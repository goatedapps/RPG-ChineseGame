    - format: Long-Answer
      text: 为什么小猫觉得妈妈要有一双明亮的眼睛？
      displayAnswer: 因为妈妈天黑时要捉老鼠。
- groupId: P2-COMP29
  subject: Higher Chinese
  passage:
    title: 送给妈妈的生日卡
    text: |-
      妈妈生日快到了，哥哥和弟弟一起去书店买礼物。弟弟想买玩具车，哥哥说妈妈不是小孩子，不会玩玩具车，建议做一张生日卡给妈妈。妈妈收到生日卡后，称赞他们是懂事的好孩子，兄弟俩都很开心。
  questions:
    - format: MCQ
      text: 弟弟和哥哥在书店里看到什么？
      options:
        - 图书、玩具车、文具
        - 生日卡、文具、玩具车
        - 图书、玩具车、生日卡
      correct: 图书、玩具车、文具
    - format: Long-Answer
      text: 为什么哥哥不让弟弟买玩具车送给妈妈？
      displayAnswer: 因为妈妈不是小孩子，不玩玩具车。
    - format: Long-Answer
      text: 为什么哥哥和弟弟送生日卡后很开心？
      displayAnswer: 因为妈妈收到生日卡后称赞他们都是好孩子。
- groupId: P2-COMP30
  subject: Higher Chinese
  passage:
    title: 大象的生日会
    text: |-
      大象生日，请了很多客人到家里做客。它为小羊准备青草，为小白兔准备胡萝卜，为小花猫准备鱼。动物们吃得很开心，都感谢大象为它们准备了各自喜欢吃的食物。
  questions:
    - format: Long-Answer
      text: 哪些动物到大象的家做客？
      displayAnswer: 小羊、小白兔和小花猫。
    - marks: 4
      format: Long-Answer
      text: 你觉得动物们喜欢大象吗？为什么？
      displayAnswer: 喜欢，因为大象为它们准备了各自喜欢吃的东西，让大家吃得很开心。
