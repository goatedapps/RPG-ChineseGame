- groupId: P2-COMP16
  subject: Higher Chinese
  passage:
    title: 儿童节的约定
    text: |-
      儿童节那天，吃完了午饭，小安的妈妈要带他去看电影。小安知道后，高兴极了！

      要去换衣服时，小安才想起他答应小亮的事情。小安急忙去找妈妈，他说："妈妈，我答应了小亮，不能去看电影了。等我做完功课，我再去看电影好吗？"

      妈妈正要回答时，电话响了。小安接起电话，原来是小亮打来的。小亮对小安说："对不起，我昨天在公园玩时不小心把脚弄伤了，不能去看电影了。"小安说："没关系，你好好休息，等你好了我们再去，祝你儿童节快乐！"

      放下电话后，小安说："妈妈，我们现在就去看电影吧。"妈妈笑着说："我们还是一起去看小亮吧，电影明天再看也来得及。"小安点了点头，然后他们就出门去了。
  questions:
    - format: MCQ
      text: 为了庆祝儿童节，妈妈想带小安去看电影。
      options:
        - 正确
        - 错误
      correct: 正确
    - format: MCQ
      text: 妈妈让小安先去做功课。
      options:
        - 正确
        - 错误
      correct: 错误
    - format: MCQ
      text: 最后，小安下午去做了什么？
      options:
        - 去看电影
        - 去看小亮
        - 去游乐场玩玩
        - 去图书馆做功课
      correct: 去看小亮
    - format: Long-Answer
      text: 小安答应小亮去做什么？
      displayAnswer: 小安答应小亮一起去看电影。
    - format: Long-Answer
      text: 为什么小亮的脚受伤了？
      displayAnswer: 因为小亮前一天在公园玩时不小心把脚弄伤了。
- groupId: P2-COMP17
  subject: Higher Chinese
  passage:
    title: 小丽画的画
    text: |-
      一天，小丽要给爸爸画一幅画送给他。她先画了一只小猪和一只小狗，可是她想起爸爸不喜欢动物的画，那该怎么办呢？

      她画了一个红灯，一张大大的桌子。桌子上有很多吃的食物，有鸡蛋、炸鸡，还有一个大蛋糕。

      小丽还想画西瓜，可是找不到绿色的彩色笔，所以很难过。爸爸看到了，对小丽说："没关系，你用黄色的彩色笔画西瓜吧！"小丽觉得很奇怪，心想：难道爸爸喜欢黄色的西瓜？

      小丽画好后，只见爸爸又用蓝色的彩色笔给黄色的西瓜上色，西瓜就变绿色了。小丽看着和爸爸一起完成的美丽图画，开心极了。
  questions:
    - format: MCQ
      text: 小丽画了一张有小动物的画，送给了爸爸。
      options:
        - 正确
        - 错误
      correct: 错误
    - format: MCQ
      text: 爸爸喜欢黄色的西瓜。
      options:
        - 正确
        - 错误
      correct: 错误
    - format: MCQ
      text: 小丽为什么会难过？
      options:
        - 因为她爸爸不喜欢她送的礼物。
        - 因为她找不到黄色的彩色笔。
        - 因为她找不到绿色的彩色笔。
        - 因为她不喜欢她画的西瓜。
      correct: 因为她找不到绿色的彩色笔。
    - format: Long-Answer
      text: 爸爸是怎么帮助小丽画西瓜的？
      displayAnswer: 小丽画好西瓜后，爸爸又用蓝色的彩色笔给黄色的西瓜上色，西瓜就变绿色了。
    - format: Long-Answer
      text: 从哪里可以看出小丽很喜欢这张画？
      displayAnswer: 小丽看着和爸爸一起完成的美丽图画，开心极了。
- groupId: P2-COMP18
  subject: Chinese
  passage:
    title: 乐乐学会关心别人
    text: |-
      一天早上，乐乐和妈妈去巴刹买菜。妈妈说："我们买些鱼片、鸡蛋和青菜，午餐可以做鱼片汤。"

      到了那里，妈妈教乐乐怎么选青菜。后来，走到卖水果的地方，妈妈要买西瓜。乐乐问："妈妈，你不是不爱吃西瓜吗？"妈妈回答："天气热，我想买给你们吃呀！"乐乐想到同学们也说天气很热，就问："那我们可以多买一个吗？我也想带去学校分给同学吃。"妈妈说："好，你长大了，学会关心别人了。"

      回家后，爸爸看到他们回来，问乐乐今天做了什么。乐乐开心地说："今天，我学会了怎么选青菜。""他还学会了主动关心别人。"妈妈笑着说。
  questions:
    - format: MCQ
      text: 妈妈和乐乐去巴刹买了什么？
      options:
        - 青菜和午餐
        - 鸡蛋和西瓜
        - 青菜和鱼片汤
        - 鸡蛋和鱼片汤
      correct: 鸡蛋和西瓜
    - format: Long-Answer
      text: 为什么乐乐想要多买一个西瓜？
      displayAnswer: 因为乐乐的同学说天气很热，所以他想多买一个西瓜，带去学校分给同学吃。
    - format: Long-Answer
      text: 乐乐跟妈妈去巴刹买菜后学会了什么？
      displayAnswer: 学会了怎么选青菜，也学会了主动关心别人。
