- groupId: P2-COMP1
  subject: Chinese
  passage:
    title: 小猴子摘香蕉
    text: |-
      森林里住着一只小猴子，名叫皮皮。皮皮最喜欢吃又香又甜的香蕉。

      有一天，皮皮看见树上长满了黄色的香蕉，他非常开心，马上爬到树上去摘。可是，树太高了，皮皮不小心摔了下来，跌得他哇哇大哭。

      这时，一只大猴子走过来，帮皮皮把香蕉摘下来，还教他要小心一点。皮皮谢过大猴子，开开心心地吃起香蕉来。
  questions:
    - format: MCQ
      text: 皮皮最喜欢吃什么？
      options:
        - 苹果
        - 香蕉
        - 西瓜
        - 葡萄
      correct: 香蕉
    - format: MCQ
      text: 皮皮为什么摔了下来？
      options:
        - 因为树太高了
        - 因为下雨了
        - 因为他睡着了
        - 因为大猴子推了他
      correct: 因为树太高了
    - marks: 4
      format: Long-Answer
      text: 大猴子帮了皮皮什么忙？他还对皮皮说了什么？
      displayAnswer: 大猴子帮皮皮把香蕉摘下来（2分），还教他要小心一点（2分）。
- groupId: P2-COMP2
  subject: Chinese
  passage:
    title: 乐乐的故事书
    text: |-
      乐乐借了一本故事书给欢欢。欢欢高兴极了，在休息的时候看。丽丽看到了，想要和欢欢一起看这本故事书。

      欢欢说："这本书是乐乐借给我看的，你走开！"

      丽丽很生气，只好去找同学们玩游戏。欢欢看完了故事书，想要和同学们一起玩游戏。丽丽说："你不要和我一起看故事书，我也不要和你一起玩游戏，你走开！"

      欢欢难过得哭了起来。坐在一旁画画的乐乐看见了，说："你们不要吵架了！我们都是同学，大家一起玩游戏，一起看故事书，才快乐。"

      丽丽和欢欢听了，就互相说"对不起"。
  questions:
    - format: MCQ
      text: 欢欢高兴极了，因为 ___。
      options:
        - 乐乐借了一本故事书给她
        - 丽丽要和她一起看故事书
        - 她要和同学们一起玩游戏
      correct: 乐乐借了一本故事书给她
    - format: MCQ
      text: 丽丽在休息的时候做什么？
      options:
        - 她和乐乐一起画画。
        - 她和欢欢看故事书。
        - 她和同学们玩游戏。
      correct: 她和欢欢看故事书。
    - format: MCQ
      text: 听了乐乐的话，丽丽和欢欢做什么？
      options:
        - 他们互相说"对不起"。
        - 他们说"不要吵架了"。
        - 他们说"一起休息吧"。
      correct: 他们互相说"对不起"。
- groupId: P2-COMP3
  subject: Chinese
  passage:
    title: 文文上课不专心
    text: |-
      老师在上英文课。文文没有专心听老师上课，手里玩着桌子上的文具。

      老师很生气，问文文："你到学校是来玩文具的吗？"文文听了，马上把文具收拾好，然后专心听老师上课。

      下课了，老师对文文说："以后老师上课时，你把文具都收进文具盒里，不可以拿出来玩。"文文点点头，说："老师，我以后一定用心学习，上课时不会再这样了。"
  questions:
    - format: Long-Answer
      text: 老师为什么会生气？
      displayAnswer: 因为文文没有专心听老师上课，手里玩着桌上的文具。
    - format: Long-Answer
      text: 文文向老师说他以后会怎么样？
      displayAnswer: 文文向老师说他以后一定用心学习，上课时不会再玩文具。
- groupId: P2-COMP4
  subject: Chinese
  passage:
    title: 小林拾到小盒子
    text: |-
      上个星期六，小林到公园去和朋友们一起跑步。小林跑步时，在一棵大树下找到了一个小盒子，小盒子里还有几块彩色的小石头。小林觉得这些五颜六色的小石头很好看。

      这时，小林看到大树旁边有一个小男孩在哭。小林走过去问："你怎么哭了？"小男孩说："奶奶送给我的小盒子不见了，里面还有奶奶送给我的彩色石头。"

      小林听了，就把手里的小盒子拿给小男孩。小男孩一看到那个小盒子，马上就不哭了，还开心地笑了。小男孩接过小盒子，还对小林说了谢谢。看到小男孩那么开心，小林也很开心。小林心想：帮助别人真好！
  questions:
    - format: Long-Answer
      text: 上个星期六，小林到公园去做了什么？
      displayAnswer: 小林到公园去和朋友们一起跑步。
    - format: Long-Answer
      text: 小林在大树下找到了什么？
      displayAnswer: 小林在大树下找到一个小盒子，小盒子里还有几块彩色的小石头。
    - format: Long-Answer
      text: 小男孩为什么哭了？
      displayAnswer: 因为小男孩的小盒子不见了，里面还有奶奶送给小男孩的彩色石头。
    - format: Long-Answer
      text: 从哪里可以看出小男孩看到小盒子后很高兴？
      displayAnswer: 小男孩一看到那个小盒子，马上就不哭了，还开心地笑了。
    - format: Long-Answer
      text: 为什么小林会说"帮助别人真好"？
      displayAnswer: 看到小男孩那么开心，小林也很开心。
- groupId: P2-COMP5
  subject: Chinese
  passage:
    title: 动物园里的国王
    text: |-
      老师带同学去参观动物园。同学们除了拍照，还看了动物表演。老师也告诉同学们各种动物有趣的地方。

      回到学校后，老师问："哪只动物是树林里的国王？为什么？"

      小康举手说："是大象。因为它的力气最大了。"

      小乐不同意："不对，是爪子又长又尖的狮子！"

      同学们都互相抢着要回答，只有文文一句话也不说。老师看到了，就问他："文文，你说谁是动物里的国王？"

      "动物园的工作人员，"文文说，"因为动物们都怕他。"
  questions:
    - format: MCQ
      text: 老师带同学们去了 ___。
      options:
        - 树林
        - 动物园
        - 学校
      correct: 动物园
    - format: Long-Answer
      text: 同学们在动物园里做了什么？
      displayAnswer: 同学们除了拍照，还看了动物表演。
    - marks: 4
      format: Long-Answer
      text: 小乐觉得哪一只动物是国王？为什么？
      displayAnswer: 小乐觉得狮子是国王，因为它的爪子又长又尖。
    - marks: 4
      format: Long-Answer
      text: 文文的答案是什么？为什么他这么说？
      displayAnswer: 文文的答案是大象，因为动物们都怕他。
- groupId: P2-COMP6
  subject: Higher Chinese
  passage:
    title: 小黄鸟唱歌
    text: |-
      树林里的鸟儿都爱唱歌，小黄鸟也喜欢唱歌。可是大家都说它唱歌不好听，小黄鸟听了很不开心。

      一天，小黄鸟在回家的路上找到一块肉。它飞到一棵树上，就想坐在树上吃肉。一只花狗看见了，也想吃那块肉。花狗想了想，就笑着对小黄鸟说："黄鸟妹妹，你唱歌非常好听，现在可以唱给我听吗？"

      小黄鸟听了，就高兴地唱起歌来。可是，它的口一张开，肉就掉在地上，花狗马上跑过去把肉吃了。
  questions:
    - format: MCQ
      text: 小黄鸟不开心，因为鸟儿都 ___。
      options:
        - 说自己唱歌好听
        - 不让它大声唱歌
        - 说它唱歌不好听
      correct: 说它唱歌不好听
    - format: MCQ
      text: 小黄鸟想在 ___ 吃肉。
      options:
        - 树上
        - 地上
        - 路上
      correct: 树上
    - format: Fill-in
      text: 最后，___ 吃了那块肉。
      accepted:
        - 花狗
      displayAnswer: 花狗
    - format: Long-Answer
      text: 为什么小黄鸟没有吃到那块肉？
      displayAnswer: 小黄鸟高兴地唱起歌来。可是，它的口一张开，肉就掉在地上，花狗马上跑过去把肉吃了。
- groupId: P2-COMP7
  subject: Chinese
  passage:
    title: 小丽和小华的笔
    text: |-
      一天，小丽上学时忘了带盒子。上课时，老师要她们写字。小丽的笔在桌上用不好，因为她没有盒子，她从文具盒里拿出一支笔。

      小华回来的时候，发现自己的一支笔不见了，就生气地说是小丽偷了他的笔。小丽听了，很生气地把笔还了回去。坐在前边的小林和美美都看到了，可是他们没有说话。

      老师知道了事情的经过后，对他们说："你们都不对。小华没有弄清楚事情就生气地说是小丽拿了他的笔。小丽如果没有拿别人的东西，也应该说清楚，而不是默默地把笔还回去。"
  questions:
    - format: MCQ
      text: 小丽的同桌同学是 ___。
      options:
        - 小米
        - 美美
        - 小华
      correct: 小华
    - format: MCQ
      text: 小丽为什么要拿小华的笔？
      options:
        - 因为小华有很多笔。
        - 因为小丽没有带笔。
        - 因为小丽的笔不见了。
      correct: 因为小丽的笔不见了。
    - format: MCQ
      text: 小丽有什么不对的地方？
      options:
        - 她偷了小华的笔。
        - 她听了小华的话就去上学。
        - 她没有说明事情就默默地把笔还了。
      correct: 她没有说明事情就默默地把笔还了。
    - format: MCQ
      text: 小华有什么不对的地方？
      options:
        - 他不要把笔借给小丽。
        - 他带了很多支笔去学校。
        - 他没有弄清楚就说小丽偷了笔。
      correct: 他没有弄清楚就说小丽偷了笔。
    - format: MCQ
      text: 听了老师的话，小丽和小华 ___。
      options:
        - 谁也不讲话。
        - 互相大声说话。
        - 知道自己错了。
      correct: 知道自己错了。
- groupId: P2-COMP8
  subject: Chinese
  passage:
    title: 小黄鸟与木瓜树
    text: |-
      小黄鸟喜欢飞来飞去。有时，它会飞到屋子前听人们讲话。有时，它会飞到学校和学生们写字。

      一天，小黄鸟飞到了小河边，看到一棵木瓜树。它飞过这棵木瓜树时，看到花朵里有几条虫子。它想："我要吃这些虫子。"

      可是，小黄鸟一飞到花朵上，木瓜树就对它说："你不可以动我的花。"小黄鸟听见了，生气地飞走了。

      过了几个月，木瓜树上都是虫子，花朵也没了，它大哭了起来。
  questions:
    - format: MCQ
      text: 小黄鸟在哪里看到木瓜树？
      options:
        - 小河边
        - 学校里
        - 组屋前
      correct: 小河边
    - format: Long-Answer
      text: 小黄鸟看到花朵里有什么？
      displayAnswer: 几条虫子。
    - format: Long-Answer
      text: 为什么木瓜树大哭了起来？
      displayAnswer: 因为木瓜树上都是虫子，花朵也没有了。
- groupId: P2-COMP9
  subject: Chinese
  passage:
    title: 小文买纸巾
    text: |-
      一天中午，小文一家人去咖啡店吃午餐。咖啡店里的人很多，他们等了很久才有位子坐。

      妈妈先带小文去买炒面和鸡饭。过后，小文就跟着爸爸去买豆浆。天气好热，爸爸和小文就走回座位。

      这时，一位老奶奶走了过来。她问爸爸要不要买纸巾。小文心想：奶奶这么老了还要出来卖纸巾，我应该跟她买。小文跟着奶奶买了三包纸巾，老奶奶笑着对他说："小弟弟，谢谢你。"爸爸妈妈看着小文，开心地笑了。
  questions:
    - format: MCQ
      text: 小文一家人去咖啡店里买了什么？
      options:
        - 炒面、鸭饭、豆浆和纸巾。
        - 炒面、鸡饭、奶茶和纸巾。
        - 炒面、鸡饭、豆浆和纸巾。
      correct: 炒面、鸡饭、豆浆和纸巾。
    - format: Long-Answer
      text: 一天中午，小文一家人去哪里吃午餐？
      displayAnswer: 咖啡店。
    - format: Long-Answer
      text: 为什么老奶奶对小文说"谢谢"？
      displayAnswer: 因为小文跟着奶奶买了三包纸巾。
- groupId: P2-COMP10
  subject: Chinese
  passage:
    title: 文文和小白狗
    text: |-
      文文八岁那年，爸爸妈妈说："你长大了，学业也进步了，我们送一只小白狗给你。"文文很喜欢小白狗，他们成了好朋友。

      小白狗有长长的尾巴，大大的眼睛，真可爱。文文每天都会给小白狗吃东西，每个星期天，他也会带它去冲凉。

      妈妈看见文文只照顾小白狗，没有好好地读书，就生气地说："我要把小白狗送给别人！"妈妈把小白狗送走后，文文每天都很难过。过了几天，文文开始努力读书。妈妈看见小白狗回来后，文文开心极了！
  questions:
    - format: Long-Answer
      text: 小白狗长得怎么样？
      displayAnswer: 有长长的尾巴、大大的眼睛，很可爱。
    - format: Long-Answer
      text: 为什么爸爸妈妈送小白狗给文文？
      displayAnswer: 因为文文长大了，学业也进步了。
    - format: MCQ
      text: 文文是一个怎样的孩子？
      options:
        - 喜欢读书
        - 关心妈妈
        - 知错能改
      correct: 知错能改
- groupId: P2-COMP11
  subject: Higher Chinese
  passage:
    title: 抱小狗拍照
    text: |-
      今天，妈妈和小安去游乐园玩。走到行人天桥时，我看见我的朋友小安和他的妈妈从对面走过来。小安正抱着一只小狗。小狗身上长着长长的毛，一双眼睛大大的，样子很可爱。

      我的眼睛一直看着小狗。这时，小安妈妈就让小狗亲我的脸，她把小狗抱过来，放在我的手上。我抱着小狗站在天桥的旁边，让妈妈给我拍了一张照片，然后我才把小狗还给小安。

      到了公园，我就一直想那只可爱的小狗，不停地看着我和小狗的照片。妈妈说如果我生日时，一定会送我一只小狗，我听了开心地跳了起来。
  questions:
    - format: MCQ
      text: 小安和他的妈妈刚从公园回来。
      options:
        - 正确
        - 错误
      correct: 正确
    - format: MCQ
      text: 小安和他的妈妈在路上看到我们。
      options:
        - 正确
        - 错误
      correct: 错误
    - format: Long-Answer
      text: 小安怎么知道"我"爱他的小狗？
      displayAnswer: 小安看到"我"的眼睛一直看着小狗，就知道"我"爱他的小狗。
    - format: Long-Answer
      text: 小安看到"我"也爱他的小狗后，他怎么做？
      displayAnswer: 他把小狗抱过来，放在"我"的手上。
    - format: Long-Answer
      text: 从哪些事情可以看出"我"很喜欢小狗？
      displayAnswer: '"我"的眼睛一直看着小狗；"我"抱着小狗拍照；"我"不停地看着"我"和小狗的照片。'
- groupId: P2-COMP12
  subject: Higher Chinese
  passage:
    title: 长大后要做什么
    text: |-
      上课时，老师问大家："你们长大了要做什么？"

      "我要做护士，照顾病人。"美美说。

      "我要做建筑师，和工人们一起建高高的组屋给大家住。"阿木说。

      张明说："我要做园丁，种很多很多花草树木，让新加坡变得更美丽。"

      欢欢说："我要做演员。"

      老师说："欢欢，你为什么要做演员？"

      欢欢开心地说："我的爷爷和奶奶都爱看戏，我要做演员，演好看的戏给爷爷和奶奶看。"

      老师听了说："欢欢真是个懂事的好孩子。"
  questions:
    - format: Long-Answer
      text: 建筑师的工作是什么？
      displayAnswer: 和工人们一起建高高的组屋给大家住。
    - marks: 4
      format: Long-Answer
      text: 新加坡需要园丁吗？为什么？
      displayAnswer: 需要，因为园丁可以种很多很多花草树木，让新加坡更美丽。
    - format: Long-Answer
      text: 为什么老师说欢欢是个懂事的孩子？
      displayAnswer: 因为她的爷爷和奶奶都爱看戏，她想做演员，演好看的戏给爷爷和奶奶看。
- groupId: P2-COMP13
  subject: Higher Chinese
  passage:
    title: 公园里的发现
    text: |-
      一天早上，小文和爸爸一起到公园。小文看到树上的小鸟，问："爸爸，那是什么？"

      爸爸说："那是小鸟，它们在飞高高。"

      小文又看了看地上，问："这又是什么呢？"

      爸爸说："这是蚂蚁，它们在搬东西。"

      小文看着公园里的花朵，说："爸爸，花儿真美丽！我可以采一朵花给妈妈吗？"

      爸爸说："公园里的花儿不能采，没有了花，蝴蝶就不能来采花蜜，人们也看不到美丽的花了。"

      小文点点头，说："好，那我们把看到的小动物说给妈妈听吧！"爸爸开心地说："小文，你长大了！"
  questions:
    - format: MCQ
      text: 小文在公园里的地上看到了什么？
      options:
        - 花朵
        - 鸟窝
        - 小鸟
        - 蚂蚁
      correct: 蚂蚁
    - format: MCQ
      text: 以下哪一个句子是正确的？
      options:
        - 小文想要捉一只蝴蝶。
        - 小文想要采花给妈妈。
        - 小文要帮小鸟建鸟窝。
        - 小文要帮蚂蚁搬东西。
      correct: 小文想要采花给妈妈。
    - format: MCQ
      text: 小鸟在地上走走。
      options:
        - 正确
        - 错误
      correct: 错误
    - format: MCQ
      text: 小文看见蚂蚁在采花蜜。
      options:
        - 正确
        - 错误
      correct: 错误
    - marks: 4
      format: Long-Answer
      text: 爸爸说公园里的花可以采吗？为什么？
