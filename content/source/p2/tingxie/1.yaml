      - zh: 谢谢你帮助我找到不见的铅笔。
        en: Thank you for helping me find my missing pencil.
      - zh: 哥哥帮助妹妹学习怎样写汉字。
        en: My older brother helps my younger sister learn how to write Chinese characters.
