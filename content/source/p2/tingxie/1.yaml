      - zh: 我会帮弟弟把玩具放回盒子里面。
        en: I will help my younger brother put the toys back into the box.
      - zh: 放学以后，我帮妈妈一起收拾房间。
        en: After school, I help Mum tidy the room.
      - zh: 同学不会做这道题，我主动过去帮他。
        en: My classmate could not do this question, so I went over to help him.

  - word: 专心
    pinyin: zhuān xīn
    meaning: To concentrate
    example: 上课的时候，我们一定要专心听老师说话。
    sentenceBank:
      - zh: 上课的时候，我们要专心听老师说话。
