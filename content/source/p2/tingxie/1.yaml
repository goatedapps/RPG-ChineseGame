      - zh: 请大家安静下来，认真听老师讲话。
        en: Everyone, please be quiet and listen carefully to the teacher.
      - zh: 弟弟喜欢听音乐，也喜欢唱歌跳舞。
        en: My younger brother likes listening to music and also likes singing and dancing.
      - zh: 我没有听清楚，请老师再说一次。
        en: I did not hear clearly, so I asked the teacher to say it again.

  - word: 帮助
    pinyin: bāng zhù
    meaning: To help
    example: 谢谢你昨天帮助我完成学校的功课。
    sentenceBank:
      - zh: 老师每天都会帮助我们学习新的知识。
