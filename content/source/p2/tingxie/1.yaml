      - zh: 做功课的时候，我会专心完成每一道题。
        en: When doing homework, I concentrate on completing every question.
      - zh: 哥哥正在专心看书，没有听见我叫他。
        en: My older brother was concentrating on reading and did not hear me call him.
      - zh: 如果你专心学习，就可以学得更好。
        en: If you concentrate on studying, you can learn better.
      - zh: 妹妹很专心地画画，一直没有说话。
        en: My younger sister concentrated on drawing and did not speak for a long time.

  - word: 听
    pinyin: tīng
    meaning: To listen
    example: 上课时，我们要认真听老师讲课。
    sentenceBank:
      - zh: 上课的时候，我们要认真听老师说话。
        en: During class, we should listen carefully to the teacher.
      - zh: 我喜欢每天晚上听妈妈讲故事。
