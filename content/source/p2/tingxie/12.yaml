title: 第十二课 (Lesson 12)
vocab:
  - word: 永远
    pinyin: yǒng yuǎn
    meaning: Forever
    example: 我希望爸爸妈妈永远健康快乐。
    sentenceBank:
      - zh: 我希望爸爸妈妈永远健康快乐。
        en: I hope Dad and Mum are always healthy and happy.
      - zh: 我们永远都是最好的朋友和同学。
        en: We will always be the best friends and classmates.
      - zh: 我希望家人永远住在一起开开心心。
        en: I hope my family will always live together happily.
      - zh: 爸爸说他会永远爱护我们一家人。
        en: Dad says he will always take care of our family.
      - zh: 我希望大家永远记得今天快乐的生日。
        en: I hope everyone will always remember today's happy birthday.

  - word: 年轻
    pinyin: nián qīng
    meaning: Young
    example: 爷爷希望自己永远年轻和身体健康。
    sentenceBank:
      - zh: 爷爷希望自己永远年轻和身体健康。
        en: Grandpa hopes to stay young and healthy forever.
      - zh: 妈妈虽然不年轻，但是每天都很开心。
        en: Although Mum is not young, she is happy every day.
      - zh: 年轻的时候，我们应该多学习新的东西。
        en: When we are young, we should learn many new things.
      - zh: 爸爸看起来很年轻，也非常喜欢运动。
        en: Dad looks young and also likes exercising very much.
      - zh: 奶奶说每天开心会让人看起来年轻。
        en: Grandma says being happy every day makes people look young.

  - word: 长命百岁
    pinyin: cháng mìng bǎi suì
    meaning: To live a long life
    example: 我们祝爷爷生日快乐，长命百岁。
    sentenceBank:
      - zh: 我们祝爷爷生日快乐，长命百岁。
        en: We wish Grandpa a happy birthday and a long life.
      - zh: 孩子们一起祝外婆长命百岁和身体健康。
        en: The children wish Grandma a long life and good health together.
      - zh: 今天是爷爷生日，我们祝他长命百岁。
        en: Today is Grandpa's birthday, and we wish him a long life.
      - zh: 全家人一起祝奶奶长命百岁，天天开心。
        en: The whole family wishes Grandma a long life and happiness every day.
      - zh: 我们送上祝福，希望外公长命百岁健康快乐。
        en: We send our blessings and hope Grandpa lives a long, healthy, and happy life.

  - word: 健康
    pinyin: jiàn kāng
    meaning: Healthy
    example: 我希望家人每天都健康和快快乐乐。
    sentenceBank:
      - zh: 我希望家人每天都健康和快快乐乐。
        en: I hope my family is healthy and happy every day.
      - zh: 多运动和吃蔬菜可以让身体更健康。
        en: Exercising and eating vegetables can make our bodies healthier.
      - zh: 爸爸祝爷爷身体健康，天天都开心。
        en: Dad wishes Grandpa good health and happiness every day.
      - zh: 我们要早睡早起，保持健康的身体。
        en: We should sleep early and wake early to keep our bodies healthy.
      - zh: 妈妈希望我们每天健康地长大和学习。
        en: Mum hopes we grow up and learn healthily every day.

  - word: 幸福
    pinyin: xìng fú
    meaning: Happy; blessed
    example: 我希望我们一家人永远幸福快乐。
    sentenceBank:
      - zh: 我希望我们一家人永远幸福快乐。
        en: I hope our whole family will always be happy.
      - zh: 有爸爸妈妈陪伴让我觉得非常幸福。
        en: Having Dad and Mum with me makes me feel very happy.
      - zh: 生日的时候，全家人在一起非常幸福。
        en: The whole family feels very happy when together on a birthday.
      - zh: 奶奶希望每一个孩子都生活得幸福。
        en: Grandma hopes every child lives a happy life.
      - zh: 我们每天一起吃饭和聊天，觉得很幸福。
        en: We eat and chat together every day and feel very happy.

  - word: 许愿
    pinyin: xǔ yuàn
    meaning: To make a wish
    example: 生日的时候，我会对着蛋糕许愿。
    sentenceBank:
      - zh: 生日的时候，我会对着蛋糕许愿。
        en: On my birthday, I make a wish in front of the cake.
      - zh: 妹妹闭上眼睛，认真地许了一个愿。
        en: My younger sister closed her eyes and made a wish carefully.
      - zh: 吹蜡烛以前，我们要先许愿和唱歌。
        en: Before blowing out the candles, we should make a wish and sing.
      - zh: 哥哥希望自己的生日愿望可以实现，所以许愿。
        en: My older brother made a wish because he hoped it would come true.
      - zh: 今天是奶奶生日，她开心地许愿和吹蜡烛。
        en: Today is Grandma's birthday, and she happily made a wish and blew out the candles.

  - word: 吹
    pinyin: chuī
    meaning: To blow
    example: 妹妹准备吹生日蛋糕上的蜡烛了。
    sentenceBank:
      - zh: 妹妹准备吹生日蛋糕上的蜡烛了。
        en: My younger sister is ready to blow out the candles on the birthday cake.
      - zh: 爸爸帮我点好蜡烛以后，我就开始吹。
        en: After Dad lit the candles, I started blowing them out.
      - zh: 大家一起唱生日歌，然后帮爷爷吹蜡烛。
        en: Everyone sang the birthday song together and then helped Grandpa blow out the candles.
      - zh: 弟弟太开心了，一口气吹掉了所有蜡烛。
        en: My younger brother was so happy that he blew out all the candles in one breath.
      - zh: 许愿以后，我们一起吹蜡烛和切蛋糕。
        en: After making a wish, we blew out the candles and cut the cake together.

  - word: 蛋糕
    pinyin: dàn gāo
    meaning: Cake
    example: 妈妈买了一个漂亮又好吃的生日蛋糕。
    sentenceBank:
      - zh: 妈妈买了一个漂亮又好吃的生日蛋糕。
        en: Mum bought a beautiful and delicious birthday cake.
      - zh: 生日蛋糕上面有很多漂亮的小花。
        en: There are many beautiful little flowers on the birthday cake.
      - zh: 我们一起唱歌以后就开始吃生日蛋糕。
        en: After singing together, we started eating the birthday cake.
      - zh: 妹妹最喜欢吃草莓和奶油生日蛋糕。
        en: My younger sister likes strawberry and cream birthday cake the most.
      - zh: 爸爸把蛋糕放在客厅的桌子上面。
        en: Dad put the cake on the table in the living room.

  - word: 首
    pinyin: shǒu
    meaning: Measure word for song
    example: 我们一起唱一首生日快乐歌给爷爷听。
    sentenceBank:
      - zh: 我们一起唱一首生日快乐歌给爷爷听。
        en: We sang a birthday song for Grandpa together.
      - zh: 妹妹在生日会上唱了一首很好听的歌。
        en: My younger sister sang a very nice song at the birthday party.
      - zh: 老师教我们唱一首新的中文歌曲。
        en: The teacher taught us a new Chinese song.
      - zh: 哥哥准备唱一首歌送给今天的生日主人。
        en: My older brother prepared a song for today's birthday person.
      - zh: 大家一起唱一首歌以后开始吃蛋糕。
        en: Everyone sang a song together before starting to eat the cake.

  - word: 张
    pinyin: zhāng
    meaning: Piece (measure word for card)
    example: 桌上有一张漂亮的生日卡送给妈妈。
    sentenceBank:
      - zh: 桌上有一张漂亮的生日卡送给妈妈。
        en: There is a beautiful birthday card on the table for Mum.
      - zh: 我亲手做了一张生日卡送给爷爷。
        en: I made a birthday card myself and gave it to Grandpa.
      - zh: 妹妹在卡片上画了一张可爱的图画。
        en: My younger sister drew a cute picture on the card.
      - zh: 哥哥准备了一张生日卡和一个礼物。
        en: My older brother prepared a birthday card and a gift.
      - zh: 我们一起写了一张卡片送给老师。
        en: We wrote a card together and gave it to the teacher.

  - word: 生日卡
    pinyin: shēng rì kǎ
    meaning: Birthday card
    example: 我做了一张生日卡送给最爱的妈妈。
    sentenceBank:
      - zh: 我做了一张生日卡送给最爱的妈妈。
        en: I made a birthday card for my beloved Mum.
      - zh: 妹妹在生日卡上写了很多祝福的话。
        en: My younger sister wrote many words of blessing on the birthday card.
      - zh: 我们一起画生日卡送给今天的爷爷。
        en: We drew a birthday card together for Grandpa today.
      - zh: 爸爸收到生日卡以后开心地笑了起来。
        en: Dad smiled happily after receiving the birthday card.
      - zh: 我把生日卡放在礼物旁边给妈妈看。
        en: I put the birthday card beside the gift for Mum to see.

  - word: 电影票
    pinyin: diàn yǐng piào
    meaning: Movie ticket
    example: 爸爸送给我两张电影票作为生日礼物。
    sentenceBank:
      - zh: 爸爸送给我两张电影票作为生日礼物。
        en: Dad gave me two movie tickets as a birthday gift.
      - zh: 妈妈买了两张电影票带我们一起看电影。
        en: Mum bought two movie tickets and took us to watch a movie.
      - zh: 我的生日愿望是和家人一起看电影。
        en: My birthday wish is to watch a movie with my family.
      - zh: 哥哥把电影票放在桌子上准备出门。
        en: My older brother put the movie tickets on the table and got ready to go out.
      - zh: 我们拿到电影票以后都开心地笑了。
        en: We all smiled happily after getting the movie tickets.

  - word: 礼物
    pinyin: lǐ wù
    meaning: Gift
    example: 生日的时候，我收到很多漂亮的礼物。
    sentenceBank:
      - zh: 生日的时候，我收到很多漂亮的礼物。
        en: I received many beautiful gifts on my birthday.
      - zh: 妈妈准备了一个特别的礼物给我。
        en: Mum prepared a special gift for me.
      - zh: 哥哥把生日礼物放在我的桌子上。
        en: My older brother put the birthday gift on my table.
      - zh: 妹妹收到礼物以后开心地说谢谢。
        en: My younger sister happily said thank you after receiving the gift.
      - zh: 我们一起选择一个生日礼物送给爷爷。
        en: We chose a birthday gift together to give to Grandpa.

  - word: 客厅
    pinyin: kè tīng
    meaning: Living room
    example: 全家人在客厅里一起庆祝妈妈生日。
    sentenceBank:
      - zh: 全家人在客厅里一起庆祝妈妈生日。
        en: The whole family celebrated Mum's birthday in the living room.
      - zh: 爸爸把生日蛋糕放在客厅的桌上。
        en: Dad put the birthday cake on the table in the living room.
      - zh: 妹妹在客厅里准备生日礼物和卡片。
        en: My younger sister prepared birthday gifts and cards in the living room.
      - zh: 我们晚上坐在客厅一起聊天和唱歌。
        en: We sat in the living room chatting and singing together in the evening.
      - zh: 客厅的桌上放着许多生日礼物和卡片。
        en: There are many birthday gifts and cards on the living room table.

  - word: 写
    pinyin: xiě
    meaning: To write
    example: 我在生日卡上写了很多祝福的话。
    sentenceBank:
      - zh: 我在生日卡上写了很多祝福的话。
        en: I wrote many words of blessing on the birthday card.
      - zh: 妹妹正在认真地写一张生日卡片。
        en: My younger sister is carefully writing a birthday card.
      - zh: 老师教我们怎样写一封感谢的信。
        en: The teacher taught us how to write a thank-you letter.
      - zh: 我想写一些祝福的话送给爷爷。
        en: I want to write some words of blessing for Grandpa.
      - zh: 哥哥写完生日卡以后放进漂亮的信封里。
        en: After writing the birthday card, my older brother put it into a beautiful envelope.

  - word: 想
    pinyin: xiǎng
    meaning: To think
    example: 我想送妈妈一份特别的生日礼物。
    sentenceBank:
      - zh: 我想送妈妈一份特别的生日礼物。
        en: I want to give Mum a special birthday gift.
      - zh: 妹妹想在生日会上唱一首歌。
        en: My younger sister wants to sing a song at the birthday party.
      - zh: 我想和全家人一起吃生日蛋糕。
        en: I want to eat birthday cake with the whole family.
      - zh: 哥哥想送爷爷两张电影票作为礼物。
        en: My older brother wants to give Grandpa two movie tickets as a gift.
      - zh: 我想祝爸爸每天健康和幸福快乐。
        en: I want to wish Dad health, happiness, and joy every day.

  - word: 奇怪
    pinyin: qí guài
    meaning: Strange
    example: 今天大家的行为看起来有一点奇怪。
    sentenceBank:
      - zh: 今天大家的行为看起来有一点奇怪。
        en: Everyone's behaviour seems a little strange today.
      - zh: 妹妹发现客厅里的桌子有一些奇怪。
        en: My younger sister noticed that the table in the living room looked strange.
      - zh: 爸爸今天没有马上打开生日礼物，很奇怪。
        en: It is strange that Dad did not open his birthday gift immediately today.
      - zh: 我觉得哥哥今天一直偷偷笑很奇怪。
        en: I think it is strange that my older brother kept secretly smiling today.
      - zh: 客厅里突然没有人说话，真的很奇怪。
        en: Suddenly nobody spoke in the living room, which was really strange.

  - word: 活动
    pinyin: huó dòng
    meaning: Activity
    example: 学校今天举行了一个有趣的生日活动。
    sentenceBank:
      - zh: 学校今天举行了一个有趣的生日活动。
        en: The school held an interesting birthday activity today.
      - zh: 我们一起参加了学校的庆祝活动。
        en: We took part in the school's celebration activity together.
      - zh: 妈妈准备了很多活动让孩子们一起玩。
        en: Mum prepared many activities for the children to play together.
      - zh: 生日会有唱歌、游戏和吃蛋糕的活动。
        en: The birthday party had activities such as singing, games, and eating cake.
      - zh: 老师希望大家开心地参加今天的活动。
        en: The teacher hopes everyone enjoys taking part in today's activity.

  - word: 宝贝
    pinyin: bǎo bèi
    meaning: Darling
    example: 妈妈笑着对我说，我的小宝贝生日快乐。
    sentenceBank:
      - zh: 妈妈笑着对我说，我的小宝贝生日快乐。
        en: Mum smiled and said to me, "Happy birthday, my darling."
      - zh: 爸爸每天都会叫妹妹可爱的小宝贝。
        en: Dad calls my younger sister his cute little darling every day.
      - zh: 妈妈准备了礼物给她最爱的宝贝。
        en: Mum prepared a gift for her beloved darling.
      - zh: 宝贝今天生日，全家人都陪着她庆祝。
        en: It is the darling's birthday today, and the whole family celebrates with her.
      - zh: 爷爷开心地抱着小宝贝一起唱生日歌。
        en: Grandpa happily hugged the little darling and sang the birthday song together.

  - word: 桌
    pinyin: zhuō
    meaning: Table
    example: 生日蛋糕放在客厅的大桌子上面。
    sentenceBank:
      - zh: 生日蛋糕放在客厅的大桌子上面。
        en: The birthday cake is on the big table in the living room.
      - zh: 桌子上面放着生日卡和漂亮的礼物。
        en: There are birthday cards and beautiful gifts on the table.
      - zh: 妈妈把水果和蛋糕一起放在桌上。
        en: Mum put the fruit and cake together on the table.
      - zh: 我们坐在桌子旁边一起吃生日蛋糕。
        en: We sat beside the table and ate birthday cake together.
      - zh: 哥哥把电影票放在桌子上准备出门。
        en: My older brother put the movie tickets on the table and got ready to go out.

  - word: 这些
    pinyin: zhè xiē
    meaning: These
    example: 这些都是家人为我准备的生日礼物。
    sentenceBank:
      - zh: 这些都是家人为我准备的生日礼物。
        en: These are all birthday gifts prepared for me by my family.
      - zh: 这些漂亮的生日卡都是朋友送给我的。
        en: These beautiful birthday cards were all given to me by my friends.
      - zh: 这些礼物放在客厅的桌子上面。
        en: These gifts are placed on the table in the living room.
      - zh: 这些蛋糕和水果都是妈妈准备的。
        en: These cakes and fruits were all prepared by Mum.
      - zh: 这些电影票是哥哥送给我的生日礼物。
        en: These movie tickets are birthday gifts from my older brother.
sentences:
  - text: 哥哥今年十岁了。
    segments:
      - 哥哥
      - 今年
      - 十岁了
