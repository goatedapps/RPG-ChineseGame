      - zh: 只要认真学习，我就能考到好成绩。
        en: As long as I study hard, I can get good results in the test.
      - zh: 雨停以后，我们就一起到菜园里摘菜。
        en: After the rain stopped, we went to the vegetable garden to pick vegetables together.
