      - zh: 妹妹在学校表演了一首好听的歌曲。
        en: My younger sister performed a nice song at school.
      - zh: 我们一起唱一首英语歌给老师听。
        en: We sang an English song for the teacher together.
      - zh: 哥哥每天晚上都会听一首好听的歌。
        en: My older brother listens to a nice song every evening.
      - zh: 活动开始以前，大家先唱一首歌曲。
