      - zh: 这本绘本里面有许多有趣的图画和人物。
        en: There are many interesting pictures and characters in this picture book.
      - zh: 我和哥哥觉得这个游戏又有趣又好玩。
        en: My older brother and I think this game is interesting and fun.
      - zh: 图书馆里有各种各样有趣的书可以看。
        en: There are all kinds of interesting books to read in the library.
      - zh: 老师的故事让大家觉得非常有趣和开心。
        en: The teacher's story made everyone feel very interested and happy.

