title: 第十六课 (Lesson 16)
vocab:
  - word: 保持
    pinyin: bǎo chí
    meaning: To keep; maintain
    example: 我们在图书馆里要保持安静和整洁。
    sentenceBank:
      - zh: 我们在图书馆里要保持安静和整洁。
        en: We should keep quiet and tidy in the library.
      - zh: 每天运动可以帮助我们保持身体健康。
        en: Exercising every day can help us keep our bodies healthy.
      - zh: 上课的时候，我们要保持安静认真听老师说话。
        en: During class, we should stay quiet and listen carefully to the teacher.
      - zh: 我们应该保持房间干净，不要乱放东西。
        en: We should keep the room clean and not leave things around.
      - zh: 看书的时候，我们要保持安静不要大声说话。
        en: When reading, we should keep quiet and not speak loudly.

  - word: 安静
    pinyin: ān jìng
    meaning: Quiet
    example: 图书馆里面很安静，大家都在看书。
    sentenceBank:
      - zh: 图书馆里面很安静，大家都在看书。
        en: The library is very quiet, and everyone is reading.
      - zh: 妹妹正在安静地坐在书桌前看绘本。
        en: My younger sister is sitting quietly at the desk reading a picture book.
      - zh: 老师请大家安静下来，准备开始上课。
        en: The teacher asked everyone to be quiet and get ready for class.
      - zh: 我喜欢在安静的地方看有趣的故事。
        en: I like reading interesting stories in quiet places.
      - zh: 弟弟睡觉的时候，我们都保持安静说话。
        en: When my younger brother is sleeping, we all speak quietly.

  - word: 大声
    pinyin: dà shēng
    meaning: Loud
    example: 在图书馆里，我们不能大声说话和唱歌。
    sentenceBank:
      - zh: 在图书馆里，我们不能大声说话和唱歌。
        en: We cannot speak loudly or sing in the library.
      - zh: 老师提醒弟弟不要大声影响其他同学。
        en: The teacher reminded my younger brother not to speak loudly and disturb other students.
      - zh: 哥哥因为太开心，所以大声地笑了起来。
        en: My older brother laughed loudly because he was very happy.
      - zh: 妈妈请我们不要大声说话影响邻居。
        en: Mum asked us not to speak loudly and disturb the neighbours.
      - zh: 小朋友们在操场上可以大声唱歌和玩耍。
        en: The children can sing loudly and play on the field.

  - word: 说话
    pinyin: shuō huà
    meaning: To speak
    example: 老师说话的时候，我们应该认真听。
    sentenceBank:
      - zh: 老师说话的时候，我们应该认真听。
        en: When the teacher speaks, we should listen carefully.
      - zh: 在图书馆里，我们要小声说话才不会影响别人。
        en: In the library, we should speak softly so we do not disturb others.
      - zh: 妹妹喜欢和朋友一起说话和分享故事。
        en: My younger sister likes talking and sharing stories with her friends.
      - zh: 爸爸正在说话，请大家先安静下来听。
        en: Dad is speaking, so everyone should be quiet and listen first.
      - zh: 有问题的时候，我们可以先好好说话。
        en: When there is a problem, we can talk calmly first.

  - word: 绘本
    pinyin: huì běn
    meaning: Picture book
    example: 妹妹每天晚上都喜欢看有趣的绘本。
    sentenceBank:
      - zh: 妹妹每天晚上都喜欢看有趣的绘本。
        en: My younger sister likes reading interesting picture books every night.
      - zh: 老师今天带了一本新的绘本给大家看。
        en: The teacher brought a new picture book for everyone to see today.
      - zh: 这本绘本里面有很多漂亮的图画和故事。
        en: There are many beautiful pictures and stories in this picture book.
      - zh: 我借了一本绘本回家和妹妹一起看。
        en: I borrowed a picture book to read at home with my younger sister.
      - zh: 我们从绘本里面学到了很多有趣的知识。
        en: We learned many interesting things from the picture book.

  - word: 有趣
