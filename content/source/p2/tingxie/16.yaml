      - zh: 妹妹向老师借了一本故事书回家看。
        en: My younger sister borrowed a storybook from the teacher to read at home.
      - zh: 哥哥借了我的书以后记得还给我。
        en: My older brother remembered to return my book after borrowing it.
      - zh: 我可以借你的彩笔来画一幅图吗？
        en: Can I borrow your coloured pencils to draw a picture?
      - zh: 图书馆里有很多书可以借回家慢慢看。
        en: There are many books in the library that can be borrowed to read at home.

  - word: 次
