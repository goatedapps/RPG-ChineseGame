title: 第十七课 (Lesson 17)
vocab:
  - word: 逛
    pinyin: guàng
    meaning: To explore
    example: 周末晚上，我们一家人一起去逛夜市。
    sentenceBank:
      - zh: 周末晚上，我们一家人一起去逛夜市。
        en: On the weekend evening, my whole family went to explore the night market together.
      - zh: 妈妈喜欢逛夜市，因为那里有很多好吃的东西。
        en: Mum likes exploring the night market because there are many delicious things there.
      - zh: 我和妹妹逛了很久，买了很多小吃回家。
        en: My younger sister and I explored for a long time and bought many snacks home.
      - zh: 爸爸带我们去逛夜市，还请我们喝饮料。
        en: Dad took us to explore the night market and also bought us drinks.
      - zh: 晚饭以后，我们一家人开心地出去逛一逛。
        en: After dinner, our whole family happily went out to explore.

  - word: 夜市
    pinyin: yè shì
    meaning: Night market
    example: 晚上的夜市非常热闹，到处都是人和灯光。
    sentenceBank:
      - zh: 晚上的夜市非常热闹，到处都是人和灯光。
        en: The night market is very bustling at night, with people and lights everywhere.
      - zh: 夜市里有很多好吃的小吃和有趣的游戏。
        en: There are many delicious snacks and interesting games at the night market.
      - zh: 我们星期六晚上一起去夜市玩游戏。
        en: We went to the night market together to play games on Saturday evening.
      - zh: 妹妹第一次来到夜市，觉得特别开心。
        en: My younger sister was very happy visiting the night market for the first time.
      - zh: 夜市里面有很多漂亮的灯光和摊位。
        en: There are many beautiful lights and stalls in the night market.

  - word: 烤香肠
    pinyin: kǎo xiāng cháng
    meaning: Grilled sausage
    example: 夜市里的烤香肠闻起来很香，大家都想吃。
    sentenceBank:
      - zh: 夜市里的烤香肠闻起来很香，大家都想吃。
        en: The grilled sausages at the night market smell delicious, and everyone wants to eat them.
      - zh: 妈妈买了两根烤香肠给我和妹妹吃。
        en: Mum bought two grilled sausages for my younger sister and me.
      - zh: 那个摊位的烤香肠又香又热，非常好吃。
        en: The grilled sausages at that stall are fragrant, hot, and delicious.
      - zh: 我们排队等了一会儿才买到烤香肠。
        en: We queued for a while before we could buy the grilled sausages.
      - zh: 弟弟看到烤香肠以后马上跑过去买东西。
        en: My younger brother ran over immediately after seeing the grilled sausages.

  - word: 炸鸡翅
    pinyin: zhá jī chì
    meaning: Fried chicken wing
    example: 夜市里的炸鸡翅又香又脆，大家都喜欢吃。
    sentenceBank:
      - zh: 夜市里的炸鸡翅又香又脆，大家都喜欢吃。
        en: The fried chicken wings at the night market are crispy and delicious, and everyone likes them.
      - zh: 爸爸买了一大盒炸鸡翅和我们一起分享。
        en: Dad bought a big box of fried chicken wings to share with us.
      - zh: 妹妹闻到炸鸡翅的香味以后很开心。
        en: My younger sister was very happy after smelling the fried chicken wings.
      - zh: 这个摊位每天晚上都会卖很多炸鸡翅。
        en: This stall sells many fried chicken wings every evening.
      - zh: 我们吃完炸鸡翅以后继续逛夜市玩。
        en: After eating the fried chicken wings, we continued exploring the night market.

  - word: 射
    pinyin: shè
    meaning: To shoot
    example: 哥哥在夜市玩射气球的有趣游戏。
