        en: My older brother played the fun balloon-shooting game at the night market.
      - zh: 爸爸教我怎样射气球才比较容易成功。
        en: Dad taught me how to shoot the balloons so it would be easier to succeed.
      - zh: 小朋友们排队等待射气球的游戏开始。
        en: The children queued up and waited for the balloon-shooting game to start.
      - zh: 哥哥射中了三个气球，开心地笑了起来。
        en: My older brother shot three balloons and laughed happily.
      - zh: 我第一次玩射气球，所以觉得非常紧张。
        en: I felt very nervous because it was my first time playing the balloon-shooting game.

