        en: My older brother shot a balloon while playing the game.
      - zh: 这些气球有红色、黄色和蓝色三种颜色。
        en: These balloons come in red, yellow, and blue.
      - zh: 小朋友们看到气球以后都开心地跑过去。
        en: The children happily ran over after seeing the balloons.

  - word: 碰碰车
