title: 第十八课 (Lesson 18)
vocab:
  - word: 餐馆
    pinyin: cān guǎn
    meaning: Restaurant
    example: 周末的时候，我们一家人一起去餐馆吃饭。
    sentenceBank:
      - zh: 周末的时候，我们一家人一起去餐馆吃饭。
        en: On the weekend, my whole family goes to a restaurant to eat.
      - zh: 这家餐馆的食物很好吃，服务也很好。
        en: The food at this restaurant is delicious, and the service is good too.
      - zh: 爸爸下班以后带我们去餐馆吃晚餐。
        en: Dad took us to a restaurant for dinner after work.
      - zh: 餐馆里面有很多客人正在一起吃饭。
        en: There are many customers eating together inside the restaurant.
      - zh: 我们吃完饭以后就一起回家休息。
        en: After eating, we went home together to rest.

  - word: 电影院
    pinyin: diàn yǐng yuàn
    meaning: Cinema
    example: 星期六下午，爸爸带我们去电影院看电影。
    sentenceBank:
      - zh: 星期六下午，爸爸带我们去电影院看电影。
        en: On Saturday afternoon, Dad took us to the cinema to watch a movie.
      - zh: 电影院里面有很多人在排队买电影票。
        en: Many people are queuing to buy movie tickets inside the cinema.
      - zh: 妹妹很喜欢和家人一起去电影院看电影。
        en: My younger sister likes going to the cinema with her family to watch movies.
      - zh: 我们买好电影票以后就走进电影院里面。
        en: After buying the movie tickets, we walked into the cinema.
      - zh: 看完电影以后，我们一起到附近吃晚餐。
        en: After watching the movie, we went to eat dinner nearby together.

  - word: 植物园
    pinyin: zhí wù yuán
    meaning: Botanical Gardens
    example: 周末我们一家人一起去植物园参观花草。
    sentenceBank:
      - zh: 周末我们一家人一起去植物园参观花草。
        en: On the weekend, our whole family went to the botanical gardens to see the plants and flowers.
      - zh: 植物园里面有很多漂亮的花和高大的树木。
        en: There are many beautiful flowers and tall trees in the botanical gardens.
      - zh: 妹妹喜欢在植物园里看各种各样的植物。
        en: My younger sister likes looking at all kinds of plants in the botanical gardens.
      - zh: 我们在植物园走了很久，也拍了很多照片。
        en: We walked for a long time in the botanical gardens and took many photos.
      - zh: 老师带我们去植物园学习植物的名字。
        en: The teacher took us to the botanical gardens to learn the names of plants.

  - word: 东海岸公园
    pinyin: Dōng hǎi àn Gōng yuán
    meaning: East Coast Park
    example: 星期天我们一家人到东海岸公园野餐。
    sentenceBank:
      - zh: 星期天我们一家人到东海岸公园野餐。
        en: On Sunday, our whole family went to East Coast Park for a picnic.
      - zh: 东海岸公园有很多树木和宽大的草地。
        en: East Coast Park has many trees and large grassy areas.
      - zh: 我们在东海岸公园一起骑脚踏车和跑步。
        en: We rode bicycles and jogged together at East Coast Park.
      - zh: 妹妹喜欢在东海岸公园捡漂亮的贝壳。
        en: My younger sister likes picking up beautiful shells at East Coast Park.
      - zh: 傍晚的时候，东海岸公园有很多人在玩。
        en: In the evening, there are many people playing at East Coast Park.

  - word: 参观
    pinyin: cān guān
    meaning: To visit
    example: 老师带我们去国家博物馆参观学习。
    sentenceBank:
      - zh: 老师带我们去国家博物馆参观学习。
        en: The teacher took us to visit and learn at the National Museum.
      - zh: 周末我们一家人一起去植物园参观。
        en: On the weekend, our whole family went to visit the botanical gardens.
      - zh: 妹妹第一次参观博物馆，觉得非常有趣。
        en: My younger sister visited a museum for the first time and found it very interesting.
      - zh: 我们参观了很多地方，也认识了新的东西。
        en: We visited many places and also learned about new things.
      - zh: 学校安排我们下星期去参观一个博物馆。
        en: The school arranged for us to visit a museum next week.

  - word: 跑步
    pinyin: pǎo bù
    meaning: To jog
    example: 爸爸每天早上都会去公园跑步运动。
    sentenceBank:
      - zh: 爸爸每天早上都会去公园跑步运动。
        en: Dad goes to the park to jog every morning.
      - zh: 我和哥哥喜欢放学以后一起跑步。
        en: My older brother and I like jogging together after school.
      - zh: 东海岸公园有很长的路可以跑步。
        en: East Coast Park has a long path where people can jog.
      - zh: 妈妈说每天跑步可以让身体更健康。
        en: Mum says jogging every day can make our bodies healthier.
      - zh: 星期天早上，很多人在公园里跑步。
        en: Many people jog in the park on Sunday mornings.

  - word: 野餐
    pinyin: yě cān
    meaning: Picnic
    example: 天气很好，我们决定到公园一起野餐。
    sentenceBank:
      - zh: 天气很好，我们决定到公园一起野餐。
        en: The weather is nice, so we decided to have a picnic in the park.
      - zh: 妈妈准备了很多食物和饮料去野餐。
        en: Mum prepared lots of food and drinks for the picnic.
      - zh: 我们坐在草地上一边吃东西一边聊天。
        en: We sat on the grass eating and chatting.
      - zh: 妹妹最喜欢和家人一起去野餐玩耍。
        en: My younger sister likes going on picnics with the family the most.
      - zh: 野餐结束以后，我们把垃圾全部收拾干净。
        en: After the picnic, we cleaned up all the rubbish.

  - word: 游泳
    pinyin: yóu yǒng
    meaning: To swim
    example: 天气很热的时候，我们喜欢去游泳。
    sentenceBank:
      - zh: 天气很热的时候，我们喜欢去游泳。
        en: When the weather is hot, we like to go swimming.
      - zh: 哥哥每个星期都会和朋友一起游泳。
        en: My older brother goes swimming with his friends every week.
      - zh: 妹妹已经学会游泳，可以自己下水了。
        en: My younger sister has learned to swim and can enter the water by herself.
      - zh: 爸爸提醒我们游泳以前一定要先热身。
        en: Dad reminds us to warm up before swimming.
      - zh: 游泳以后，我们一起坐下来喝水休息。
        en: After swimming, we sat down together to drink water and rest.

  - word: 泥沙
    pinyin: ní shā
    meaning: Sand
    example: 海边的泥沙很软，妹妹喜欢在那里玩。
    sentenceBank:
      - zh: 海边的泥沙很软，妹妹喜欢在那里玩。
        en: The sand at the beach is soft, and my younger sister likes playing there.
      - zh: 我们在泥沙上画了很多漂亮的图画。
        en: We drew many beautiful pictures on the sand.
      - zh: 弟弟的鞋子里面跑进了很多泥沙。
        en: A lot of sand got inside my younger brother's shoes.
      - zh: 下雨以后，地上的泥沙变得湿湿的。
        en: After the rain, the sand on the ground became wet.
      - zh: 妈妈提醒我们不要把泥沙带回家里。
        en: Mum reminded us not to bring sand back home.

  - word: 捡
