      - zh: 妈妈提醒我洗澡的时候不要浪费水。
        en: Mum reminded me not to waste water while showering.
      - zh: 吃饭的时候，我们也不应该浪费食物。
        en: We should not waste food while eating either.
      - zh: 老师告诉我们浪费水会影响很多人。
        en: The teacher told us that wasting water can affect many people.
      - zh: 我们要学会节约，不可以随便浪费东西。
