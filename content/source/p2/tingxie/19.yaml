title: 第十九课 (Lesson 19)
vocab:
  - word: 洗
    pinyin: xǐ
    meaning: To wash
    example: 我们每天早上起来都要先洗脸刷牙。
    sentenceBank:
      - zh: 我们每天早上起来都要先洗脸刷牙。
        en: Every morning when we wake up, we wash our faces and brush our teeth first.
      - zh: 妈妈叫我吃饭以前一定要洗手。
        en: Mum tells me that I must wash my hands before eating.
      - zh: 弟弟喜欢自己洗澡，不需要妈妈帮忙。
        en: My younger brother likes bathing by himself and does not need Mum's help.
      - zh: 我们用水洗衣服以后要记得关水龙头。
        en: After washing clothes with water, we must remember to turn off the tap.
      - zh: 回家以后，我马上去洗手和换衣服。
        en: After going home, I immediately washed my hands and changed my clothes.

  - word: 浇
    pinyin: jiāo
    meaning: To water (plant)
    example: 每天早上，爸爸都会帮家里的花浇水。
    sentenceBank:
      - zh: 每天早上，爸爸都会帮家里的花浇水。
        en: Every morning, Dad waters the flowers at home.
      - zh: 妹妹喜欢用小水壶帮植物浇水。
        en: My younger sister likes using a small watering can to water the plants.
      - zh: 天气很热的时候，我们要记得给花浇水。
        en: When the weather is hot, we must remember to water the flowers.
      - zh: 老师教我们每天给学校的植物浇水。
        en: The teacher taught us to water the plants at school every day.
      - zh: 我们浇水的时候不要把水浪费掉。
        en: When we water the plants, we should not waste the water.

  - word: 冲
    pinyin: chōng
    meaning: To flush
    example: 上完厕所以后，我们一定要记得冲马桶。
    sentenceBank:
      - zh: 上完厕所以后，我们一定要记得冲马桶。
        en: After using the toilet, we must remember to flush it.
      - zh: 妈妈告诉弟弟上完厕所要马上冲水。
        en: Mum told my younger brother to flush immediately after using the toilet.
      - zh: 我们不能一直冲水，因为这样会浪费水。
        en: We should not keep flushing because this wastes water.
      - zh: 老师教我们正确使用厕所里的马桶。
        en: The teacher taught us how to use the toilet bowl correctly.
      - zh: 看到马桶没有冲干净，我们要再冲一次。
        en: If we see that the toilet bowl is not clean, we should flush it again.

  - word: 马桶
    pinyin: mǎ tǒng
    meaning: Toilet bowl
    example: 上完厕所以后，我们要记得冲马桶。
    sentenceBank:
      - zh: 上完厕所以后，我们要记得冲马桶。
        en: After using the toilet, we must remember to flush the toilet bowl.
      - zh: 妈妈教我怎样正确使用家里的马桶。
        en: Mum taught me how to use the toilet bowl at home correctly.
      - zh: 马桶坏了以后，爸爸马上请人来修理。
        en: After the toilet bowl broke, Dad immediately got someone to repair it.
      - zh: 我们不能把纸巾丢进不适合的马桶里。
        en: We should not throw tissues into an unsuitable toilet bowl.
      - zh: 使用马桶以后，我们一定要保持厕所干净。
        en: After using the toilet bowl, we must keep the toilet clean.

  - word: 厕所
    pinyin: cè suǒ
    meaning: Toilet
    example: 妹妹上完厕所以后记得把手洗干净。
    sentenceBank:
      - zh: 妹妹上完厕所以后记得把手洗干净。
        en: My younger sister remembers to wash her hands after using the toilet.
      - zh: 学校的厕所每天都有人打扫和清洁。
        en: The school toilets are cleaned every day.
      - zh: 我们使用厕所以后要保持里面干净。
        en: We should keep the toilet clean after using it.
      - zh: 弟弟急着找厕所，所以马上跑了过去。
        en: My younger brother urgently needed the toilet, so he ran over immediately.
      - zh: 老师告诉我们不要在厕所里浪费水。
        en: The teacher told us not to waste water in the toilet.

  - word: 告诉
    pinyin: gào su
    meaning: To tell
    example: 妈妈告诉我们一定要珍惜生活中的水。
    sentenceBank:
      - zh: 妈妈告诉我们一定要珍惜生活中的水。
        en: Mum told us that we must cherish the water we use in daily life.
      - zh: 老师告诉大家为什么水对我们很重要。
        en: The teacher told everyone why water is important to us.
      - zh: 爸爸告诉我洗手以后要关好水龙头。
        en: Dad told me to turn off the tap after washing my hands.
      - zh: 妹妹告诉外婆今天学校发生的事情。
        en: My younger sister told Grandma what happened at school today.
      - zh: 我想告诉朋友不要浪费干净的水。
        en: I want to tell my friend not to waste clean water.

  - word: 珍惜
    pinyin: zhēn xī
    meaning: To cherish
    example: 我们应该珍惜水，不要随便浪费水。
    sentenceBank:
      - zh: 我们应该珍惜水，不要随便浪费水。
        en: We should cherish water and not waste it carelessly.
      - zh: 老师教我们要珍惜生活中的每一滴水。
        en: The teacher taught us to cherish every drop of water in our daily lives.
      - zh: 爸爸说我们一定要珍惜大自然的资源。
        en: Dad said that we must cherish the resources of nature.
      - zh: 妈妈希望我们从小就学会珍惜东西。
        en: Mum hopes that we learn to cherish things from a young age.
      - zh: 我们要珍惜水资源，让大家都有水喝。
        en: We should cherish water resources so everyone has water to drink.

  - word: 滴
    pinyin: dī
    meaning: Drop (measure word for water)
    example: 每一滴水都很重要，我们不能随便浪费。
    sentenceBank:
      - zh: 每一滴水都很重要，我们不能随便浪费。
        en: Every drop of water is important, and we must not waste it carelessly.
      - zh: 水龙头没有关好，一滴一滴的水流出来。
        en: The tap was not turned off properly, and water was dripping out.
      - zh: 妹妹用一滴水把手上的灰尘洗掉。
        en: My younger sister used a drop of water to wash the dirt off her hand.
      - zh: 老师告诉我们要珍惜每一滴干净的水。
        en: The teacher told us to cherish every drop of clean water.
      - zh: 看到一滴滴水流出来，我马上关水龙头。
        en: When I saw drops of water flowing out, I immediately turned off the tap.

  - word: 生活
    pinyin: shēng huó
    meaning: Life
    example: 水在我们的生活中是非常重要的东西。
    sentenceBank:
      - zh: 水在我们的生活中是非常重要的东西。
        en: Water is a very important thing in our lives.
      - zh: 我们每天的生活都少不了干净的水。
        en: Our daily lives cannot do without clean water.
      - zh: 学校生活让我学会了很多新的东西。
        en: School life has taught me many new things.
      - zh: 妈妈希望我们过着健康快乐的生活。
        en: Mum hopes that we live healthy and happy lives.
      - zh: 我们应该从小养成节约水的生活习惯。
        en: We should develop the habit of saving water from a young age.

  - word: 节约
    pinyin: jié yuē
    meaning: To save
    example: 我们应该节约用水，不要让水一直流。
    sentenceBank:
      - zh: 我们应该节约用水，不要让水一直流。
        en: We should save water and not let it keep flowing.
      - zh: 妈妈教我们洗手的时候要节约用水。
        en: Mum taught us to save water when washing our hands.
      - zh: 学校举行活动教大家怎样节约水资源。
        en: The school held an activity to teach everyone how to save water resources.
      - zh: 我们每天都可以做小事来节约用水。
        en: We can do small things every day to save water.
      - zh: 节约用水是每个人都应该做到的事情。
        en: Saving water is something everyone should do.

  - word: 浪费
    pinyin: làng fèi
    meaning: To waste
    example: 我们不应该一直开着水龙头浪费水。
    sentenceBank:
