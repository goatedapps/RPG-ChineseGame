title: 第二课 (Lesson 2)
vocab:
  - word: 大吉大利
    pinyin: dà jí dà lì
    meaning: Good luck
    example: 新年到了，祝大家大吉大利，天天开心。
    sentenceBank:
      - zh: 新年到了，祝大家大吉大利，天天开心。
        en: The Chinese New Year has arrived. Wishing everyone good luck and happiness every day.
      - zh: 我们全家一起说大吉大利，祝大家新年快乐。
        en: Our whole family said “good luck” and wished everyone a Happy New Year.
      - zh: 妈妈希望新的一年大吉大利，家人平平安安。
        en: Mum hopes the new year will bring good luck and peace to the family.
      - zh: 过年的时候，我们都会说大吉大利这句话。
        en: During Chinese New Year, we always say “good luck”.
      - zh: 爸爸祝爷爷奶奶大吉大利，身体健康。
        en: Dad wishes Grandpa and Grandma good luck and good health.

  - word: 岁岁平安
