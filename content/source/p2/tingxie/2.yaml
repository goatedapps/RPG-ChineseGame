    sentenceBank:
      - zh: 新年时，我们祝家人岁岁平安，身体健康。
        en: During Chinese New Year, we wish our family peace and good health every year.
      - zh: 我祝外婆岁岁平安，每天都开开心心。
        en: I wish Grandma peace every year and happiness every day.
      - zh: 爸爸妈妈希望我们一家人岁岁平安。
        en: Dad and Mum hope our whole family will have peace every year.
      - zh: 拜年的时候，我对爷爷说岁岁平安。
        en: When wishing Grandpa a Happy New Year, I said “peace every year”.
      - zh: 新年祝福里常常可以听到岁岁平安。
        en: We can often hear “peace every year” in New Year greetings.

