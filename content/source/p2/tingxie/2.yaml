        en: Mum says “more than enough every year” is a good New Year blessing.
      - zh: 吃鱼的时候，爸爸说年年有余。
        en: When we ate fish, Dad said “more than enough every year”.
      - zh: 我希望我们家年年有余，天天都开心。
        en: I hope our family will have more than enough every year and be happy every day.
      - zh: 新年祝福中常常会说年年有余这句话。
        en: The phrase “more than enough every year” is often used in New Year greetings.

