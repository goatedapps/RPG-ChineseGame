      - zh: 同学们坐成一排听老师说话。
        en: The students sat in a row and listened to the teacher.
      - zh: 花园里有一排不同颜色的花。
        en: There is a row of flowers in different colours in the garden.
      - zh: 我们把画纸一排一排地放在桌上。
        en: We put the drawing paper in rows on the table.

  - word: 片
