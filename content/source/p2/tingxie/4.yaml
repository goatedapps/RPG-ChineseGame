    meaning: Measure word (row)
    example: 学校门口种了一排漂亮的小树。
    sentenceBank:
      - zh: 学校门口种了一排漂亮的小树。
        en: A row of beautiful little trees was planted at the school entrance.
      - zh: 教室外面有一排绿色的大树。
