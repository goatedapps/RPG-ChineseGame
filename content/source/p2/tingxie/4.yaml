title: 第四课 (Lesson 4)
vocab:
  - word: 棵
    pinyin: kē
    meaning: Measure word for tree
    example: 学校门口有一棵很大的树。
    sentenceBank:
      - zh: 学校门口有一棵很大的树。
        en: There is a very big tree at the school entrance.
      - zh: 公园里有一棵漂亮的老树。
        en: There is a beautiful old tree in the park.
      - zh: 爸爸在家门前种了一棵小树。
        en: Dad planted a small tree in front of our house.
      - zh: 那一棵树上有很多绿色的叶子。
        en: That tree has many green leaves.
      - zh: 我们一起在花园里种一棵小树。
        en: We planted a small tree in the garden together.

  - word: 树
    pinyin: shù
    meaning: Tree
    example: 公园里的树又高又大又漂亮。
    sentenceBank:
      - zh: 公园里的树又高又大又漂亮。
        en: The trees in the park are tall, big, and beautiful.
      - zh: 我喜欢坐在大树下面看故事书。
        en: I like sitting under a big tree and reading storybooks.
      - zh: 学校里种了很多不同的树。
        en: Many different trees have been planted in the school.
      - zh: 小鸟喜欢站在树上唱歌。
        en: Birds like standing on trees and singing.
      - zh: 下雨的时候，我们可以站在树下躲雨。
        en: When it rains, we can stand under a tree to shelter from the rain.

  - word: 剪出
    pinyin: jiǎn chū
    meaning: To cut
    example: 我用彩色纸剪出一朵漂亮的小花。
