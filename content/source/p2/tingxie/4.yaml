      - zh: 远处有一片树林，里面住着小鸟。
        en: There is a forest in the distance where birds live.
      - zh: 我们在一片树林里看到很多小动物。
        en: We saw many small animals in a forest.
      - zh: 学校后面有一片安静的树林。
