      - zh: 老师教我们剪出不同形状的图画。
        en: The teacher taught us to cut out pictures of different shapes.
      - zh: 妹妹用剪刀剪出一只可爱的小动物。
        en: My younger sister used scissors to cut out a cute little animal.
      - zh: 我们一起剪出很多绿色的小树。
        en: We cut out many little green trees together.
      - zh: 哥哥可以用纸剪出一个大大的圆形。
        en: My older brother can cut a big circle out of paper.

  - word: 排
