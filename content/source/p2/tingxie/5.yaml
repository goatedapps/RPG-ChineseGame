title: 第五课 (Lesson 5)
vocab:
  - word: 音乐室
    pinyin: yīn yuè shì
    meaning: Music room
    example: 学校的音乐室在三楼的最后一个房间。
    sentenceBank:
      - zh: 学校的音乐室在三楼的最后一个房间。
        en: The school's music room is in the last room on the third floor.
      - zh: 我们下午要到音乐室学习唱歌和音乐。
        en: We are going to the music room to learn singing and music this afternoon.
      - zh: 音乐老师正在音乐室教我们唱新歌。
        en: The music teacher is teaching us a new song in the music room.
      - zh: 开放日的时候，爸爸妈妈可以参观音乐室。
        en: During the open house, Dad and Mum can visit the music room.
      - zh: 音乐室里面有很多不同的乐器可以使用。
        en: There are many different musical instruments to use in the music room.

  - word: 哪里
    pinyin: nǎ lǐ
    meaning: Where
    example: 请问学校的美术室在哪里可以找到呢？
    sentenceBank:
      - zh: 请问学校的美术室在哪里可以找到呢？
        en: Excuse me, where can I find the school's art room?
      - zh: 你知道音乐室在哪里吗，我找不到它。
        en: Do you know where the music room is? I cannot find it.
      - zh: 妈妈问老师厕所在哪里可以找到。
        en: Mum asked the teacher where she could find the toilet.
      - zh: 你知道足球场在哪里吗，我们一起去吧。
        en: Do you know where the football field is? Let's go together.
      - zh: 我不知道图书馆在哪里，所以问了老师。
        en: I did not know where the library was, so I asked the teacher.

  - word: 顶楼
    pinyin: dǐng lóu
    meaning: Top floor
    example: 美术室在学校的顶楼，走楼梯就可以到。
    sentenceBank:
      - zh: 美术室在学校的顶楼，走楼梯就可以到。
        en: The art room is on the top floor of the school, and we can get there by taking the stairs.
      - zh: 我们一起走到顶楼参观学校的美术室。
        en: We walked to the top floor together to visit the school's art room.
      - zh: 顶楼的房间很安静，适合我们画画。
        en: The rooms on the top floor are quiet and suitable for drawing.
      - zh: 开放日的时候，很多家长来到顶楼参观。
        en: During the open house, many parents came to the top floor to visit.
      - zh: 哥哥告诉我音乐室就在顶楼的旁边。
        en: My older brother told me that the music room is on the top floor nearby.

  - word: 美术室
    pinyin: měi shù shì
    meaning: Art room
    example: 学校的美术室里面有很多漂亮的图画。
    sentenceBank:
      - zh: 学校的美术室里面有很多漂亮的图画。
        en: There are many beautiful pictures in the school's art room.
      - zh: 老师带我们到美术室一起画画。
        en: The teacher brought us to the art room to draw together.
      - zh: 美术室里面有很多不同颜色的彩色笔。
        en: There are many coloured pencils in different colours in the art room.
      - zh: 开放日时，爸爸妈妈可以参观美术室。
        en: During the open house, Dad and Mum can visit the art room.
      - zh: 我最喜欢在美术室画自己喜欢的图画。
        en: I like drawing my favourite pictures in the art room the most.

  - word: 旁边
    pinyin: páng biān
    meaning: Beside
    example: 音乐室就在美术室的旁边。
    sentenceBank:
      - zh: 音乐室就在美术室的旁边。
        en: The music room is right beside the art room.
      - zh: 学校的图书馆在食堂的旁边。
        en: The school library is beside the canteen.
      - zh: 妹妹坐在我的旁边一起听老师说话。
        en: My younger sister sat beside me and listened to the teacher.
      - zh: 足球场就在学校操场的旁边。
        en: The football field is right beside the school field.
      - zh: 爸爸把车停在学校大门的旁边。
        en: Dad parked the car beside the school gate.

  - word: 向
    pinyin: xiàng
    meaning: Towards
    example: 我们向学校的大门慢慢走过去。
    sentenceBank:
      - zh: 我们向学校的大门慢慢走过去。
        en: We slowly walked towards the school gate.
      - zh: 小鸟向天空飞去，很快就看不见了。
        en: The bird flew towards the sky and soon disappeared.
      - zh: 我向老师问了一个简单的问题。
        en: I asked the teacher a simple question.
      - zh: 妹妹向妈妈跑过去，然后开心地抱住她。
        en: My younger sister ran towards Mum and happily hugged her.
      - zh: 我们向足球场走去，准备开始运动。
        en: We walked towards the football field, ready to exercise.

  - word: 就
    pinyin: jiù
    meaning: At once
    example: 老师一叫我们，我们就马上走过去。
    sentenceBank:
      - zh: 老师一叫我们，我们就马上走过去。
        en: As soon as the teacher called us, we went over immediately.
      - zh: 下课以后，我就马上去找我的朋友。
        en: After class, I immediately went to find my friend.
      - zh: 妈妈一到家，我就开心地跑过去。
        en: As soon as Mum got home, I happily ran over.
      - zh: 我们吃完早餐就一起出发去学校。
        en: After eating breakfast, we immediately set off for school together.
      - zh: 老师说可以开始，我们就马上开始画画。
        en: When the teacher said we could start, we immediately began drawing.

  - word: 足球场
    pinyin: zú qiú chǎng
    meaning: Football court
    example: 学校的足球场在操场的另一边。
    sentenceBank:
      - zh: 学校的足球场在操场的另一边。
        en: The school's football field is on the other side of the field.
      - zh: 下课以后，男同学一起到足球场踢球。
        en: After class, the boys went to the football field to play football.
      - zh: 开放日的时候，爸爸带我参观足球场。
        en: During the open house, Dad took me to visit the football field.
      - zh: 足球场上有很多同学正在一起运动。
        en: There are many students exercising together on the football field.
      - zh: 我们走过操场以后就可以看到足球场。
        en: After walking across the field, we can see the football field.

  - word: 往
    pinyin: wǎng
    meaning: Towards
    example: 请一直往前走，然后在大门那里转弯。
    sentenceBank:
      - zh: 请一直往前走，然后在大门那里转弯。
        en: Please walk straight ahead and then turn at the gate.
      - zh: 我们往学校里面走，很快就看到老师。
        en: We walked towards the school and soon saw the teacher.
      - zh: 小狗往公园的方向开心地跑过去了。
        en: The puppy happily ran towards the park.
      - zh: 妈妈告诉我往右边走就可以找到厕所。
        en: Mum told me to walk towards the right to find the toilet.
      - zh: 下课以后，同学们一起往操场走去。
        en: After class, the students walked towards the field together.

  - word: 转
    pinyin: zhuǎn
    meaning: To turn
    example: 到了学校大门以后，请向左边转。
    sentenceBank:
      - zh: 到了学校大门以后，请向左边转。
        en: When you reach the school gate, please turn left.
      - zh: 走到前面以后，我们要向右边转。
        en: After walking ahead, we need to turn right.
      - zh: 老师告诉我们在第二个路口转弯。
        en: The teacher told us to turn at the second junction.
      - zh: 妹妹不知道在哪里转，所以问了妈妈。
        en: My younger sister did not know where to turn, so she asked Mum.
      - zh: 我们转过一个弯以后就看到足球场了。
        en: After we turned a corner, we saw the football field.

  - word: 操场
    pinyin: cāo chǎng
    meaning: Field
    example: 学生们每天都会到操场做运动。
    sentenceBank:
      - zh: 学生们每天都会到操场做运动。
        en: The students go to the field to exercise every day.
      - zh: 下课以后，我们喜欢在操场上一起玩。
        en: After class, we like playing together on the field.
      - zh: 操场上有很多同学正在跑步和踢球。
        en: There are many students running and playing football on the field.
      - zh: 学校开放日的时候，操场非常热闹。
        en: The school field is very lively during the open house.
      - zh: 老师带我们到操场参加体育活动。
        en: The teacher brought us to the field to take part in sports activities.

  - word: 运动
    pinyin: yùn dòng
    meaning: To exercise
    example: 我每天放学以后都会做一些运动。
    sentenceBank:
      - zh: 我每天放学以后都会做一些运动。
        en: I exercise a little every day after school.
      - zh: 老师告诉我们每天都要多做运动。
        en: The teacher told us that we should exercise more every day.
      - zh: 哥哥喜欢在操场上跑步和做运动。
        en: My older brother likes running and exercising on the field.
      - zh: 周末的时候，我和爸爸一起出去运动。
        en: At the weekend, Dad and I go out to exercise together.
      - zh: 做运动可以让我们的身体更加健康。
        en: Exercising can make our bodies healthier.

  - word: 路
    pinyin: lù
    meaning: Road
    example: 这条路很长，我们要走很久才到。
    sentenceBank:
      - zh: 这条路很长，我们要走很久才到。
        en: This road is very long, so we have to walk for a long time to get there.
      - zh: 妈妈告诉我过马路一定要小心。
        en: Mum told me that I must be careful when crossing the road.
      - zh: 我们沿着这条路一直走就可以到学校。
        en: We can reach the school by walking along this road.
      - zh: 下雨以后，路上有很多小水坑。
        en: After it rained, there were many puddles on the road.
      - zh: 爸爸开车的时候会注意路上的车辆。
        en: Dad pays attention to the cars on the road when driving.

  - word: 奶奶
    pinyin: nǎi nai
    meaning: Paternal grandmother
    example: 今天奶奶来到学校参加开放日活动。
    sentenceBank:
      - zh: 今天奶奶来到学校参加开放日活动。
        en: Grandma came to school today to attend the open house.
      - zh: 奶奶很喜欢看看我的学校和教室。
        en: Grandma likes looking at my school and classroom.
      - zh: 我带奶奶参观学校里的音乐室和美术室。
        en: I took Grandma to visit the music room and art room in the school.
      - zh: 奶奶走了很远的路才来到我的学校。
        en: Grandma travelled a long way to come to my school.
      - zh: 开放日结束以后，我和奶奶一起回家。
        en: After the open house ended, Grandma and I went home together.

  - word: 远
    pinyin: yuǎn
    meaning: Far
    example: 奶奶家离学校很远，需要坐车过去。
    sentenceBank:
      - zh: 奶奶家离学校很远，需要坐车过去。
        en: Grandma's house is far from school, so we need to take a car there.
      - zh: 足球场离音乐室很远，我们走了很久。
        en: The football field is far from the music room, so we walked for a long time.
      - zh: 那座山看起来很远，我们还要继续走。
        en: That mountain looks very far away, and we still have to keep walking.
      - zh: 我的朋友住得很远，所以很少见面。
        en: My friend lives very far away, so we rarely meet.
      - zh: 学校虽然很远，但是我每天都很开心。
        en: Although the school is far away, I am happy every day.

  - word: 迷路
    pinyin: mí lù
    meaning: To lose one's way
    example: 奶奶第一次来到学校，所以差一点迷路。
    sentenceBank:
      - zh: 奶奶第一次来到学校，所以差一点迷路。
        en: Grandma came to the school for the first time, so she almost got lost.
      - zh: 我们在大公园里走了很久，最后迷路了。
        en: We walked in the big park for a long time and got lost in the end.
      - zh: 如果你不知道路，就不要一个人走以免迷路。
        en: If you do not know the way, do not walk alone so that you do not get lost.
      - zh: 妈妈告诉我出门的时候一定不要迷路。
        en: Mum told me that I must not get lost when going out.
      - zh: 哥哥看着地图，所以我们没有迷路。
        en: My older brother looked at the map, so we did not get lost.

  - word: 从
    pinyin: cóng
    meaning: From
    example: 我们从学校的大门走到足球场那里。
    sentenceBank:
      - zh: 我们从学校的大门走到足球场那里。
        en: We walked from the school gate to the football field.
      - zh: 奶奶从家里坐车来到学校参加开放日。
        en: Grandma came from home to school by car for the open house.
      - zh: 我从音乐室走到美术室找老师。
        en: I walked from the music room to the art room to find the teacher.
      - zh: 小鸟从树上飞到了蓝蓝的天空。
        en: The bird flew from the tree into the blue sky.
      - zh: 爸爸从学校门口一直走到操场那里。
        en: Dad walked all the way from the school gate to the field.

  - word: 山坡
    pinyin: shān pō
    meaning: Hillside
    example: 山坡上有很多绿色的树和青草。
    sentenceBank:
      - zh: 山坡上有很多绿色的树和青草。
        en: There are many green trees and grass on the hillside.
      - zh: 我们和老师一起慢慢走上山坡。
        en: We slowly walked up the hillside with our teacher.
      - zh: 山坡上的风很大，天气也非常凉快。
        en: The wind on the hillside is strong, and the weather is very cool.
      - zh: 小朋友们在山坡下面一起玩游戏。
        en: The children played games together at the bottom of the hillside.
      - zh: 奶奶从山坡那里走下来找我们。
        en: Grandma walked down from the hillside to find us.

  - word: 久
    pinyin: jiǔ
    meaning: For a long time
    example: 我们走了很久，终于到了学校。
    sentenceBank:
      - zh: 我们走了很久，终于到了学校。
        en: We walked for a long time and finally reached the school.
      - zh: 奶奶等了很久，终于看到了我们。
        en: Grandma waited for a long time and finally saw us.
      - zh: 我好久没有来学校参加这样的活动了。
        en: I have not come to school for such an activity for a long time.
      - zh: 爸爸开车开了很久才到达目的地。
        en: Dad drove for a long time before reaching the destination.
      - zh: 我们在操场上玩了很久才回教室。
        en: We played on the field for a long time before returning to the classroom.

  - word: 回答
    pinyin: huí dá
    meaning: To answer
    example: 老师问我问题，我马上举手回答。
    sentenceBank:
      - zh: 老师问我问题，我马上举手回答。
        en: The teacher asked me a question, and I immediately raised my hand to answer.
      - zh: 妈妈问我学校在哪里，我认真地回答。
        en: Mum asked me where the school was, and I answered carefully.
      - zh: 我不知道这个问题的答案，所以没有回答。
        en: I did not know the answer to this question, so I did not answer.
      - zh: 老师请同学们一个一个地回答问题。
        en: The teacher asked the students to answer the questions one by one.
      - zh: 哥哥听完问题以后马上回答了老师。
        en: My older brother answered the teacher immediately after hearing the question.

  - word: 笑
    pinyin: xiào
    meaning: To laugh
    example: 妹妹听到有趣的故事以后开心地笑了。
    sentenceBank:
      - zh: 妹妹听到有趣的故事以后开心地笑了。
        en: My younger sister laughed happily after hearing the funny story.
      - zh: 老师说了一个笑话，大家都开心地笑。
        en: The teacher told a joke, and everyone laughed happily.
      - zh: 看到奶奶来到学校，我马上开心地笑了。
        en: I immediately smiled happily when I saw Grandma come to school.
      - zh: 弟弟看到小狗做动作的时候一直笑。
        en: My younger brother kept laughing when he saw the puppy doing tricks.
      - zh: 我们一起看有趣的表演，笑得非常开心。
        en: We watched an interesting performance together and laughed very happily.

  - word: 已经
    pinyin: yǐ jīng
    meaning: Already
    example: 我们已经走到学校的大门口了。
    sentenceBank:
      - zh: 我们已经走到学校的大门口了。
        en: We have already walked to the school gate.
      - zh: 老师已经在音乐室里面等我们了。
        en: The teacher is already waiting for us in the music room.
      - zh: 妈妈已经帮我准备好今天的东西了。
        en: Mum has already prepared everything I need for today.
      - zh: 奶奶已经来到学校参加开放日活动。
        en: Grandma has already arrived at school for the open house.
      - zh: 我已经参观过美术室和音乐室了。
        en: I have already visited the art room and music room.

  - word: 直
    pinyin: zhí
    meaning: Straight
    example: 请一直直走，然后在第二个路口转弯。
    sentenceBank:
      - zh: 请一直直走，然后在第二个路口转弯。
        en: Please walk straight ahead and then turn at the second junction.
      - zh: 从学校大门直走就可以看到操场了。
        en: Walk straight from the school gate and you will see the field.
      - zh: 我们沿着这条路一直直走到前面。
        en: We walked straight along this road to the front.
      - zh: 老师告诉我们不要走错，要一直直走。
        en: The teacher told us not to go the wrong way and to keep walking straight.
      - zh: 这条路很直，我们很快就到了学校。
        en: This road is very straight, so we reached the school quickly.
