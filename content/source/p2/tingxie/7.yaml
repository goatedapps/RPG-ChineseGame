        en: My younger sister added a small spoonful of sugar to her coffee.
      - zh: 爸爸说吃太多糖对身体不好。
        en: Dad says eating too much sugar is not good for our bodies.
      - zh: 服务员问我要不要在奶茶里加糖。
        en: The waiter asked whether I wanted to add sugar to my milk tea.

