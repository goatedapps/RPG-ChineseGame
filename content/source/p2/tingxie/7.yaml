title: 第七课 (Lesson 7)
vocab:
  - word: 奶茶
    pinyin: nǎi chá
    meaning: Milk tea
    example: 我最喜欢在咖啡店喝一杯奶茶。
    sentenceBank:
      - zh: 我最喜欢在咖啡店喝一杯奶茶。
        en: I like drinking a cup of milk tea at the coffee shop the most.
      - zh: 妈妈今天早上买了一杯香香的奶茶。
        en: Mum bought a fragrant cup of milk tea this morning.
      - zh: 妹妹喜欢喝奶茶，但是不能喝太多。
        en: My younger sister likes drinking milk tea, but she cannot drink too much.
      - zh: 爸爸帮我点了一杯少糖的奶茶。
        en: Dad ordered a less-sweet milk tea for me.
      - zh: 星期六早上，我们一起去咖啡店喝奶茶。
