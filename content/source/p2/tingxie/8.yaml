    sentenceBank:
      - zh: 妈妈每天都会照顾我们一家人的生活。
        en: Mum takes care of our family's daily life every day.
      - zh: 护士在医院里认真照顾生病的孩子。
        en: The nurse carefully takes care of sick children in the hospital.
      - zh: 姐姐会帮助妈妈照顾年幼的弟弟。
        en: My older sister helps Mum take care of our younger brother.
      - zh: 我们应该学会照顾自己的身体和生活。
        en: We should learn to take care of our bodies and daily lives.
      - zh: 爷爷生病以后，大家一起照顾他。
        en: After Grandpa became sick, everyone took care of him together.
  - word: 爷爷
    pinyin: yé ye
    meaning: Paternal grandfather
    example: 爷爷每天早上都会到公园散步运动。
    sentenceBank:
      - zh: 爷爷每天早上都会到公园散步运动。
        en: Grandpa goes to the park for a walk and exercise every morning.
      - zh: 我很喜欢听爷爷说以前的故事。
        en: I really like listening to Grandpa tell stories about the past.
      - zh: 爷爷生病的时候，我们会陪他看病。
        en: When Grandpa is sick, we accompany him to see the doctor.
      - zh: 爷爷常常教我种花和照顾植物。
        en: Grandpa often teaches me to plant flowers and take care of plants.
      - zh: 周末的时候，我会和爷爷一起吃饭。
        en: At the weekend, I have meals with Grandpa.
  - word: 小贩
