title: 第八课 (Lesson 8)
vocab:
  - word: 医生
    pinyin: yī shēng
    meaning: Doctor
    example: 医生每天帮助很多生病的人恢复健康。
    sentenceBank:
      - zh: 医生每天帮助很多生病的人恢复健康。
        en: Doctors help many sick people recover every day.
      - zh: 我生病的时候，妈妈带我去看医生。
        en: When I was sick, Mum took me to see the doctor.
      - zh: 医生认真地听我说身体哪里不舒服。
        en: The doctor carefully listened to me describe where I felt uncomfortable.
      - zh: 这位医生每天都很认真地工作。
        en: This doctor works very hard every day.
      - zh: 我长大以后想成为一名帮助别人的医生。
        en: I want to become a doctor who helps others when I grow up.
  - word: 看病
    pinyin: kàn bìng
    meaning: To examine a patient
    example: 生病以后，我们应该早点去医院看病。
    sentenceBank:
      - zh: 生病以后，我们应该早点去医院看病。
        en: After getting sick, we should go to the hospital to see a doctor early.
      - zh: 妈妈陪爷爷去医院看病和拿药。
        en: Mum accompanied Grandpa to the hospital to see the doctor and get medicine.
      - zh: 医生每天要帮助很多病人看病。
        en: Doctors have to examine many patients every day.
      - zh: 我身体不舒服，所以爸爸带我去看病。
        en: I felt unwell, so Dad took me to see a doctor.
      - zh: 看病以后，医生告诉我要多休息喝水。
        en: After examining me, the doctor told me to rest and drink more water.
  - word: 护士
    pinyin: hù shi
    meaning: Nurse
    example: 护士每天都认真地照顾医院里的病人。
    sentenceBank:
      - zh: 护士每天都认真地照顾医院里的病人。
        en: Nurses carefully take care of patients in the hospital every day.
      - zh: 护士帮医生准备看病需要的东西。
        en: The nurse helps the doctor prepare the things needed for examining patients.
      - zh: 我住院的时候，护士每天来看我。
        en: When I was in the hospital, the nurse came to see me every day.
      - zh: 护士很有耐心地回答病人的问题。
        en: The nurse patiently answered the patient's questions.
      - zh: 我很感谢护士每天对大家的帮助。
        en: I am very thankful for the nurses' help every day.
  - word: 照顾
    pinyin: zhào gù
    meaning: To take care of
