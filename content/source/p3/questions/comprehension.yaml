- groupId: P3-CH-2025-WA2-HENRYPARK-Q14-16
  subject: Chinese
  passage:
    title: 小猴子不专心
    source: P3_Chinese_2025_WA2_henrypark.pdf; PDF pages 6–7; answer key supplied in PDF
    text: |-
      一天，猴妈妈要在家里请客，但家里没米了。猴妈妈很忙，便叫小猴子帮它下山去买一包米回来。猴妈妈还叫小猴子快去快回，不要在路上玩。

      小猴子买了米，走到半路，看到一棵树，树上长了许多它最喜欢吃的香蕉。于是，小猴子把米放下，爬上树去采香蕉。当它采了香蕉，想回去拿米时，米已经被老鼠拿走了。

      小猴子又走了一会儿，看到小河边有很多花。小猴子觉得这些花又香又美丽，便把香蕉丢进河里，跑去采花。

      快到家时，小猴子看到路旁的大树上结了一个大水果。它想知道那是什么东西，便爬上树去。当它刚采到大水果时，一不小心，从树上跌了下来。大水果和花都掉在地上，被小猴子压坏了。

      猴妈妈见小猴子空着手回来，非常生气。它听小猴子说完事情的经过后，说：“你这样不专心，怎能把事情做好呢？”听了妈妈的话，小猴子不好意思地低下了头。
  questions:
    - sourceQuestion: Q14
      format: Fill-in
      text: 猴妈妈很忙，便叫小猴子帮它下山去________回来。
      accepted:
        - 买一包米
      displayAnswer: 买一包米
    - sourceQuestion: Q15
      format: MCQ
      text: 以下哪个句子是不正确的？
      options:
        - 小猴子把花朵丢进了河里。
        - 小猴子最喜欢吃的是香蕉。
        - 小猴子买的米被老鼠拿走了。
        - 小猴子压坏了大水果和花朵。
      correct: 小猴子把花朵丢进了河里。
    - sourceQuestion: Q16
      format: MCQ
      text: 小猴子从这件事中学到了什么？
      options:
        - 要把东西放好
        - 应该帮助妈妈
        - 做事时要专心
        - 做错事要认错
      correct: 做事时要专心
- groupId: P3-CH-2025-WA2-HENRYPARK-Q17-19
  subject: Chinese
  passage:
    title: 小鸡学会帮助别人
    source: P3_Chinese_2025_WA2_henrypark.pdf; PDF pages 8–9; answer key supplied in PDF
    text: |-
      一天早上，小白兔来找小鸡，向它借篮子。小鸡摇摇头说：“不行，我自己要用。”

      过了一会儿，鸭妈妈要去看医生，它请小鸡帮忙照顾小鸭。小鸡听后马上说：“不行，我要去玩。”

      到了晚上，小松鼠来找小鸡。它说：“明天一早我要去采果子。天一亮，请你大声叫我起床。我知道你每天都起得很早。”小鸡苦着脸说：“不行，我没力气大声叫。”

      小松鼠刚走，就下起了大雨。小鸡的木屋倒下来了！小白兔、鸭妈妈和小松鼠知道了，就马上赶来，合力帮小鸡建了一座新的木屋。

      小鸡红着脸对动物们说：“我以前那么对你们，你们还来帮我，真是太谢谢你们了！”
  questions:
    - sourceQuestion: Q17
      format: Long-Answer
      text: 鸭妈妈要小鸡帮它做什么？小鸡为什么不能帮它？
      displayAnswer: 鸭妈妈要小鸡帮它照顾小鸭。因为小鸡要去玩。
    - sourceQuestion: Q18
      format: Long-Answer
      text: 动物们有没有生小鸡的气？从哪里可以知道？
      displayAnswer: 动物们没有生小鸡的气。从它们知道小鸡的木屋倒了，就马上赶来，合力帮小鸡建了一座新的木屋可以知道。
    - sourceQuestion: Q19
      format: Long-Answer
      text: 小鸡为什么会脸红？你认为小鸡以后会有什么变化？
      displayAnswer: 因为小鸡知道自己做错了。我认为小鸡以后看见有动物需要帮忙时，会马上帮助它们。
- groupId: P3-CH-2025-WA2-MAHABODHI-Q15-17
  subject: Higher Chinese
  passage:
    title: 小猫和玩具小鸡
    source: P3_Chinese_2025_WA2_mahabodhi.pdf; PDF pages 6–7; answer key supplied in PDF
    text: |-
      一天，小猫米米发现桌子上有一个奇怪的书包。这个书包会自己动，还会发出声音。米米很好奇，就走上前去看一看。

      米米试着用爪子拍了拍书包，书包没有再动，也安静了下来。米米感到害怕想要躲起来，可是它又想知道书包里有什么。它跳上桌子，用力地踢了书包一下。书包掉在地上，打开了！

      这时，书包里跳出了一只玩具小鸡。小鸡在地上走来走去，还一直“叽叽”叫。米米怕得马上跳到椅子上。它小心地看了一会儿，发现小鸡原来一点儿也不可怕。

      后来，米米把小鸡当成了好朋友，每天一起玩。米米很高兴自己没有因为害怕就躲起来，要是它躲起来，就不会发现新事物了！
  questions:
    - sourceQuestion: Q15
      format: MCQ
      text: 米米第一次看到书包时，它是怎么做的？
      options:
        - 它用爪子去拍书包。
        - 它走上前去看一看。
        - 它马上跳到椅子上。
        - 它找个地方躲起来。
      correct: 它走上前去看一看。
    - sourceQuestion: Q16
      format: MCQ
      text: 米米为什么用力地踢了书包一下？
      options:
        - 因为它要让书包不停地动。
        - 因为它要让书包发出声音。
        - 因为它想知道怎么打开书包。
        - 因为它想知道书包里有什么。
      correct: 因为它想知道书包里有什么。
    - sourceQuestion: Q17
      format: MCQ
      text: 这件事让米米学到了什么？
      options:
        - 不可以动别人的东西。
        - 不可以去发现新事物。
        - 不能因为害怕就躲起来。
        - 不能因为好奇就做坏事。
      correct: 不能因为害怕就躲起来。
- groupId: P3-CH-2025-WA2-METHODIST-Q11-15
  subject: Chinese
  passage:
    title: 新邻居
    source: P3_Chinese_2025_WA2_methodist.pdf; PDF pages 5–6; answer key supplied in PDF
    text: |-
      半年前，我搬新家了。刚开始，我总是觉得很不开心，因为不能跟好朋友一起玩了。

      一天傍晚，我们正在客厅搬沙发。突然，门铃响了，爸爸打开门，一位叔叔和一位阿姨在门口。叔叔说：“我们是你的邻居，来向你们问好。”接着，阿姨请我们尝一尝她刚做好的蛋糕。爸爸和妈妈还来不及道谢，叔叔又指着沙发，说道：“我帮你们搬沙发吧！”看到这里，我的心里十分感动。

      第二天下午放学后，我走到组屋楼下，看到电梯旁边多了一个小书架，上面放着很多本故事书。这时，电梯门开了，邻居阿姨走了出来。她一边把几本书放在书架上，一边对我说：“这是我们的图书角落，大家可以从书架上选书带回家读或者把家里的书放在这里让别人看。”

      原来是这样，我知道应该怎么做了！
  questions:
    - sourceQuestion: Q11
      format: MCQ
      marks: 2
      text: 为什么刚搬家时，“我”觉得很不开心呢？因为“我”___。
      options:
        - 不能吃阿姨做的蛋糕。
        - 不想去新的学校上学。
        - 不认识住在旁边的邻居。
        - 不能跟好朋友一起玩了。
      correct: 不能跟好朋友一起玩了。
    - sourceQuestion: Q12
      format: MCQ
      marks: 2
      text: 邻居为什么会来按我们家的门铃？
      options:
        - 他们来请爸爸帮忙搬沙发。
        - 他们要教我做美味的蛋糕。
        - 他们要认识和帮助新邻居。
        - 他们想叫我们去楼下拿书。
      correct: 他们要认识和帮助新邻居。
    - sourceQuestion: Q13
      format: Long-Answer
      marks: 2
      text: |-
        a）文中形容“一直都是”的词语是：________。（1分）
        b）文中形容“时间短，没赶上”的词语是：________。（1分）
      displayAnswer: a）总是。b）来不及。
    - sourceQuestion: Q14
      format: Long-Answer
      marks: 2
      text: 为什么“我”的心里十分感动？
      displayAnswer: 因为阿姨请“我”和家人尝刚做好的蛋糕，叔叔还主动帮我们搬沙发。
    - sourceQuestion: Q15
      format: Long-Answer
      marks: 2
      text: 在组屋楼下听了邻居阿姨的话后，“我”可以怎么做？
      displayAnswer: “我”可以从书架上选书带回家读，或者把家里的书放在那里让别人看。
- groupId: P3-CH-2025-WA2-RAFFLES-Q11-14
  subject: Chinese
  passage:
    title: 帮助朋友找书
    source: P3_Chinese_2025_WA2_raffles.pdf; PDF pages 6–7; answer key supplied in PDF
    text: |-
      放学后，我和康康正要走出校门，看到了小美。小美的眼睛红红的，我觉得很奇怪，就问道：“你怎么了？”她伤心地说：“我的故事书不见了。”

      康康说：“安安，我们帮小美找故事书，好吗？”我想回家，不想帮忙。但是康康是我的好朋友，我不好意思说“不”，就答应了。

      我们回到课室四处找，都没有看到那本书。小美说：“时间不早了，你们不要找了，还是回家吧。”康康摇摇头，又拉着小美一起去了音乐室。果然，故事书就在音乐室的一张桌子上！小美看到了，高兴得跳了起来，说：“谢谢你们！”

      看到小美脸上的笑容，我感到很开心，但是又有一点不好意思。原来帮助朋友是一件快乐的事，我以后也要多帮助同学。
  questions:
    - sourceQuestion: Q11
      format: MCQ
      marks: 2
      text: 什么事情让“我”觉得很奇怪？
      options:
        - 小美的眼睛红红的。
        - 小美的故事书不见了。
        - 大家在课室里找不到书。
      correct: 小美的眼睛红红的。
    - sourceQuestion: Q12
      format: MCQ
      marks: 2
      text: 以下哪一个句子是对的？
      options:
        - “我”本来不想帮忙找书，因为“我”想回家。
        - 康康感到很不好意思，因为小美跟他们说谢谢。
        - 他们到音乐室去找，在地上找到小美的故事书。
      correct: “我”本来不想帮忙找书，因为“我”想回家。
    - sourceQuestion: Q13
      format: Long-Answer
      marks: 3
      text: 从哪里可以看出康康喜欢帮助别人？
      displayAnswer: 从康康知道小美的故事书不见了，便主动帮小美找可以看出。
    - sourceQuestion: Q14
      format: Long-Answer
      marks: 2
      text: 小美最后找到故事书，“我”学到了什么？
      displayAnswer: “我”学到帮助朋友是一件快乐的事，以后也要多帮助同学。
- groupId: P3-CH-2025-WA2-ROSYTH-Q11-15
  subject: Chinese
  passage:
    title: 小乌龟找妈妈
    source: P3_Chinese_2025_WA2_rosyth.pdf; PDF pages 4–5; answer key supplied in PDF
    text: |-
      放学后，小安和康康到学校旁边的公园去玩。池塘里有一群小乌龟，身体圆圆的，身上披着绿衣服，在水里游来游去。小安看见小乌龟们摆动着四条短短的腿，说：“小乌龟真可爱！”

      康康走到池塘边，看见一只小乌龟站在石头上，就问：“它在睡觉吗？怎么不会动啊？”小安说：“它的腿受伤了！它爬不动。”康康听了，说：“小安，你带它回家吧。你一定要好好照顾它。”小安点点头。

      过了一个星期，小乌龟的腿好了。可是，小安很爱小乌龟，觉得小乌龟是个好伙伴。小安不想把它放回池塘里。有一天，小安读了一本书，书上写着：“乌龟妈妈找不到小乌龟，伤心极了。”小安心想：我把小乌龟带走，乌龟妈妈找不到小乌龟，一定会很着急的。

      第二天，小安把小乌龟带到池塘边。他对小乌龟说：“快去找你的妈妈吧！”
  questions:
    - sourceQuestion: Q11
      format: MCQ
      marks: 2
      text: 小安为什么觉得小乌龟很可爱？
      options:
        - 因为它们的身体是圆形的。
        - 因为它们披着绿色的衣服。
        - 因为它们摆动着短短的腿。
        - 因为它们在水里游来游去。
      correct: 因为它们摆动着短短的腿。
    - sourceQuestion: Q12
      format: MCQ
      marks: 2
      text: 康康走到池塘边，发现了什么？
      options:
        - 小乌龟一动也不动。
        - 小乌龟在石头上爬。
        - 小乌龟少了一条腿。
        - 小乌龟在地上睡觉。
      correct: 小乌龟一动也不动。
    - sourceQuestion: Q13
      format: Long-Answer
      marks: 2
      text: 知道小乌龟受伤后，康康对小安说了什么？
      displayAnswer: 康康叫小安带小乌龟回家，一定要好好照顾它。
    - sourceQuestion: Q14
      format: Long-Answer
      marks: 2
      text: 小乌龟的腿好了后，小安为什么不把它放回池塘里？
      displayAnswer: 因为小安很爱小乌龟，觉得小乌龟是个好伙伴。
    - sourceQuestion: Q15
      format: Long-Answer
      marks: 2
      text: 小安最后为什么要带小乌龟去找它的妈妈？
      displayAnswer: 因为小安读了书，想到乌龟妈妈找不到小乌龟一定会很着急，所以要让它找妈妈。
- groupId: P3-CH-2025-WA2-STHILDAS-Q6-8
  subject: Chinese
  passage:
    title: 把垃圾丢进垃圾桶
    source: P3_Chinese_2025_WA2_sthildas.pdf; PDF pages 8–9; answer key supplied in PDF
    text: |-
      上午，老师带同学们到动物园去玩。

      中午，同学们坐在草地上，开心地吃着带来的食物。吃完后，同学们等着坐巴士回家。这时，老师走过来，看到地上的垃圾。她生气地说：“垃圾桶就在不远处，你们乱丢垃圾是不对的。吃完后，你们应该把垃圾捡起来丢进垃圾桶。”

      听了老师的话后，同学们脸红了起来，低下了头。他们想了一会儿，知道怎么做了。
  questions:
    - sourceQuestion: Q6
      format: Long-Answer
      marks: 1
      text: 老师带同学们去哪里？
      displayAnswer: 老师带同学们去动物园。
    - sourceQuestion: Q7
      format: Long-Answer
      marks: 2
      text: 老师为什么很生气？
      displayAnswer: 因为同学们乱丢垃圾。
    - sourceQuestion: Q8
      format: Long-Answer
      marks: 2
      text: 听了老师的话后，同学们接着会怎么做？
      displayAnswer: 同学们会把垃圾捡起来丢进垃圾桶。
- groupId: P3-CH-2025-WA2-TAONAN-Q25-28
  subject: Higher Chinese
  passage:
    title: 一家人的晚餐
    source: P3_Chinese_2025_WA2_taonan.pdf; PDF pages 7–8; answer key supplied in PDF
    text: |-
      今天，我刚走到家门口，就闻到一阵咖喱的香味儿。我轻轻地打开门，把书包放在客厅，然后冲到厨房，大声叫道：“奶奶，我回来了！”奶奶左手拿着一些咖喱叶，右手拿着一盒牛奶，温和地对我说：“你回来了啊！快去洗手。”我问奶奶：“好香啊！您在煮什么？”奶奶回答道：“不就是你和你爸爸最喜欢吃的……”这时，我看见桌上有一些鸡骨头，便高兴地喊道：“咖喱鸡！”奶奶听了，笑着点了点头。

      晚上，奶奶最爱听的电台节目要开始了，但是她还在厨房里忙着。爷爷从书房里走到客厅对我说：“快做功课，你妈妈和妹妹快回来了。”说完，爷爷把报纸整理好，然后走到阳台去给花儿浇水。接着，他把收音机的音量调高，让奶奶可以一边煮饭，一边听电台节目。

      不久，妈妈和妹妹回来了，奶奶也煮好了晚饭。我们一家人开开心心地坐下来，一起享用美味可口的晚餐。
  questions:
    - sourceQuestion: Q25
      format: MCQ
      marks: 2
      text: “我”和爸爸最爱的食物是什么？
      options:
        - 牛奶。
        - 咖喱叶。
        - 咖喱鸡。
        - 鸡骨头。
      correct: 咖喱鸡。
    - sourceQuestion: Q26
      format: MCQ
      marks: 2
      text: “我”回到家时，家里有些什么人？
      options:
        - 爸爸和爷爷。
        - 爷爷和奶奶。
        - 妈妈和妹妹。
        - 奶奶和妹妹。
      correct: 爷爷和奶奶。
    - sourceQuestion: Q27
      format: MCQ
      marks: 2
      text: 以下哪一项不是爷爷从书房走出来后所做的事情？
      options:
        - 帮奶奶煮饭。
        - 给花儿浇水。
        - 叫“我”做功课。
        - 整理客厅里的报纸。
      correct: 帮奶奶煮饭。
    - sourceQuestion: Q28
      format: MCQ
      marks: 2
      text: 爷爷为什么要把收音机的音量调高？
      options:
        - 让爷爷在书房里也听得见。
        - 让妈妈和妹妹在门外也听得见。
        - 让奶奶一边煮饭，一边听电台节目。
        - 让“我”一边做功课，一边听电台节目。
      correct: 让奶奶一边煮饭，一边听电台节目。
- groupId: P3-CH-2025-WA2-TAONAN-Q29-33
  subject: Higher Chinese
  passage:
    title: 诚实的小华
    source: P3_Chinese_2025_WA2_taonan.pdf; PDF pages 9–10; answer key supplied in PDF
    text: |-
      早上，小华在学校门口拾到一个漂亮的文具盒。他想：这应该是我们学校哪位同学的文具盒，不如我拿去交给老师吧！于是，他把文具盒放进书包里，然后走进了校门。

      第一节是华文课。黄老师一走进教室，就大声问道：“文丽昨天新买的文具盒不见了，是谁拿走了？快还给她。”小华听了，心想：如果我把文具盒交出来，同学们可能会认为是我偷的；如果不交出来，让老师发现文具盒在我的书包里，那该怎么办？可是，我又没偷她的文具盒……

      小华想了又想，最后还是决定把文具盒拿出来交给老师。他小声地对老师说：“老师，我在校门口拾到这个文具盒，不知道是不是文丽的。”

      文丽看见心爱的文具盒，马上走上前向小华道谢。老师称赞小华是个诚实的孩子。小华听了，开心地笑了。
  questions:
    - sourceQuestion: Q29
      format: Long-Answer
      marks: 2
      text: |-
        a）文中形容“发觉”的词语是：________。（1分）
        b）文中形容“对如何行动做出主张”的词语是：________。（1分）
      displayAnswer: a）发现。b）决定。
    - sourceQuestion: Q30
      format: Long-Answer
      marks: 1
      text: 小华在哪里拾到文具盒？
      displayAnswer: 小华在学校门口拾到文具盒。
    - sourceQuestion: Q31
      format: Long-Answer
      marks: 2
      text: 小华为什么要把文具盒放进书包里？
      displayAnswer: 小华认为这是他们学校某位同学的文具盒，决定拿去交给老师，所以先把它放进书包里。
    - sourceQuestion: Q32
      format: Long-Answer
      marks: 2
      text: 小华交出文具盒后，老师和文丽有什么反应？
      displayAnswer: 文丽马上走上前向小华道谢。老师称赞小华是个诚实的孩子。
    - sourceQuestion: Q33
      format: Long-Answer
      marks: 2
      text: 如果你是小华，你会把文具盒拿出来交给老师吗？为什么？
      displayAnswer: 我会把文具盒拿出来交给老师，因为我们要做诚实的孩子，不要把别人的东西占为己有。
- groupId: P3-CH-2025-WA3-CATHOLIC-S3-Q22-24
  subject: Higher Chinese
  passage:
    title: 子文只顾玩手机
    source: P3_Chinese_2025_WA3_catholic.pdf; PDF pages 4–5; answer key supplied in PDF
    text: |-
      一个下午，妈妈在喂两岁的妹妹吃水果，子文在玩手机游戏。

      不久，外头下起了大雨。妈妈一边跑到厨房，一边大声喊道：“子文，妈妈去把屋外的衣服收进来，你看着妹妹。”子文没好气地回答道：“别担心，妹妹不会有事的！”子文看了妹妹一眼，又低头继续玩手机游戏，把妈妈的话当耳边风。

      就在这时，妹妹不小心从沙发上跌了下来，痛得她放声大哭。子文见了，吓得不敢出声。妈妈听到妹妹的哭声，马上冲到客厅抱起妹妹，看她有没有受伤。

      过后，妈妈拿走子文的手机，生气地对他说：“你只顾着玩，叫你做点儿事都做不好，以后不准你再玩手机游戏！”

      子文低下头，一句话也不敢说。
  questions:
    - sourceQuestion: Q22
      format: MCQ
      marks: 2
      text: 妈妈要子文___。
      options:
        - 收拾衣服。
        - 去做午餐。
        - 照顾妹妹。
        - 放下手机。
      correct: 照顾妹妹。
    - sourceQuestion: Q23
      format: MCQ
      marks: 2
      text: 子文不把妈妈的话放在心上，因为他___。
      options:
        - 只想玩手机的游戏。
        - 讨厌年纪小的妹妹。
        - 一点也不喜欢妹妹。
        - 觉得妹妹会自己玩。
      correct: 只想玩手机的游戏。
    - sourceQuestion: Q24
      format: MCQ
      marks: 2
      text: 文中的子文是一个怎样的孩子？
      options:
        - 不用功。
        - 不懂事。
        - 没爱心。
        - 没礼貌。
      correct: 不懂事。
- groupId: P3-CH-2025-WA3-CATHOLIC-S4-Q22-24
  subject: Higher Chinese
  passage:
    title: 友情第一比赛第二
    source: P3_Chinese_2025_WA3_catholic.pdf; PDF pages 10–11; answer key supplied in PDF
    text: |-
      小白兔看不起小乌龟。它认为小乌龟爬得慢，比不上自己。有一次，小白兔在赛跑中输给小乌龟，心里很不高兴。于是，它约小乌龟再比一次，看谁先翻过小山、越过小河。

      比赛一开始，小白兔就快步地向前冲。不久，它爬上了山顶。看见乌龟还在后面慢慢地爬，它忍不住哈哈大笑。可是，小白兔想起上次比赛的教训，便马上往河边跑去。

      当小白兔来到河边时，看见小河上的桥倒了。它不会游泳，心里很着急。小白兔很难过，心想：这次比赛又要输了。就在这时，小乌龟追了上来。它停下脚步，对小白兔说：“来！我背你过河！”

      小白兔听了，睁大了眼睛，不相信乌龟说的话。于是，它问小乌龟：“你为什么要这么做，你不怕输了比赛吗？”小乌龟笑了笑，说：“这没什么，友情第一，比赛第二。”就这样，它们俩一起过了河。

      经过这次的比赛，小白兔知道自己错了，因为小乌龟不但本领一点儿也不小，还乐于助人。
  questions:
    - sourceQuestion: Q22
      format: MCQ
      marks: 2
      text: 小白兔为什么要跟小乌龟再比一次？
      options:
        - 因为它认为小乌龟一定会输的。
        - 因为它认为小乌龟有不少本领。
        - 因为它认为小乌龟会慢慢地爬。
        - 因为它认为小乌龟要得到教训。
      correct: 因为它认为小乌龟一定会输的。
    - sourceQuestion: Q23
      format: MCQ
      marks: 2
      text: 小乌龟要背小白兔过河，小白兔有什么感受？
      options:
        - 很着急。
        - 很生气。
        - 很吃惊。
        - 很难过。
      correct: 很吃惊。
    - sourceQuestion: Q24
      format: MCQ
      marks: 2
      text: 你认为小乌龟是只怎样的动物？
      options:
        - 懂事。
        - 热心。
        - 诚实。
        - 聪明。
      correct: 热心。
- groupId: P3-CH-2025-WA3-HENRYPARK-Q14-16
  subject: Chinese
  passage:
    title: 不乱丢果皮
    source: P3_Chinese_2025_WA3_henrypark.pdf; PDF pages 6–7; answer key supplied in PDF
    text: |-
      小马、小羊和小猪是好朋友。它们住在一起。

      小马和小羊爱吃水果。它们吃完水果，就会把果皮丢在家门口。小猪看见了，轻声对它们说：“你们不能把果皮丢在地上，这样做是不对的。”但是，小马和小羊不听，把小猪的话当耳边风。小猪生气极了，不要跟它们做朋友了。过了没多久，它们的家门口到处都是果皮，又脏又臭。

      一天早上，小马和小羊要出门。小羊刚一走出门口，因为踩到果皮而跌倒了！它坐在地上哇哇大哭，大喊：“谁扔的果皮？”小马低声说：“是我们自己扔的！”这时，小马和小羊才知道自己错了。它们红着脸低下头，向小猪认错：“小猪，你说得对，乱丢果皮是不对的。我们以后再也不这样做了。”

      最后，三只动物一起把门口打扫得干干净净。
  questions:
    - sourceQuestion: Q14
      format: Long-Answer
      text: 过了没多久，它们的家门口到处都是果皮，________。
      displayAnswer: 又脏又臭
    - sourceQuestion: Q15
      format: MCQ
      text: 小猪为什么会生气？因为___。
      options:
        - 小马和小羊总爱乱丢果皮。
        - 小马和小羊非常爱吃水果。
        - 小马和小羊不跟它做朋友。
        - 小马和小羊忘了打扫房子。
      correct: 小马和小羊总爱乱丢果皮。
    - sourceQuestion: Q16
      format: MCQ
      text: 从哪里可以知道小马和小羊知错了？
      options:
        - 小羊踩到果皮跌倒。
        - 它们红着脸低下头。
        - 小羊坐在地上大哭。
        - 果皮是它们丢掉的。
      correct: 它们红着脸低下头。
- groupId: P3-CH-2025-WA3-HENRYPARK-Q17-19
  subject: Chinese
  passage:
    title: 小青蛙想飞
    source: P3_Chinese_2025_WA3_henrypark.pdf; PDF pages 8–9; answer key supplied in PDF
    text: |-
      一天，小青蛙正站在家门口望着天空，两只海鸟飞了过来。看见小青蛙闷闷不乐的样子，海鸟们问它：“小青蛙，你为什么不开心？”

      小青蛙回答：“我想要像你们一样在天空中飞来飞去，可是我没有翅膀，飞不起来。”

      两只海鸟就和小青蛙一起想办法，怎么才能让它飞到天上去。突然，小青蛙大声说：“我有办法了！”它去找来一根树枝，叫两只海鸟咬住树枝的两头，它自己咬住树枝的中间。

      人们在地上看见海鸟们带着小青蛙飞了起来，都说：“看，这两只海鸟真聪明啊，想出了这么好的办法！”小青蛙听了，连忙喊道：“这是我想出的……啊！”

      原来，它一张嘴，就从天上掉了下来……
  questions:
    - sourceQuestion: Q17
      format: Long-Answer
      text: 小青蛙为什么不开心？
      displayAnswer: 因为它想像海鸟一样在天空中飞来飞去，可是没有翅膀，飞不起来。
    - sourceQuestion: Q18
      format: Long-Answer
      text: 小青蛙是怎么让自己飞起来的？
      displayAnswer: 它找来一根树枝，叫两只海鸟咬住树枝的两头，自己咬住树枝的中间，让两只海鸟带它飞上天空。
    - sourceQuestion: Q19
      format: Long-Answer
      text: 你觉得小青蛙的办法好吗？为什么？
      displayAnswer: 我觉得小青蛙的办法好，因为它可以让自己飞起来。
      notes: 参考答案认为办法好；也可认为不好，并合理说明一张嘴就会掉下来。
- groupId: P3-CH-2025-WA3-TAONAN-S3-Q25-28
  subject: Higher Chinese
  passage:
    title: 小狗只为自己着想
    source: P3_Chinese_2025_WA3_taonan.pdf; PDF pages 8–9; answer key supplied in PDF
    text: |-
      树林里已经好久没下过一场雨了，连河里的水都干了，只有小狗家里的井还有水。住在小狗家对面的花猫和猴子来找小狗，求小狗给它们一点水喝。

      可是，小狗却摇摇头，大声地说：“不可以！”说完，它就把花猫和猴子赶了出去。

      小狗担心邻居们来偷水，便把井口用盖子盖上，再用锁头锁住，然后才安心上床睡觉。

      夜里，小狗的家着火了。邻居们都赶来救火，可是井盖被锁住了，它们没办法打水灭火。最后，小狗的家被大火烧光了。

      小狗红着脸对大家说：“我只为自己着想，结果害了自己，我知道错了。”
  questions:
    - sourceQuestion: Q25
      format: MCQ
      marks: 2
      text: 河水干了，给大家带来什么不便？
      options:
        - 小动物没水喝。
        - 树林里不再下雨。
        - 花猫不可以过河。
        - 小狗无法安心睡觉。
      correct: 小动物没水喝。
    - sourceQuestion: Q26
      format: MCQ
      marks: 2
      text: 为什么小狗家里有水喝？
      options:
        - 它家里的井还有水。
        - 它偷了邻居家的水。
        - 它家对面有一条河。
        - 它跟猴子要了一点水。
      correct: 它家里的井还有水。
    - sourceQuestion: Q27
      format: MCQ
      marks: 2
      text: 从哪里可以看出小狗不为别人着想？
      options:
        - 它把邻居赶出去。
        - 它大声跟邻居说话。
        - 它不让邻居来喝水。
        - 它不让邻居打水灭火。
      correct: 它不让邻居来喝水。
    - sourceQuestion: Q28
      format: MCQ
      marks: 2
      text: 这个故事告诉我们什么道理？
      options:
        - 做人要有礼貌。
        - 应该多认识新朋友。
        - 不要对朋友说实话。
        - 做人不能只为自己着想。
      correct: 做人不能只为自己着想。
- groupId: P3-CH-2025-WA3-TAONAN-S3-Q29-33
  subject: Higher Chinese
  passage:
    title: 神笔马良
    source: P3_Chinese_2025_WA3_taonan.pdf; PDF pages 10–11; answer key supplied in PDF
    text: |-
      古时候，有个名叫马良的孩子。他很喜欢画画，可是没有钱买画笔，每天只能用树枝在地上画画。

      一天晚上，马良躺在床上休息。突然，床前出现了一道亮光，一位白头发的老爷爷出现了，交给马良一支漂亮的笔。“这支笔送给你，它能画出不同的颜色，也能让你画的画成真。”说完，老爷爷就不见了。

      有了这支神笔，马良就到处帮人画画。有人的羊不见了，马良就给他画一只羊。谁家没水牛帮忙种田，马良就画一头水牛送给那家人。

      这件事很快被贪心的国王知道了。国王把马良叫来，对他说：“你画一座金山给我，我就让你当大官。”马良知道国王没安好心，就先画了一片大海，然后又在大海中间画了一座金山。等马良画好了船，国王就上船出发了。

      这时，马良开始画风。风越来越大，海浪也越来越强。最后，国王的船翻了。贪心的国王再也没有回来。
  questions:
    - sourceQuestion: Q29
      format: Long-Answer
      marks: 2
      text: |-
        a）文中指“好看”的词语是：________。（1分）
        b）文中指“动手做”的词语是：________。（1分）
      displayAnswer: a）漂亮。b）开始。
    - sourceQuestion: Q30
      format: Long-Answer
      marks: 1
      text: 为什么马良用树枝在地上画画？
      displayAnswer: 因为他很喜欢画画，可是没有钱买画笔。
    - sourceQuestion: Q31
      format: Long-Answer
      marks: 2
      text: 老爷爷送给马良的笔有什么特别的地方？
      displayAnswer: 它能画出不同的颜色，也能让马良画的画成真。
    - sourceQuestion: Q32
      format: Long-Answer
      marks: 2
      text: 你觉得马良是一个怎样的孩子？为什么？
      displayAnswer: 他是一个乐于助人的孩子。他到处帮人画画，例如给丢了羊的人画一只羊，给没水牛的人画一头水牛。
    - sourceQuestion: Q33
      format: Long-Answer
      marks: 2
      text: 如果你有一支神笔，你会怎么做？请举例说明。
      displayAnswer: 我会帮助别人，比如有人的书包不见了，我会给他画一个书包。
- groupId: P3-CH-2025-WA3-TAONAN-S4-Q25-28
  subject: Higher Chinese
  passage:
    title: 往好的方面想
    source: P3_Chinese_2025_WA3_taonan.pdf; PDF pages 22–23; answer key supplied in PDF
    text: |-
      老婆婆有两个儿子，大儿子卖雨伞和雨衣，小儿子卖草鞋。

      一到晴天，老婆婆就担心大儿子的雨伞和雨衣卖不出去，便开始哭个不停。可是到了下雨天，老婆婆又开始担心雨会把草鞋淋湿，这样就没有人要买小儿子的草鞋了。想到这里，她又伤心地哭了起来。

      老婆婆每天都过得很不开心。有一天，她把自己的心事说给朋友听。朋友对她说：“为什么你不往好的方面想呢？下雨天，你的大儿子卖伞的生意一定好。晴天，小儿子卖草鞋的生意也应该不错。你的儿子每天都有生意做，你应该高兴才对呀！”

      老婆婆听了朋友的话后，觉得很有道理。从那天起，老婆婆不再担心孩子的生意，过得非常开心。
  questions:
    - sourceQuestion: Q25
      format: MCQ
      marks: 2
      text: 老婆婆的儿子做什么生意？
      options:
        - 大儿子卖草鞋。
        - 大儿子卖雨伞。
        - 小儿子卖雨伞。
        - 小儿子卖雨衣。
      correct: 大儿子卖雨伞。
    - sourceQuestion: Q26
      format: MCQ
      marks: 2
      text: 为什么老婆婆每天都不开心？
      options:
        - 她担心儿子的生意不好。
        - 她担心儿子的生意太好。
        - 她担心儿子不去做生意。
        - 她担心儿子不会做生意。
      correct: 她担心儿子的生意不好。
    - sourceQuestion: Q27
      format: MCQ
      marks: 2
      text: 晴天的时候，老婆婆担心什么？
      options:
        - 小儿子的雨伞卖不出去。
        - 大儿子的雨伞卖不出去。
        - 大儿子的草鞋卖不出去。
        - 小儿子的草鞋卖不出去。
      correct: 大儿子的雨伞卖不出去。
    - sourceQuestion: Q28
      format: MCQ
      marks: 2
      text: 这个故事告诉我们什么道理？
      options:
        - 有心事时要告诉朋友。
        - 晴天比雨天好做生意。
        - 事情要往好的方面想。
        - 不要担心孩子的生意。
      correct: 事情要往好的方面想。
- groupId: P3-CH-2025-WA3-TAONAN-S4-Q29-33
  subject: Higher Chinese
  passage:
    title: 答应的事要做到
    source: P3_Chinese_2025_WA3_taonan.pdf; PDF pages 24–25; answer key supplied in PDF
    text: |-
      星期天下午，文丽要和朋友去海边野餐。五岁的妹妹知道后，吵着要姐姐带她一块儿去。可是，文丽不想和朋友出去玩的时候还要照顾妹妹。于是，她对妹妹说：“妹妹，你去换件漂亮的衣服，我才带你去野餐。”妹妹听了，高兴地拍手叫好，然后跑进房里换衣服。

      文丽一见妹妹跑进房里，就连忙拿起背包跑出家门。在客厅看报纸的爸爸看见了，三步并作两步地走到门口把文丽叫回来，对她说：“孩子，如果你一开始就不想带妹妹去野餐，为什么不直接告诉她呢？”文丽不好意思地回答：“要是我告诉妹妹我不想她跟着去，她一定会哭个不停的。”爸爸听了，笑着问：“如果爸爸答应了你的事没做到，你以后还会相信爸爸吗？”文丽听了，想了想说：“爸爸，我错了。我知道该怎么做了。”

      这时，妹妹换好衣服，踏着轻快的脚步走到文丽身边。她拉着文丽的手，说：“姐姐，我们可以出门了吗？”文丽看着妹妹，说：“我们现在就走！”
