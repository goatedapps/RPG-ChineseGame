      Q4 爸爸在水池里样了几条鱼。
      Q5 我在士卷上写上自己的名字。
      Q6 听写时，我发现小文在头看。
      Q7 灯了三十分钟，巴士却还不来。
      Q8 我们刚搬来这里，认视的人不多。
      Q9 我站了起来，把做位让给了老奶奶。
