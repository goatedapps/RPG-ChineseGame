- groupId: P3-CH-2025-WA1-CHIJ-Q1-10
  subject: Higher Chinese
  passage:
    title: 改正错字
    source: P3_Chinese_2025_WA1_chij.pdf; PDF pages 2; answer key supplied in PDF
    text: |-
      Q1 我在纸上画了一个三脚形。
      Q2 小明改桌了迟到的坏习惯。
      Q3 我常常具手回答老师的问题。
      Q4 她每天跑步，身体变得月来月健康。
      Q5 小鱼摆动未巴，在水里游来游去。
      Q6 姐姐很东事，每天都会帮妈妈扫地。
      Q7 妈妈告诉我出门前要几得把门关好。
      Q8 课室里的书架上放了一此华文故事书。
      Q9 哥哥想看看种在土里的绿豆会有什么变画。
      Q10 只要他努力都书，就一定能考到好成绩。
  questions:
