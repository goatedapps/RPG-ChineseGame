    text: |-
      Q1 我让为乱丢垃圾是不对的。
      Q2 我们不应该再公园里的花朵。
      Q3 桌上的糖果印来了很多蚂蚁。
      Q4 我把国七画在明信片的中间。
      Q5 妈妈对我的学习表现很慢意。
      Q6 小明专过头来，笑着对我说话。
      Q7 周末，我和妹妹到公园奇脚踏车。
      Q8 妈妈每天都会提着环保带去买东西。
      Q9 曹冲想办法，称出来大象的重亮。
      Q10 上课铃声响了，同学们都忘课室的方向走去。
