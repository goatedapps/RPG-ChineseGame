      Q2 妹妹帮娃娃船上漂亮的裙子。
      Q3 弟弟很热，就把外衣给说了。
      Q4 外公的角受伤了，不能做运动。
      Q5 我一不小心朋倒了邻居的花盆。
      Q6 我和妈妈到服近的公园做运动。
      Q7 我今天迟到了，来不记坐校车上学。
      Q8 妹妹跌倒了，爸爸叫她自己吧起来。
      Q9 外婆父了钱后，便拿着水果回家去。
      Q10 姐姐吐然出现在我面前，把我吓了一跳。
