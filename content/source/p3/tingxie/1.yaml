      - zh: 我们一起努力，把教室打扫干净。
        en: We worked hard together to clean the classroom.
      - zh: 虽然题目很难，他还是努力思考。
        en: Although the problem was difficult, he still made an effort to think it through.
      - zh: 哥哥努力工作，认真完成每项任务。
        en: My older brother works hard and completes every task carefully.
      - zh: 只要继续努力，你就会慢慢进步。
        en: If you keep making an effort, you will gradually improve.
  - word: 讲
