    sentenceBank:
      - zh: 姐姐每天练习弹钢琴。
        en: My older sister practises playing the piano every day.
      - zh: 他在操场上练习跑步。
        en: He practises running on the school field.
      - zh: 我们一起练习朗读课文。
        en: We practise reading the lesson text aloud together.
      - zh: 多练习几次，你就会熟悉这个动作。
        en: Practise a few more times, and you will become familiar with this movement.
      - zh: 她认真练习游泳，终于学会了。
        en: She practised swimming diligently and finally learned how to do it.
  - word: 就
    pinyin: jiù
    meaning: Then / Immediately after
    example: 做完作业，我就去洗澡。
    sentenceBank:
      - zh: 放学后，我就回家。
        en: After school, I go straight home.
      - zh: 吃完早餐，她就背起书包出门。
