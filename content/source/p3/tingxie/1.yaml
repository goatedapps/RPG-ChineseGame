      - zh: 铃声一响，同学们就走进教室。
        en: As soon as the bell rings, the students enter the classroom.
      - zh: 你先把手洗干净，就可以吃饭了。
        en: Wash your hands first, and then you can eat.
      - zh: 看到妈妈回来，弟弟就跑过去抱她。
        en: As soon as he saw Mum return, my younger brother ran over to hug her.
  - word: 努力
