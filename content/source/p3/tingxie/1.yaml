title: 第一课 (Lesson 1)
vocab:
  - word: 龙争虎斗
    pinyin: lóng zhēng hǔ dòu
    meaning: An intense contest between two strong sides
    example: 两支强队展开了一场龙争虎斗，谁也不肯认输。
    sentenceBank:
      - zh: 这两支球队实力相近，决赛时一定会有一场龙争虎斗。
        en: These two teams are equally strong, so their final will be an intense contest.
      - zh: 两位棋手都很厉害，今天的比赛真是一场龙争虎斗。
        en: Both chess players are excellent, making today's match a fierce contest.
      - zh: 经过一场龙争虎斗，我们队终于以一分之差获胜。
        en: After a fierce contest, our team finally won by one point.
      - zh: 观众为场上龙争虎斗的两支强队大声加油。
        en: The spectators cheered loudly for the two strong teams battling intensely on the field.
      - zh: 这场龙争虎斗十分精彩，直到最后才分出胜负。
        en: This intense contest was exciting, and the winner was only decided at the very end.
  - word: 你追我赶
    pinyin: nǐ zhuī wǒ gǎn
    meaning: Strive to catch up with and outdo one another
    example: 跑道上，选手们你追我赶，努力冲向终点。
    sentenceBank:
      - zh: 两位选手你追我赶，谁也不愿落在后面。
        en: The two contestants strove to catch up with and overtake each other, neither wanting to fall behind.
      - zh: 同学们在学习上你追我赶，都希望取得进步。
        en: The classmates strove to keep up with and outdo one another in their studies, all hoping to improve.
      - zh: 游泳比赛中，大家你追我赶，奋力游向终点。
        en: In the swimming race, everyone strove to catch up with and overtake one another as they swam towards the finish.
      - zh: 我和哥哥练习跑步时你追我赶，谁也不肯停下来。
        en: My older brother and I strove to catch up with and overtake each other while practising running, neither willing to stop.
      - zh: 两组同学你追我赶，都想先完成任务。
        en: The two groups of students strove to outdo one another, each wanting to finish the task first.
  - word: 马到成功
    pinyin: mǎ dào chéng gōng
    meaning: Achieve immediate success
    example: 比赛前，妈妈祝我马到成功，一举夺冠。
    sentenceBank:
      - zh: 哥哥明天参加比赛，我祝他马到成功。
        en: My older brother is competing tomorrow, and I wish him immediate success.
      - zh: 出发前，大家祝参赛的队员马到成功。
        en: Before they left, everyone wished the competing team members success right away.
      - zh: 店铺开张时，朋友们祝爸爸马到成功。
        en: When Dad's shop opened, his friends wished him success from the start.
      - zh: 她准备参加选拔，老师祝她马到成功，顺利入选。
        en: She was preparing for a selection trial, and the teacher wished her immediate success in being selected.
      - zh: 弟弟在卡片上写下“马到成功”，为哥哥加油。
        en: My younger brother wrote “May you succeed right away” on a card to encourage his older brother.
  - word: 科学
    pinyin: kē xué
    meaning: Science
    example: 科学课上，我们观察种子怎样发芽。
    sentenceBank:
      - zh: 我喜欢科学，因为可以了解大自然。
        en: I like science because I can learn about nature.
      - zh: 老师在科学课上带我们做实验。
        en: The teacher guided us through an experiment in science class.
      - zh: 这本科学书介绍了太阳和月亮。
        en: This science book introduces the sun and the moon.
      - zh: 她对科学很有兴趣，常常提出问题。
        en: She is very interested in science and often asks questions.
      - zh: 我们通过科学实验，比较不同材料的吸水能力。
        en: We compared how well different materials absorb water through a science experiment.
  - word: 将来
    pinyin: jiāng lái
    meaning: In the future
    example: 我希望将来能当一名医生。
    sentenceBank:
      - zh: 将来，我想去不同的国家旅行。
        en: In the future, I want to travel to different countries.
      - zh: 她希望将来能成为一名老师。
        en: She hopes to become a teacher in the future.
      - zh: 哥哥说，将来要自己开一家书店。
        en: My older brother says he wants to open his own bookshop in the future.
      - zh: 为了将来能画得更好，他每天练习画画。
        en: He practises drawing every day so he can draw better in the future.
      - zh: 我们现在学好本领，将来就能帮助更多人。
        en: If we learn useful skills now, we can help more people in the future.
  - word: 当
    pinyin: dāng
    meaning: Work as / Be
    example: 姐姐长大后想当一名老师。
    sentenceBank:
      - zh: 我的爸爸在学校当老师。
        en: My dad works as a teacher at a school.
      - zh: 她想当护士，照顾生病的人。
        en: She wants to be a nurse and care for sick people.
      - zh: 叔叔当司机，每天驾驶巴士。
        en: My uncle works as a driver and drives a bus every day.
      - zh: 哥哥希望当厨师，做出好吃的食物。
        en: My older brother hopes to be a chef and make delicious food.
      - zh: 他当了几年医生，帮助了许多病人。
        en: He worked as a doctor for several years and helped many patients.
  - word: 司机
    pinyin: sī jī
    meaning: Driver
    example: 巴士司机把车稳稳地停在车站。
    sentenceBank:
      - zh: 司机开车时要注意路上的行人。
        en: A driver must watch out for pedestrians when driving.
      - zh: 我们向巴士司机问好。
        en: We greeted the bus driver.
      - zh: 德士司机帮奶奶把行李放进车里。
        en: The taxi driver helped Grandma put her luggage into the car.
      - zh: 这位司机开车很小心。
        en: This driver drives very carefully.
      - zh: 司机看见红灯，立刻停下车。
        en: The driver saw the red light and stopped the vehicle immediately.
  - word: 希望
    pinyin: xī wàng
    meaning: Hope / Wish
    example: 我希望明天天气晴朗，可以去公园玩。
    sentenceBank:
      - zh: 妈妈希望我们健康快乐地长大。
        en: Mum hopes we grow up healthy and happy.
      - zh: 她希望有一天能参加游泳比赛。
        en: She hopes to enter a swimming competition one day.
      - zh: 我希望奶奶早日康复。
        en: I hope Grandma recovers soon.
      - zh: 弟弟希望生日时收到一本故事书。
        en: My younger brother hopes to receive a storybook for his birthday.
      - zh: 老师希望大家上课时认真听讲。
        en: The teacher hopes everyone listens carefully in class.
  - word: 成为
    pinyin: chéng wéi
    meaning: Become
    example: 她努力练习，希望成为一名优秀的运动员。
    sentenceBank:
      - zh: 我们互相帮助，渐渐成为好朋友。
        en: We helped each other and gradually became good friends.
      - zh: 哥哥长大后成为一名医生。
        en: My older brother became a doctor when he grew up.
      - zh: 她经过选拔，成为学校合唱团的一员。
        en: She became a member of the school choir after passing the selection trial.
      - zh: 这本有趣的书成为妹妹最喜欢的读物。
        en: This interesting book became my younger sister's favourite book to read.
      - zh: 他帮助了许多人，成为大家学习的榜样。
        en: He helped many people and became a role model for everyone.
  - word: 军人
    pinyin: jūn rén
    meaning: Soldier / Member of the armed forces
    example: 叔叔是一名军人，每天都要参加训练。
    sentenceBank:
      - zh: 军人穿着整齐的军服，站得笔直。
        en: The soldier wore a neat uniform and stood straight.
      - zh: 这位军人认真执行任务。
        en: This soldier carried out his duties conscientiously.
      - zh: 爷爷年轻时是一名军人。
        en: Grandpa was a soldier when he was young.
      - zh: 阅兵时，军人们迈着整齐的步伐向前走。
        en: During the parade, the soldiers marched forward in step.
      - zh: 军人努力训练，准备保卫国家。
        en: Soldiers train hard to prepare to defend their country.
  - word: 保卫
    pinyin: bǎo wèi
    meaning: Protect and defend
    example: 军人保卫国家，让人民安心生活。
    sentenceBank:
      - zh: 故事里的士兵勇敢地保卫家园。
        en: The soldiers in the story bravely defended their homeland.
      - zh: 敌人来了，村民团结起来保卫村子。
        en: When the enemy came, the villagers united to defend their village.
      - zh: 军人守在边境，保卫国家。
        en: The soldiers stood guard at the border to defend their country.
      - zh: 为了保卫城堡，士兵们守住大门。
        en: The soldiers guarded the gate to defend the castle.
      - zh: 大家决心保卫家园，不让敌人占领。
        en: Everyone was determined to defend their homeland and prevent the enemy from occupying it.
  - word: 练习
    pinyin: liàn xí
