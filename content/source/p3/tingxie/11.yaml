title: 第十一课 (Lesson 11)
vocab:
  - word: "环保袋"
    pinyin: "huán bǎo dài"
    meaning: "Reusable shopping bag"
    example: "妈妈带环保袋去买菜。"
    sentenceBank:
      - zh: "这个环保袋可以用很多次。"
        en: "This reusable shopping bag can be used many times."
      - zh: "她把水果装进环保袋。"
        en: "She put the fruit into the reusable bag."
      - zh: "我把环保袋折好放进书包。"
        en: "I folded the reusable bag and put it in my schoolbag."
      - zh: "这只环保袋是布做的。"
        en: "This reusable shopping bag is made of cloth."
      - zh: "爸爸忘了带环保袋，回家拿了一只。"
        en: "Dad forgot his reusable bag and went home for one."
  - word: "代替"
    pinyin: "dài tì"
    meaning: "Replace / Take the place of"
    example: "我们用环保袋代替一次性塑料袋。"
    sentenceBank:
      - zh: "老师用图片代替实物来讲解。"
        en: "The teacher used pictures instead of real objects to explain."
      - zh: "她今天代替姐姐喂小猫。"
        en: "She fed the kitten in her older sister's place today."
      - zh: "我们用纸盒代替塑料盒。"
        en: "We used a cardboard box instead of a plastic box."
      - zh: "他用夹子代替胶水固定纸张。"
        en: "He used a clip instead of glue to hold the paper."
      - zh: "爸爸生病，我代替他去拿报纸。"
        en: "Dad was ill, so I collected the newspaper in his place."
