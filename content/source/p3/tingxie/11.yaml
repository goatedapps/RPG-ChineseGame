        en: "Mum kept the plastic bag for reuse."
      - zh: "塑料袋被风吹到树上。"
        en: "The wind blew the plastic bag into the tree."
      - zh: "我们少用一次性塑料袋。"
        en: "We use fewer single-use plastic bags."
      - zh: "这个塑料袋破了一个洞。"
        en: "This plastic bag has a hole in it."
      - zh: "她用塑料袋装好垃圾。"
        en: "She put the rubbish into a plastic bag."
