      - zh: "她在课室外等老师。"
        en: "She waited for the teacher outside the classroom."
      - zh: "请在课室里保持安静。"
        en: "Please keep quiet in the classroom."
  - word: "吓"
    pinyin: "xià"
    meaning: "Scare / Frighten"
    example: "突然的雷声吓了我一跳。"
    sentenceBank:
      - zh: "小狗被响声吓得躲起来。"
        en: "The noise frightened the puppy into hiding."
      - zh: "请不要故意吓妹妹。"
        en: "Please do not scare my younger sister deliberately."
      - zh: "黑暗里的影子把他吓住了。"
        en: "The shadow in the dark frightened him."
      - zh: "她被突然打开的门吓了一跳。"
        en: "She was startled by the door opening suddenly."
      - zh: "故事中的怪兽没有吓倒勇敢的少年。"
        en: "The monster in the story did not scare the brave boy."
  - word: "逃不掉"
    pinyin: "táo bu diào"
    meaning: "Cannot escape / Cannot get away"
    example: "故事里的小偷被围住，逃不掉了。"
    sentenceBank:
      - zh: "那只虫被网罩住，逃不掉。"
        en: "The insect was trapped under a net and could not escape."
      - zh: "坏人被警察堵住去路，知道自己逃不掉。"
        en: "The police blocked the villain's route, and he knew he could not escape."
      - zh: "故事中的怪兽逃不掉，只好认输。"
        en: "The monster in the story could not escape and admitted defeat."
      - zh: "他想逃避责任，但做错事后逃不掉。"
        en: "He wanted to avoid responsibility, but could not escape it after doing wrong."
      - zh: "小鱼被困在网里，怎么游也逃不掉。"
        en: "The fish was trapped in the net and could not swim free."
  - word: "痛"
