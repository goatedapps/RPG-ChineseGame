      - zh: "他紧张得手心冒冷汗。"
        en: "He was so nervous that his palms became cold and sweaty."
      - zh: "听到危险已经过去，她擦去额头的冷汗。"
        en: "After hearing the danger was over, she wiped the cold sweat from her forehead."
      - zh: "故事里的少年脱险后，身上仍有冷汗。"
        en: "The boy in the story was still in a cold sweat after escaping danger."
