title: 第十五课 (Lesson 15)
vocab:
  - word: "小偷"
    pinyin: "xiǎo tōu"
    meaning: "Thief"
    example: "故事里的小偷拿走了别人的钱。"
    sentenceBank:
      - zh: "警察抓住了小偷。"
        en: "The police caught the thief."
      - zh: "这部影片讲一个小偷改过的故事。"
        en: "This film tells the story of a thief reforming."
      - zh: "小偷被发现后想逃走。"
        en: "The thief tried to escape after being discovered."
      - zh: "他扮演小偷，姐姐扮演警察。"
        en: "He played the thief, and his older sister played the police officer."
      - zh: "故事中的小偷最后把东西还回去。"
        en: "The thief in the story eventually returned the stolen things."
