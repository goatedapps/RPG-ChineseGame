title: 第十六课 (Lesson 16)
vocab:
  - word: "有始无终"
    pinyin: "yǒu shǐ wú zhōng"
    meaning: "Start something but fail to finish"
    example: "他总是有始无终，模型做了一半就不做了。"
    sentenceBank:
      - zh: "学习不能有始无终，要坚持到底。"
        en: "Learning should not be abandoned before completion; we should persist."
      - zh: "她以前做事有始无终，现在努力完成每个任务。"
        en: "She used to leave tasks unfinished but now tries to complete them all."
      - zh: "这份报告写了开头就停下，真是有始无终。"
        en: "Stopping after writing only the report's opening is starting without finishing."
      - zh: "老师提醒我们不要有始无终。"
        en: "The teacher reminded us not to start tasks and leave them unfinished."
      - zh: "他种花只浇了两天水就不管了，这样有始无终可不行。"
        en: "He watered the flowers for two days and then stopped caring for them; leaving things unfinished is not acceptable."
  - word: "虎头蛇尾"
    pinyin: "hǔ tóu shé wěi"
    meaning: "Strong beginning but weak ending"
    example: "他的作文开头精彩，结尾草率，有点虎头蛇尾。"
    sentenceBank:
      - zh: "做事不能虎头蛇尾，开始和结束都要认真。"
        en: "Do not start strongly and finish poorly; take care throughout the task."
      - zh: "这次表演开始很好，最后却乱了，真是虎头蛇尾。"
        en: "The performance started well but ended in confusion, with a strong beginning and weak ending."
      - zh: "她修改结尾，避免作文虎头蛇尾。"
        en: "She revised the ending to avoid an essay with a weak finish."
      - zh: "他打扫时开始认真，后来乱做，显得虎头蛇尾。"
        en: "He began cleaning carefully but became careless, finishing weakly after a strong start."
      - zh: "这个计划开头安排周到，后面却很草率，有虎头蛇尾的问题。"
        en: "This plan began with careful arrangements but became rushed, showing a strong start and weak finish."
  - word: "半途而废"
    pinyin: "bàn tú ér fèi"
    meaning: "Give up halfway"
    example: "学游泳不能半途而废，要继续练习。"
    sentenceBank:
      - zh: "他拼了一半就放弃，真是半途而废。"
        en: "He stopped building halfway, giving up before finishing."
      - zh: "她遇到困难，也没有半途而废。"
        en: "She did not give up halfway despite difficulties."
      - zh: "既然开始做，就不要半途而废。"
        en: "Since you have started, do not give up halfway."
      - zh: "我们互相鼓励，避免半途而废。"
        en: "We encouraged each other so we would not give up halfway."
      - zh: "哥哥学琴时想半途而废，老师鼓励他继续。"
        en: "My older brother wanted to give up piano lessons halfway, but the teacher encouraged him to continue."
  - word: "勤学"
    pinyin: "qín xué"
    meaning: "Study diligently"
    example: "她勤学好问，每天认真读书。"
    sentenceBank:
      - zh: "老师喜欢勤学的学生。"
        en: "The teacher values diligent students."
      - zh: "他勤学不懈，成绩慢慢提高。"
        en: "He studied diligently without stopping, and his results improved."
      - zh: "奶奶鼓励我们勤学，多了解世界。"
        en: "Grandma encouraged us to study diligently and learn about the world."
      - zh: "这位孩子虽然家里穷，却十分勤学。"
        en: "Although his family is poor, this child studies very diligently."
      - zh: "姐姐勤学的态度值得我学习。"
        en: "My older sister's diligent approach to learning is an example for me."
  - word: "俩"
