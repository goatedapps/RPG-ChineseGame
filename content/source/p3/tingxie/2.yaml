  - word: "言"
    pinyin: "yán"
    meaning: "Speech radical; simplified form 讠"
    example: "“许”字左边的“讠”是“言”字的偏旁形式。"
    sentenceBank:
      - zh: "“语”字有言字旁。"
        en: "The character 语 has the speech radical."
      - zh: "老师教我们认出言字旁。"
        en: "The teacher taught us to recognise the speech radical."
      - zh: "“话”和“说”都有言字旁。"
