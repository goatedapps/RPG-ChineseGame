        en: "She got out of bed as soon as she heard the alarm."
      - zh: "他扶着椅子慢慢爬起来。"
        en: "He slowly got up with the chair's support."
      - zh: "小猫睡醒后爬起来伸懒腰。"
        en: "The kitten got up and stretched after waking."
