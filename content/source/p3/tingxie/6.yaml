        en: "He pushed a shopping trolley."
      - zh: "请不要推前面的同学。"
        en: "Please do not push the classmate in front of you."
      - zh: "我们一起推这张桌子。"
        en: "We pushed this table together."
      - zh: "妹妹轻轻推了一下秋千。"
        en: "My younger sister gently pushed the swing."
      - zh: "工人把车推到路边。"
        en: "The workers pushed the vehicle to the roadside."
  - word: "原谅"
    pinyin: "yuán liàng"
    meaning: "Forgive"
    example: "我诚恳道歉，希望朋友原谅我。"
    sentenceBank:
      - zh: "她原谅了弟弟的粗心。"
        en: "She forgave her younger brother's carelessness."
      - zh: "请原谅我今天迟到。"
        en: "Please forgive me for being late today."
      - zh: "他承认错误，妈妈原谅了他。"
        en: "He admitted his mistake, and Mum forgave him."
      - zh: "朋友愿意原谅我，我们又一起玩了。"
        en: "My friend forgave me, and we played together again."
      - zh: "得到原谅后，她更加认真。"
        en: "After being forgiven, she became more careful."
  - word: "弄破"
    pinyin: "nòng pò"
    meaning: "Damage by tearing or making a hole"
    example: "我不小心把纸袋弄破了。"
