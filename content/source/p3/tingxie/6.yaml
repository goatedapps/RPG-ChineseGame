title: 第六课 (Lesson 6)
vocab:
  - word: "软"
    pinyin: "ruǎn"
    meaning: "Soft"
    example: "这个枕头很软，睡起来很舒服。"
    sentenceBank:
      - zh: "刚出炉的面包很软。"
        en: "The freshly baked bread is soft."
      - zh: "小猫的毛又软又细。"
        en: "The kitten's fur is soft and fine."
      - zh: "她坐在软软的沙发上。"
        en: "She sat on a soft sofa."
      - zh: "这块海绵很软，一压就扁了。"
        en: "This sponge is soft and flattens when pressed."
      - zh: "泥土被雨水泡软了。"
        en: "The soil softened in the rainwater."
  - word: "硬"
    pinyin: "yìng"
    meaning: "Hard"
    example: "这块石头很硬，压不碎。"
    sentenceBank:
      - zh: "这个核桃壳很硬。"
        en: "This walnut shell is hard."
      - zh: "面包放久了，变硬了。"
        en: "The bread became hard after being left too long."
      - zh: "他坐在硬木椅上。"
        en: "He sat on a hard wooden chair."
      - zh: "这颗糖太硬，弟弟咬不动。"
        en: "This sweet is too hard for my younger brother to bite."
      - zh: "地上的泥晒干后很硬。"
        en: "The mud on the ground is hard after drying in the sun."
  - word: "松"
    pinyin: "sōng"
    meaning: "Loose"
    example: "鞋带松了，我重新绑好。"
    sentenceBank:
      - zh: "这颗螺丝有点松。"
        en: "This screw is a little loose."
      - zh: "绳子绑得太松，箱子滑了下来。"
        en: "The rope was tied too loosely, and the box slipped down."
      - zh: "妹妹的裤子太松，一直往下掉。"
        en: "My younger sister's trousers are too loose and keep slipping down."
      - zh: "这张椅子的脚松了。"
        en: "This chair's leg is loose."
      - zh: "他把绑得太紧的带子放松一些。"
        en: "He loosened the strap that was too tight."
  - word: "紧"
    pinyin: "jǐn"
    meaning: "Tight"
    example: "妈妈把袋口绑紧。"
    sentenceBank:
      - zh: "这双鞋太紧，穿着不舒服。"
        en: "These shoes are too tight and uncomfortable."
      - zh: "他紧紧握住绳子。"
        en: "He held the rope tightly."
      - zh: "请把瓶盖拧紧。"
        en: "Please tighten the bottle cap."
      - zh: "绳子拉得很紧。"
        en: "The rope is pulled tight."
      - zh: "妹妹紧紧抱着玩具熊。"
        en: "My younger sister hugged her teddy bear tightly."
  - word: "失去"
    pinyin: "shī qù"
    meaning: "Lose"
    example: "他不小心松手，失去了手里的气球。"
    sentenceBank:
      - zh: "说谎会让你失去别人的信任。"
        en: "Lying can make you lose others' trust."
      - zh: "小鸟失去了原来的家。"
        en: "The bird lost its original home."
      - zh: "他失去平衡，差点跌倒。"
        en: "He lost his balance and nearly fell."
      - zh: "她没有失去学习的信心。"
        en: "She did not lose confidence in learning."
      - zh: "因为迟到，他失去了参赛的机会。"
        en: "He lost the chance to compete because he was late."
  - word: "错误"
    pinyin: "cuò wù"
    meaning: "Mistake / Incorrect"
    example: "老师指出了我答案中的错误。"
    sentenceBank:
      - zh: "我把错误改正了。"
        en: "I corrected the mistake."
      - zh: "这个说法是错误的。"
        en: "This statement is incorrect."
      - zh: "她仔细检查，发现一个错误。"
        en: "She checked carefully and found a mistake."
      - zh: "承认错误需要勇气。"
        en: "It takes courage to admit a mistake."
      - zh: "我们从错误中学习。"
        en: "We learn from mistakes."
  - word: "应该"
    pinyin: "yīng gāi"
    meaning: "Should / Ought to"
    example: "我们应该爱护学校的东西。"
    sentenceBank:
      - zh: "做错事应该道歉。"
        en: "We should apologise when we do something wrong."
      - zh: "你应该先洗手再吃饭。"
        en: "You should wash your hands before eating."
      - zh: "我们应该按时交作业。"
        en: "We should hand in homework on time."
      - zh: "她认为大家应该互相帮助。"
        en: "She thinks everyone should help one another."
      - zh: "过马路应该看清车辆。"
        en: "We should watch the traffic when crossing the road."
  - word: "扔"
