    meaning: "Throw / Toss"
    example: "我把废纸扔进垃圾桶。"
    sentenceBank:
      - zh: "他把球扔给朋友。"
        en: "He threw the ball to his friend."
      - zh: "不要随地扔垃圾。"
        en: "Do not throw rubbish on the ground."
      - zh: "她轻轻把沙包扔进篮子。"
        en: "She gently tossed the beanbag into the basket."
      - zh: "弟弟把玩具扔到地上。"
        en: "My younger brother threw the toy onto the floor."
      - zh: "这张纸还能用，不要扔掉。"
        en: "This paper can still be used; do not throw it away."
  - word: "错"
    pinyin: "cuò"
    meaning: "Wrong / Mistaken"
    example: "这道题我答错了。"
    sentenceBank:
      - zh: "他走错了路。"
        en: "He went the wrong way."
      - zh: "这不是你的错。"
        en: "This is not your fault."
      - zh: "我把名字写错了。"
        en: "I wrote the name incorrectly."
      - zh: "她发现自己拿错书包。"
        en: "She realised she had taken the wrong schoolbag."
      - zh: "做错了，就要改正。"
        en: "Correct your mistake when you get something wrong."
  - word: "推"
    pinyin: "tuī"
    meaning: "Push"
    example: "爸爸推开门，走进屋里。"
    sentenceBank:
