      - zh: "小猫用爪子把窗帘弄破。"
        en: "The kitten tore the curtain with its claws."
      - zh: "他把气球弄破了。"
        en: "He burst the balloon."
      - zh: "请小心，不要弄破书页。"
        en: "Please be careful not to tear the pages."
      - zh: "弟弟跌倒时弄破了裤子。"
        en: "My younger brother tore his trousers when he fell."
      - zh: "袋子装得太满，被弄破了。"
        en: "The overfilled bag was torn."
  - word: "没关系"
    pinyin: "méi guān xi"
    meaning: "Never mind / It is all right"
    example: "我说“对不起”，朋友回答“没关系”。"
    sentenceBank:
      - zh: "没关系，做错了可以再改。"
        en: "It is all right; you can correct the mistake."
      - zh: "她笑着说，晚一点来也没关系。"
        en: "She smiled and said it was all right to arrive a little later."
      - zh: "没关系，我们再试一次。"
        en: "Never mind; we can try again."
      - zh: "妹妹碰倒杯子，妈妈说没关系。"
        en: "My younger sister knocked over a cup, and Mum said it was all right."
      - zh: "你不会写也没关系，我来教你。"
        en: "It is all right if you cannot write it; I will teach you."
