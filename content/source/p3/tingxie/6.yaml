      - zh: "车门关了，我们来不及上车。"
        en: "The doors closed before we could board."
      - zh: "雨来得太快，她来不及收衣服。"
        en: "The rain came too quickly for her to bring in the clothes."
      - zh: "我来不及回答，电话就断了。"
        en: "The call ended before I could answer."
      - zh: "快点出门，不然来不及赶巴士。"
        en: "Leave quickly, or we will be too late for the bus."
      - zh: "他来不及捡球，球就滚进水里。"
        en: "The ball rolled into the water before he could pick it up."
