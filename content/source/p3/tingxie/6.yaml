      - zh: "他突然想起忘了带书。"
        en: "He suddenly remembered he had forgotten his book."
      - zh: "灯突然灭了。"
        en: "The light suddenly went out."
      - zh: "门突然打开，把我吓了一跳。"
        en: "The door suddenly opened, startling me."
      - zh: "她突然听见有人叫她。"
        en: "She suddenly heard someone calling her."
  - word: "来不及"
    pinyin: "lái bu jí"
    meaning: "Not have enough time / Be too late"
    example: "我起床太晚，来不及吃早餐。"
