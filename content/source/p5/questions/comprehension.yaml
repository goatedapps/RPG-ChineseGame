    - marks: 3
      format: Long-Answer
      text: 为什么会一股怒气冲上了“我”的脑袋？
      displayAnswer: 因为“我”的最喜欢的笔不见了，“我”看到同桌小丽的书包口袋里露出一支和“我”一样的笔，“我”以为是小丽偷偷拿了“我”的笔，因为小丽曾经说过“我”的笔既漂亮又好用。
    - marks: 3
      format: Long-Answer
      text: 作者认为是小丽偷了自己的笔，为什么不敢去问她？
      displayAnswer: 因为小丽是作者最好的朋友，她们总是互相分享彼此喜欢的东西，作者不相信是小丽偷了她的笔，也不确定是不是小丽偷了她的笔。
    - marks: 4
      format: Long-Answer
      text: 当作者找到笔时，心里有什么感受？为什么？
      displayAnswer: 当作者找到笔时，她的脸一下红了感到不好意思。因为作者以为是她最好的朋友偷了她的笔，而是作者粗心大意，不小心把笔夹在作业本里。作者感到很惊讶和惭愧，因为自己的粗心大意，把笔夹在作业本里交给老师，却怀疑小丽偷了她的笔，对小丽态度不好。
    - marks: 4
      format: Long-Answer
      text: 文中“我心里的大石头落了地”指的是什么？为什么作者的眼睛湿湿的？
      displayAnswer: 它指的是作者放心了，因为小丽原谅了作者。作者错怪小丽偷她的笔，可是小丽还是原谅作者和她做朋友，她感到很感动。
    - marks: 4
      format: Long-Answer
      text: 小丽还愿意和作者做朋友，你同意她的做法吗？为什么？
      displayAnswer: 我同意小丽的做法。因为作者丢了她最喜欢的笔，刚巧小丽有一支和她一样的笔，所以作者误会了。后来，作者意识到自己的错误，主动和小丽道歉，朋友之间不应该因为小事而争吵，应该对彼此宽容理解对方。每个人都会犯错，我们应该给同学一个改过的机会。
- groupId: SH-G2
  subject: Chinese
  passage:
    title: 运动会上的坚持
    text: |-
      今天是学校运动会，小明胸有成竹地站在跑道上开始热身。他的心里既兴奋又紧张。作为班级的短跑选手，他希望为班级赢得冠军。

      比赛开始了！小明像箭一样扑了出去，领先其他选手。可是，就在快到终点时，他不小心跌倒了！腿上露出一道伤口，疼得他哭了出来。

      “别放弃！”王老师跑过来对他说。小明好不容易站起来，完成了比赛，但其他选手已经超越他了。老师马上检查了他的伤口，还使用药箱帮他处理伤口。这时，同学们也围过来，有的递水，有的安慰他：“小明，你已经很棒了！”

      下午的接力赛，小明原本可以休息，但他坚持要上场。“我肯定能赢！”他咬着牙说。比赛时，他忍住疼痛，稳稳地接住接力棒，奋力冲向终点。这一次，他没有摔倒，还帮助班级拿到了第三名！

      运动会结束后，小明珍惜地摸着奖杯，心里暖暖的。他明白：只要不怕困难，肯努力，就一定能超越自己。晚上，小明在日记本上认真写道：“今天的运动会让我懂得，比成绩更重要的是永不服输的精神……”
