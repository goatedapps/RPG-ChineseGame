      text: 子路问孔子什么问题？
      options:
        - 应不应该马上帮助别人
        - 怎样才能不让机会溜走
        - 如何才能一直被人称赞
        - 怎样确保自己不会后悔
      correct: 应不应该马上帮助别人
    - format: MCQ
      text: 文中的子路是一个 ___ 的人
      options:
        - 很胆小怕事
        - 拿不定主意
        - 喜欢问问题
        - 要求很严格
      correct: 拿不定主意
    - format: MCQ
      text: 孔子让然由怎么做？
      options:
        - 马上去做
        - 想想再做
        - 让别人做
        - 不要去做
      correct: 想想再做
    - format: MCQ
      text: 为什么孔子对两个学生的问题回答不一样？
      options:
        - 因为他想考一考学生
        - 因为两个问题不一样
        - 因为学生的特点不同
        - 因为他记不清楚答案
      correct: 因为学生的特点不同
    - format: MCQ
      text: 这个故事主要说明了什么道理？
      options:
        - 要学会分工合作
        - 学生要听老师的话
        - 提问之前要先思考
        - 根据特点来教学生
      correct: 根据特点来教学生
- groupId: RL-G5
  subject: Chinese
  passage:
    title: 错怪好友
    text: |-
      一天上午，我正准备写作业，忽然发现自己最喜欢的笔不见了。我把书包翻了个遍，还是找不到。

      这时，我无意间看见同桌小丽的书包口袋里露出了一支和我的一样的笔。小丽曾经说过我的笔既漂亮又好用，一定是她偷偷拿了我的笔！想到这里，一股怒气冲上了我的脑袋。可是，小丽是我最好的朋友，我们总是互相分享彼此喜欢的东西，她怎么会偷我的笔呢？真的是她偷的吗？我不敢去问小丽。

      接下来的华文课上，我闷闷不乐，眼睛盯着白板，老师说的话一句也听不进去。小丽悄悄地碰了碰我，小声地问：“你怎么了？身体不舒服吗？”我冷冷地看了她一眼，完全不想理睬她。

      下课前，老师把改好的本子发给我们。我一翻开就呆住了——我的笔竟然在作业本里！原来，昨天交作业时，我粗心大意，不小心把笔夹在作业本里一起交给了老师。我的脸一下子红了，回想起自己刚才对小丽的态度，我恨不得挖个地洞钻进去。

      放学后，我鼓起勇气走到小丽的面前，低声对她说：“小丽，对不起，是我错怪了你，以为你偷走了我的笔。”

      小丽先是瞪大了眼睛，然后露出了笑容。她拍拍我的肩膀，说：“没关系，我们还是好朋友。”那一刻，我心里的大石头落了地，眼睛也有些湿湿的……
  questions:
    - format: Fill-in
      text: 文中表示“从前有过那种情况”的词语是：___ 。
      accepted:
        - 曾经
      displayAnswer: 曾经
