      displayAnswer: 知道小乌龟的梦想后，小猴子嘲笑小乌龟的动作那么慢，要爬到什么时候。小兔也摇摇头说山太高了，小乌龟是做不到的。
    - marks: 4
      format: Long-Answer
      text: 小乌龟遇到的第一个困难是什么 (1分)？它接着是怎么做的 (3分)？
      displayAnswer: 小乌龟遇到的第一个困难是路上一块巨石让它过不去。它接着试着爬过去，可是石头太滑了，爬到一半，就滑了下来。它慢慢地绕过石头继续前进。
    - marks: 4
      format: Long-Answer
      text: 最后一段路小乌龟很累了，为什么它还是拼尽力气向上爬？
      displayAnswer: 因为它看着不远处的山顶，想起了那只努力搬食物的小蚂蚁。它深吸一口气，用尽最后的力气，所以最后一段小路小乌龟很累了，它还是用尽力气向上爬。小蚂蚁告诉它如果现在停下，之前的努力就白费了。
    - marks: 4
      format: Long-Answer
      text: 你觉得小乌龟是个怎样的动物？从哪里可以看出？
      displayAnswer: 我觉得小乌龟是个遇到困难不放弃的动物，小乌龟想要爬上山顶看美景，但它没有放弃，而是努力坚持下去，最后爬到山顶看到了美景。
- groupId: MB-G2
  subject: Chinese
  passage:
    title: 邻居的手电筒
    text: |-
      我刚搬进新家，跟周围的人都不太认识。每天下班回家，我总会看到邻居家的孩子在楼下玩耍。他们常常穿着破旧的校服，在空地上追跑打闹，笑声和吵闹声连楼上的邻居都能听得一清二楚。我皱了皱眉头，心里想：这么吵，也太不为别人着想了！衣服已经那么旧了，还在穿，不觉得难为情吗？我关上窗，告诉自己不要理他们。

      一天晚上，突然打雷，接着下起了大雨。不一会儿，整座组屋就停电了。房间里一下子变得黑暗。我有点害怕，立刻找出手电筒，这才安心多了。

      这时，门外突然传来敲门声，把我吓了一跳。打开门一看，原来是邻居的小孩。他慌慌张张地问道：“阿姨，您有手电筒吗？”我心想：果然是穷得连手电筒也买不起……“没有！”我不耐烦地摇摇头，急忙把门关上。“阿姨！阿姨！”男孩又开始敲门。我叹了一口气，用力地把门再次打开，并大喊：“去找别人借！”只见小男孩从口袋里拿出手电筒，递给我，说：“妈妈说您一个人住，怕您会害怕，叫我送手电筒来给您。”我顿时大吃一惊，脸也红了。“谢谢你！”我接过手电筒，感动地说，“阿姨刚才还以为……对……不起。”小男孩笑了笑，说：“没关系，我们是邻居！互相关心是应该的啊！”

      那晚，手电筒的光虽然很弱，却像太阳一样照亮了我的心。
  questions:
