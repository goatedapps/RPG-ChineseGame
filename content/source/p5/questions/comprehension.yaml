      options:
        - 一脸认真地和小刚玩游戏。
        - 叹了口气并且向小刚认输。
        - 发出“啊呀啊呀”的声音。
        - 假装自己被小刚咬得很痛。
      correct: 叹了口气并且向小刚认输。
    - format: MCQ
