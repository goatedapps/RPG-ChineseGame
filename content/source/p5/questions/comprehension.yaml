      text: 妈妈告诉作者她觉得鱼头的肉怎么样？(1分) 你认为妈妈这样说的原因是什么？(3分)
      displayAnswer: 妈妈说鱼头的肉特别甜。我认为妈妈这样说是因为她想把最好的给孩子，但又不想告诉孩子她故意这样做，不想让孩子担心她。
