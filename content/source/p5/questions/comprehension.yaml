        - 生气妈妈很粗心，忘记关门。
        - 十分感动妈妈还这么关心她。
      correct: 觉得家里可能进来了小偷。
    - format: MCQ
      text: 一听到女儿的叫声，妈妈立刻睁开眼睛。这说明了什么？
      options:
        - 女儿告诉妈妈她晚上回家。
        - 她知道女儿一定会回来的。
        - 女儿每天晚上都准时回家。
        - 她时刻盼望女儿早点回家。
      correct: 她时刻盼望女儿早点回家。
    - format: MCQ
