        - 怕晚上家里进来小偷。
        - 觉得菜和鸡鸭会被偷。
      correct: 怕晚上家里进来小偷。
    - format: MCQ
      text: “她们为了这件事发生了争吵”文中的这件事指的是什么？
      options:
