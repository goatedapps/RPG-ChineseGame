      displayAnswer: 荧光笔是新买的，也是他求了很久，爸爸才给他买的。要是爸爸知道荧光笔被弄丢了，一定会很生气。
    - marks: 3
      format: Long-Answer
      text: 当小华看到伟明握着一支同样的荧光笔时，他有什么反应？
      displayAnswer: 小华气得脸色通红，想到伟明之前向他借荧光笔，他不愿意。现在伟明竟然没有得到他的同意就拿走荧光笔，这样做太过分了。
    - marks: 4
      format: Long-Answer
      text: 伟明有没有拿小华的荧光笔？从哪里可以看出？
      displayAnswer: 伟明没有拿走小华的荧光笔。伟明说荧光笔是自己买的。班主任老师告诉小华他昨天把荧光笔留在电脑室，然后把荧光笔递给小华。
    - marks: 4
      format: Long-Answer
      text: 文中的小华“默默地做了一个决定”指的是什么？他为什么会做出这个决定？
      displayAnswer: 它指的是小华要向伟明道歉，承认自己的错误。小华看到伟明一脸伤心，感到很惭愧，觉得是自己太过冲动，没弄清楚就怪伟明偷了他的笔。
    - marks: 4
      format: Long-Answer
      text: 如果你是伟明，你会继续跟小华做朋友吗？为什么？
      displayAnswer: 如果我是伟明，我会继续跟小华做朋友。小华只是一时冲动，错怪我偷了他的荧光笔，但是他已经向我道歉，并承认了错误。每个人都会犯错，只要知错能改，就值得被原谅。我们是好朋友，友谊比一时的误会更重要，我们不应该为了一件小事而闹得不愉快。
- groupId: RL-G2
  subject: Chinese
  passage:
    title: 孔子教学生
    text: |-
      孔子是古时候有名的老师，他会根据每个学生的特点，用不同的方法教学生。

      有一天，有一个叫子路的学生走到孔子面前，问道：“老师，如果要做好事，比如帮助别人，我是不是应该马上去做，不必多想？”孔子看着子路，点点头说：“当然要马上去做。一个人如果总是思前想后，机会就会溜走。你要立刻行动！”子路听了，眼睛一亮，点了点头。

      没过多久，另一个叫然由的学生也来问孔子同样的问题：“老师，如果我要做一件好事，是不是应该马上去做？”孔子却摇摇头，说：“你应该先想一想，确保自己不会后悔再去做。”然由听了，认真地点了点头。

      孔子身旁的学生好奇地问：“老师，子路和然由问的明明是同一个问题，为什么您的回答不一样呢？”

      孔子笑了笑，说：“因为子路做事总是拿不定主意，所以我要鼓励他；然由总是没有想清楚就去做事，所以我要提醒他先想再做。教不同的学生要用不同的方法，这样他们才能各自进步。”学生听了，恍然大悟。
  questions:
