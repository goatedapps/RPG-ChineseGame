- groupId: SH-HC-G4
  subject: Higher Chinese
  passage:
    title: 山间雨伞
    text: |-
      去年，我陪妈妈去爬山。

      刚出发不久，就下起了小雨。这下惨了！我们赶紧走到树下避雨。妈妈突然指着草丛对我说：“你看，那是什么？”

      我顺着她指的方向望去，没想到竟然会在这山区发现一把红色的雨伞躺在草丛中！

      我走过去撑开伞一看，“还是一把新雨伞呢！”我惊喜地说。妈妈说：“幸好有这把伞。”我们继续前行。

      下山时，雨才停住。我心想：这一路上拿把雨伞多不方便呀，便随手把雨伞扔进垃圾桶。妈妈见了，命令道：“你快去把雨伞拿回来！”

      我心里有些不高兴：“这把雨伞本来就不是我们的，拿去游客中心又不方便，扔掉算了。”

      妈妈没理睬我，自己拿过雨伞：“你带纸了吗？”

      我不解地摇摇头。

      “你的名片呢？给我一张。”

      我取出一张名片递给她。妈妈写了些东西后，便说：“你把名片夹在伞里面，再把这把伞立在那棵树旁。经过的人多，容易注意到。”

      我照她的话去做了。名片背面的留言是：“你用过这把伞后，请把它放在容易被看到的地方，让它继续传递温暖。”

      几天前，我收到了一张明信片。明信片上没有寄信人的地址，也没有写上名字。

      明信片写着几行字：“亲爱的陌生朋友，您留在路边的那把红色雨伞，让我们感受到了世间的温暖与真爱。永远祝福你！”

      看到这段话，我心里暖暖的。
  questions:
    - format: Long-Answer
      text: 试解释短语“这下惨了”（第二段）在文中的意思。
      displayAnswer: 当时下起了小雨，作者和妈妈没带伞，他担心会被雨淋湿。
    - format: Long-Answer
      text: 试解释短语“让它继续传递温暖”（第十一段）在文中的意思。
      displayAnswer: 用过这把伞的人将伞传给下一个人，让下一个人感受到关爱。
    - marks: 3
      format: Long-Answer
      text: 为什么作者看到雨伞时会感到意外？
      displayAnswer: 因为作者没想到会在山上（这山区）发现一把新的雨伞。
    - marks: 4
      format: Long-Answer
      text: 下山后，作者和妈妈分别觉得应该怎么处理那把伞？为什么他们这么认为？
      displayAnswer: 作者认为伞用完后可以扔掉，因为他觉得伞不是他们的，拿去游客中心又不方便。妈妈认为应该把伞放在容易被看到的地方，并在名片上留言，因为妈妈认为伞可以帮助其他人。
    - marks: 4
      format: Long-Answer
      text: 请用不超过15个字，写出短文中第五段的段落大意。
      displayAnswer: 雨停后，“我”扔了伞，妈妈命令“我”取回。
    - marks: 4
      format: Long-Answer
      text: 作者收到来自谁的明信片？（1分）看到明信片上的留言，为什么会让他心里暖暖的？（3分）
      displayAnswer: 作者收到的明信片来自使用过雨伞的人。因为作者发现妈妈留下的雨伞真的帮助到了别人，而且这个人特意写明信片表达祝福，让作者觉得很感动。
    - marks: 5
      format: Long-Answer
      text: 这篇短文告诉了我们什么道理？（2分）试举生活中的例子加以说明。（3分）
      notes: 前半部分（道理）为短文中可归纳的固定要点，后半部分（生活例子）为学生个人开放式作答，本答案仅为示例。
      displayAnswer: 这篇短文告诉我们，我们获得了帮助后应该帮助别人。（举例仅供参考）有一次，我忘了带笔，朋友借我笔用。之后，我看到其他同学没带笔时，想到别人曾经帮助过我，也将自己的笔借给他用。
- groupId: TN-G2
  subject: Chinese
  passage:
    title: 乐乐的孝心
    text: |-
      小猴子乐乐和它的家人住在森林里。乐乐很好动，喜欢在树上跳来跳去。一有时间，它就会约朋友们到处去玩耍。猴妈妈年纪大了，动作不像以前那么快，但她还是会每天去找最甜的果子给乐乐吃。

      一天，森林里刮起了大风，许多树木被吹倒了。猴妈妈摘果子时，不小心摔伤了脚，走不动了。乐乐知道后，心里很难过，决定要为妈妈做点什么。

      为了让妈妈有充足的休息，乐乐开始每天早起，独自去树林深处找又大又甜的果子带回家。此外，它也开始学做家务，把家里收拾得整整齐齐，希望让妈妈安心休养。

      一天，乐乐出门时，正好遇见小鹿来约它去河边玩，但是乐乐拒绝了。小鹿好奇地问：“乐乐，你最近怎么都不和我们一起玩耍了？”

      乐乐停下脚步，解释道：“我妈妈的脚受伤了，我得照顾她。”小鹿听了，说：“乐乐，你真有孝心啊！”这时，在一旁休息的猴妈妈听见了，脸上露出了笑容。

      在乐乐细心的照顾下，猴妈妈的脚渐渐好了。她看着懂事的孩子，心里既开心又感动，说：“乐乐，你长大了，我为你感到自豪！”

      乐乐明白了：真正的爱，不只是说出来。他学会了用行动去关爱家人。
  questions:
