      displayAnswer: 长大后，作者不害怕吃到鱼骨头了。因为作者认为不管是食物还是其他东西，作者都会想把最好的给自己的孩子。以前害怕吃鱼骨头的作者，现在像妈妈一样，很多时候都是把鱼肉夹给孩子后，自己吃鱼头和鱼骨头上连着的那点肉。
    - marks: 4
