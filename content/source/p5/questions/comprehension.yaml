- groupId: CH-G2
  subject: Chinese
  passage:
    title: 西瓜和苹果
    text: |-
      我的弟弟今年五岁。他爱听故事，也爱问问题，而且每次都一定要问出答案不可。

      一天晚上，我做完了功课，正想上床睡觉，他拉着我，一直吵着让我给他讲一个故事。我想快点打发他，随口给他讲了一个简单的故事。弟弟认真地听完故事，就问：“故事里的妹妹把大的苹果让给哥哥，那哥哥为什么不把苹果让给妹妹呢？”

      这看似简单的问题，我想都没想过，这可真把我给问倒了。这时妈妈走进房间，了解发生了什么事情后，对弟弟说：“所以说故事里的妹妹比哥哥还懂事啊！”弟弟听了，似懂非懂地点了点头。

      第二天，爸爸下班回来，手里抱着一个西瓜。吃过晚饭，弟弟一直喊着：“我要吃最大块的西瓜。”爸爸切好西瓜，摆在盘子里。不等爸爸分西瓜，弟弟立刻拿走了一块最大的西瓜。我心想：真是贪吃！昨天才给他讲了让苹果的故事，今天就忘得一干二净！

      我刚想开口，就看到拿着西瓜的弟弟，走到奶奶面前说：“奶奶，这块西瓜给您吃。”奶奶先是惊讶，然后开心地接过西瓜。弟弟平时有好吃的东西就会紧紧地抓在手里，谁都抢不走；今天却主动把最大的西瓜让给了奶奶，自己还挑了一块最小的西瓜，坐在一旁津津有味地吃起来。弟弟的这一个举动，让大家都大跌眼镜。

      妈妈走到弟弟身边问：“怎么啦，西瓜不好吃吗？”弟弟调皮地回答：“别人会让苹果，我会让西瓜。”
  questions:
    - format: MCQ
      text: “我”为什么给弟弟讲故事？
      options:
        - 因为“我”想给弟弟随便讲个故事。
        - 因为“我”不想让弟弟一直问问题。
        - 因为弟弟知道“我”很喜欢讲故事。
        - 因为弟弟一定要“我”讲一个故事。
      correct: 因为弟弟一定要“我”讲一个故事。
    - format: MCQ
      text: 文中“这可真把我给问倒了”指的是什么？
      options:
        - “我”不必回答弟弟的问题。
        - “我”不想回答弟弟的问题。
        - “我”不敢回答弟弟的问题。
        - “我”不会回答弟弟的问题。
      correct: “我”不会回答弟弟的问题。
    - format: MCQ
      text: 什么事让“我”认为弟弟忘了“我”给他讲的故事？
      options:
        - 弟弟把西瓜紧紧地抓住。
        - 弟弟一直吵着要吃西瓜。
        - 弟弟拿走最大块的西瓜。
        - 弟弟没有帮爸爸摆西瓜。
      correct: 弟弟拿走最大块的西瓜。
    - format: MCQ
      text: 大家为什么都“大跌眼镜”？
      options:
        - 因为弟弟还是把最大块的西瓜给自己。
        - 因为弟弟这次没等爸爸给每人分西瓜。
        - 因为弟弟今天要吃苹果，不要吃西瓜。
        - 因为弟弟会主动把大块西瓜分给家人。
      correct: 因为弟弟会主动把大块西瓜分给家人。
    - format: MCQ
      text: 从弟弟吃西瓜这件事可以看出他是个怎样的人？
      options:
        - 爱听故事。
        - 贪吃自私。
        - 孝顺懂事。
        - 没有耐心。
      correct: 孝顺懂事。
- groupId: CH-G5
  subject: Chinese
  passage:
    title: 书店老板
    text: |-
      上小学时，学校外的书店是我放学后常去的地方。照理来说，去书店应该是买书来看的，但更多的时候，口袋空空的我只能装作选书的样子，偷偷地看几页的故事，然后装作没事离开。我以为这样做神不知鬼不觉，心中一直非常得意。

      一天，我又在偷读故事，突然听到有人说：“你坐下慢慢读吧！”我慌张地抬头，发现书店老板正看着我，微笑着指了指身旁的椅子。见老板没有因为我白看书而赶我走，我松了一口气。我刚要坐下，突然身后有人拉住了我的衣领。我一转头，看到父亲生气地瞪着我。

      “别怪他，一两次而已……”老板见了，连忙说。没等老板说完，父亲就抢过我手中的书，看了看那本书的价钱，快速地从钱包里拿出钱放在柜台上，然后拉着我走了。

      回到家里，父亲对我说：“我们虽然不富有，也不能占别人便宜。你想想，如果大家都跟你一样，你要书店的生意怎么做下去？”我听了，觉得之前的行为太不应该了。

      那天后，父亲经常故意安排一些家务给我做。做完家务后，他会给我一些钱，这样放学后我就可以到书店买下自己喜欢的书。

      最近爸爸让我专心准备考试，没安排家务给我做。没有钱，我只好不去书店了。这天放学后，我经过书店时，老板叫住了我，问道：“最近怎么不来买书了？”我红着脸告诉他实情。他笑着递给我一个笔记本，说：“没事的，你就先拿吧，然后把拿的书记在这个本子上，以后再付钱。”听了他的话，我的眼圈红红的。一个和我没有什么关系的人愿意为我这样做，让我的心中暖暖的。
  questions:
    - format: Fill-in
      text: 文中表示“心里紧张，动作忙乱”的词语是 ___ 。
      accepted:
        - 慌张
      displayAnswer: 慌张
    - format: Fill-in
      text: 文中表示“动作速度快”的词语是 ___ 。
      accepted:
        - 快速
      displayAnswer: 快速
    - marks: 3
      format: Long-Answer
      text: “我”为了什么事感到得意？
      displayAnswer: 我口袋空空（0.5分），在书店装作选书（0.5分），偷偷看了几页故事（0.5分），然后装作没事离开（0.5分），以为这样做神不知鬼不觉（1分），感到很得意。
    - marks: 3
      format: Long-Answer
      text: 发现“我”白看书的行为后，父亲在书店里做了什么？
      displayAnswer: 父亲拉住了“我”的衣领（0.5分），生气地瞪着“我”（0.5分），然后抢过“我”手上的书（0.5分），看了看那本书的价钱（0.5分），快速地从钱包里拿出钱放在柜台上（0.5分），拉着“我”走了（0.5分）。
    - marks: 4
      format: Long-Answer
      text: 文中的“你要书店的生意怎么做下去”指的是什么？
      displayAnswer: 这指的是如果大家（0.5分）都像作者（0.5分）一样，只看书不买书（0.5分），书店老板就没有钱赚了。(2分)
    - marks: 4
      format: Long-Answer
      text: 书店老板后来对“我”做的事让“我”有什么感受？为什么？
      displayAnswer: a) “我”非常感动（2分）。 b) 因为书店老板和“我”没有什么关系（1分），却让“我”先拿书，把拿的书记在本子上（0.5分），让“我”以后再给书的钱（0.5分）。
    - marks: 4
      format: Long-Answer
      text: 如果你是书店的老板，你还会怎么帮助作者？请加以说明。
      displayAnswer: |-
        官方答案接受以下任一种结构：
        【2方法+2说明】a) 如果我是书店老板，我会请作者来我的书店打工（1分）。b) 这样可以让他赚钱买自己喜欢的书（1分）。a) 我也可以把书以便宜的价钱卖给他（1分）。b) 这样他就买得起书了（1分）。
        【或：1方法+1说明】a) 如果我是书店老板，我会以比较便宜的价钱把书卖给作者（2分）。b) 因为我知道作者喜欢看书（0.5分），但家里不富有（0.5分），用这样的方法可以鼓励他继续看书（1分）。
- groupId: NH-G2
  subject: Chinese
  passage:
    title: 捐鞋子
    text: |-
      几天前，我放学回家时看到门上插着一张纸。我拿起来一看，原来是有人在回收旧物品，如衣服、书包，还有旧鞋子。

      我马上想到几天前妈妈说我有几双鞋子穿不下，又要买新的了！于是我赶紧跑去找妈妈：“妈妈，我们可以把旧鞋子捐出去，送给有需要的人。”妈妈点点头，笑着说：“太好了，我找个时间准备一下。”

      今天，我一放学回家就发现妈妈在弯腰刷鞋子。我走近一看，那不就是我们要捐出去的鞋子吗？我好奇地问：“妈妈，鞋子都要捐出去了，为什么还要洗呢？这样不是很麻烦吗？”

      妈妈语重心长地说：“如果别人送给我们的二手衣服很脏，你会开心吗？”

      我想了一下，然后摇摇头：“不会……我可能还会有点难过，会觉得他们在可怜我。”妈妈点点头说：“我希望别人拿到鞋子的时候开心，而不是觉得我们只是把不要的东西扔给他们。我们要用心帮助他人、尊重他人。”听完妈妈的话，我的脸有点红了。我原来只想着把鞋子送出去就好了，没想到这件事并没有那么简单。

      我想：以后我在帮助别人的时候，也要像妈妈一样，带着尊重和爱心去做每一件小事。
  questions:
    - format: MCQ
      text: 作者为什么想要捐鞋子？
      options:
        - 想要再买一双新的鞋子
        - 去帮助那些有需要的人
        - 不想要再清洗旧鞋子了
        - 感谢别人送的二手衣服
      correct: 去帮助那些有需要的人
    - format: MCQ
      text: 什么事情让作者感到好奇？
      options:
        - 妈妈清洗将要捐出去的鞋子
        - 妈妈要找个时间准备旧鞋子
        - 妈妈不想收到不干净的衣服
        - 妈妈希望拿到鞋子的人开心
      correct: 妈妈清洗将要捐出去的鞋子
    - format: MCQ
      text: “没想到这件事并没有那么简单”，这句话是什么意思？
      options:
        - 觉得这样捐东西给别人太麻烦了
        - 认为可以把不要的东西直接扔掉
        - 不知道帮人时要注意别人的感受
