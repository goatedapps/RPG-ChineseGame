      - zh: 这棵老树以苍劲的姿态屹立了几百年。
        en: This old tree has stood for hundreds of years in a sturdy, vigorous posture.
      - zh: 老鹰展开翅膀，以优雅的姿态在天空中翱翔。
        en: The eagle spread its wings and soared gracefully across the sky.
      - zh: 他始终以谦虚的姿态面对别人的赞美。
        en: He always faced others' praise with a humble attitude.
      - zh: 运动员摆好起跑的姿态，等待比赛开始的信号。
        en: The athlete assumed his starting posture, waiting for the signal to begin the race.
