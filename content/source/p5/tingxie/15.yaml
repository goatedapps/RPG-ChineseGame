      - zh: 春天悄悄地来临，树上冒出了嫩绿的新芽。
        en: Spring quietly arrived, and tender green new buds sprouted on the trees.
      - zh: 猫咪悄悄地靠近了正在睡觉的小鸟。
        en: The cat quietly approached the sleeping bird.
      - zh: 她悄悄地把纸条塞进了同学的抽屉里。
        en: She quietly slipped the note into her classmate's drawer.
  - word: 枯叶
