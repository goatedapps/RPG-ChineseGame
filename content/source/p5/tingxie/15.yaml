      - zh: 这座公园里种植着许多茂密的灌木丛。
        en: Many dense bushes are planted in this park.
      - zh: 我们穿过茂密的树林，才找到了那条隐藏的小路。
        en: We passed through the dense woods before finding that hidden path.
      - zh: 院子里的葡萄藤长得十分茂密，遮住了整个凉亭。
        en: The grapevine in the yard grew very densely, covering the entire pavilion.
