      - zh: 我们把野餐垫铺在树荫下阴凉的草地上。
        en: We spread the picnic mat on the shady, cool grass under the tree's shadow.
      - zh: 走进森林，一阵阴凉的气息扑面而来。
        en: Walking into the forest, a burst of cool, shady air rushed toward us.
