      - zh: 听到自己的名字被念出来，他骄傲地挺起了胸膛。
        en: Upon hearing his own name called out, he proudly straightened his chest.
      - zh: 士兵们挺起胸膛，整齐地列队走过广场。
        en: The soldiers straightened their chests and marched in neat formation across the square.
      - zh: 她挺起身子，努力地朝着终点线冲去。
        en: She straightened her body and made an effort to dash toward the finish line.
