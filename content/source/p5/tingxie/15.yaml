title: 第十五课 (Lesson 15)
vocab:
  - word: 栽种
    pinyin: zāi zhòng
    meaning: Plant
    example: 爷爷在院子里栽种了许多果树。
    sentenceBank:
      - zh: 春天到了，农夫们忙着在田里栽种各种蔬菜。
        en: Spring has arrived, and farmers are busy planting all kinds of vegetables in the fields.
      - zh: 学校组织学生在校园里栽种了一排排小树苗。
        en: The school organized students to plant rows of small saplings on campus.
      - zh: 妈妈在阳台上栽种了几盆美丽的花卉。
        en: Mom planted a few pots of beautiful flowers on the balcony.
      - zh: 他细心地栽种下这棵小树，希望它能够茁壮成长。
        en: He carefully planted this little tree, hoping it would grow strong and healthy.
      - zh: 这片森林里的树木大多是人们几十年前栽种的。
        en: Most of the trees in this forest were planted by people decades ago.
  - word: 宽阔
    pinyin: kuān kuò
    meaning: Broad / Wide
    example: 这条宽阔的马路上车水马龙。
    sentenceBank:
      - zh: 站在山顶上，我们看到了一片宽阔的平原。
        en: Standing on top of the mountain, we saw a broad plain.
      - zh: 这条河流十分宽阔，河面上停泊着许多船只。
        en: This river is very wide, and many boats are moored on its surface.
      - zh: 公园里有一片宽阔的草地，很适合孩子们奔跑玩耍。
        en: There is a broad lawn in the park, which is very suitable for children to run and play on.
      - zh: 这栋房子有一间宽阔明亮的客厅。
        en: This house has a spacious and bright living room.
      - zh: 大树伸展着宽阔的枝叶，为我们遮挡阳光。
        en: The big tree spreads its broad branches and leaves, shielding us from the sun.
  - word: 淡淡
    pinyin: dàn dàn
    meaning: Light (Color/Taste/Feeling)
    example: 空气中飘来一阵淡淡的花香。
    sentenceBank:
      - zh: 她的脸上总是挂着一抹淡淡的微笑。
        en: A faint, light smile always hangs on her face.
      - zh: 这杯茶的味道很淡淡的，一点也不苦涩。
        en: This cup of tea has a light taste and is not bitter at all.
      - zh: 傍晚的天空染上了一层淡淡的粉红色。
        en: The evening sky was tinged with a light shade of pink.
      - zh: 他的话语中带着淡淡的忧伤，让人心疼。
        en: There was a faint sadness in his words, which was touching.
      - zh: 花园里飘来阵阵淡淡的清香，让人感到十分舒服。
        en: Bursts of light, fresh fragrance drifted from the garden, making people feel very comfortable.
  - word: 扁扁
    pinyin: biǎn biǎn
    meaning: Flat
    example: 这颗种子的外形扁扁的。
    sentenceBank:
      - zh: 炮弹树的果实外形扁扁圆圆的，十分特别。
        en: The fruit of the cannonball tree is flat and round in shape, which is very special.
      - zh: 他不小心把面包压得扁扁的。
        en: He accidentally squashed the bread flat.
      - zh: 这种鱼的身体扁扁的，很适合在浅水中游动。
        en: This kind of fish has a flat body, which is well suited for swimming in shallow water.
      - zh: 妹妹用黏土捏出了一个扁扁的小盘子。
        en: My younger sister used clay to shape a flat little plate.
      - zh: 书包被压得扁扁的，里面的东西都皱了。
        en: The school bag was squashed flat, and the things inside were all crumpled.
  - word: 乳白
    pinyin: rǔ bái
    meaning: Milky White
    example: 天空渐渐染上了一层乳白色的雾气。
    sentenceBank:
      - zh: 炮弹树的花朵是乳白色的，散发着淡淡的香气。
        en: The flowers of the cannonball tree are milky white and give off a light fragrance.
      - zh: 妈妈买了一盏乳白色的台灯放在书桌上。
        en: Mom bought a milky white desk lamp and placed it on the desk.
      - zh: 清晨的湖面笼罩着一层乳白色的薄雾。
        en: The lake surface in the early morning is shrouded in a layer of milky white mist.
      - zh: 这种贝壳的内壁呈现出美丽的乳白色光泽。
        en: The inner wall of this kind of shell has a beautiful milky white sheen.
      - zh: 她穿着一条乳白色的裙子，看起来十分优雅。
        en: She wore a milky white dress and looked very elegant.
  - word: 浓
    pinyin: nóng
    meaning: Thick / Strong (Concentration)
    example: 这杯咖啡的味道很浓。
    sentenceBank:
      - zh: 炮弹树果实腐烂后会散发出一股浓浓的气味。
        en: After the cannonball tree's fruit decomposes, it gives off a strong smell.
      - zh: 山上的浓雾让司机不得不放慢车速。
        en: The thick fog on the mountain forced the driver to slow down.
      - zh: 妈妈煮的汤味道很浓，非常好喝。
        en: The soup mom cooked has a rich flavor and tastes very good.
      - zh: 窗外浓密的树叶挡住了大部分的阳光。
        en: The thick leaves outside the window blocked most of the sunlight.
      - zh: 他对绘画有着浓厚的兴趣，每天都会练习。
        en: He has a strong interest in painting and practices every day.
  - word: 炮弹树
    pinyin: pào dàn shù
    meaning: Cannonball Tree
    example: 公园里种着一棵奇特的炮弹树。
    sentenceBank:
      - zh: 炮弹树的果实又大又圆，看起来就像一颗颗炮弹。
        en: The fruit of the cannonball tree is big and round, looking just like cannonballs.
      - zh: 我们在植物园里第一次见到了炮弹树。
        en: We saw a cannonball tree for the first time at the botanical garden.
      - zh: 炮弹树的花朵长在树干上，样子十分奇特。
        en: The flowers of the cannonball tree grow on the trunk, which looks very unusual.
      - zh: 炮弹树成熟的果实掉落地上时，会发出腐烂的气味。
        en: When the ripe fruit of the cannonball tree falls to the ground, it gives off a rotten smell.
      - zh: 老师向我们介绍了炮弹树这种特别的热带植物。
        en: The teacher introduced us to the cannonball tree, a special tropical plant.
  - word: 是否
    pinyin: shì fǒu
    meaning: Whether Or Not
    example: 他还在犹豫自己是否应该参加这次比赛。
    sentenceBank:
      - zh: 老师询问我们是否已经完成了今天的功课。
        en: The teacher asked whether we had finished today's homework.
      - zh: 我不确定明天是否会下雨，所以带了一把伞。
        en: I'm not sure whether it will rain tomorrow, so I brought an umbrella.
      - zh: 妈妈想知道我是否愿意参加这次的夏令营。
        en: Mom wants to know whether I am willing to participate in this summer camp.
      - zh: 他反复思考是否应该把这个秘密告诉朋友。
        en: He repeatedly considered whether he should tell his friend this secret.
      - zh: 我们应该仔细检查作业，看看是否有错误的地方。
        en: We should carefully check our homework to see whether there are any mistakes.
  - word: 腐烂
    pinyin: fǔ làn
    meaning: Decomposed / Rotten
    example: 炮弹树的果实掉落后会渐渐腐烂。
    sentenceBank:
      - zh: 这些苹果放得太久，已经开始腐烂发霉了。
        en: These apples have been kept too long and have already begun to rot and grow mold.
      - zh: 腐烂的落叶为泥土提供了丰富的养分。
        en: Decomposed fallen leaves provide the soil with rich nutrients.
      - zh: 妈妈提醒我们不要吃腐烂变质的食物。
        en: Mom reminded us not to eat rotten, spoiled food.
      - zh: 树洞里的木头因为长年潮湿而渐渐腐烂了。
        en: The wood in the tree hollow gradually rotted due to long-term dampness.
      - zh: 农夫把腐烂的蔬菜清理掉，以免影响其他作物。
        en: The farmer cleared away the rotten vegetables to avoid affecting the other crops.
  - word: 编号
    pinyin: biān hào
    meaning: Number (Label)
    example: 公园里每一棵树都挂着一个编号。
    sentenceBank:
      - zh: 图书馆里的每一本书都有自己独特的编号。
        en: Every book in the library has its own unique number.
      - zh: 植物园给每一棵珍贵的树木都挂上了编号牌。
        en: The botanical garden hung a number tag on every precious tree.
      - zh: 老师根据编号把我们的作业本一一分发下去。
        en: The teacher distributed our exercise books one by one according to their numbers.
      - zh: 每一个座位都有自己的编号，方便观众寻找位置。
        en: Every seat has its own number, making it convenient for the audience to find their place.
      - zh: 工作人员按照编号仔细清点了仓库里的货物。
        en: The staff carefully counted the goods in the warehouse according to their numbers.
  - word: 闲聊
    pinyin: xián liáo
    meaning: Chat
    example: 邻居们喜欢在傍晚坐在一起闲聊。
    sentenceBank:
      - zh: 放学后，我们几个好朋友喜欢在树下闲聊。
        en: After school, a few of us good friends like to chat under the tree.
      - zh: 爷爷奶奶常常在公园的长椅上和老朋友闲聊。
        en: Grandpa and grandma often chat with old friends on a bench in the park.
      - zh: 妈妈和邻居阿姨在门口闲聊了将近一个小时。
        en: Mom chatted with the neighbor auntie at the doorway for nearly an hour.
      - zh: 课间休息时，同学们喜欢聚在一起闲聊几句。
        en: During recess, classmates like to gather together and chat for a bit.
      - zh: 他们一边散步一边闲聊，气氛十分轻松愉快。
        en: They chatted casually while taking a walk, and the atmosphere was very relaxed and pleasant.
  - word: 姿态
    pinyin: zī tài
    meaning: Gesture / Posture
    example: 那棵大树以挺拔的姿态屹立在山坡上。
