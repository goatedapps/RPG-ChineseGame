      - zh: 学校组织我们参观了国家博物院里的恐龙展览。
        en: The school organized a visit for us to the dinosaur exhibition at the national museum.
      - zh: 博物院的导览员详细地为我们讲解每一件展品。
        en: The museum guide explained every exhibit to us in detail.
      - zh: 这个假期，我打算和家人一起去博物院增长见识。
