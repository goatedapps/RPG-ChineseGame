      - zh: 我们应该学会与大自然和谐相处，保护环境。
        en: We should learn to live in harmony with nature and protect the environment.
      - zh: 班上的同学们相处得十分和谐，从不吵架。
        en: The classmates in our class get along very harmoniously and never quarrel.
      - zh: 音乐会上，各种乐器的声音配合得十分和谐。
        en: At the concert, the sounds of the various instruments blended very harmoniously.
      - zh: 老师鼓励我们要以和谐的方式解决同学之间的矛盾。
        en: The teacher encourages us to resolve conflicts between classmates in a harmonious way.
  - word: 博物院
