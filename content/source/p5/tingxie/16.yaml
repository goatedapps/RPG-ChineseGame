title: 第十六课 (Lesson 16)
vocab:
  - word: 滴
    pinyin: dī
    meaning: Quantifier (Drop)
    example: 窗外下起了雨，雨滴打在窗户上。
    sentenceBank:
      - zh: 妈妈在伤口上滴了几滴消毒药水。
        en: Mom dripped a few drops of disinfectant onto the wound.
      - zh: 清晨的荷叶上滚动着一滴滴晶莹的露珠。
        en: In the early morning, drops of crystal-clear dew roll on the lotus leaves.
      - zh: 他不小心把一滴墨水滴在了洁白的纸张上。
        en: He accidentally dripped a drop of ink onto the white paper.
      - zh: 每一滴水都很珍贵，我们应该节约用水。
        en: Every drop of water is precious, and we should conserve water.
      - zh: 汗水一滴一滴地从他的额头上滑落下来。
        en: Drops of sweat trickled down from his forehead one by one.
  - word: 资源
    pinyin: zī yuán
    meaning: Resource
    example: 水是地球上非常珍贵的资源。
    sentenceBank:
      - zh: 我们应该珍惜大自然赋予我们的各种资源。
        en: We should cherish the various resources that nature has given us.
      - zh: 森林是地球上非常重要的自然资源之一。
        en: Forests are one of the very important natural resources on Earth.
      - zh: 老师提醒我们要善用图书馆的学习资源。
        en: The teacher reminded us to make good use of the library's learning resources.
      - zh: 由于水资源有限，我们必须学会节约用水。
        en: Because water resources are limited, we must learn to conserve water.
      - zh: 这个国家拥有丰富的矿产资源，经济十分发达。
        en: This country has abundant mineral resources, and its economy is very developed.
  - word: 翻开
    pinyin: fān kāi
    meaning: Turn Over / Open (A Book)
    example: 老师让我们翻开课本的第十页。
    sentenceBank:
      - zh: 他小心翼翼地翻开这本古老的书籍。
        en: He carefully opened this ancient book.
      - zh: 一翻开日记本，往事便一一浮现在眼前。
        en: As soon as she opened the diary, past events appeared before her eyes one by one.
      - zh: 老师翻开课本，开始为我们讲解今天的课文。
        en: The teacher opened the textbook and began explaining today's lesson to us.
      - zh: 他兴奋地翻开新买的漫画书，迫不及待地读了起来。
        en: He excitedly opened the newly bought comic book and couldn't wait to start reading.
      - zh: 每天早上，爷爷都会翻开报纸阅读最新的新闻。
        en: Every morning, grandpa opens the newspaper to read the latest news.
  - word: 粒
    pinyin: lì
    meaning: Quantifier (Grain)
    example: 桌上掉了几粒米饭。
    sentenceBank:
      - zh: 农夫辛苦种出的每一粒粮食都值得我们珍惜。
        en: Every single grain of food that the farmer works hard to grow deserves our cherishing.
      - zh: 妹妹不小心把一粒纽扣弄丢了。
        en: My younger sister accidentally lost a button.
      - zh: 他种下了一粒小小的种子，期待它发芽成长。
        en: He planted a tiny seed, looking forward to it sprouting and growing.
      - zh: 沙滩上有数不清的沙粒，闪闪发光。
        en: There are countless grains of sand on the beach, sparkling brightly.
      - zh: 她细心地捡起了掉在地上的每一粒珍珠。
        en: She carefully picked up every single pearl that had fallen on the ground.
  - word: 粮食
    pinyin: liáng shí
    meaning: Food (Grain)
    example: 农夫辛勤耕种，为大家提供粮食。
    sentenceBank:
      - zh: 我们应该珍惜粮食，不要随意浪费食物。
        en: We should cherish food and not waste it carelessly.
      - zh: 这个国家的粮食产量在今年有了明显的增长。
        en: This country's grain production has clearly increased this year.
      - zh: 农民们辛苦劳作，只为了能有充足的粮食过冬。
        en: The farmers work hard, all just to have enough food for the winter.
      - zh: 战争时期，粮食十分短缺，人们常常吃不饱。
        en: During wartime, food was very scarce, and people often could not eat their fill.
      - zh: 政府呼吁人们节约粮食，共同抵抗浪费。
        en: The government calls on people to save food and jointly resist waste.
  - word: 污染
    pinyin: wū rǎn
    meaning: Pollute
    example: 工厂排放的废气污染了周围的空气。
