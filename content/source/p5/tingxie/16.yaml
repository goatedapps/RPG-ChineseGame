        en: The factory discharged wastewater carelessly, severely polluting this river.
      - zh: 汽车排放的尾气是造成空气污染的原因之一。
        en: Exhaust gas emitted by cars is one of the causes of air pollution.
      - zh: 我们应该减少使用塑料袋，避免污染海洋环境。
        en: We should reduce the use of plastic bags to avoid polluting the marine environment.
      - zh: 噪音污染同样会影响我们的日常生活和健康。
        en: Noise pollution can also affect our daily life and health.
      - zh: 政府正在采取措施减少城市里的空气污染。
        en: The government is taking measures to reduce air pollution in the city.
  - word: 和谐
    pinyin: hé xié
    meaning: Harmonious
