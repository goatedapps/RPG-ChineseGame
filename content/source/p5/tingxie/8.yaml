        en: In ancient China, "cun" was often used as a unit for measuring length.
      - zh: 这把尺子上标示着以寸为单位的刻度。
        en: This ruler has markings in units of "cun".
      - zh: 俗话说"一寸光阴一寸金"，提醒我们时间十分宝贵。
        en: As the saying goes, "an inch of time is an inch of gold," reminding us that time is very precious.
      - zh: 木匠师傅仔细地量出了这块木板的寸数。
        en: The carpenter carefully measured the length of this wooden board in cun.
      - zh: 老师向我们介绍了古代中国使用寸、尺等单位的历史。
        en: The teacher introduced us to the history of ancient China using units like cun and chi.
