      - zh: 这座古老的城堡曾经住着一位有名的国王。
        en: This ancient castle was once home to a famous king.
      - zh: 她曾经梦想成为一名作家，如今终于实现了愿望。
        en: She once dreamed of becoming a writer, and now she has finally realized her wish.
      - zh: 这条小溪曾经清澈见底，如今却因为污染而变得浑浊。
        en: This little stream was once clear to the bottom, but now it has become murky due to pollution.
      - zh: 我们曾经一起度过了许多快乐又难忘的时光。
        en: We once spent many happy and unforgettable times together.
