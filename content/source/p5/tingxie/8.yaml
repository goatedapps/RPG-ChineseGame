      - zh: 光阴似箭，日月如梭，我们要好好珍惜眼前的时光。
        en: Time flies like an arrow and the sun and moon shuttle by; we must cherish the present time.
      - zh: 老师感叹道："光阴似箭，你们都已经长大了。"
        en: The teacher sighed and said, "Time flies like an arrow; you have all grown up."
      - zh: 光阴似箭，爷爷已经从这个岗位上退休二十年了。
        en: Time flies like an arrow; grandpa has already been retired from this position for twenty years.
      - zh: 正所谓光阴似箭，我们更应该抓紧时间努力学习。
        en: As the saying goes, time flies like an arrow, so we should seize the time to study hard.
  - word: 寸
