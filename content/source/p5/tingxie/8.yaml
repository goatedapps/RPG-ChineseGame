title: 第八课 (Lesson 8)
vocab:
  - word: 陆地
    pinyin: lù dì
    meaning: Land
    example: 海龟只有在产卵的时候才会爬上陆地。
    sentenceBank:
      - zh: 经过几天几夜的海上航行，水手们终于看到了远处的陆地。
        en: After days and nights of sailing at sea, the sailors finally saw land in the distance.
      - zh: 企鹅虽然是鸟类，但是它们在陆地上走路的样子却十分笨拙。
        en: Although penguins are birds, they walk very clumsily on land.
      - zh: 地球表面大部分是海洋，只有小部分是陆地。
        en: Most of the Earth's surface is ocean, and only a small part is land.
      - zh: 船只终于靠岸了，乘客们迫不及待地踏上了陆地。
        en: The ship finally docked, and the passengers couldn't wait to step onto land.
      - zh: 这种鱼类可以在陆地上生存好几个小时，非常特别。
        en: This kind of fish can survive on land for several hours, which is very special.
  - word: 汉字
    pinyin: hàn zì
    meaning: Chinese Character
    example: 每个汉字都有它自己的意思和读音。
    sentenceBank:
      - zh: 我们从小就开始学习写汉字，一笔一划都不能马虎。
        en: We started learning to write Chinese characters from a young age, and every stroke must not be careless.
      - zh: 这个汉字的笔画很多，我练习了好几遍才记住。
        en: This Chinese character has many strokes, and I practiced several times before I remembered it.
      - zh: 外国朋友觉得汉字很有趣，因为它们看起来像图画。
        en: Foreign friends find Chinese characters interesting because they look like pictures.
      - zh: 老师教我们用部首来猜测一个陌生汉字的意思。
        en: The teacher taught us to use radicals to guess the meaning of an unfamiliar Chinese character.
      - zh: 他能够读懂三千多个常用汉字，华文水平很不错。
        en: He can read and understand over three thousand common Chinese characters; his Chinese proficiency is quite good.
  - word: 制造
    pinyin: zhì zào
    meaning: Manufacture
    example: 这家工厂专门制造儿童玩具。
    sentenceBank:
      - zh: 这家工厂每天可以制造上千件家具，销售到世界各地。
        en: This factory can manufacture thousands of pieces of furniture every day, selling them all over the world.
      - zh: 科学家们正在研究如何制造出更环保的交通工具。
        en: Scientists are researching how to manufacture more environmentally friendly means of transportation.
      - zh: 他喜欢用木头制造各种各样有趣的小玩意儿。
        en: He likes to use wood to make all kinds of interesting little gadgets.
      - zh: 这个国家以制造精密的手表和机械闻名于世。
        en: This country is famous around the world for manufacturing precise watches and machinery.
      - zh: 工人们花了整整一个月才制造出这架巨大的飞机模型。
        en: The workers took an entire month to manufacture this huge airplane model.
  - word: 机器人
    pinyin: jī qì rén
    meaning: Robot
    example: 这个机器人可以帮忙打扫房间。
    sentenceBank:
      - zh: 科学课上，老师让我们自己动手组装一个简单的机器人。
        en: In science class, the teacher had us assemble a simple robot ourselves.
      - zh: 这家医院已经开始使用机器人来协助医生进行手术。
        en: This hospital has already begun using robots to assist doctors during surgery.
      - zh: 弟弟最喜欢的玩具是一个会说话的机器人。
        en: My younger brother's favorite toy is a robot that can talk.
      - zh: 未来的机器人也许能够代替人类完成很多危险的工作。
        en: In the future, robots may be able to replace humans in completing many dangerous jobs.
      - zh: 这个扫地机器人非常聪明，能够自己避开家具。
        en: This robot vacuum cleaner is very smart and can avoid furniture on its own.
  - word: 登
    pinyin: dēng
    meaning: Ascend / Climb
    example: 我们计划下个星期天去登山。
    sentenceBank:
      - zh: 他花了整整五个小时才成功登上那座陡峭的高山。
        en: He took a full five hours to successfully ascend that steep, tall mountain.
      - zh: 登上飞机之前，乘客们必须先出示自己的护照。
        en: Before boarding the plane, passengers must first present their passports.
      - zh: 站在登上塔顶后，他看见了整座城市美丽的风景。
        en: After climbing to the top of the tower, he saw the beautiful scenery of the whole city.
      - zh: 运动员们奋力向上攀登，终于登上了这座著名的山峰。
        en: The athletes struggled to climb upward and finally ascended this famous peak.
      - zh: 每年元旦，很多人都会选择登高来迎接新的一年。
        en: Every New Year's Day, many people choose to climb to a high place to welcome the new year.
  - word: 足迹
    pinyin: zú jì
    meaning: Footprint
    example: 雪地上留下了一串小动物的足迹。
    sentenceBank:
      - zh: 沙滩上留下了一行清晰的足迹，一直延伸到海边。
        en: A row of clear footprints was left on the beach, stretching all the way to the sea.
      - zh: 猎人根据地上的足迹判断出这只野兽刚刚经过这里。
        en: The hunter judged from the footprints on the ground that this wild beast had just passed by here.
      - zh: 他的足迹遍布世界各地，几乎去过每一个大洲。
        en: His footprints are spread all over the world; he has been to almost every continent.
      - zh: 科学家们在岩石上发现了几千万年前恐龙留下的足迹。
        en: Scientists discovered footprints left by dinosaurs tens of millions of years ago on the rocks.
      - zh: 我们沿着老师的足迹，一步一步地走完了这条古老的小路。
        en: We followed in the teacher's footsteps, walking this ancient path step by step.
  - word: 网络
    pinyin: wǎng luò
    meaning: Network / Internet
    example: 我们可以通过网络学习很多新知识。
    sentenceBank:
      - zh: 由于网络出现了故障，我们没有办法准时提交功课。
        en: Because there was a network fault, we were unable to submit our homework on time.
      - zh: 妈妈提醒我们上网时要小心，不要随便相信网络上的消息。
        en: Mom reminded us to be careful when going online and not to easily believe messages on the internet.
      - zh: 这座图书馆提供免费的无线网络给读者使用。
        en: This library provides free wireless internet for readers to use.
      - zh: 现在的孩子从小就开始接触网络和各种电子产品。
        en: Children nowadays start being exposed to the internet and various electronic products from a young age.
      - zh: 网络购物越来越方便，很多人都喜欢在网上买东西。
        en: Online shopping is becoming more and more convenient, and many people like to buy things online.
  - word: 未来
    pinyin: wèi lái
    meaning: Future
    example: 我希望未来能够成为一名医生。
    sentenceBank:
      - zh: 老师鼓励我们要为自己的未来制定一个清楚的计划。
        en: The teacher encourages us to make a clear plan for our own future.
      - zh: 没有人能够确切地知道未来会发生什么事情。
        en: No one can know exactly what will happen in the future.
      - zh: 科学家相信，未来的科技将会改变我们的生活方式。
        en: Scientists believe that future technology will change the way we live.
      - zh: 他从小就对未来充满信心，努力朝着自己的理想前进。
        en: Since childhood he has been full of confidence about the future, working hard toward his dream.
      - zh: 我们应该珍惜现在，才能拥有一个美好的未来。
        en: We should cherish the present in order to have a wonderful future.
  - word: 悲伤
    pinyin: bēi shāng
    meaning: Sad / Sorrowful
    example: 听到这个消息，她感到非常悲伤。
    sentenceBank:
      - zh: 看完这部电影的结局后，很多观众都感到十分悲伤。
        en: After watching the ending of this movie, many viewers felt very sad.
      - zh: 他强忍着心中的悲伤，露出了一个勉强的笑容。
        en: He held back the sadness in his heart and forced a smile.
      - zh: 失去心爱的宠物之后，小女孩一连几天都感到悲伤难过。
        en: After losing her beloved pet, the little girl felt sad and upset for several days in a row.
      - zh: 音乐会上那首悲伤的曲子让在场的观众都流下了眼泪。
        en: That sad piece of music at the concert made the audience present shed tears.
      - zh: 朋友的安慰渐渐地帮助他走出了悲伤的情绪。
        en: His friend's comfort gradually helped him get out of his sad mood.
  - word: 瘦弱
    pinyin: shòu ruò
    meaning: Emaciated / Thin And Weak
    example: 那只流浪猫看起来非常瘦弱。
    sentenceBank:
      - zh: 生病之后，他原本健壮的身体变得十分瘦弱。
        en: After falling ill, his once strong body became very thin and weak.
      - zh: 志愿者们收养了一只瘦弱的小狗，细心地照顾它。
        en: The volunteers adopted a thin and weak puppy and took care of it attentively.
      - zh: 老爷爷身体瘦弱，走起路来需要拄着拐杖。
        en: The old grandfather's body is frail, and he needs to lean on a cane when walking.
      - zh: 经过几个月的悉心照料，那只瘦弱的小鸟渐渐恢复了健康。
        en: After months of careful care, that weak little bird gradually recovered its health.
      - zh: 他小时候身体瘦弱，经常生病，妈妈非常担心他。
        en: When he was young his body was thin and weak, and he often fell ill, which worried his mother greatly.
  - word: 永远
    pinyin: yǒng yuǎn
    meaning: Forever
    example: 我们的友谊会永远持续下去。
    sentenceBank:
      - zh: 妈妈答应我，无论发生什么事，她都会永远爱我。
        en: Mom promised me that no matter what happens, she will love me forever.
      - zh: 这段美好的回忆将会永远留在我的心里。
        en: This wonderful memory will remain in my heart forever.
      - zh: 没有什么东西是永远不变的，我们要学会接受改变。
        en: Nothing stays the same forever; we must learn to accept change.
      - zh: 他向朋友保证，无论将来搬到哪里，友情都会永远不变。
        en: He promised his friend that no matter where he moves in the future, their friendship will remain forever unchanged.
      - zh: 老师说，只要肯努力，梦想就永远不会太迟实现。
        en: The teacher said that as long as you are willing to work hard, it is never too late to achieve your dream.
  - word: 曾经
