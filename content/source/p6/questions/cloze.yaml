    source: ACSJ Primary 6 Higher Chinese Prelim 2026; PDF pages 2; P6_HChinese_Prelim_2026_ACSJ_Exam_Papers.pdf
    text: |-
      在广东，有一道很有名的点心叫“老婆饼”。这个名字很有趣，第一次听说的人常常会问：“老婆饼里面真的有老婆吗？”答案当然是没有的。这背后有一个温暖的故事。

      以前，有一位点心师父每天在茶楼忙忙碌碌地工作，很少有时间[Q1]___妻子。妻子心里很委屈。她忍不住[Q2]___：“你天天做精美的点心给别人吃，什么时候也为我做一道？”师父每次都一口答应，还说明天一定做。可是第二天他一忙起来，就把和老婆的[Q3]___忘得一干二净。

      有一天，妻子自己用冬瓜、糖和面粉做了一道全新的点心。那点心外皮金黄，散发着[Q4]___的香气。师父尝了一口，眼睛都亮了：“太好吃了！它叫什么？”妻子说：“它是我做的，所以叫‘老婆饼’。”原来，妻子[Q5]___创造出这道点心，就是要提醒丈夫别忘了自己答应老婆的事。

      师父听了，又惭愧又感动。后来，老婆饼传到各地，成了一道远近闻名的点心。

