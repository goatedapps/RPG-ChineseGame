    text: |-
      每当经过那间旧书店，我都会想起一件往事。

      那年假期，弟弟让我帮他去买一本书。我不怕跑腿，只是不喜欢那间书店的老板。他态度[Q16]___，对人爱理不理，讲话总是冷冰冰的，让人觉得很不舒服。

      来到店里，我跟老板说要买一本书。他说了几个字，但我没听清，想请他重复一次。他头也不抬地指着柜台旁的书架，说：“那边！”我虽然心中[Q17]___愤怒，但还是咬牙忍住，赶紧来到书架旁，避免和他争吵。

      这时，一位中学生拿着一本书走来柜台，面带笑容地问：“叔叔，这本科学书多少钱？”中学生亲切的笑容却换来老板的冷漠对待：“三块钱！”让我意想不到的是，那位中学生[Q18]___保持笑容，付了钱后还说：“谢谢您，祝您周末愉快！”老板冷着脸，没有任何反应。

      看到这里，我忍不住好奇地追上那位中学生，问他：“这个老板对你这么没礼貌，你不生气吗？”那位中学生停下脚步说：“他怎么对待我，我没必要去[Q19]___他。我的人生应该由我自己做主。如果我轻易让他人的态度[Q20]___自己的心情，那么快乐也将不再属于我自己。”

      那位中学生的话令我获益良多。自此，我以他为榜样，不论什么事，我都要求自己保持乐观的心境。
