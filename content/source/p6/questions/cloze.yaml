      这天，奶奶买了一包种子，准备种在花盆里。小云也想种花，就向奶奶要了一颗种子，把它埋进泥土里。一个星期过去了，花盆里一点[Q17]___都没有。小云翻开泥土一看，原来种子已经腐烂了。奶奶对她说：“种子种得太深，埋在土里不透气就很难发芽，甚至会烂掉。”

      小云听了奶奶的话，决定再[Q18]___一次。几天后，她发现花盆里的泥土冒出了绿苗。她忍不住轻轻拨开泥土，想帮它更快长出来。可是幼苗被太阳一晒，很快就干枯了。奶奶摇摇头说：“你太心急了，种子生根发芽，钻出泥土，都要靠自己的力量，这样才能长得更好。”

