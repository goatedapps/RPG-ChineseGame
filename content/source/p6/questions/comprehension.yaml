      displayAnswer: 山羊先生在作业上画的红圈圈越来越少，有时还会画上一个小笑脸。因为欢欢从那以后写作业更认真了，不会的字就查字典。
    - sourceQuestion: Q40
      marks: 4
      format: Long-Answer
      text: 你同意“严格，才能让人真正成长”这句话吗？请在你的生活中举例说明。
      displayAnswer: 我同意。有一次，我的游泳教练对我很严格，要求我每天练习换气和划水。一开始我觉得很辛苦，但在教练不断的鼓励下，我克服了害怕，学会了游泳，也变得更有毅力。因此，适当的严格能帮助人进步。
- groupId: P6-CH-2026-NanHua-Q21-25
  subject: Chinese
  passage:
    title: 林爷爷学钢琴
    source: NanHua Primary 6 Chinese Prelim 2026; PDF pages 9–10; P6_Chinese_Prelim_2026_NanHua_Exam_Papers.pdf
    text: |-
      林爷爷今年六十岁。他小时候家里很穷，连饭都吃不饱，更别说学钢琴了。可是，他特别喜欢音乐。每次路过学校，听到音乐教室里面传来的琴声，他都会停下脚步，听得入迷。从那时起，他心里便种下了一个梦想——

      有一天，自己也能弹钢琴。长大后，他努力工作，赚钱养家，一直也没有忘记小时候的梦。

      现在，林爷爷觉得自己终于有了时间，也存了一些钱，便鼓起勇气去找钢琴老师。可是，很多老师说学钢琴的“黄金年龄”早已过去；也有老师觉得他太老了，手指太硬；还有的直接拒绝教他。林爷爷听了很难过，却不想就这样放弃。他用自己存的钱买了一架钢琴，每天在家慢慢练习。开始时，琴声很不好听，但他始终坚持练习。有一天，林爷爷在公园看到一架钢琴，便坐下来弹了自己练了很久的曲子。一个路过的男人停下脚步，静静听完后，微笑着对他说：“您弹得非常好听，请继续。”男人说完便离开了。

      几年后，林爷爷终于站上舞台参加钢琴比赛，他惊讶地发现考官中竟坐着当年那个男人。原来，他是一位著名钢琴家。比赛后，那位钢琴家走上前对他说：“您的琴声比当年更好了，这份热爱，没有多少年轻人能够超越。”林爷爷听了，感动地流下了眼泪。他明白了，梦想从不会因为年龄而迟到。
  questions:
    - sourceQuestion: Q21
      marks: 2
      format: MCQ
      text: 林爷爷小时候为什么不能学钢琴？
      options:
        - 他年纪小，没有老师教他。
        - 他家里很穷，付不起学费。
        - 他太忙了，没有多余时间。
        - 他吃不饱饭，要赚钱养家。
      correct: 他家里很穷，付不起学费。
    - sourceQuestion: Q22
      marks: 2
      format: MCQ
      text: 钢琴老师拒绝林爷爷的原因是什么？
      options:
        - 林爷爷学得太慢。
        - 林爷爷很快就会放弃。
        - 林爷爷弹的曲子不够好听。
        - 林爷爷错过了学琴的最佳时期。
      correct: 林爷爷错过了学琴的最佳时期。
    - sourceQuestion: Q23
      marks: 2
      format: MCQ
      text: 林爷爷被拒绝后，他___。
      options:
        - 难过地放弃学钢琴。
        - 决定存钱学习钢琴。
        - 买了一架钢琴，每天练习。
        - 站上舞台，参加钢琴比赛。
      correct: 买了一架钢琴，每天练习。
    - sourceQuestion: Q24
      marks: 2
      format: MCQ
      text: 钢琴家在公园见到林爷爷时，做了什么？
      options:
        - 他停下来听，还让他继续弹。
        - 他被琴声感动，称赞林爷爷。
        - 他表示愿意收林爷爷为学生。
        - 他马上邀请林爷爷参加比赛。
      correct: 他停下来听，还让他继续弹。
    - sourceQuestion: Q25
      marks: 2
      format: MCQ
      text: 这个故事告诉我们什么道理？
      options:
        - 学钢琴一定要从小开始。
        - 有钱以后就能实现所有梦想。
        - 只有得到名师指导，才可能成功。
        - 不管年龄多大，都有可能实现梦想。
      correct: 不管年龄多大，都有可能实现梦想。
- groupId: P6-CH-2026-NanHua-Q34-40
  subject: Chinese
  passage:
    title: 种花生
    source: NanHua Primary 6 Chinese Prelim 2026; PDF pages 15–16; P6_Chinese_Prelim_2026_NanHua_Exam_Papers.pdf
    text: |-
      一个周末，吃完饭，外婆忽然拿出几颗花生，笑着问：“要不要种花生？”我们马上答应了。外婆便带着我们把花生一颗颗种在花盆里。

      从那以后，我们每天放学回家，第一件事就是跑去看花生发芽了没有。过了几天，泥土里终于冒出了绿色的小苗。看到那些小小的叶子，我们高兴得手舞足蹈。

      日子一天天过去，花生苗慢慢长大。我们却有些着急，总是问外婆什么时候花生才能长出来。外婆却总是说：“种花生和学习一样，都需要耐心。”

      几个月后，花生的叶子变黄了。

      外婆说花生成熟了，带着我们把花生从泥土里拔出来。当我们看见根下面挂着一串串花生时，都瞪大了眼睛，原来花生不是长在树上的，而是藏在土里的。

      晚上，妈妈把花生煮成香喷喷的花生汤。全家人围坐在一起，边吃一边聊天。外婆问：“你们知道花生有什么好处吗？”哥哥说：“花生很有营养！”妹妹笑着说：“花生能做成花生油！”我想了想，说：“花生的价格便宜，谁都可以买来吃。”外婆说：“花生的好处很多，有一样最可贵：它的果实埋在地里，虽然不容易被看到，却对人很有好处。我们也应该像花生一样，默默付出，做一个对别人有帮助的人。”

      那晚，我们聊了很久，外婆的话深深地印在我的心上。
  questions:
    - sourceQuestion: Q34
      marks: 2
      format: Fill-in
      text: 文中表示“立刻”的词语是___。
      accepted:
        - 马上
      displayAnswer: 马上
    - sourceQuestion: Q35
      marks: 2
      format: Fill-in
      text: 文中表示“值得珍惜”的词语是___。
      accepted:
        - 可贵
      displayAnswer: 可贵
    - sourceQuestion: Q36
      marks: 3
      format: Long-Answer
      text: “我们”喜不喜欢种花生？从哪里可以看出？
      displayAnswer: “我们”喜欢种花生。外婆问要不要种花生时，“我们”马上答应；每天放学回家，第一件事就是跑去看花生发芽了没有；看到小苗的叶子时，“我们”高兴得手舞足蹈。
    - sourceQuestion: Q37
      marks: 4
      format: Long-Answer
      text: 为什么外婆说“种花生和学习一样，都需要耐心”？
      displayAnswer: 因为“我们”看到花生苗慢慢长大，有些着急，总是问外婆什么时候花生才能长出来。外婆想让“我们”知道种花生要等花生慢慢长大，就像学习也要慢慢积累知识、一天天努力。
    - sourceQuestion: Q38
      marks: 3
      format: Long-Answer
      text: 看到自己种出的花生时，“我们”有什么感受？（1分）为什么会有这样的感受？（2分）
      displayAnswer: “我们”很吃惊，因为“我们”以为花生是长在树上的，现在才知道花生是藏在土里的。
    - sourceQuestion: Q39
      marks: 4
      format: Long-Answer
      text: 外婆为什么要让“我们”向花生学习？
      displayAnswer: 外婆要让“我们”明白花生的果实埋在地里，虽然不容易被看到，却对人很有好处。外婆要让我们像花生一样，默默付出，做一个对别人有帮助的人。
    - sourceQuestion: Q40
      marks: 4
      format: Long-Answer
      text: 你认为外婆教导“我们”的方法好吗？试加以说明。
      displayAnswer: 我认为外婆教导“我们”的方法很好，因为外婆通过带我们种花生，让我们明白花生虽然不容易被看到，却对人很有好处，并希望我们默默付出，做一个对别人有帮助的人，这让我们印象深刻。
- groupId: P6-CH-2026-Nanyang-Q21-25
  subject: Chinese
  passage:
    title: 停电时的手电筒
    source: Nanyang Primary 6 Chinese Prelim 2026; PDF pages 10–11; P6_Chinese_Prelim_2026_Nanyang_Exam_Papers.pdf
    text: |-
      杰西刚搬进新家，隔壁邻居家的两个小男孩经常在楼道里跑来跑去玩，还不时发出阵阵笑声。杰西发现他们的身上总是穿着不合身的旧衣服，不是太大就是太小，有些衣服上还有破洞。杰西想他们家的生活一定很清苦。

      一天晚上，整座楼突然停电了，周围一下子变得黑黑的。杰西吓了一跳，她下意识地抓起手机，打开手电筒功能，白亮的光让她稍稍安心。但她还是有点紧张一一这是她第一次独自一人在陌生的房子里遇到停电。她在家里找了找，幸好找到两个备用手电筒。

      就在此时，门口传来轻轻的敲门声。杰西的心猛地一跳，赶紧走到门口。打开门后只见外面站着的是隔壁的两个小男孩，他们脸上带着紧张又礼貌的神情。其中一个大一点的男孩小声地问道：“阿姨，停电了，请问您家有手电筒吗？”

      杰西呆住了，心里闪过一个念头：他们家这样穷，家里一定连手电筒都买不起，以后他们一定会因为家里缺少东西而常常来找她帮忙。想到这里，杰西不由自主皱起眉，故作冷淡地说：“没有。你们快回去吧！”

      杰西正准备关门时，这个小男孩却笑了起来，笑容明亮又真诚：“我就猜阿姨家没有手电筒！”说完，他从口袋里拿出一个手电筒递给她：“妈妈怕您一个人住会害怕，所以让我们送手电筒给您。”

      杰西再次呆住了。她感到又羞愧又感动。原来她误会了邻居的好意。

      她看着两个小男孩真诚的眼神，双手接过手电筒，轻轻地说道：“谢谢你们。”

      在黑暗的晚上，那个小小的手电筒，不只是带来了光亮，更带来了温暖和善意。杰西的心，也在那一刻亮了起来。
  questions:
    - sourceQuestion: Q21
      marks: 2
      format: MCQ
      text: 一开始，杰西对隔壁邻居家的生活有什么看法？
      options:
        - 他们过得很快乐。
        - 他们过得很清苦。
        - 他们的生活很自由。
        - 他们的生活很孤独。
      correct: 他们过得很清苦。
    - sourceQuestion: Q22
      marks: 2
      format: MCQ
      text: 停电时，杰西有什么反应？
      options:
        - 害怕地抓起手机照明。
        - 担心地等待邻居来帮忙。
        - 吃惊地到处寻找男孩们。
        - 紧张地走去房间查看情况。
      correct: 害怕地抓起手机照明。
    - sourceQuestion: Q23
      marks: 2
      format: MCQ
      text: 为什么杰西告诉男孩们她家没有手电筒？
      options:
        - 因为她担心他们以后会常来借东西。
        - 因为她以为邻居家里有两个手电筒。
        - 因为她有一个手机可以长时间照明。
        - 因为她家里的手电筒根本就不够用。
      correct: 因为她担心他们以后会常来借东西。
    - sourceQuestion: Q24
      marks: 2
      format: MCQ
      text: 接过男孩的手电筒后，杰西心情有什么变化？
      options:
        - 从安心变得紧张不安。
        - 从好奇变得轻松放心。
        - 从焦急变得惊讶欣慰。
        - 从怀疑变得感动羞愧。
      correct: 从怀疑变得感动羞愧。
    - sourceQuestion: Q25
      marks: 2
      format: MCQ
      text: 这篇短文主要告诉我们什么道理？
      options:
        - 停电前要准备好照明工具。
        - 人越陌生就越要保持距离。
        - 不要轻易误会别人的好意。
        - 邻居之间应该要和谐相处。
      correct: 不要轻易误会别人的好意。
- groupId: P6-CH-2026-Nanyang-Q34-40
  subject: Chinese
  passage:
    title: 最后的华文课
    source: Nanyang Primary 6 Chinese Prelim 2026; PDF pages 16–17; P6_Chinese_Prelim_2026_Nanyang_Exam_Papers.pdf
    text: |-
      铃声响了，这一堂课是华文课。张老师站在我旁边，反复提醒我要拿出华文课本，要认真听课，要把她讲的重点都写下来。可是我就是提不起兴趣，把老师的话当成了耳边风。

      下午回到家，爸爸突然告诉我们，一个月后我们全家将会移民去美国。听到这个消息，我心里不由得一紧，惊讶地问：“爸爸，那以后我还有机会学华文吗？”爸爸摸了摸我的头，说：“那边的学校没有华文课，以后你就学不了华文了。唉，我正为这件事操心。”

      原来自己最多只能再学习一个月华文了，想到这里，我久久说不出话来。过去因为我不喜欢学华文，没有认真学，我的华文水平实在是很糟糕。我轻轻摸着手里的华文课本，真希望能把整本书一下子全学会。

      从那天开始，我每天放学后都会温习当天学过的课文，还拿出纸，一笔一画地复习新学的生字。一连两次，我的听写都全对！华文课上，张老师拿出我的听写本，翻开第一页和最后一页给大家看。张老师说：“陈小允是我们学习的好榜样。你们看，他这学期刚开始时，听写总不及格，现在却得了满分！这都是他努力的结果！”

      同学们都向我投来敬佩的目光，我的心里既高兴又有点酸酸的。那一刻，我在心里默默地说：唉，华文课，在我深深喜欢上你的时候，我却快要离开你了。人总是在快要失去一件东西的时候，才真正懂得它的珍贵。想到这里，我轻轻擦了擦眼角，站起来说：“张老师，我下星期要离开这里了，我们全家要移民去美国。我……我以后可能再也没有机会上华文课了。”教室里一下子安静了下来。

      时间过得飞快，终于到了离别的那天。我上完最后一堂华文课，下课的时候，张老师走到我身边，递给我一套中学的华文课本，温和地说：“小允，到了那边也要好好学习华文，不要忘记自己的母语。有不懂的地方，可以写信问我。”我接过书，心里暖暖的，我用力点了点头。
