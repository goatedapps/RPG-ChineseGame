        - 假期一到，来喝瘦肉粥的顾客就很多。
        - 外公的动作非常慢，顾客们要等很久。
        - 瘦肉粥的味道很鲜美，受到顾客欢迎。
      correct: 瘦肉粥的味道很鲜美，受到顾客欢迎。
    - sourceQuestion: Q22
