      correct: 班长想帮助小华赔水壶给小丽。
- groupId: P6-CH-2025-HenryPark-Q34-40
  subject: Chinese
  passage:
    title: 陌生姑娘的帮助
    source: HenryPark Primary 6 Chinese 2025, Paper 2; PDF pages 24–25; P6_Chinese_2025_SA2_henrypark.pdf
    text: |-
      那天，巴士上真是挤得让人透不过气来。随着巴士的摇摆，我旁边一个穿格子上衣的青年不时地把身体靠向我，让我多少有些不自在。我侧着身子背向他，尽量离他远一点。

      这时，有人冲着我喊了一声：“张老师！”我一看，是一个二十几岁的姑娘。我打量了她好久，始终想不起她是谁。再说，我也不姓张，更不是一名老师，她肯定是认错人了。为了不让她感到难为情，我只是向她微微点点头，笑了笑。

      姑娘站起身，非要把自己的座位让给我，我不想拒绝她的好意，便接受了。坐下时，我无意间看到“格子青年”狠狠地瞪了姑娘一眼，往车尾走去。我觉得有些奇怪，却也没太在意。

      当姑娘聊起发生在校园里的往事时，我有点儿不知所措，但还是默默点头回应。转眼巴士到站了，我站起身说：“我该下车了。”谁知，那姑娘马上说：“真巧，我也在这里下车！”

      刚一下车，姑娘就挥手对我说：“再见了，阿姨！”我被搞糊涂了，连忙问道：“你怎么又叫我阿姨了？”那姑娘说：“您没注意到，刚才您身旁的青年一直盯着您的手提袋。我怀疑他不怀好意，心里一急，就叫您张老师啦！”我顿时恍然大悟，终于明白了一切。望着这匆匆离去的陌生背影，想到她与我互不认识，却肯……我的心微微一震。
  questions:
    - sourceQuestion: Q34
      format: Fill-in
      marks: 2
      text: 文中“注意；放在心上”的词语是：
      accepted:
        - 在意
      displayAnswer: 在意
    - sourceQuestion: Q35
      format: Fill-in
      marks: 2
      text: 文中“不明白；不清楚”的词语是：
      accepted:
        - 糊涂
      displayAnswer: 糊涂
    - sourceQuestion: Q36
      format: Long-Answer
      marks: 3
      text: 什么让作者感到不自在？她怎么做？
      displayAnswer: 巴士很挤，身旁穿格子上衣的青年不时把身体靠向她。她侧着身子背向青年，尽量离他远一点。
    - sourceQuestion: Q37
      format: Long-Answer
      marks: 3
      text: 为什么作者认为姑娘认错人了？作者有什么反应？
      displayAnswer: 姑娘叫她张老师，但作者想不起姑娘是谁，也不姓张，更不是老师。为了不让姑娘难为情，她微微点头，笑了笑。
    - sourceQuestion: Q38
      format: Long-Answer
      marks: 4
      text: “便接受了”指什么？作者为什么这样做？
      displayAnswer: 接受姑娘让座。青年靠向她使她不自在，她也不想拒绝姑娘的好意，不想让姑娘难为情。
    - sourceQuestion: Q39
      format: Long-Answer
      marks: 4
      text: 作者为什么“心微微一震”？
      displayAnswer: 陌生姑娘发现青年盯着作者的手提袋，怀疑他不怀好意，便故意叫她张老师并让座，帮助她避免受到伤害。姑娘与作者互不认识，却肯帮助她，使她感动。
    - sourceQuestion: Q40
      format: Long-Answer
      marks: 4
      text: 你认为文中的姑娘是个怎样的人？为什么？
      displayAnswer: 她是乐于助人的人。虽然不认识作者，发现可疑青年盯着作者的手提袋时，仍想出叫她张老师并让座的办法，避免她受到伤害。
- groupId: P6-CH-2025-MGS-Q21-25
  subject: Chinese
  passage:
    title: 地球的眼泪
    source: MGS Primary 6 Chinese 2025, Paper 2; PDF pages 11–12; P6_Chinese_2025_SA2_mgs.pdf
    text: |-
      伟文是个热爱画画的男孩。他的房间里到处都是他的作品，有彩色的风景画，也有活泼可爱的动物。每次上美术课，伟文总是班里最认真的一个，他的画也常常得到老师的认可。

      最近，美术老师宣布要举办“环保小卫士”画画比赛，主题是宣传环保的重要性。伟文听了非常兴奋，他想借着他的画表达环保的重要性。他去图书馆借了许多关于环保的书籍，还上网查资料，了解什么是垃圾分类，为什么要节约用水、用电等知识。

      这次的比赛，伟文决定画一幅《地球的眼泪》。图画中间，地球妈妈的脸上挂着两行泪珠，周围到处都是垃圾和干枯的土地。画面里，一些小小的身影正弯着腰，有的在捡垃圾，有的在努力种下一棵棵小树苗。图画的下方，写着一行字“我们该做些什么？”为了让图画更生动，他还特意去请教了美术老师，请他提供构图和色彩上的建议。

      经过一个星期的努力，伟文终于完成了他的画作。他的画引起了不小的反响，班级里出现了环保的热潮。班里不再有人忘记关水龙头，用餐后地上少了垃圾，离开课室前有人会记得关灯、关风扇，厕所的地上少了乱丢的纸巾。伟文没想到自己的画画特长能让更多人思考环保的重要性。他的画就像一颗种子，在同学们的心中发芽。

      伟文认为爱护地球，人人有责。这次比赛让他明白，只要用心去做，哪怕是小小的举动，也能产生大大的影响。他决定以后要继续使用画笔，画出更多有意义的作品。
  questions:
    - sourceQuestion: Q21
      format: MCQ
      marks: 2
      text: “伟文是个热爱画画的男孩”说明了什么？
      options:
        - 伟文的画画作品非常多。
        - 伟文的画画技术非常好。
        - 伟文的兴趣爱好是画画。
        - 伟文经常参加画画比赛。
      correct: 伟文的兴趣爱好是画画。
    - sourceQuestion: Q22
      format: MCQ
      marks: 2
      text: 伟文听到学校要举办画画比赛后，非常兴奋，因为___。
      options:
        - 他想要得到老师的认可。
        - 他想通过画画宣传环保。
        - 他想让地球妈妈再次流泪。
        - 他想在比赛中获得好成绩。
      correct: 他想通过画画宣传环保。
    - sourceQuestion: Q23
      format: MCQ
      marks: 2
      text: “他的画就像一颗种子，在同学们心中发芽”是什么意思？
      options:
        - 伟文的画提醒大家多阅读环保的书籍。
        - 伟文的画让同学们想种下一棵棵树苗。
        - 同学们都渐渐产生了保护环境的意识。
        - 同学们希望通过画画为环保尽一份力。
      correct: 同学们都渐渐产生了保护环境的意识。
    - sourceQuestion: Q24
      format: MCQ
      marks: 2
      text: 关于伟文的画作带来的影响，哪个说法不正确？
      options:
        - 保护环境从身边的小事做起。
        - 同学们开始减少能源的浪费。
        - 同学们学会了怎么分类垃圾。
        - 同学开始深入思考如何环保。
      correct: 同学们学会了怎么分类垃圾。
    - sourceQuestion: Q25
      format: MCQ
      marks: 2
      text: 这次的画画比赛让伟文明白什么道理？
      options:
        - 爱护地球是大家的责任。
        - 小举动也能产生大影响。
        - 以后要继续使用画笔作画。
        - 要画出更多有意义的画作。
      correct: 小举动也能产生大影响。
- groupId: P6-CH-2025-MGS-Q34-40
  subject: Chinese
  passage:
    title: 勇敢参选班长
    source: MGS Primary 6 Chinese 2025, Paper 2; PDF pages 17–18; P6_Chinese_2025_SA2_mgs.pdf
    text: |-
      班上要选班长了，老师告诉大家，可以提名自己觉得合适的同学。小明听了这个消息，心里既兴奋又紧张。他一直渴望为班级服务，希望有同学会提名他，但又担心自己还不够优秀。

      第二天，小明走进教室，立刻快步走向布告板。当他在名单上找到自己的名字时，眼睛一亮，嘴角微微上扬。这时，一向深受同学欢迎的大华走了过来，笑着说：“恭喜你也被提名了！看来大家都很信任你。”就在这时，小明看到名单最顶端写着“陈大华”三个字，脸上的笑容一下子消失了。小明低声地说：“我……我觉得自己还不够好。”大华轻拍他的肩膀，说：“你平时做事很认真，常常帮助同学，我相信你可以的。”上课时，老师宣布，所有被提名的同学都要准备一篇演讲稿，明天在班上发表演讲。

      晚饭后，小明站在镜子前反复练习演讲，努力让自己看起来充满自信。但他的声音越来越小，手开始发抖，额头冒汗，心跳加快。他坐回椅子上，低头看着演讲稿，心想：大家会不会取笑我？他不禁怀疑自己的能力。于是，小明把演讲稿轻轻折起，塞进书包底层。

      爸爸看到小明这样，走过来温和地问：“你想当班长，到底是为了赢，还是因为你真心想帮助同学？”小明认真地思考着，爸爸接着说：“真正的勇敢，不是没有害怕，而是明知道有可能失败，仍然愿意去尝试。”

      听了爸爸的话，小明重新拿出演讲稿，一字一句地认真练习。他告诉自己：“就算选不上，也不能半途而废。”

      选举结果公布那天，大华当选班长。虽然小明没有当选，但他脸上露出了微笑。
