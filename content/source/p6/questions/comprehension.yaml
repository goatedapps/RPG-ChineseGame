      displayAnswer: 杰克无法回答老师的问题，成绩一直不理想／理解能力较差。这使他每天闷闷不乐，晚上还经常做恶梦。
    - sourceQuestion: Q37
      marks: 2
      format: Long-Answer
      text: 母亲为什么决定亲自教导杰克？
      displayAnswer: 老师告诉母亲杰克的理解能力较差，恐怕无法取得好成绩。母亲担心他的成绩，想帮助他提高。
    - sourceQuestion: Q38
      marks: 4
      format: Long-Answer
      text: 母亲是怎样帮助杰克实现梦想的？（1分）从哪里看出他实现了梦想？（3分）
      displayAnswer: 母亲让杰克去上设计课。后来他被艺术品公司录用为设计师，工作勤奋、表现优秀，还在多次塑像设计比赛中获得冠军。
    - sourceQuestion: Q39
      marks: 4
      format: Long-Answer
      text: 你认为杰克的母亲是个怎样的人？请举例说明。
      displayAnswer: 她关爱孩子、善于鼓励孩子、懂得因材施教。杰克成绩不理想时，她鼓励他重新找回信心；发现他对设计有兴趣后，她让他上设计课。
    - sourceQuestion: Q40
      marks: 5
      format: Long-Answer
      text: 这个故事告诉我们什么道理？（2分）你会怎样把这个道理应用在生活中？请举例说明。（3分）
      displayAnswer: 每个人都有自己的长处，不应因为一方面表现不好就否定自己。找到适合自己的方向并坚持努力，就能取得成功。例如我数学成绩不好，却喜欢画画，我可以参加美术课，每天练习并参加比赛，发挥自己的长处。
- groupId: P6-CH-2026-TaoNan-Q21-25
  subject: Chinese
  passage:
    title: 没有掌声也要努力
    source: TaoNan Primary 6 Chinese Prelim 2026; PDF pages 6–7; P6_Chinese_Prelim_2026_TaoNan_Exam_Papers.pdf
    text: |-
      我喜欢打篮球，特别喜欢在球场上奔跑的感觉。每当听到从观众席上传来掌声和欢呼声，我就会特别兴奋，便更积极地传球、投篮。

      有一次，我跟随篮球队去参加比赛。当我们进入球场时，观众席上静悄悄的，没有人起身欢迎我们。他们看着我们，却好像什么也没看见似的。但当另一所学校的球队入场时，就算他们差点迟到了，所有观众还是不约而同地站起来，用热烈的掌声欢迎他们的到来。

      我没想到，观众对两支球队的态度竟然如此不同。观众的反应影响了我的心情和表现。比赛开始不久，我就一直没接住队友传过来的球，根本没办法和队员好好合作，连我平时最厉害的投篮也一次又一次地失败。因为这样，上半场比赛我们打得一团糟。

      中场休息时，教练问我：“你为什么选择打篮球？”我沉默了一会儿才回答：“因为我喜欢打篮球。”教练说：“不，我觉得你选择打篮球，只是为了得到观众的掌声。能得到观众的掌声是一件好事。可是，如果没有掌声，你也不应该受到影响。要知道，观众可以不支持你，但是他们不能阻止你获得冠军！”

      教练的话似乎具有神奇的魔力，在下半场比赛中，我脑子里只想着打好篮球，完全不管周围发生了什么事。最终，我们赢了那场比赛。
