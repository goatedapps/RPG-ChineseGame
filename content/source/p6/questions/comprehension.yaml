      correct: 小明周末时会复习所学过的东西。
    - sourceQuestion: Q24
      format: MCQ
      marks: 2
      text: 小明为什么在日记里写下“人最大的敌人是自己”？
      options:
        - 他在上课时总是遇到许多难题。
