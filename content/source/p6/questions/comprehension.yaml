        - 妈妈感到很累，因为爸爸去世了。
      correct: 妈妈一个人要当爸爸也要当妈妈。
    - sourceQuestion: Q24
      format: MCQ
      marks: 2
      text: 听了妈妈的话，作者有什么新认识？
      options:
        - 认为妈妈应该保养双手。
        - 妈妈的双手充满了母爱。
        - 觉得妈妈应该减少她的工作。
        - 妈妈的手是因为爸爸才变丑。
      correct: 妈妈的双手充满了母爱。
    - sourceQuestion: Q25
      format: MCQ
      marks: 2
      text: 作者“默默下定决心”的原因？
      options:
        - 作者害怕妈妈会伤心难过。
