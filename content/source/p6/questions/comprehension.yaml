      options:
        - 奶奶给他的任务很辛苦。
        - 爷爷说他喜欢自找烦恼。
        - 他觉得自己比哥哥努力。
        - 大家都称赞伟明很能干。
      correct: 爷爷说他喜欢自找烦恼。
