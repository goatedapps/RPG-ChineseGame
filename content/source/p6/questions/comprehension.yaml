      text: 什么让作者经过桥时停下脚步？
      options:
        - 火车站外唯一通往村子的小路。
        - 周围山上的树林和河里的鱼儿。
        - 热情地跟作者聊天的和室主人。
        - 小巷后面那座漂亮的蓝色小屋。
      correct: 周围山上的树林和河里的鱼儿。
    - sourceQuestion: Q24
      format: MCQ
      marks: 2
      text: 哪个句子正确？
      options:
        - 作者在村子旅行时会住在主人家里。
