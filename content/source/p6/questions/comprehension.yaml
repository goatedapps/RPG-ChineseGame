      format: Long-Answer
      text: 爷爷认为交朋友需要做到什么？（1分）作者哪些方面不足？（1分）为什么？（2分）
      displayAnswer: 需要心到、眼到、口到和手到。作者缺少口到和手到，因为没有把画册给同学看，也没有主动和同学交谈。
