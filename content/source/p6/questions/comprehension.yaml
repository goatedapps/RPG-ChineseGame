      format: MCQ
      marks: 2
      text: 作者平时躲开妈妈的手，主要因为什么？
      options:
        - 妈妈的手很丑。
        - 妈妈刚做完家务。
        - 妈妈一摸就觉得痛。
        - 他讨厌妈妈那一双手。
      correct: 妈妈的手很丑。
    - sourceQuestion: Q22
      format: MCQ
      marks: 2
      text: 妈妈“不好意思地对我笑了笑”说明心情怎样？
      options:
