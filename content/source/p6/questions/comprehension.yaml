      marks: 2
      format: Fill-in
      text: 文中表示“指出缺点和错误使其改正”的词语是___。
      accepted:
        - 批评
      displayAnswer: 批评
    - sourceQuestion: Q35
      marks: 2
      format: Fill-in
      text: 文中表示“心里不甘，觉得不公平”的词语是___。
      accepted:
        - 不服气
      displayAnswer: 不服气
