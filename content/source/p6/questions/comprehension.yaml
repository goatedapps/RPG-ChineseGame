      text: 马丽如何帮助女孩？
      options:
        - 想办法让女孩不再发烧。
        - 第一时间送女孩去医院。
        - 请刚好经过的医生帮忙。
        - 把女孩移到阴凉的地方。
      correct: 把女孩移到阴凉的地方。
    - sourceQuestion: Q23
      marks: 2
      format: MCQ
      text: 马丽没有后悔帮女孩，因为___。
      options:
        - 救人比参加面试更重要。
