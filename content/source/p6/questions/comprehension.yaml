      displayAnswer: 王乐身体不舒服，不能参加比赛，队员们担心少了他会输给强劲的对手。
    - sourceQuestion: Q37
      marks: 4
      format: Long-Answer
      text: 林老师说“今天这个机会，我想让他试一试”这句话里的“机会”指的是什么？（1分）为什么林老师要这样做？（3分）
      displayAnswer: “机会”指让小杰代替王乐上场比赛。因为小杰平时训练最认真，每天最早到球场练习投篮，却很少有比赛机会，所以想让他试一试。
    - sourceQuestion: Q38
      marks: 3
      format: Long-Answer
      text: 听了子文说的话，大华的看法有什么改变？什么原因使大华改变？
      displayAnswer: 大华起初反对小杰上场，后来同意让他上场，因为他想起自己刚加入篮球队时，也是从代替别人比赛开始的。
    - sourceQuestion: Q39
      marks: 4
      format: Long-Answer
      text: 以前，大家没有让小杰上场比赛的原因是什么？（2分）小杰怎么样在这场比赛中改变大家对他的印象？（2分）
      displayAnswer: 大家认为小杰个子不高，而且从来没有和他们一起比赛。小杰努力抢球、传给队友，为球队创造得分机会，改变了大家的印象。
    - sourceQuestion: Q40
      marks: 4
      format: Long-Answer
      text: 你觉得子文是一个怎样的队长？请举例说明。
      displayAnswer: 子文是个细心、有远见、懂得鼓励队友的队长。他注意到小杰训练认真，主动建议让他代替王乐上场；面对队友反对时，仍劝大家互相支持，相信小杰。
- groupId: P6-CH-2026-StNicholas-Q21-25
  subject: Chinese
  passage:
    title: 善良的医生
    source: StNicholas Primary 6 Chinese Prelim 2026; PDF pages 9–10; P6_Chinese_Prelim_2026_StNicholas_Exam_Papers.pdf
    text: |-
      那年夏天，马丽准备到一家医院面试当医生。半路上，马丽碰见一名突然昏倒的女孩，便立即过去帮忙。她发现女孩脸色发白，正在发烧，就把女孩移到较阴凉的地方，并一直替她扇风。

      这时，一位刚好经过的医生马上上前帮忙。经过医生和马丽的帮助，女孩醒了过来。马丽确定女孩没事后，便急忙赶去医院。不过，她还是迟到，错过面试的时间。虽然马丽失去面试的机会，但是她并不后悔。她认为救人比面试重要。

      几天后，马丽意外接到医院的电话，院长请她再到医院面试。见面时，院长笑着对马丽说：“你前几天在路上救人的事，我已经听说了。那时跟你一起帮助那位女孩的医生正是我们医院的医生。他认出你，并把事情告诉我。”

      马丽很有礼貌地说：“当时我没有多想，只知道我应该救那个女孩。虽然我因此错过面试，但是如果让我再选择一次，我还是会先救人。”

      院长满意地点点头说：“一名医生最重要的不是医术，而是拥有一颗善良的心和强烈的责任感。你具备了这些品德，失去你这样的医生会非常可惜。恭喜你通过面试，成为我们医院的医生。”马丽听了，不禁喜出望外。
