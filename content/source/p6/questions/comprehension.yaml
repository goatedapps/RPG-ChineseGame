      displayAnswer: 示例：换个角度理解别人，不只靠批评解决问题。例如弟弟得不到想要的东西就发脾气，家人应了解原因，教他冷静表达，而非只责骂。
- groupId: P6-CH-2025-Catholic-Q21-25
  subject: Chinese
  passage:
    title: 让父亲骄傲
    source: Catholic Primary 6 Chinese 2025, Paper 2; PDF pages 18–19; P6_Chinese_2025_SA2_catholic.pdf
    text: |-
      我小时候家境贫穷，父亲为了赚钱养家，每天都工作到很晚才回来，根本没时间管我。

      那时的我十分顽皮，到处闹事。邻居常常来找我的父亲，要他好好管我。每当被父亲责骂时，我都对他不理不睬，气得父亲说不出话。邻居总是对父亲说：“你儿子可真‘厉害’！”面对别人的嘲笑，父亲都会脸上发烫，不好意思地说：“这个孩子，真是让我头痛！”

      上小学后，我还是没有改变，经常被老师批评。有一次，我又犯了错，老师把父亲请到学校谈话。老师对父亲说：“您的儿子整天打架、偷东西，还欺负同学。您一定要好好教导他啊！”父亲看着老师，回答道：“我已经尽了力。打也打了，骂也骂了，我已经没有办法了。”父亲叹了一口气，转身便离开了。

      过后的一段日子，为了避开邻居，父亲总是带我绕一大圈才回到家。吃饭时，父亲也不说话。我渐渐地明白：我的行为让父亲遭受别人的嘲笑，让他在别人面前抬不起头。看着父亲一天天变得沉默，我决定一定要让父亲为我感到骄傲。

      我开始时刻注意我的行为，还经常帮助有需要的同学。经过不断的努力，我在毕业时获得了“优秀毕业生”的奖项。从那时起，笑容又回到了父亲的脸上。
  questions:
    - sourceQuestion: Q21
      format: MCQ
      marks: 2
      text: 为什么作者的父亲没时间管他？
      options:
        - 作者的父亲赚的钱不多。
        - 父亲工作的时间非常长。
        - 作者从不听父亲的教导。
        - 父亲不懂得如何教作者。
      correct: 父亲工作的时间非常长。
    - sourceQuestion: Q22
      format: MCQ
      marks: 2
      text: 邻居说“你儿子可真‘厉害’！”是因为___。
      options:
        - 作者常常犯错不听话。
        - 作者总是被老师责骂。
        - 作者经常帮助同学们。
        - 作者成为优秀毕业生。
      correct: 作者常常犯错不听话。
    - sourceQuestion: Q23
      format: MCQ
      marks: 2
      text: 父亲带作者绕一大圈回家的目的是什么？
      options:
        - 作者感到不好意思。
        - 父亲要让作者改过。
        - 作者的老师找父亲谈话。
        - 父亲不想遇到认识的人。
      correct: 父亲不想遇到认识的人。
    - sourceQuestion: Q24
      format: MCQ
      marks: 2
      text: 什么让作者决定改变？
      options:
        - 邻居向作者的父亲抱怨。
        - 作者常常让父亲很生气。
        - 老师请父亲到学校谈话。
        - 父亲因为他而遭受嘲笑。
      correct: 父亲因为他而遭受嘲笑。
    - sourceQuestion: Q25
      format: MCQ
      marks: 2
      text: 作者是怎样的人？
      options:
        - 做事认真。
        - 懂得感恩。
        - 知错能改。
        - 聪明能干。
      correct: 知错能改。
- groupId: P6-CH-2025-Catholic-Q34-40
  subject: Chinese
  passage:
    title: 贪心财主变青蛙
    source: Catholic Primary 6 Chinese 2025, Paper 2; PDF pages 24–25; P6_Chinese_2025_SA2_catholic.pdf
    text: |-
      从前有个财主，他住在大房子里，不愁吃喝，却爱钱如命，一分钱也舍不得花。看到上门来要钱的穷人时，他还会瞪大眼睛，气呼呼地说：“你们快走开，不然我就拿扫把赶你们走！”

      一天，财主看到了一张通告，国王将举办一场比赛，谁能在水池里站一夜，就能得到一袋金子。对于那些半途而废的人，国王将拿走他们的房子。这个消息很快传遍了全城，大家都很想试一试，但一想到冰冷的水，都失去了勇气。财主心想：如果得到这袋金子，我就能买更多的田地，租给别人，赚更多的钱。因此，财主就决定参加比赛。

      第二天，财主去见国王，说他能在水池里站一夜。国王提醒：“要是你没完成比赛，我就会拿走你的大房子。”财主听了，想到自己会变成穷人，遭受他人的嘲笑，心里很担心，但为了得到奖励，他仍然愿意一试。于是，他立刻签下比赛的合同。

      财主站在冰冷的水池里，全身发抖，几次想要离开，但又不甘愿失去房子。过了一会儿，突然刮起了大风。他受不了了，只好对着天空念道：“天神啊！如果你能让我不被冻死，我就把一半的金子分给城里的穷人。”话刚说完，风就停了，而且水也变暖了。财主在水里舒服地度过了一夜，心里有说不出的高兴。

      早上，当财主得到那袋金子时，他顿时后悔自己答应过天神的事。财主把金子藏起来，没有分给穷人。天神知道后，怒气冲冲地将财主变成了一只青蛙，让他夜夜守在水池边。
  questions:
    - sourceQuestion: Q34
      format: Fill-in
      marks: 2
      text: 文中“事情没完成就停止不做”的词语是：
      accepted:
        - 半途而废
      displayAnswer: 半途而废
    - sourceQuestion: Q35
      format: Fill-in
      marks: 2
