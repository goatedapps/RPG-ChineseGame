      displayAnswer: 对手自认更高大强壮，参赛经验丰富，而男孩没有左臂。暂停前他已把男孩打得节节败退，觉得自己能打赢男孩。
    - sourceQuestion: Q22
      format: Long-Answer
      marks: 4
      text: “那一个特别招数”如何使男孩反败为胜？
      displayAnswer: 男孩趁对手放松防备时，敏捷地使出特别招数，把对手打倒在地，赢得了比赛。对手要破解这一招，唯一的办法是抓住男孩的左手，但男孩在车祸中失去了左手臂，所以对手无法破解这一招。
    - sourceQuestion: Q23
      format: Long-Answer
      marks: 4
      text: 男孩是个怎样的人？写出性格特点并举两个例子说明。
      displayAnswer: 男孩遇到困难坚持到底、不放弃。少了左臂，他训练时付出更多时间精力，却不放弃；比赛中对手连连进攻，他仍拼命抵抗。
- groupId: P6-HC-2025-MGS-Q11-16
  subject: Higher Chinese
  passage:
    title: 宽容的力量
    source: MGS Primary 6 Higher Chinese 2025, Paper 2; PDF pages 6–7; P6_HChinese_2025_SA2_methodist.pdf
    text: |-
      一天，著名的钢琴家李斯特路过一家咖啡馆时，看到门外贴着一张海报。海报上写着：李斯特的学生——玛丽小姐钢琴独奏音乐会。看到自己的名字在上面，李斯特不禁皱起眉头，心中涌起一丝不悦：我从没教过这个人，她怎能假装是我的学生，欺骗公众？他打算去责问玛丽，并让主办方取消音乐会。

      李斯特找到玛丽后，她吓得脸色苍白，哭着告诉李斯特自己从小在孤儿院长大，现在靠在咖啡馆弹琴维持生活。为了吸引观众买票，她才谎称自己是李斯特的学生。玛丽说完，羞愧地低下了头。听到这里，李斯特眼神变得柔和，语气温和地说：“原来是这样……让我想想，有没有补救的办法。”玛丽呆住了，不敢相信李斯特居然没有责备她。

      第二天，李斯特再次找到玛丽，让她弹奏音乐会的曲子。他边听边指导，教她如何表达感情、掌握节奏。弹完后，他拍了拍玛丽的肩膀，说：“你学得很快。今晚你就大胆地上台演奏吧。从现在起，你确实是我的学生了。”

      当天晚上，音乐会准时举行。最后一个节目宣布时，全场惊呼了起来——竟然是李斯特亲自登台演奏！他的琴声优美动人，观众报以热烈的掌声。玛丽在台下，眼中闪着泪花，双手紧紧握住衣角，满心感激。

      这场音乐会之后，玛丽真正开始了她的音乐之路。多年后，玛丽成为受人尊敬的钢琴家。她永远不会忘记，是一位大师对她的理解和宽容，改变了她的人生。
