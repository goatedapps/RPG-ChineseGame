      displayAnswer: 仍然
    - sourceQuestion: Q13
      format: Long-Answer
      marks: 2
      text: 见到轮椅运动员之前，立明的行为是什么？为什么？
      displayAnswer: 收起运动服，不肯进康复治疗室，因为医生说至少半年不能剧烈运动，无法参加比赛，他感到绝望。
    - sourceQuestion: Q14
      format: Long-Answer
      marks: 2
      text: 见到轮椅运动员之后，立明的行为是什么？为什么？
      displayAnswer: 翻来覆去、握紧拳头，主动要求康复训练，忍痛坚持，因为他明白只要还想跑就有希望，要在困境中怀抱梦想、永不放弃。
    - sourceQuestion: Q15
      format: Long-Answer
      marks: 4
      text: “我失去的只是跑道，不是对运动的热爱”是什么意思？运动员想告诉大家什么？
      displayAnswer: 失去右腿不能短跑，但仍热爱运动，可以打篮球。他告诉大家要怀抱梦想，不轻易放弃，可用其他方式实现梦想。
    - sourceQuestion: Q16
      format: Long-Answer
      marks: 4
      text: 从“跑道以外的坚持”和“被困难打败了”中选一个最适合的题目，并举例说明理由。
      displayAnswer: 选择“跑道以外的坚持”。立明训练时骨折，起初绝望；轮椅篮球运动员的坚持激励了他，他坚持康复训练，重新跑步，懂得困境中仍要怀抱梦想。
- groupId: P6-HC-2025-PLMGS-Q17-23
  subject: Higher Chinese
  passage:
    title: 母亲的隔夜饭
    source: PLMGS Primary 6 Higher Chinese 2025, Paper 2; PDF pages 6–7; P6_HChinese_2025_SA2_mgspayalebar.pdf
    text: |-
      我从小住在一间政府组屋里，屋子虽小，但整洁温暖。父亲早年去世，母亲一个人在小餐馆里打工养家，我们的生活过得紧紧巴巴的。但是，母亲从不让我觉得缺少了什么。每天回家，桌上总是摆着热气腾腾的米饭和香喷喷的菜。母亲盛好饭，总把满满的一碗递给我，自己却只吃几口饭菜。我天真地以为，母亲真的像她说的那样：“妈妈不饿，所以吃得少。”

      直到长大后，我无意中发现了母亲的秘密。那天我提早下班，轻轻推开门，看见母亲正坐在厨房里的角落，拿着一个小碗吃饭。碗里的米饭硬硬的，菜叶也失去了新鲜的颜色。

      看到我进来，母亲呆住，然后赶快笑着说：“怎么提早回来了？快坐下，妈妈给你热饭！”她边说边把手里的碗藏到橱柜里，好像害怕我看见她吃剩饭似的。我鼻子一酸，心里像堵了一块大石头。原来，母亲不是不饿，只是把新鲜的饭菜全留给我吃，自己吃着隔夜饭。

      从那天起，我开始观察母亲的一举一动。逛街时，她总说自己不缺衣服，可是一看到我喜欢的东西，就想办法给我买；家里有好吃的，她总是先让我吃，自己留下一点就满足了；哪怕晚上加班很晚，她一回到家，就马上给我热饭，说：“趁热吃，不然就凉了。”

      有一天晚上，我趁母亲不注意，悄悄为她热了一碗饭，端到她面前。母亲呆住了，随即便笑了，眼角的细纹像花一样盛开。那一刻，我心里升起一种从未有过的温暖。我知道，母亲吃隔夜饭，不是因为喜欢，而是因为心里装着我。母亲只需要一份简单的关心，就会感到满足和快乐。
  questions:
    - sourceQuestion: Q17
      format: Long-Answer
      marks: 2
      text: 解释“天真地以为”（第一段）在文中的意思。
      displayAnswer: 作者看母亲只吃几口饭菜，单纯地相信她是因为不饿才吃得少。
    - sourceQuestion: Q18
      format: Long-Answer
      marks: 2
      text: 解释“眼角的细纹像花一样盛开”（第五段）在文中的意思。
