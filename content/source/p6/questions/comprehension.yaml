      format: MCQ
      marks: 2
      text: 小丽为什么没把水壶放在地上？
      options:
        - 她非常喜欢自己的水壶。
        - 她没有听见老师说的话。
        - 她十分担心会打翻水壶。
        - 她总是把水壶放在桌上。
      correct: 她非常喜欢自己的水壶。
