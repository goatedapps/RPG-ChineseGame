- groupId: P6-CH-2025-PeiChun-Q30-33
  subject: Chinese
  passage:
    title: 儿童舞蹈班招生
    source: PeiChun Primary 6 Chinese 2025, Paper 2; PDF pages 13–15; P6_Chinese_2025_SA2_peichun.pdf
    text: |-
      学校假期快到了！欢迎家长带孩子报名参加由新加坡舞蹈学校与大巴窑民众俱乐部共同开办的“儿童舞蹈班”，度过充实又有意义的假期。
      经验丰富的舞蹈老师会以目前最流行的韩国音乐和可爱又帅气的动作，让孩子享受跳舞乐趣，提高舞蹈技巧及对舞蹈的热爱。
      课程结束后，上课内容会分享到网站，孩子可在家用电脑或手机观看、复习。

      | 课程 | 初级班（2个班） | 中级班（2个班） |
      | --- | --- | --- |
      | 时间 | 10月至12月，星期六或星期天上午10至11点 | 同左 |
      | 对象 | 7至9岁，零起点 | 7至11岁，学过舞蹈 |
      | 收费 | 200元 | 300元 |

      报名方式：通过新加坡舞蹈学校网站。
      上课地点：大巴窑民众俱乐部2楼。
      招生人数有限，请尽早报名。
      截止日期：2025年9月15日。
      网址：www.dancechildsg.com
      电话：66551234，联系金先生。
  questions:
