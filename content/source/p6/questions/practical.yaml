      correct: 报名参加活动的居民需自己安排早、晚餐。
    - sourceQuestion: Q33
      format: Long-Answer
      marks: 4
      text: 假如你是小华，写短信邀妈妈参加义工日，说明一个好处及报名方式。
      displayAnswer: 妈妈，我知道您喜欢做义工，想邀请您和我一起参加“爱心99”义工活动，可以拉近一家人的感情。请您在8月15日至9月5日之间上网www.redhillcc.sg报名。
- groupId: P6-CH-2025-PLMGS-Q30-33
  subject: Chinese
  passage:
    title: 晚晴园半日游
    source: PLMGS Primary 6 Chinese 2025, Paper 2; PDF pages 15–17; P6_Chinese_2025_SA2_mgspayalebar.pdf
    text: |-
      为了让人们了解“晚晴园”和它的历史，本民众俱乐部将举办“晚晴园”半日游活动。欢迎任何有兴趣的公众报名参加，最多接受30人报名。

      活动日期及时间：9月11日上午9点至中午12点。
      活动收费：每人$20（儿童免费）。
      报名方法：上网www.sengkangcommunityclub.com.sg报名，截止日期是8月31日。

