  subject: Chinese
  passage:
    title: “马年大吉”新年庆祝会
    source: TaoNan Primary 6 Chinese Prelim 2026; PDF pages 10–11; P6_Chinese_Prelim_2026_TaoNan_Exam_Papers.pdf
    text: |-
      为了让居民了解华族传统文化，一起欢庆新年，欢乐民众俱乐部将举办“马年大吉”新年庆祝会。为了让活动更热闹，我们今年特别邀请了书法家为居民现场写春联，送福气。快来参加我们的新年庆祝活动，一起玩游戏、拿奖品、收祝福，感受节日的快乐气氛吧！

      日期：2026年2月12日至14日
      时间：上午十点到傍晚六点
      地点：欢乐民众俱乐部广场
      每日前50名到场的民众可免费领取马年娃娃！

      新春猜灯谜：猜对即可领取新春礼品。
      写春联，送福气：书法老师——张大伟现场为居民书写春联。
      动手做一做：制作新春贺卡（需付两元材料费）。
      舞龙舞狮表演：观看舞龙舞狮表演。
      年味小吃摊：尝一尝各种新年小吃，例如炸年糕、肉干、蛋卷。

      今年的活动现场也会有各式各样的灯笼，喜欢拍照的朋友千万不能错过哦！想要知道更多详情，请上网www.hlmzjlb.com到欢乐民众俱乐部的网站查看。您也可以拨电61234567向林小姐了解详情。
