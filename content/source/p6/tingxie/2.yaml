        en: We should learn the virtue of respecting the elderly and caring for the young.
      - zh: 她从不浪费食物，体现了节俭的美德。
        en: She never wastes food, showing the virtue of thrift.
      - zh: 老师通过故事教我们认识善良的美德。
        en: The teacher used a story to teach us about the virtue of kindness.
      - zh: 他主动承认错误，表现出了诚实的美德。
        en: He willingly admitted his mistake, demonstrating the virtue of honesty.
  - word: 促进
