        en: This activity helped develop friendship between the two classes.
      - zh: 充足的阳光能促进植物生长。
        en: Plenty of sunlight can promote plant growth.
      - zh: 经常交流有助于促进彼此的了解。
        en: Regular communication helps people understand each other better.
      - zh: 学校举办阅读活动，促进同学们养成阅读习惯。
        en: The school organises reading activities to help students develop a reading habit.
      - zh: 小组讨论能促进同学们互相学习。
        en: Group discussions encourage students to learn from one another.
  - word: 家庭
