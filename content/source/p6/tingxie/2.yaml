title: 第二课 (Lesson 2)
vocab:
  - word: 祖孙
    pinyin: zǔ sūn
    meaning: Grandparent and grandchild
    example: 爷爷和小明这对祖孙每天一起散步。
    sentenceBank:
      - zh: 祖孙俩坐在树下，开心地聊天。
        en: The grandparent and grandchild sat under a tree, chatting happily.
      - zh: 这张照片记录了祖孙三代一起过年的情景。
        en: This photograph captures three generations celebrating the New Year together.
      - zh: 奶奶教孙女包饺子，祖孙俩忙得不亦乐乎。
        en: Grandma taught her granddaughter to make dumplings, and the two happily kept busy.
      - zh: 祖孙俩手牵着手，慢慢地走过小桥。
        en: The grandparent and grandchild held hands and slowly crossed the little bridge.
      - zh: 这部电影讲述了一段感人的祖孙情。
        en: This film tells a touching story about the bond between a grandparent and grandchild.
  - word: 牵
