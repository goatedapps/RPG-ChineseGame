      - zh: 爷爷牵着小孙子的手，走进公园。
        en: Grandpa held his little grandson's hand and led him into the park.
      - zh: 牧童牵着牛，沿着小路回家。
        en: The young herder led the cow home along the path.
      - zh: 爸爸牵着我的手，带我穿过人群。
        en: Dad held my hand and led me through the crowd.
      - zh: 她牵着马，慢慢走向马厩。
        en: She led the horse slowly towards the stable.
      - zh: 哥哥牵着弟弟的手，陪他走上楼梯。
        en: My older brother held my younger brother's hand and accompanied him up the stairs.
