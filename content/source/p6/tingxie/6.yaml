      - zh: 两名选手在决赛中展开对抗。
        en: The two contestants competed against each other in the final.
      - zh: 故事中的村民团结起来对抗恶霸。
        en: The villagers in the story united to resist the bully.
      - zh: 这次训练让队员练习如何对抗强大的对手。
        en: This training helped the players practise competing against strong opponents.
      - zh: 两队对抗了很久，仍然难分胜负。
        en: The two teams competed for a long time without a clear winner.
