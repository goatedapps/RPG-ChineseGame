        en: This mountain town is a good place for tourists to escape the summer heat.
      - zh: 为了避暑，一家人搬到凉爽的山庄住了几周。
        en: The family stayed at a cool mountain lodge for several weeks to escape the summer heat.
      - zh: 天气越来越热，他们决定去北方避暑。
        en: As the weather grew hotter, they decided to go north to escape the summer heat.
      - zh: 她在山里避暑时，每天清晨都去散步。
        en: While staying in the mountains to escape the summer heat, she walked every morning.
