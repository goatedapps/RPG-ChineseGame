<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1b2430">
  <meta name="description" content="A tablet-friendly Chinese vocabulary adventure for Primary 2 and Primary 5 learners.">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Word Spirit Quest</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css?p16">
  <link rel="stylesheet" href="../css/stage.css?p17">
</head>
<body>
  <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
    <symbol id="menu-book" viewBox="0 0 24 24"><path d="M12 5.5c-2.7-1.7-5.5-1.9-9-1.4v14c3.5-.5 6.3-.3 9 1.4m0-14c2.7-1.7 5.5-1.9 9-1.4v14c-3.5-.5-6.3-.3-9 1.4m0-14v14"/></symbol>
    <symbol id="menu-hero" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M5.5 20v-2.1a6.5 6.5 0 0 1 13 0V20H5.5Z"/><path d="M9 15h6"/></symbol>
    <symbol id="menu-bag" viewBox="0 0 24 24"><path d="M4.5 8h15l-1.1 12h-12L4.5 8Z"/><path d="M8.5 9V6a3.5 3.5 0 0 1 7 0v3"/><path d="M9 13h6"/></symbol>
    <symbol id="menu-room" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3V10Z"/><path d="M9 20v-7h6v7"/><path d="M7 10h2"/></symbol>
    <symbol id="menu-daily" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 6 2.3 2.2L16 13"/></symbol>
    <symbol id="menu-adventure" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.1 4.9-4.9 2.1 2.1-4.9 4.9-2.1Z"/></symbol>
    <symbol id="menu-parent" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor" stroke="none"/><circle cx="15" cy="17" r="2" fill="currentColor" stroke="none"/></symbol>
  </svg>
  <div class="prologue-root" id="prologue" hidden></div>
  <a class="skip-link" href="#game-stage">Skip to the game</a>
  <main class="game-shell">
    <header class="hud" aria-label="Player status">
      <div class="hud-overview"><div class="brand">Word Spirit Quest <span>字灵</span><small id="hud-region">Scholar Village</small></div><div class="hud-status">
      <div class="hud-stat"><span>Curriculum</span><b id="hud-level">—</b></div>
      <div class="hud-stat"><span>Location</span><b id="hud-location">—</b></div>
      <div class="hud-stat"><span>Level</span><b id="hud-player-level">1</b></div>
      <div class="hud-stat xp"><span>XP to next level</span><i><em id="hud-xp-bar"></em></i><b id="hud-xp">0/30 XP</b></div>
      <div class="hud-stat hp"><span>HP</span><i><em id="hud-hp-bar"></em></i><b id="hud-hp">20/20</b></div>
      <div class="hud-stat"><span>Coins</span><b id="hud-coins">20</b></div>
      <div class="hud-stat"><span>Spirits</span><b id="hud-spirits">0</b></div>
      <div class="hud-stat"><span>Battles</span><b id="hud-battles">30 left</b></div>
      <div class="hud-stat"><span>Lantern streak</span><b id="hud-streak">0 days</b></div>
      </div></div>
      <nav class="hud-actions" aria-label="Game menus">
      <button class="hud-button" id="book-button" type="button"><svg aria-hidden="true"><use href="#menu-book"/></svg><span>Spirit Book</span></button>
      <button class="hud-button" id="character-button" type="button"><svg aria-hidden="true"><use href="#menu-hero"/></svg><span>Hero Status</span></button>
      <button class="hud-button" id="bag-button" type="button"><svg aria-hidden="true"><use href="#menu-bag"/></svg><span>Bag</span></button>
      <button class="hud-button" id="room-button" type="button"><svg aria-hidden="true"><use href="#menu-room"/></svg><span>My Room</span></button>
      <button class="hud-button" id="daily-button" type="button"><svg aria-hidden="true"><use href="#menu-daily"/></svg><span>Daily Board</span></button>
      <button class="hud-button" id="story-button" type="button"><svg aria-hidden="true"><use href="#menu-adventure"/></svg><span>Adventure</span></button>
      <button class="hud-button utility" id="parent-button" type="button"><svg aria-hidden="true"><use href="#menu-parent"/></svg><span>Parent</span></button>
      <button class="hud-button utility" id="sound-button" type="button" aria-pressed="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3Z"/><path class="sound-waves" d="M16 8a6 6 0 0 1 0 8m2-11a10 10 0 0 1 0 14"/><path class="sound-slash" d="M4 20 20 4"/></svg><span>Sound on</span></button>
      <a class="hud-button debug-only" href="./lab.html" hidden>Learning lab</a>
      <button class="hud-button debug-only" id="status-button" type="button" hidden>Build status</button>
      </nav>
    </header>

    <div class="objective" aria-live="polite"><b>Next step</b><span id="objective-text">Explore Scholar Village and read its signs.</span><small id="save-status" role="status">Save verified</small></div>

    <section class="stage" id="game-stage" tabindex="-1" aria-label="Scholar Village map">
      <canvas id="world" width="640" height="448" aria-label="Game world"></canvas>
      <div class="toast" id="toast" hidden aria-live="polite"></div>
      <div class="dpad" id="dpad" aria-label="Movement controls">
        <button type="button" data-direction="up" aria-label="Move up">▲</button>
        <button type="button" data-direction="left" aria-label="Move left">◀</button>
        <button type="button" data-direction="down" aria-label="Move down">▼</button>
        <button type="button" data-direction="right" aria-label="Move right">▶</button>
      </div>
      <div class="overlay" id="overlay" hidden></div>
    </section>
  </main>
  <noscript>Word Spirit Quest needs JavaScript enabled to run.</noscript>
  <script src="../vendor/hanzi-writer/hanzi-writer.min.js"></script>
  <script type="module" src="../src/main.js?p17c"></script>
</body>
</html>
