<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1b2430">
  <meta name="description" content="A tablet-friendly Chinese vocabulary adventure for Primary 2 and Primary 5 learners.">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Word Spirit Quest</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css?p10n">
  <link rel="stylesheet" href="../css/stage.css?p10p">
</head>
<body>
  <a class="skip-link" href="#game-stage">Skip to the game</a>
  <main class="game-shell">
    <header class="hud" aria-label="Player status">
      <div class="hud-overview"><div class="brand">Word Spirit Quest <span>字灵</span><small id="hud-region">Scholar Village</small></div><div class="hud-status">
      <div class="hud-stat"><span>Curriculum</span><b id="hud-level">—</b></div>
      <div class="hud-stat"><span>Location</span><b id="hud-location">—</b></div>
      <div class="hud-stat"><span>Level</span><b id="hud-player-level">1</b></div>
      <div class="hud-stat xp"><span>XP to next level</span><i><em id="hud-xp-bar"></em></i><b id="hud-xp">0/30 XP</b></div>
      <div class="hud-stat hp"><span>HP</span><i><em id="hud-hp-bar"></em></i><b id="hud-hp">20/20</b></div>
      <div class="hud-stat"><span>Coins</span><b id="hud-coins">20</b></div>
      <div class="hud-stat"><span>Spirits</span><b id="hud-spirits">0</b></div>
      <div class="hud-stat"><span>Battles</span><b id="hud-battles">30 left</b></div>
      <div class="hud-stat"><span>Lantern streak</span><b id="hud-streak">0 days</b></div>
      </div></div>
      <nav class="hud-actions" aria-label="Game menus">
      <button class="hud-button" id="book-button" type="button"><i aria-hidden="true">册</i><span>Spirit Book</span></button>
      <button class="hud-button" id="character-button" type="button"><i aria-hidden="true">人</i><span>Hero Status</span></button>
      <button class="hud-button" id="bag-button" type="button"><i aria-hidden="true">袋</i><span>Bag</span></button>
      <button class="hud-button" id="room-button" type="button"><i aria-hidden="true">屋</i><span>My Room</span></button>
      <button class="hud-button" id="daily-button" type="button"><i aria-hidden="true">日</i><span>Daily Board</span></button>
      <button class="hud-button" id="story-button" type="button"><i aria-hidden="true">卷</i><span>Adventure</span></button>
      <button class="hud-button utility" id="parent-button" type="button"><i aria-hidden="true">⚙</i><span>Parent</span></button>
      <button class="hud-button utility" id="sound-button" type="button" aria-pressed="true"><i aria-hidden="true">♪</i><span>Sound on</span></button>
      <a class="hud-button debug-only" href="./lab.html" hidden>Learning lab</a>
      <button class="hud-button debug-only" id="status-button" type="button" hidden>Build status</button>
      </nav>
    </header>

    <div class="objective" aria-live="polite"><b>Next step</b><span id="objective-text">Explore Scholar Village and read its signs.</span><small id="save-status" role="status">Save verified</small></div>

    <section class="stage" id="game-stage" tabindex="-1" aria-label="Scholar Village map">
      <canvas id="world" width="640" height="448" aria-label="Game world"></canvas>
      <div class="toast" id="toast" hidden aria-live="polite"></div>
      <div class="dpad" id="dpad" aria-label="Movement controls">
        <button type="button" data-direction="up" aria-label="Move up">▲</button>
        <button type="button" data-direction="left" aria-label="Move left">◀</button>
        <button type="button" data-direction="down" aria-label="Move down">▼</button>
        <button type="button" data-direction="right" aria-label="Move right">▶</button>
      </div>
      <div class="overlay" id="overlay" hidden></div>
    </section>
  </main>
  <noscript>Word Spirit Quest needs JavaScript enabled to run.</noscript>
  <script src="../vendor/hanzi-writer/hanzi-writer.min.js"></script>
  <script type="module" src="../src/main.js?p10p"></script>
</body>
</html>
