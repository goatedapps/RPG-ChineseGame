    title: 扫地机器人
    source: 老师自编
    text: |-
      我家有一台扫地机。它长着两只脚，每只脚上有三把小刷子，扫地可全靠它们呢！它还长着两只“小眼睛”，[Q6]停止 它乱撞家里的东西。

      别看它不大，扫起地来可快了！你只要按下它身体上的开关，它就会 [Q7](墨)(墨) 地扫起地来。它扫地时可仔细了，你完全不用 [Q8]怀(意) 它的能力。如果发现哪个地方很脏，它就会不停地扫，直到完成任务，才肯离开。

      它还有好多其他的本领呢！除了 [Q9]辛(琴) 地工作，它还会自己充电呢！如果它快没电了，它就会赶快跑回充电的地方。充电时，它的身体就会亮起绿灯。电充好了，它就能重新开始工作了。

      多么聪明的扫地机啊！自从有了它，我家 [Q10]增长 了许多乐趣！
