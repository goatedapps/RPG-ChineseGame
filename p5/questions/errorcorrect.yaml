    title: 妈妈的建议
    source: 老师自编
    text: |-
      我的妈妈是一名教师，平时工作很忙，但她总是会抽出时间陪我。每当我在学业上遇到困难时，妈妈总是耐心地鼓励我，并给我 [Q6]珍贵 的建议。

      记得有一次，我因为考试成绩差而感到难过，妈妈没有生气，而是轻轻地拍拍我的肩膀，安 [Q7](卫) 我说：“失败是成功之母。只要你努力，下次一定会考到好成绩。”妈妈的话让我 [Q8]回复 自信，变得积极起来。

      妈妈不仅关心我的学业，也关心我的品格培养。她为人慷 [Q9](既)，时常捐钱给老人院，也时常带我一起做义工。在她的影响下，我变得越来越有爱心。

      妈妈让我学会了坚强与感 [Q10](思)。在成长的道路上，无论我遇到什么困难，只要想到妈妈，我就能坚持下去。
