    title: 无声的爱
    source: 改编自《无声的爱》
    text: |-
      “你还是带雨衣吧！今天可能会下雨！”我刚准备出门，爸爸 [Q6](兰) 住了我。我转身看了看天空，天气那么好，应该不会下雨，就对爸爸说：“不会下雨啦！”然后我就出门了。

      放学时，天色突然暗了下来。我望着阴沉沉的天空，心里 [Q7]不时担心 起来：早知道就听爸爸的话，带上雨衣就不会被雨淋湿了！

      下课铃声刚响，大雨就倾盆而下。就在我 [Q8](扮) 望有人来接我时，我从远处看到了爸爸的身影！他一看到我，就说：“还好赶上了。”说完，爸爸把雨衣 [Q9](第) 给我。

      我把雨衣披在身上，感受到了爸爸的温暖。我是多么幸运有一位一直保护着我的爸爸，我一定要 [Q10]珍贵 爸爸对我的爱，长大后用行动来感谢他。
