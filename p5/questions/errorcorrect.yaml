    title: 明华打乒乓球
    source: Nanyang Primary School, 2025 P5 Higher Chinese EOY
    text: |-
      有一天，明华在一场乒乓球赛中输给了对手。比赛结束后，好胜心强的他很不服气，把球拍摔在了地上。他想通过这样的方式表达自己的委 [Q6](区)。

      明华哭着向教练说道：“我努力训练了这么久，为什么还是输给了对手？我真 [Q7]可疑 自己是不是选错了课外活动？我不想再打乒乓了。”教练捡起地上的球拍，对他说：“发脾气是不能解决问题的，每一个人都会有遇到失 [Q8](贩) 的时候，我们能做的是勇敢、积极地面对困难，而不是逃 [Q9](闭)。这样，我们才能离成功越来越近。”听了教练的话，明华惭愧地低下了头。

      从那以后，明华非常 [Q10]珍贵 训练时的每一分，每一秒，无论训练有多辛苦，他都会尽力完成。经过半年的刻苦训练，明华最终得了冠军。他明白了只有勇敢地面对困难，才有战胜它的可能。
