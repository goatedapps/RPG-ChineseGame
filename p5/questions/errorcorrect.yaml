    title: 跳到月亮上的男孩
    source: Maha Bodhi School, 2025 P5 Higher Chinese EOY
    text: |-
      一天晚上，母亲正在厨房里洗碗，她的小儿子在后院玩。母亲不断听到儿子蹦蹦跳跳的声音，感到很 [Q6]奇妙 ，便问他在干什么。儿子大声回答：“妈妈，我想跳到月亮上去。”母亲听了，笑了笑，[Q7]温情 地说：“真的吗？那你别忘了从月亮上跳回来，我们还没有吃晚饭呢！”

      又有一天傍晚，这个小男孩爬到了高高的房顶上。邻居看到这一幕，[Q8]小心 极了，立刻通知了小男孩的母亲。母亲急忙跑过去，冲着他喊：“你爬到房顶上做什么？快下来！”儿子下来后，严肃地对妈妈说：“我要到月亮上去！”妈妈听了，哭笑不得地说：“真的吗？可是你没有带 [Q9](将) 落伞，到月亮上怎么下来呢？带上它再去吧！”

      谁能想到，这个小男孩长大后真的“跳”到月亮上了！他就是人类历史上第一个 [Q10](灯) 上月球的人——阿姆斯特朗。
