  passage:
    title: 友康杯歌唱比赛广告
    source: Henry Park Primary School, 2024 P5 EOY
    text: |-
      友康超市诚意举办：2024年友康杯儿童歌唱比赛
      想要在舞台上展现展示你的歌唱才华吗？快来报名参加吧！

      参赛资格：开放给所有7岁至12岁的小朋友（曾经获得友康杯冠军者除外）。
      试音详情：参赛者必须通过试音才能进入决赛。试音成功者将收到电话通知。
      报名费用：5元
      报名截止日期：8月8日
      网址：www.youkang.sg
  questions:
    - format: MCQ
      text: 这个广告的主要目的是什么？
      options:
        - 吸引家长给孩子报名歌唱比赛。
        - 吸引观众来观看友康歌唱比赛。
        - 鼓励大家到友康超市去买东西。
        - 鼓励小孩子长大后当一名歌手。
      correct: 吸引家长给孩子报名歌唱比赛。
    - format: MCQ
      text: 下面哪位小朋友能够报名参加这个比赛？
      options:
        - 今年5岁，唱歌非常好听的玉美。
        - 今年7岁，来游玩的美国居民国华。
        - 今年9岁，曾经获得友康杯冠军的伟强。
        - 今年12岁，从来没参加过歌唱比赛的月丽。
      correct: 今年12岁，从来没参加过歌唱比赛的月丽。
    - format: MCQ
      text: 以下哪一句话是不正确的？
      options:
        - 如果有任何问题可以上网查看。
        - 友康杯歌唱比赛每一年举办一次。
        - 试音成功的小歌手会收到电话通知。
        - 参赛歌手必须通过试音才能参加比赛。
      correct: 如果有任何问题可以上网查看。
    - marks: 4
      format: Writing-Constrained
      text: 假如你是康康，看了广告后，很有兴趣参加这个比赛。请写一张便条给妈妈，告诉她报名时要注意的事，并请她帮你报名。
      displayAnswer: 可以帮我报名。如果你可以帮我报名，你要再上网 www.youkang.sg 填写报名表格。报名费5元，而且报名的截止日期是8月8日。
- groupId: MB24SA2-G4
