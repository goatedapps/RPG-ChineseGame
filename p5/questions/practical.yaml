  passage:
    title: 美术周乐趣多
    source: Tao Nan School, 2025 P5 EOY — 应用文/通告
    text: |-
      为了让学生们对艺术更有兴趣，欢乐小学将于10月18日至10月22日举办美术周活动！休息时，同学们可以去学校的不同角落参加活动，到时家长也会在场帮助学生制作美术作品。

      与往年不同的是，为了鼓励同学们爱护环境，今年所使用的材料都是生活中可回收的物品。每个活动都要自己准备材料。各年级学生的优秀作品会在礼堂展出。希望同学们别错过这个机会，享受艺术带来的乐趣。

      活动详情：
      活动一：“欢乐灯笼”—— 用红包袋制作灯笼（地点：食堂 / 文具：胶水）
      活动二：“欢乐水墨画”—— 在旧纸板上画水墨画（地点：图书馆 / 文具：毛笔）
      活动三：“欢乐剪纸”—— 把废纸剪成图案（地点：讲堂 / 文具：剪刀）

      学生每参加一个活动，就能得到一张美术周纪念贴纸。获得三张贴纸后，还能换取环保小礼品。小礼品先到先得，送完为止。

      想知道更多详情，请上网 www.huanlexiaoxue@school.com 或发电邮给负责人李老师 (lilaoshi@school.com)。
  questions:
    - format: MCQ
      text: 学校举办“美术周”活动的目的是什么？
      options:
        - 教学生们学习如何画画。
        - 培养学生们对艺术的兴趣。
        - 选出学校最优秀的美术作品。
        - 让学生们用可回收物品制作灯笼。
      correct: 培养学生们对艺术的兴趣。
    - format: MCQ
      text: 参加活动的学生要怎样才能得到纪念贴纸？
      options:
        - 获得三个礼品。
        - 发电邮给李老师。
        - 完成的作品在礼堂展出。
        - 参加美术周其中一项活动。
      correct: 参加美术周其中一项活动。
    - format: MCQ
      text: 以下哪一个句子是不正确的？
      options:
        - 环保小礼物的数量有限。
        - 所有的活动都会在讲堂进行。
        - “美术周”活动在10月22日结束。
        - 家长会在现场帮助学生制作美术作品。
      correct: 所有的活动都会在讲堂进行。
    - marks: 4
      format: Writing-Constrained
      text: 如果你是五年级学生文华，请你写一张便条给好友思杰，告诉他今年的美术周活动和往年有什么不一样，并约他参加“欢乐剪纸”这个活动，以及提醒他需要准备什么材料。
      notes: 本题为约束式应用文写作，官方示范答案只是其中一种合理写法，评分以内容要点+表达是否通顺为准，并非唯一标准答案。
      displayAnswer: 思杰：学校将要举办美术周活动。今年的活动和往年不一样的地方是，今年所使用的材料都是生活中可回收的物品。我想约你参加“欢乐剪纸”这个活动，活动当天，我们必须自己准备废纸。希望你到时可以和我一起去参加这个活动。文华 10月18日下午三点
