  passage:
    title: 国家图书馆读报角落活动
    source: Maha Bodhi School, 2024 P5 SA2
    text: |-
      为了鼓励小学高年级学生多关心新闻、培养阅读报纸的习惯，国家图书馆将于11月份的每个星期六下午2点，在各图书馆的“读报角落”举办《大拇指》读报交流会。

      活动内容包括：
      1. 义工与学生一起阅读当周的《大拇指》报纸。
      2. 探讨并分享热门新闻话题。
      3. 报业集团记者现场分享采访与写作经验。

      欢迎有兴趣的小学五、六年级学生踊跃报名参加。家长亦可陪同出席。参加者将获得精美礼包一份。

      报名截止日期：10月31日
      报名方式：请上网 www.library.gov.sg 或到各图书馆柜台报名。
  questions:
    - format: MCQ
      text: 举办这项活动的主要目的是什么？
      options:
        - 教会学生怎样采访新闻。
        - 鼓励学生时常阅读报纸。
        - 介绍图书馆的读报角落。
        - 让人们能免费阅读报纸。
      correct: 鼓励学生时常阅读报纸。
    - format: MCQ
      text: 什么人能报名参加这个活动？
      options:
        - 图书馆的义工和记者。
        - 喜欢《大拇指》的学生。
        - 想陪孩子去图书馆的家长。
        - 有兴趣的小学高年级学生。
      correct: 有兴趣的小学高年级学生。
    - format: MCQ
      text: 以下哪一个句子是正确的？
      options:
        - 义工将会讲解过去一周的新闻。
        - 记者会送所有在场的学生免费报纸。
        - 学生和家长可以一起参加这项活动。
        - 只要参加这次活动就能得到精美礼包。
      correct: 义工将会讲解过去一周的新闻。
