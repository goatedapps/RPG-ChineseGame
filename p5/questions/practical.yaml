  passage:
    title: 中秋晚会
    source: 老师自拟 — 应用文/通告
    text: |-
      中秋晚会 2025

      为了介绍华族文化，一年一度的中秋晚会又来了！这将更加丰富居民的生活。

      活动详情如下：9月22日（星期六）／晚上7时到9时／乌美1街大牌220前的公园

      活动安排：文化部长讲话／中秋美食展（超过20个摊位）／设计灯笼（每个灯笼的材料费2元，请自备剪刀）／歌舞表演（由欢乐歌舞团呈献）／抽奖活动（奖品由物美公司提供）

      中秋晚会的收费是每人5元（儿童和60岁以上的老人免费）。有兴趣者，请到俱乐部的办公室报名。如果要参加设计灯笼的活动，必须在活动当天下午4点前报名。查问详情，请拨打电话66345678或上新华俱乐部的网站www.xinhua.com.sg。
  questions:
    - format: MCQ
      text: 举办“中秋晚会”的目的是什么？
      options:
        - 观看歌舞表演。
        - 介绍华族文化。
        - 品尝中秋美食。
        - 学会制作灯笼。
      correct: 介绍华族文化。
    - format: MCQ
      text: 哪些人参加这个活动不需要付钱？
      options:
        - 孩子和老年人。
        - 所有报名的人。
        - 父母和他们的孩子。
        - 俱乐部的所有会员。
      correct: 孩子和老年人。
    - format: MCQ
      text: 以下哪一项不是通告所提到的？
      options:
        - 只要报名就可以参加活动。
        - 中秋晚会每年只举行一次。
        - 参加中秋晚会有机会获得奖品。
        - 报名者可获得一个精美的灯笼。
      correct: 报名者可获得一个精美的灯笼。
    - marks: 4
      format: Writing-Constrained
      text: 如果你是明华，你知道妈妈很喜欢做手工，试写一则短信给妈妈，向她提议可以参加哪一个活动，并告诉她参加这个活动要注意些什么。
      context: |-
        开头已给出：“妈妈：新华民众俱乐部将举办‘中秋晚会’活动，我知道您喜欢做手工，……”
        评分标准：内容 /2分，表达 /2分（扣分项：病句、错别字、标点符号错误、词语搭配错误），总分 /4分。
      displayAnswer: 妈妈：新华民众俱乐部将举行“中秋晚会”活动，我知道您喜欢做手工，所以我建议您参加设计灯笼这个活动。参加时要注意灯笼的材料费是2元，并且请自备剪刀。另外，记得必须在活动当天下午4点前报名。
- groupId: NY-G4
  lessonIds: []
  passage:
    title: 欢乐阅读周
    source: 老师自拟 — 应用文/通告
    text: |-
      欢乐阅读周

      为了引起学生阅读华文书的兴趣，本校将在阅读周推出许多有趣的阅读活动，欢迎各年级的同学积极参与！以下是其中三个活动：

      【读书会】老师们将用华语为大家介绍世界各国的著名绘本，并安排各种有趣的读后活动，等着大家参与哦！日期：10月3日至10月7日／时间：一二三年级的休息时间／地点：学校图书馆

      【本地知名作家阿福分享会】阿福老师将来到校园与大家见面！他将分享自己的写作心得，并指导同学们写小故事。详情--日期：10月5日（星期三）／时间：下午2点半至4点半／地点：学校图书馆
      注意事项：1）仅限前30位报名的六年级学生参加。请通过电邮linshuxiang@huanlepri.com向林书香老师报名。2）所有参加者将获得一本阿福老师亲笔签名的新书《狮城60载》。

      【书中人物服装秀】孙悟空、花木兰、哈利波特、小红帽……你最想扮演哪位书中人物呢？日期：10月6日（星期四）／时间：各年级的周会时间／地点：学校礼堂
      注意事项：有兴趣的同学请在当天装扮成你最喜欢的书中人物，你将有机会上台拍照，并获得一份小礼物！
  questions:
    - format: MCQ
      text: 学校举办"欢乐阅读周"的主要目的是什么？
      options:
        - 提高学生写华文故事的能力。
        - 鼓励学生积极参加各种活动。
        - 引起学生阅读华文书的兴趣。
        - 介绍新加坡的知名作家阿福。
      correct: 引起学生阅读华文书的兴趣。
    - format: MCQ
      text: 低年级学生不能参加哪个阅读活动？
      options:
        - 绘本读后活动。
        - 装扮故事人物。
        - 阿福的分享会。
        - 听老师讲故事。
      correct: 阿福的分享会。
    - format: MCQ
      text: 以下哪一个句子是正确的？
      options:
        - 学生可以装扮成任何书中人物。
        - 阅读活动仅有三个有趣的活动。
        - 老师们将以各国语言讲绘本故事。
        - 所有分享会的报名者都可获得新书。
      correct: 学生可以装扮成任何书中人物。
    - marks: 4
      format: Writing-Constrained
      text: 看了这则通告后，你想起上六年级的哥哥喜欢看本地作家阿福的书，希望他不会错过阿福的分享会。请写一则短信给哥哥，告诉他参加分享会的一个好处，活动详情和报名方法，并告诉他要尽早报名的原因。
      context: 开头已给出："哥哥，学校将邀请你喜欢的作家阿福来学校进行分享会，……"
