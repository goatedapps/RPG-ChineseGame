  passage:
    title: 动物园游
    source: 老师自拟 — 应用文/通告
    text: |-
      假期"趣"动物园！

      为了鼓励小朋友和家人一起到动物园游玩，并度过充实的假期，新加坡动物园将在学校假期举办"假期'趣'动物园！"活动。

      【健康步道行】每天早上7点至晚上7点。除了能和家人一起运动和欣赏景色，你们还能看到一些小动物呢！

      【儿童故事时间】12月的每个周末／下午1点至2点／雨林广场。欢迎小朋友来听故事《动物园的秘密》！活动结束后，小朋友还可以在现场买书。

      【动物知识大比拼】12月6日／早上9点至10点／雨林广场。小朋友和家长两人一组报名参加。活动当天，请在早上8点半前到雨林广场报名。报名费是每组10元。

      【小小管理员】12月7日／早上9点至12点／雨林探险园。欢迎小朋友来当一日动物管理员！报名费是每人5元，请到www.zoo.com.sg报名。

      注意：
      ◆ 为了支持环保，动物园没有卖矿泉水，请自己带水壶。
      ◆ 只要报名参加活动，就有机会赢得大奖。
  questions:
    - format: MCQ
      text: 举办"假期'趣'动物园"的主要目的是什么？
      options:
        - 提醒大家度过充实的假期。
        - 鼓励大家到动物园去游玩。
        - 告诉大家假期有什么活动。
        - 请大家来现场听儿童故事。
      correct: 鼓励大家到动物园去游玩。
    - format: MCQ
      text: 哪一个活动适合爷爷、小文和弟弟一起参加？
      options:
        - 健康步道行。
        - 小小管理员。
        - 儿童故事时间。
        - 动物知识大比拼。
      correct: 健康步道行。
    - format: MCQ
      text: 以下哪一个句子是正确的？
      options:
        - 参加所有动物园的活动前，都要先报名。
        - 周末早上，小朋友可以一起听儿童故事。
        - 只要去动物园，就可能有机会赢得大奖。
        - 如果想看小动物，可以参加健康步道行。
      correct: 如果想看小动物，可以参加健康步道行。
    - marks: 4
      format: Writing-Constrained
      text: 假如你是小文，你和妈妈想要参加"动物知识大比拼"。请在活动前一天写一则短信，提醒妈妈参加活动需要注意的事项。
      context: 开头已给出："妈妈，我们明天早上就要去动物园参加'动物知识大比拼'的活动了。活动会在早上9点开始。我想要提醒您，……"
      displayAnswer: 妈妈，我们明天早上就要去动物园参加"动物知识大比拼"的活动了。活动会在早上9点开始。我想要提醒您，活动当天，要在早上8点半前到雨林广场报名，报名费是每组10元。还有，为了支持环保，动物园没有卖矿泉水，所以我们要自己带水壶。
