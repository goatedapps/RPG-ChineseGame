    title: 篮球假期训练营
    source: Nanyang Primary School, 2024 P5 WA2
    text: |-
      学校假期要来了，找个活动让孩子放松一下吧！我们的篮球训练营，不仅能够让中小学生减轻学习压力、提高篮球技术，更重要的是可以让学生们在运动中学会合作，并认识新朋友。

      训练详情：
      训练日期：6月12日到6月15日
      时间：早上8点到11点
      地点：红山民众俱乐部篮球场
      收费：12-18岁：300元/人；6-12岁：半价

      优惠：如果两人一起报名，报名费立减50元！

      报名时间及方式：
      请在6月10日前，到网站www.basket.com.sg下载报名表格，填好后交到红山民众俱乐部办公室。
      如果有任何疑问，请拨打热线电话：81234567。

      红山民众俱乐部
      2024年5月20日
  questions:
    - marks: 4
      format: Writing-Constrained
      text: 学校假期快到了，你看了这则广告，想和哥哥一起去参加这个活动。请发一则信息给哥哥，告诉他假期训练营的详情，你想参加训练营的一个原因，以及两人一起报名的好处。
