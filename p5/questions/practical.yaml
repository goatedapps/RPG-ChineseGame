  passage:
    title: 你想当环保大使吗？
    source: Nanyang Primary School, 2024 P5 EOY — 通告
    text: |-
      为了提高本区居民的环保意识，我校今年将第一次举办“共造绿色未来”环保活动。有兴趣当环保大使的五、六年级同学，请马上报名参加吧！

      环保大使的任务：
      任务一：打扫组屋公共空间（在组屋楼下捡垃圾；清理和擦洗桌椅、电梯、楼梯扶手、邮箱等）
      任务二：将可回收物品分类（协助居民把送来的可回收物品分类，并将它们分别放置在相应的回收箱里。）

      注意事项：
      • 每位环保大使只能选择一个任务，并在报名时注明任务名称。

      活动详情：
      日期：11月15日（星期六）
      时间：上午9点至中午12点
      地点：红山组屋区大牌101-110

      *有兴趣的同学请在11月12日之前上网报名（www.greenambassador.com），如有任何疑问，请电邮陈美美老师 may_tan@huanlexiaoxue.com。

      欢乐小学
      11月2日
  questions:
    - format: MCQ
      text: 关于环保大使任务，以下哪项说明是正确的？
      options:
        - 每人需要同时完成两个任务。
        - 每位环保大使只能选择一个任务。
        - 任务二是在学校里帮同学分类垃圾。
        - 任务一只需要在楼梯口捡垃圾。
      correct: 每位环保大使只能选择一个任务。
    - format: MCQ
      text: 想要报名参加活动的学生应该怎么做？
      options:
        - 在11月15日前发电邮给陈老师。
        - 在11月2日前找陈老师报名。
        - 在11月12日前直接到红山组屋区现场报名。
        - 在11月12日之前上网报名。
      correct: 在11月12日之前上网报名。
    - marks: 4
      format: Writing-Constrained
      text: 看了这则通告后，你想起同学小安对可回收物品分类有兴趣，请写一则短信给小安，鼓励他去报名当环保大使，并告诉他适合他的任务、活动详情及报名详情。
      displayAnswer: 小安，学校将举办“共造绿色未来”环保活动。我知道你对可回收物品分类有兴趣，想鼓励你去报名当环保大使，适合你的任务是将可回收物品分类。活动将在11月15日上午9点至中午12点在红山组屋区大牌101-110举行。请在11月12日之前上网（www.greenambassador.com）报名。如有疑问可电邮陈美美老师（may_tan@huanlexiaoxue.com）。希望你能参加！
