  passage:
    title: 中秋节庆祝会
    source: 老师自编 — 应用文/通告
    text: |-
      中秋节庆祝会

      中秋节就要到了，为了让同学对这个华人传统节日有更深的认识，欢乐小学将在10月3日傍晚六点到晚上八点举办中秋节庆祝会。

      【灯笼制作比赛】活动详情：
      时间：傍晚六点到七点　地点：学校礼堂
      注意：比赛是个人赛／只能用学校提供的材料／请在9月26日前到学校办公室报名

      【提灯笼游园】活动详情：
      时间：傍晚七点半　地点：学校广场集合
      注意：必须自备灯笼

      【游戏摊位】活动详情：
      时间：傍晚六点到七点半　地点：篮球场

      （傍晚6点开始，食堂有小吃摊卖美食。）

      中秋节庆祝会入场免费，现场也有照相摊位，让大家拍照留念，但需付费。
      如果想了解更多中秋节庆祝会的详情，请拨打61234567到办公室找陈小姐。

      欢乐小学
      2025年9月10日
  questions:
    - format: MCQ
      text: 学校举办中秋节庆祝会的目的是什么？
      options:
        - 鼓励学生们参加灯笼制作比赛。
        - 通知学生有小吃摊位售卖美食。
        - 让学生对中秋节有更深的认识。
        - 邀请学生来中秋庆祝会提灯笼。
      correct: 让学生对中秋节有更深的认识。
    - format: MCQ
      text: 怎样才可以参加灯笼制作比赛？
      options:
        - 10月3日傍晚六点到礼堂去。
        - 在庆祝会时带自己的灯笼来。
        - 拨办公室电话号码找陈小姐。
        - 在截止日期前到办公室报名。
      correct: 在截止日期前到办公室报名。
    - format: MCQ
      text: 以下哪一个句子是不正确的？
      options:
        - 学校会提供灯笼制作比赛的材料。
        - 参加者可以在照相摊位免费拍照。
        - 游戏摊在傍晚六点至七点半开放。
        - 庆祝中秋的活动在10月3日举办。
      correct: 参加者可以在照相摊位免费拍照。
    - marks: 4
      format: Writing-Constrained
      text: 如果你是国华，你和同学立明约好10月3日中秋节庆祝会当天一起提灯笼游园。于是，你写一则短信给立明，提醒他这个活动的详情。
      context: |-
        开头已给出：“立明，别忘了我们约好10月3日当天一起提灯笼游园。请记得______”
        评分标准：内容 /2分，表达 /2分（扣分项：病句、错别字、标点符号错误、词语搭配错误），总分 /4分。
      displayAnswer: 立明，别忘了我们约好10月3日当天一起提灯笼游园。请记得我们傍晚7点半（0.5分）在学校广场集合（0.5分），必须自备灯笼（1分）。
- groupId: NH-G4
  lessonIds: []
  passage:
    title: 户外亲子游
    source: 老师自编 — 应用文/通告
    text: |-
      户外亲子游

      为了加深居民们对新加坡的了解，欢乐民众俱乐部将举办户外亲子游活动。有兴趣的居民请在11月25日之前到欢乐民众俱乐部报名，报名免费。

      活动详情：
      日期：2025年12月6日
      时间：上午8:30-12:30

      路线一：爬山乐　呼吸新鲜空气，沿路看各种植物和动物。山路难走，一年级以上小朋友才能参加。

      路线二：动物园步道行　沿着动物园外围走，可以免费看各种动物，全程三公里。

      路线三：市中心街道行　参观城市建筑，了解历史，适合喜欢历史和市区文化的人。

      路线四：东海岸骑行　沿着海岸线骑行，一路欣赏海景，非常自由放松。参加者一定要会骑车，需自己付钱租车。

      注：一定要穿舒服的鞋子，要注意防蚊防晒，带雨伞以防下雨。

      2025年11月1日
      欢乐民众俱乐部
  questions:
    - format: MCQ
      text: 这则通告的主要目的是什么？
      options:
        - 告诉大家新加坡有很多好玩的地方
        - 提醒家长要多带孩子进行户外活动
        - 鼓励大家报名参加户外亲子游活动
        - 希望居民们对新加坡有更深的了解
      correct: 鼓励大家报名参加户外亲子游活动
    - format: MCQ
      text: 以下哪一项是动物园步道行的特别之处？
      options:
        - 可以呼吸新鲜的空气
        - 能看到动物园的动物
        - 感受大海的美丽景色
        - 了解历史和市区文化
      correct: 能看到动物园的动物
    - format: MCQ
      text: 以下哪句话是正确的？
      options:
        - 参加东海岸骑行的人要自己付钱租车
        - 所有小朋友都可以参加爬山乐的活动
        - 民众俱乐部会准备防蚊防雨防晒用品
        - 只有参加爬山乐才可以看到各种动物
      correct: 参加东海岸骑行的人要自己付钱租车
    - marks: 4
      format: Writing-Constrained
      text: 妈妈，我看到欢乐民众俱乐部的通告，他们将举办“户外亲子游”活动，我喜欢看各种建筑物，______
      context: 开头已给出：“妈妈，我看到欢乐民众俱乐部的通告，他们将举办‘户外亲子游’活动，我喜欢看各种建筑物，______”
      displayAnswer: 妈妈，我看到欢乐民众俱乐部的通告，他们将举办“户外亲子游”活动，我喜欢看各种建筑，我想让您带我参加“市中心街道行”。这个活动的日期是12月6日，时间是上午8:30到12:30。请您在11月25日之前到欢乐民众俱乐部报名。
- groupId: ACSJ-G4
  lessonIds: []
  passage:
    title: 假期活动
    source: 老师自编 — 应用文/通告
    text: |-
      红山小学假期活动

      为了让学生度过一个又特别又难忘的假期，红山小学将首次举办学校假期活动，让他们有机会认识自己生活的地方，帮助有需要的人。活动人数有限，欢迎家长在11月20日前上学校网站www.chengxinschool.sg为孩子报名。

      【走走看看】活动内容：小导游带你探索红山组屋区。日期和时间：11月28日下午4点到6点。注意事项：三年级以下的学生需要家长陪伴。

      【献爱心】活动内容：帮助独居老人大扫除／陪老人聊天。日期和时间：每周星期六早上8点到12点。注意事项：7点半到学校礼堂集合。

      【亲亲大自然】活动内容：到红山公园种树。日期和时间：12月3日早上7点到10点。注意事项：只限五、六年级学生。

      除了以上为学生准备的假期活动，本校也鼓励大家捐出旧衣服，帮助有需要的人。捐出的衣物必须清洗干净，放进学校门口的回收箱。
  questions:
    - format: MCQ
      text: 如果想进一步认识红山组屋区，你应该报名参加哪个活动？
      options:
        - 献爱心。
        - 走走看看。
        - 捐出旧衣服。
        - 亲亲大自然。
      correct: 走走看看。
    - format: MCQ
      text: 以下哪一个说法是不正确的？
      options:
        - 学生需要报名参加假期活动。
        - 要捐出的旧衣服应该先清洗干净。
        - 所有活动都必须家长陪伴才可以参加。
        - 这是红山小学第一次举办学校假期活动。
      correct: 所有活动都必须家长陪伴才可以参加。
    - format: MCQ
      text: 红山小学举办学校假期活动的主要目的是什么？
      options:
        - 让学生踏出家门认识朋友。
        - 让学生学习怎么上学校网站。
        - 让学生能和家长一起参加活动。
        - 让学生度过又特别又难忘的假期。
      correct: 让学生度过又特别又难忘的假期。
    - marks: 4
      format: Writing-Constrained
      text: 假如你是康康，看到这个通告时，想起同班同学小乐很关心老人。于是，你写了一个短信给小乐，告诉她哪一个活动适合她，并说明活动当天需要做些什么和注意什么。
      context: |-
        开头已给出：“小乐，我们学校在假期将举办很多活动，我觉得你可以参加‘献爱心’的活动……”
        评分标准：内容 /2分，表达 /2分（扣分项：病句、错别字、标点符号错误、词语搭配错误），总分 /4分。
      displayAnswer: 小乐，我们学校在假期将举办很多活动，我觉得你可以参加“献爱心”的活动。这个活动内容是帮助独居老人打扫除和陪老人聊天。日期和时间是每周星期六早上8点至12点，如果你有兴趣参加，请你父母在11月20日前在学校网站www.chengxinschool.sg为你报名，报名后每周星期六早上7点半到学校礼堂集合。
- groupId: HP-G4
  lessonIds: []
  passage:
    title: 亲子同乐日
    source: 老师自编 — 应用文/通告
    text: |-
      乐享健康・亲子同乐日

      您还在为周末的亲子活动发愁吗？欢乐民众俱乐部邀请您参加“乐享健康・亲子同乐日”活动！这次活动将在2025年10月28日（星期天）举办。希望本次健康日可以让民众享受和家人一起运动的乐趣。

      活动详情：

      【舞动亲子情】时间：8:00 AM – 9:30 AM。地点：民众俱乐部大礼堂。内容：跟随舞蹈老师学习简单又有趣的亲子舞蹈，享受音乐与跳舞的快乐！8岁以上儿童可自己参加哦！

      【活力健康行】时间：9:45 AM – 11:00 AM。地点：欢乐公园步道。要求：儿童需要家长陪伴。内容：在大自然中散步，呼吸新鲜空气，放松身心！

      【欢乐风筝赛】时间：11:15 AM – 1:00 PM。地点：欢乐公园广场。组别：儿童组（12岁以下）／亲子组（家长+儿童）／公开组（12岁以上）。内容：风筝飞得最高的前三名，将获得精美奖品！

      报名方式：请上网huanlecc.com报名。报名截止日期：10月15日。热线电话：如有任何疑问，请拨打热线6543 7890。

      欢乐民众俱乐部
  questions:
    - format: MCQ
      text: “乐享健康・亲子同乐日”的活动目的是什么？
      options:
        - 让民众都能收到精美的奖品。
        - 让民众享受音乐带来的快乐。
        - 让民众有机会和家人一起运动。
        - 让民众有机会和家人放松身心。
      correct: 让民众有机会和家人一起运动。
    - format: MCQ
      text: 下面哪个活动儿童必须要家长陪伴？
      options:
        - 舞动亲子情
        - 活力健康行
        - 欢乐风筝赛
        - 所有的活动
      correct: 活力健康行
    - format: MCQ
      text: 以下哪一句话是不正确的？
      options:
        - “舞动亲子情”是室内活动。
        - “活力健康行”在上午举行。
        - “欢乐风筝赛”只能儿童参加。
        - 如果有疑问可以拨打热线电话。
      correct: “欢乐风筝赛”只能儿童参加。
    - marks: 4
      format: Writing-Constrained
      text: 你的朋友小安很喜欢和父母一起放风筝。看了这则通告，请发一条短信给他，告诉他可以参加的活动和原因，并告诉他报名的方法和要注意的事。
      context: |-
        开头已给出：“亲爱的小安，我看到一则通告，关于‘乐享健康，亲子同乐日’。我觉得你会有兴趣参加……”
        评分标准：内容 /2分，表达 /2分（扣分项：病句、错别字、标点符号错误、词语搭配错误），总分 /4分。
      displayAnswer: 亲爱的小安，我看到一则通告，关于“乐享健康，亲子同乐日”。我觉得你会有兴趣参加，因为你很喜欢和你的爸爸妈妈一起放风筝。活动会在学校的操场进行。你们要带自己的风筝就可以了。记得注意安全，别跑太快，也要留意周围的人。
- groupId: MB-G4
