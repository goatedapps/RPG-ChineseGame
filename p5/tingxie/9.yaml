title: 第九课 (Lesson 9)
vocab:
  - word: 增添
    pinyin: zēng tiān
    meaning: Add / Increase
    example: 新的装饰品为房间增添了不少节日气氛。
    sentenceBank:
      - zh: 学校新建的图书馆为校园增添了一道美丽的风景线。
        en: The school's newly built library added a beautiful sight to the campus.
      - zh: 这几盆鲜花的到来，为客厅增添了几分生气。
        en: The arrival of these pots of fresh flowers added a bit of vitality to the living room.
      - zh: 弟弟的出生为我们家增添了不少欢声笑语。
        en: My younger brother's birth added a lot of laughter to our family.
      - zh: 老师在课堂上增添了一些有趣的小游戏，让大家更投入。
        en: The teacher added some interesting little games to the class to make everyone more engaged.
      - zh: 这场大雨为炎热的夏天增添了一丝凉意。
        en: This heavy rain added a bit of coolness to the hot summer.
  - word: 民众俱乐部
    pinyin: mín zhòng jù lè bù
    meaning: Community Club
    example: 星期六，爸爸带我去民众俱乐部学习游泳。
    sentenceBank:
      - zh: 附近的民众俱乐部每个星期都会举办各种有趣的活动。
        en: The nearby community club holds all kinds of interesting activities every week.
      - zh: 我们社区的民众俱乐部里设有图书馆、篮球场和游泳池。
        en: Our neighborhood's community club has a library, a basketball court, and a swimming pool.
      - zh: 爷爷退休以后，经常到民众俱乐部和老朋友们下棋聊天。
        en: After grandpa retired, he often goes to the community club to play chess and chat with old friends.
      - zh: 这个假期，民众俱乐部为孩子们安排了丰富的手工课程。
        en: This holiday, the community club has arranged a wealth of craft classes for children.
      - zh: 民众俱乐部的义工们热心地帮助居民解决各种生活问题。
        en: The volunteers at the community club warmly help residents solve various daily life problems.
  - word: 将
    pinyin: jiāng
    meaning: Going To / About To
    example: 我们家将在下个月搬到新的房子。
    sentenceBank:
      - zh: 校长在大会上宣布，学校将在下学期建一座新礼堂。
        en: The principal announced at the assembly that the school will build a new hall next semester.
      - zh: 这场足球比赛将在星期六下午举行。
        en: This football match will be held on Saturday afternoon.
      - zh: 老师说，我们将学习一篇非常有意思的课文。
        en: The teacher said we are going to study a very interesting text.
      - zh: 天气预报说，明天将会有一场大雷雨。
        en: The weather forecast says there will be a big thunderstorm tomorrow.
      - zh: 这项新政策将会为居民带来许多方便。
        en: This new policy will bring a lot of convenience to residents.
  - word: 花木兰
    pinyin: Huā Mùlán
    meaning: Hua Mulan
    example: 花木兰女扮男装，代替父亲从军打仗。
    sentenceBank:
      - zh: 花木兰的故事教育我们要勇敢面对困难，孝顺父母。
        en: The story of Hua Mulan teaches us to bravely face difficulties and be filial to our parents.
      - zh: 老师在课堂上给我们讲述了花木兰替父从军的传说。
        en: The teacher told us the legend of Hua Mulan joining the army in place of her father during class.
      - zh: 花木兰在战场上表现英勇，最终立下了赫赫战功。
        en: Hua Mulan performed bravely on the battlefield and eventually achieved remarkable military merits.
      - zh: 我们观看了一部关于花木兰的动画电影，深受感动。
        en: We watched an animated film about Hua Mulan and were deeply moved.
      - zh: 花木兰的孝心和勇气一直被后人所传颂。
        en: Hua Mulan's filial piety and courage have always been praised by later generations.
  - word: 票价
    pinyin: piào jià
    meaning: Ticket Price
    example: 这场演唱会的票价非常昂贵。
    sentenceBank:
      - zh: 电影院最近调低了周末场次的票价，吸引了不少观众。
        en: The cinema recently lowered the ticket price for weekend showings, attracting many viewers.
      - zh: 儿童的票价通常只是成人票价的一半。
        en: The ticket price for children is usually only half of the adult ticket price.
      - zh: 我们提前在网上购买了车票，票价比现场购买便宜许多。
        en: We bought train tickets online in advance, and the price was much cheaper than buying on-site.
      - zh: 这个主题乐园的票价虽然不便宜，但十分值得一游。
        en: Although the ticket price for this theme park is not cheap, it is well worth a visit.
      - zh: 由于是特别场次，这场话剧的票价比平时贵了一倍。
        en: Because it was a special showing, the ticket price for this play was double the usual price.
  - word: 免费
    pinyin: miǎn fèi
    meaning: Free (Of Charge)
    example: 这个博物馆星期天对学生免费开放。
    sentenceBank:
      - zh: 图书馆为读者提供免费的无线网络服务。
        en: The library provides free wireless internet service for readers.
      - zh: 商店为了庆祝开业，前一百位顾客可以免费获得礼物。
        en: To celebrate the opening, the store offered the first hundred customers a free gift.
      - zh: 这个健康讲座是完全免费的，欢迎大家踊跃参加。
        en: This health talk is completely free, and everyone is welcome to actively participate.
      - zh: 学校为家境贫困的学生提供免费的午餐。
        en: The school provides free lunches for students from poor family backgrounds.
      - zh: 只要出示学生证，就可以免费进入这座公园。
        en: As long as you show your student card, you can enter this park for free.
  - word: 订票
    pinyin: dìng piào
    meaning: Book A Ticket
    example: 我们提前在网上订票，节省了不少时间。
    sentenceBank:
      - zh: 为了确保有座位，我们决定提前一个月订票。
        en: To ensure we have seats, we decided to book tickets a month in advance.
      - zh: 妈妈帮我们订票，让我们能够顺利地看到这场表演。
        en: Mom helped us book tickets so that we could watch this show smoothly.
      - zh: 由于这部电影非常受欢迎，很多人都提前几天订票。
        en: Because this movie is very popular, many people booked tickets days in advance.
      - zh: 我们打算下个星期订票，去邻国旅行五天。
        en: We plan to book tickets next week to travel to a neighboring country for five days.
      - zh: 订票的时候，记得核对好日期和场次，以免出错。
        en: When booking tickets, remember to check the date and session carefully to avoid mistakes.
  - word: 矿泉水
    pinyin: kuàng quán shuǐ
    meaning: Mineral Water
    example: 运动之后，他喝了一大瓶矿泉水解渴。
    sentenceBank:
      - zh: 出门郊游时，妈妈总会准备几瓶矿泉水给我们。
        en: When going out for an outing, mom always prepares a few bottles of mineral water for us.
      - zh: 天气炎热，大家都争着买冰凉的矿泉水解暑。
        en: The weather was hot, and everyone rushed to buy cold mineral water to cool off.
      - zh: 这个品牌的矿泉水取自天然的山泉，非常清甜。
        en: This brand of mineral water comes from natural mountain springs and is very sweet and refreshing.
      - zh: 学校提醒同学们外出时要随身携带一瓶矿泉水。
        en: The school reminded students to carry a bottle of mineral water with them when going out.
      - zh: 他不小心把矿泉水打翻了，弄湿了整张桌子。
        en: He accidentally knocked over the mineral water and got the whole table wet.
  - word: 装扮
    pinyin: zhuāng bàn
    meaning: Dress Up
    example: 妹妹把自己装扮成一位美丽的公主。
    sentenceBank:
      - zh: 万圣节那天，同学们都把自己装扮成各种有趣的角色。
        en: On Halloween, classmates all dressed themselves up as various interesting characters.
      - zh: 圣诞节前夕，全家人一起装扮圣诞树，非常开心。
        en: On Christmas Eve, the whole family decorated the Christmas tree together, very happily.
      - zh: 她花了很长时间才把自己装扮成戏剧里的角色。
        en: She spent a long time dressing herself up as a character from the play.
      - zh: 商场里到处装扮着五颜六色的新年装饰品。
        en: The mall is decorated everywhere with colorful New Year decorations.
      - zh: 舞台上的演员装扮成古代的将军，看起来威风凛凛。
        en: The actor on stage was dressed up as an ancient general, looking very imposing.
  - word: 代替
    pinyin: dài tì
    meaning: Replace
    example: 花木兰代替父亲从军打仗。
    sentenceBank:
      - zh: 老师因为生病请假，由另一位老师代替她上课。
        en: Because the teacher was sick and on leave, another teacher replaced her to teach the class.
      - zh: 我们可以用蜂蜜代替糖，让蛋糕吃起来更健康。
        en: We can use honey to replace sugar to make the cake healthier to eat.
      - zh: 队长受伤了，教练只好派另一位球员代替他上场。
        en: The captain got injured, so the coach had to send another player to replace him on the field.
      - zh: 没有任何东西能够代替父母对孩子的爱。
        en: Nothing can replace the love parents have for their children.
      - zh: 由于妈妈出差了，是奶奶代替她来接我放学。
        en: Since mom was on a business trip, grandma came to pick me up from school in her place.
  - word: 打仗
    pinyin: dǎ zhàng
    meaning: Fight (A War)
    example: 古代的将军经常带领士兵去打仗。
    sentenceBank:
      - zh: 花木兰代替父亲去打仗，展现了她的孝心和勇气。
        en: Hua Mulan went to fight in her father's place, showing her filial piety and courage.
      - zh: 历史课上，老师讲述了古代两个国家打仗的故事。
        en: In history class, the teacher told the story of two ancient countries going to war.
      - zh: 没有人愿意打仗，因为战争会带来许多伤亡和痛苦。
        en: No one wants to fight a war, because war brings a lot of casualties and suffering.
      - zh: 士兵们在战场上英勇地打仗，保卫自己的家乡。
        en: The soldiers fought bravely on the battlefield, defending their hometown.
      - zh: 电影里描述了将军们如何指挥军队打仗的场面。
        en: The movie depicted the scene of generals commanding their armies to fight.
