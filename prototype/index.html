o":["xín zhuàn","xín zhuàng","xíng zhuàn","xíng zhuàng"],"c":"xíng zhuàng"},{"k":"pinyin","q":"学校__禁止__学生在课室里用手机。 (选出画线词语的汉语拼音)","o":["jìn zǐ","jìn zhǐ","jìng zǐ","jìng zhǐ"],"c":"jìn zhǐ"},{"k":"pinyin","q":"我们在海边玩了一整天，直到__黄昏__才回家。（选出画线词语的汉语拼音）","o":["huáng hūn","háng hūn","huáng yún","háng yún"],"c":"huáng hūn"},{"k":"pinyin","q":"我们到达机场时，已经接近__黄昏__了。（选出画线词语的汉语拼音）","o":["huán hūn","huán fēn","huáng hūn","huáng fēn"],"c":"huáng hūn"},{"k":"pinyin","q":"我们今天完成了一项数学__测试__。（选出画线词语的汉语拼音）","o":["cè sì","cè shì","chè sì","chè shì"],"c":"cè shì"},{"k":"pinyin","q":"爷爷送给我的手表非常__贵重__，我一定会好好珍惜。（选出画线词语的汉语拼音）","o":["guì zòng","kuì zòng","guì zhòng","kuì zhòng"],"c":"guì zhòng"},{"k":"phrase","q":"蔬果放进冰箱里，可以__保持__新鲜。（选出画线词语的意思）","o":["使吸收更多的营养","使不消失或不改变","使受到伤害或破坏","使比原来的更加好"],"c":"使不消失或不改变"},{"k":"phrase","q":"老师刚提出问题，同学们就__异口同声__地喊出答案。（选出画线词语的意思）","o":["很多人同时不停地说话","很多人同时说一样的话","很多人争着抢着要说话","很多人按顺序轮流说话"],"c":"很多人同时说一样的话"}],"comp":[{"id":"HC-G3","sub":"Higher Chinese","title":"大卫的成长","text":"大卫家里十分有钱，从小要什么有什么，但这让他觉得生活有些无聊，于是开始喜欢捉弄别人。村民们都讨厌他，不愿意和他做朋友。\n\n有一次，大卫逛街时，听到一位艺术家拉小提琴。那动听的琴声深深吸引了他，他第一次发现，原来音乐能带来这么多美好和感动。从那以后，他对小提琴产生了浓厚的兴趣。他跟随一名老师认真学习，并花了很多时间和精力练习。\n\n一年后，大卫感觉自己有了很大进步，很想找人分享。他怀着兴奋的心情，邀请村民们到广场上观看他的演出。可是，他在广场上等了很久都没有人来。原来，村民们都以为大卫又要恶作剧，不想再被骗。大卫坐在空无一人的广场上，望着心爱的小提琴，难过极了。他默默地收起琴盒，准备回家。\n\n“请你拉一曲好吗？”匆匆赶来的马丁喊道，“我非常想看你的表演，只是临时有事来晚了。”大卫连忙回答：“当然可以！”他深吸了一口气，便开始拉小提琴。大卫表演得特别用心，沉浸在音乐之中，脸上露出愉快的神情。\n\n表演结束后，马丁热烈地鼓掌，并说：“太好听了！”大卫激动地说：“非常感谢您愿意做我的听众，还肯定我的表现！我以前总是捉弄别人，所以村民们都不愿意来听我拉小提琴。我知道自己错了。”\n\n马丁笑着说：“人是会成长的，你也一样。”\n\n从那以后，大卫学会了尊重别人，渐渐赢回了村民们的信任和友谊。","qs":[{"f":"fill","q":"从短文中找出与下列画线词语意思相近或相同的词语：这个活动十分__没趣__，大家都不想参加。","acc":["无聊"],"ans":"无聊"},{"f":"fill","q":"从短文中找出与下列画线词语意思相近或相同的词语：天气__一点一点__变冷了，我们都开始穿上厚衣服。","acc":["渐渐"],"ans":"渐渐"},{"f":"open","q":"在拉小提琴给马丁听之前，大卫的心情是怎样的？原因是什么？","ans":"心情：难过\n原因：大卫邀请村民们听他拉小提琴，但没人来。","ctx":""},{"f":"open","q":"在拉小提琴给马丁听之后，大卫的心情是怎样的？原因是什么？","ans":"心情：激动\n原因：马丁愿意做他的听众，肯定了他的表现。","ctx":""},{"f":"open","q":"为什么大卫想要学小提琴？","ans":"因为大卫逛街时（0.5分），听到一位艺术家拉小提琴（0.5分）。那动听的琴声（0.5分）深深吸引了他（0.5分），他第一次发现，原来音乐能带来这么多美好（0.5分）和感动（0.5分）。从那以后，他对小提琴产生了浓厚的兴趣（1分）。","ctx":""},{"f":"open","q":"试从以下两个选项中，选一个最适合的作为这篇短文的题目，并举例说明理由：(1) 大卫的成长 (2) 大卫学小提琴","ans":"选 (1) 大卫的成长。理由——起因：大卫以前爱捉弄别人，大家都讨厌他（0.5分）；经过：后来只有马丁一个人来看他的演出（0.5分）；结果：大卫知道自己以前做错了（0.5分）；点题：他成长了，学会了尊重别人，渐渐赢回了村民们的信任和友谊（0.5分）。","ctx":""}]},{"id":"HC-G4","sub":"Higher Chinese","title":"散步","text":"明文的父亲去世了，年老的母亲一个人住。一天，明文对母亲说：“妈，您年纪越来越大了，身体也不太好，我担心您要是发生什么意外，没有人知道怎么办？我想让您和我们一起住。”母亲想了想，就同意了，很快便搬来跟明文住。\n\n一天傍晚，明文提议一家人到河边散步。母亲觉得自己行动不方便，走远一点就会觉得累，需要坐下来休息，所以拒绝了他。明文却认为母亲应该多走走，身体才会更健康。在他的再三劝说下，母亲点头答应了。\n\n河边有两条小路，左边是宽阔的木板步道，右边是窄小的石路。母亲想走木板步道，她说：“木板步道比较宽，我走起来会轻松些。”但明文的女儿丽丽想走石路，她说：“石路的风景更漂亮，我想去那里欣赏刚盛开的花朵。”\n\n明文听了，心里有些矛盾，但他又想到平时常常带丽丽到公园赏花，而母亲年纪大了，走石路会太累，所以他对丽丽说：“[Q17]你就让一下吧。”\n\n明文以为丽丽会失望，没想到丽丽听了爸爸的话，却说：“没问题，我们就一起走木板步道吧！”说完，丽丽就牵起奶奶的手，一同前行。走了不久，丽丽看到奶奶满头大汗的，便建议她坐下来休息一会儿。妻子也拿出毛巾，帮母亲擦汗。明文看到眼前这一幕，[Q18]心中涌起一种说不出的温暖。\n\n坐在长椅上，一家人说说笑笑，风轻轻地吹着，阳光洒在他们身上，特别舒服。这一刻，明文明白了一个道理：原来走哪一条路都不重要，因为只要有家人的陪伴，就是最幸福的事了！","qs":[{"f":"open","q":"试解释下面短语在文中的意思（第四段）：“你就让一下吧”","ans":"丽丽想走石路（0.5分），明文（0.5分）要她让奶奶（0.5分）走木板步道（0.5分）。","ctx":""},{"f":"open","q":"试解释下面短语在文中的意思（第五段）：“心中涌起一种说不出的温暖”","ans":"明文很感动（1分），因为他看到了丽丽看到奶奶满头大汗的，便建议她坐下来休息一会儿（0.5分），妻子也拿出毛巾，帮母亲擦汗（0.5分）。","ctx":""},{"f":"open","q":"为什么明文希望母亲和他们一起住？","ans":"因为明文的父亲去世了（0.5分），年老的母亲一个人住（0.5分），明文认为母亲的年纪越来越大了（0.5分），身体也不太好（0.5分），担心（1分）她要是发生什么意外（0.5分），没有人知道（0.5分）。","ctx":""},{"f":"open","q":"来到河边，明文的母亲和女儿分别想走哪条路？为什么她们的想法不同？","ans":"母亲想走木板步道，因为木板步道比较宽，走起来会轻松些；丽丽想走石路，因为石路的风景更漂亮，她想去欣赏刚盛开的花朵。两人的想法不同，是因为母亲考虑体力和舒适，丽丽则看重沿途的风景。","ctx":""},{"f":"open","q":"请用不超过15个字，写出短文中第二段的段落大意。","ans":"【参考答案，非官方】明文劝母亲一起到河边散步。（约13字）","ctx":"字数限制：≤15字"},{"f":"open","q":"你认为丽丽是一个怎样的孩子？从哪两件事情可以看出来？","ans":"【参考答案，非官方】丽丽是一个懂事、孝顺、体贴长辈的孩子。可以从两件事看出来：（一）她原本想走石路看花，但为了让奶奶轻松一些，答应改走木板步道；（二）她看到奶奶满头大汗，主动建议奶奶坐下来休息。","ctx":""},{"f":"open","q":"明文认为最幸福的事是什么？你同意明文的看法吗？试举生活中的例子加以说明。","ans":"明文认为，只要有家人的陪伴，就是最幸福的事。第二部分为开放式问题：需结合自己的生活例子说明是否同意，没有固定答案。","ctx":""}]},{"id":"CH-G2","sub":"Chinese","title":"西瓜和苹果","text":"我的弟弟今年五岁。他爱听故事，也爱问问题，而且每次都一定要问出答案不可。\n\n一天晚上，我做完了功课，正想上床睡觉，他拉着我，一直吵着让我给他讲一个故事。我想快点打发他，随口给他讲了一个简单的故事。弟弟认真地听完故事，就问：“故事里的妹妹把大的苹果让给哥哥，那哥哥为什么不把苹果让给妹妹呢？”\n\n这看似简单的问题，我想都没想过，这可真把我给问倒了。这时妈妈走进房间，了解发生了什么事情后，对弟弟说：“所以说故事里的妹妹比哥哥还懂事啊！”弟弟听了，似懂非懂地点了点头。\n\n第二天，爸爸下班回来，手里抱着一个西瓜。吃过晚饭，弟弟一直喊着：“我要吃最大块的西瓜。”爸爸切好西瓜，摆在盘子里。不等爸爸分西瓜，弟弟立刻拿走了一块最大的西瓜。我心想：真是贪吃！昨天才给他讲了让苹果的故事，今天就忘得一干二净！\n\n我刚想开口，就看到拿着西瓜的弟弟，走到奶奶面前说：“奶奶，这块西瓜给您吃。”奶奶先是惊讶，然后开心地接过西瓜。弟弟平时有好吃的东西就会紧紧地抓在手里，谁都抢不走；今天却主动把最大的西瓜让给了奶奶，自己还挑了一块最小的西瓜，坐在一旁津津有味地吃起来。弟弟的这一个举动，让大家都大跌眼镜。\n\n妈妈走到弟弟身边问：“怎么啦，西瓜不好吃吗？”弟弟调皮地回答：“别人会让苹果，我会让西瓜。”","qs":[{"f":"mcq","q":"“我”为什么给弟弟讲故事？","o":["因为“我”想给弟弟随便讲个故事。","因为“我”不想让弟弟一直问问题。","因为弟弟知道“我”很喜欢讲故事。","因为弟弟一定要“我”讲一个故事。"],"c":"因为弟弟一定要“我”讲一个故事。"},{"f":"mcq","q":"文中“这可真把我给问倒了”指的是什么？","o":["“我”不必回答弟弟的问题。","“我”不想回答弟弟的问题。","“我”不敢回答弟弟的问题。","“我”不会回答弟弟的问题。"],"c":"“我”不会回答弟弟的问题。"},{"f":"mcq","q":"什么事让“我”认为弟弟忘了“我”给他讲的故事？","o":["弟弟把西瓜紧紧地抓住。","弟弟一直吵着要吃西瓜。","弟弟拿走最大块的西瓜。","弟弟没有帮爸爸摆西瓜。"],"c":"弟弟拿走最大块的西瓜。"},{"f":"mcq","q":"大家为什么都“大跌眼镜”？","o":["因为弟弟还是把最大块的西瓜给自己。","因为弟弟这次没等爸爸给每人分西瓜。","因为弟弟今天要吃苹果，不要吃西瓜。","因为弟弟会主动把大块西瓜分给家人。"],"c":"因为弟弟会主动把大块西瓜分给家人。"},{"f":"mcq","q":"从弟弟吃西瓜这件事可以看出他是个怎样的人？","o":["爱听故事。","贪吃自私。","孝顺懂事。","没有耐心。"],"c":"孝顺懂事。"}]},{"id":"CH-G5","sub":"Chinese","title":"书店老板","text":"上小学时，学校外的书店是我放学后常去的地方。照理来说，去书店应该是买书来看的，但更多的时候，口袋空空的我只能装作选书的样子，偷偷地看几页的故事，然后装作没事离开。我以为这样做神不知鬼不觉，心中一直非常得意。\n\n一天，我又在偷读故事，突然听到有人说：“你坐下慢慢读吧！”我慌张地抬头，发现书店老板正看着我，微笑着指了指身旁的椅子。见老板没有因为我白看书而赶我走，我松了一口气。我刚要坐下，突然身后有人拉住了我的衣领。我一转头，看到父亲生气地瞪着我。\n\n“别怪他，一两次而已……”老板见了，连忙说。没等老板说完，父亲就抢过我手中的书，看了看那本书的价钱，快速地从钱包里拿出钱放在柜台上，然后拉着我走了。\n\n回到家里，父亲对我说：“我们虽然不富有，也不能占别人便宜。你想想，如果大家都跟你一样，你要书店的生意怎么做下去？”我听了，觉得之前的行为太不应该了。\n\n那天后，父亲经常故意安排一些家务给我做。做完家务后，他会给我一些钱，这样放学后我就可以到书店买下自己喜欢的书。\n\n最近爸爸让我专心准备考试，没安排家务给我做。没有钱，我只好不去书店了。这天放学后，我经过书店时，老板叫住了我，问道：“最近怎么不来买书了？”我红着脸告诉他实情。他笑着递给我一个笔记本，说：“没事的，你就先拿吧，然后把拿的书记在这个本子上，以后再付钱。”听了他的话，我的眼圈红红的。一个和我没有什么关系的人愿意为我这样做，让我的心中暖暖的。","qs":[{"f":"fill","q":"文中表示“心里紧张，动作忙乱”的词语是 ___ 。","acc":["慌张"],"ans":"慌张"},{"f":"fill","q":"文中表示“动作速度快”的词语是 ___ 。","acc":["快速"],"ans":"快速"},{"f":"open","q":"“我”为了什么事感到得意？","ans":"我口袋空空（0.5分），在书店装作选书（0.5分），偷偷看了几页故事（0.5分），然后装作没事离开（0.5分），以为这样做神不知鬼不觉（1分），感到很得意。","ctx":""},{"f":"open","q":"发现“我”白看书的行为后，父亲在书店里做了什么？","ans":"父亲拉住了“我”的衣领（0.5分），生气地瞪着“我”（0.5分），然后抢过“我”手上的书（0.5分），看了看那本书的价钱（0.5分），快速地从钱包里拿出钱放在柜台上（0.5分），拉着“我”走了（0.5分）。","ctx":""},{"f":"open","q":"文中的“你要书店的生意怎么做下去”指的是什么？","ans":"这指的是如果大家（0.5分）都像作者（0.5分）一样，只看书不买书（0.5分），书店老板就没有钱赚了。(2分)","ctx":""},{"f":"open","q":"书店老板后来对“我”做的事让“我”有什么感受？为什么？","ans":"a) “我”非常感动（2分）。 b) 因为书店老板和“我”没有什么关系（1分），却让“我”先拿书，把拿的书记在本子上（0.5分），让“我”以后再给书的钱（0.5分）。","ctx":""},{"f":"open","q":"如果你是书店的老板，你还会怎么帮助作者？请加以说明。","ans":"官方答案接受以下任一种结构：\n【2方法+2说明】a) 如果我是书店老板，我会请作者来我的书店打工（1分）。b) 这样可以让他赚钱买自己喜欢的书（1分）。a) 我也可以把书以便宜的价钱卖给他（1分）。b) 这样他就买得起书了（1分）。\n【或：1方法+1说明】a) 如果我是书店老板，我会以比较便宜的价钱把书卖给作者（2分）。b) 因为我知道作者喜欢看书（0.5分），但家里不富有（0.5分），用这样的方法可以鼓励他继续看书（1分）。","ctx":""}]},{"id":"NH-G2","sub":"Chinese","title":"捐鞋子","text":"几天前，我放学回家时看到门上插着一张纸。我拿起来一看，原来是有人在回收旧物品，如衣服、书包，还有旧鞋子。\n\n我马上想到几天前妈妈说我有几双鞋子穿不下，又要买新的了！于是我赶紧跑去找妈妈：“妈妈，我们可以把旧鞋子捐出去，送给有需要的人。”妈妈点点头，笑着说：“太好了，我找个时间准备一下。”\n\n今天，我一放学回家就发现妈妈在弯腰刷鞋子。我走近一看，那不就是我们要捐出去的鞋子吗？我好奇地问：“妈妈，鞋子都要捐出去了，为什么还要洗呢？这样不是很麻烦吗？”\n\n妈妈语重心长地说：“如果别人送给我们的二手衣服很脏，你会开心吗？”\n\n我想了一下，然后摇摇头：“不会……我可能还会有点难过，会觉得他们在可怜我。”妈妈点点头说：“我希望别人拿到鞋子的时候开心，而不是觉得我们只是把不要的东西扔给他们。我们要用心帮助他人、尊重他人。”听完妈妈的话，我的脸有点红了。我原来只想着把鞋子送出去就好了，没想到这件事并没有那么简单。\n\n我想：以后我在帮助别人的时候，也要像妈妈一样，带着尊重和爱心去做每一件小事。","qs":[{"f":"mcq","q":"作者为什么想要捐鞋子？","o":["想要再买一双新的鞋子","去帮助那些有需要的人","不想要再清洗旧鞋子了","感谢别人送的二手衣服"],"c":"去帮助那些有需要的人"},{"f":"mcq","q":"什么事情让作者感到好奇？","o":["妈妈清洗将要捐出去的鞋子","妈妈要找个时间准备旧鞋子","妈妈不想收到不干净的衣服","妈妈希望拿到鞋子的人开心"],"c":"妈妈清洗将要捐出去的鞋子"},{"f":"mcq","q":"“没想到这件事并没有那么简单”，这句话是什么意思？","o":["觉得这样捐东西给别人太麻烦了","认为可以把不要的东西直接扔掉","不知道帮人时要注意别人的感受","以为别人拿到旧鞋子时会很开心"],"c":"不知道帮人时要注意别人的感受"},{"f":"mcq","q":"你认为妈妈是一个怎样的人？","o":["喜欢干净","不怕麻烦","做事认真","为人着想"],"c":"为人着想"},{"f":"mcq","q":"这个故事告诉大家一个什么道理？","o":["把旧鞋子刷干净才能捐出去","可以把不要的东西送给别人","做好事也要带着尊重和爱心","尽自己所能帮助有需要的人"],"c":"做好事也要带着尊重和爱心"}]},{"id":"NH-G5","sub":"Chinese","title":"值日生","text":"休息铃声响起后，明伟和立成留在教室里，他们是今天的值日生。明伟在擦白板时，立成却偷偷跑出去打篮球了。\n\n过了一会儿，明伟发现立成溜走了，他皱了皱眉头，但什么也没说，继续打扫教室。\n\n不一会儿，老师来了。她看到教室很整洁，以为今天负责打扫的两位值日生分工合作，把教室打扫干净了，问道：“今天谁是值日生？”明伟说：“老师，是我和立成。”老师接着说：“教室很整洁，但垃圾桶旁还有些垃圾，下次记得更仔细一些。”明伟点点头。\n\n第二天，老师在班上表扬道：“昨天我看见教室很整洁，白板也很干净。有些同学就算没人提醒，也依然尽责，这是一种值得学习的精神。”立成听了老师的话，偷偷看了一眼明伟，心中有些惭愧，也有点感动。\n\n放学后，立成跑来找明伟：“你为什么不告诉老师我没做值日？”明伟淡淡地说：“我是值日生，我应该把我的部分做好。你是我的朋友，我不想因为一句话破坏我们的友情。但我也希望你以后不要把责任推给别人。”立成低下头，难为情地说：“对不起，我以后不会再这样了。”\n\n又到了做值日的时候，立成留在教室里打扫。明伟没有说话，只是递给他一块抹布，两人看着对方，不约而同地笑了。","qs":[{"f":"fill","q":"文中表示“做事认真”的词语是 ___。","acc":["仔细"],"ans":"仔细"},{"f":"fill","q":"文中表示“事先没有约定，行动却完全一样”的词语是 ___。","acc":["不约而同"],"ans":"不约而同"},{"f":"open","q":"发现立成偷偷跑出去打篮球后，明伟有什么反应？","ans":"明伟发现立成偷偷跑出去打篮球后，他皱了皱眉头，但什么也没说，继续打扫教室。","ctx":""},{"f":"open","q":"立成听了老师的话，为什么有些惭愧，也有些感动？","ans":"a) 立成听了老师的话，觉得有些惭愧，因为他偷偷跑出去打篮球，留下明伟一个人做值日，他知道自己做错了。 b) 他也觉得感动，因为他知道明伟没有告诉老师他没做值日的事，让他不会被老师责骂。","ctx":""},{"f":"open","q":"为什么明伟不告诉老师立成没做值日？","ans":"明伟不告诉老师立成没做值日，因为他认为他也是值日生，应该把他的部分做好，而立成是他的朋友，他不想因为这件事破坏他们的友情。","ctx":""},{"f":"open","q":"第四段中，老师说的话让同学们明白了什么？（2分）最后立成做了什么决定？（1分）","ans":"老师的话让同学们明白了做事要尽责，就算没人提醒也能自己完成任务。最后立成在做值日时，留在课室认真打扫。","ctx":""},{"f":"open","q":"你从明伟身上学到了什么？你会怎么把它运用到生活中？","ans":"官方参考答案接受以下任一种（学生答案只要合理并符合评分要点即可）：\n【责任心角度】我从明伟身上学到了不要把责任推给别人。平时在学习时，我会自动自发地把老师吩咐的作业做好，并按时交上，不需要他人提醒或催促。\n【友情角度】我从明伟的身上学到了不应该为了一点小事而破坏了友情。和朋友相处时，不要为了一小事争吵，有误会时要说清楚。","ctx":""}]},{"id":"NH-HC-G3","sub":"Higher Chinese","title":"了不起的爸爸","text":"大卫的爸爸只有一条腿，这让大卫觉得有点丢脸。有一天，学校举行篮球比赛，大卫希望妈妈能去看。但当妈妈说要和爸爸一起去时，大卫立刻拒绝，不情愿地说：“我只希望您一个人去。爸爸去了，会让气氛变得奇怪。”妈妈叹了口气，正要说话，爸爸刚好走过来说：“我要出国工作，你们去就好。”\n\n比赛那天，大卫的队伍赢了。妈妈很开心，说：“如果你爸爸知道了，一定会感到骄傲的！”大卫一听见“爸爸”两个字，脸色就变了，不耐烦地说：“别提他了，好吗？”妈妈问：“你知道爸爸是怎么失去一条腿的吗？”大卫摇头。妈妈说：“你两岁时在路边乱跑，一辆车突然冲出来。你爸爸冲过去推开你，结果自己被撞了。”大卫听了，满脸通红，一句话也说不出来。\n\n妈妈接着告诉他另一个秘密：爸爸就是著名作家布恩特！那个写出许多精彩故事的人，竟然就是他一直以为“丢脸”的爸爸！大卫不敢相信自己的耳朵，冲去问老师。老师点头说：“这是真的。你爸爸不想让你太早知道这些，是怕你有压力。他一直都很爱你，你爸爸是一位伟大的父亲。”\n\n几天后，爸爸回来了，大卫小声问：“您真的是布恩特？”没等爸爸回答，大卫就把一本爸爸写的书递了过去，兴奋地请他签名。爸爸微笑地看着大卫，然后在第一页写下：“爸爸永远爱你！”","qs":[{"f":"fill","q":"从短文中找出与下列画线词语意思相近或相同的词语：弟弟做错了事，却不肯道歉。","acc":["拒绝"],"ans":"拒绝"},{"f":"fill","q":"从短文中找出与下列画线词语意思相近或相同的词语：他听到自己拿了一百分，非常自豪。","acc":["骄傲"],"ans":"骄傲"},{"f":"open","q":"大卫在得知第一个秘密时，他的反应有所不同，试加以比较，并说明原因。（填入表格：得知第一个秘密时）","ans":"反应：满脸通红，一句话也说不出来\\n原因：知道了爸爸是为了自己而受伤，感到惭愧","ctx":"表格栏目：反应 / 原因"},{"f":"open","q":"大卫在得知第二个秘密时，他的反应有所不同，试加以比较，并说明原因。（填入表格：得知第二个秘密时）","ans":"反应：不敢相信自己的耳朵，冲去问老师\\n原因：没想到爸爸是著名作家","ctx":"表格栏目：反应 / 原因"},{"f":"open","q":"当妈妈说要和爸爸一起去看大卫的比赛时，大卫是怎么做的，为什么？","ans":"大卫立刻拒绝了，不情愿地说他只希望妈妈一个人去。因为爸爸只有一条腿，大卫认为有点丢脸，去了会让气氛变得奇怪。","ctx":""},{"f":"open","q":"试从以下两个选项中，选一个最适合的作为这篇短文的题目，并举例说明理由：(1) 伟大的父亲 (2) 著名的作家","ans":"选 (1) 伟大的父亲。我选《伟大的父亲》作为这篇短文的题目，因为短文主要讲的是大卫的父亲为了救大卫而失去一条腿，而且父亲怕大卫有压力，就没有告诉大卫自己就是著名作家布恩特。大卫最后明白了父亲一直默默在为自己付出，是一位伟大的父亲。","ctx":""}]},{"id":"NH-HC-G4","sub":"Higher Chinese","title":"自己动脑","text":"假期里，小光到外婆家住。外婆写了一张购物清单，让他去附近的小超市帮忙买日用品。\n\n第一次自己去买东西，小光把清单递给了小超市的老板王爷爷。王爷爷只是扫了一眼，便说：“架子上都有，自己去找吧。”说完，他便转身走向收银台，不再理会小光。\n\n小光听了，十分惊讶。他原以为大人会帮他，结果却被一句话打发了。他只好在架子间走来走去。鸡蛋藏在面包和牛奶之间，纸巾压在玩具堆下，牙刷竟然夹在毛巾旁边。他蹲下、起身，来来回回转了好几圈，才手忙脚乱地把东西全部找齐。\n\n回到家，他向外婆抱怨，说王爷爷冷冰冰的，不理睬他，明明知道东西在哪里，却害他浪费了好多时间。外婆笑了笑，鼓励他说：“我明白王爷爷的意思，你自己去找答案吧。”\n\n接下来的几天，外婆依然让他一个人去店里。一开始，小光还需要花很多时间。渐渐地，他学会主动把清单读一遍，在脑子里先想好找东西的顺序再出门。后来，他发现自己找得一次比一次快。\n\n每次小光独自完成任务，都会觉得自己长高了一点，王爷爷也总向他投来赞许的目光。\n\n假期快结束时，王爷爷问小光现在有没有明白他的用意。小光点点头，说：“您是想让我学会自己动脑，也让我知道，很多事情不是别人不帮，而是自己可以做到。”王爷爷笑着说：“真正的成长，是哪怕一开始觉得难，也愿意去尝试。”","qs":[{"f":"open","q":"试解释下面短语在文中的意思（第三段）：“被一句话打发了”","ans":"小光以为王爷爷会帮他找东西，没想到王爷爷却说架子上都有，让他自己找，便不再理会小光。","ctx":""},{"f":"open","q":"试解释下面短语在文中的意思（第六段）：“觉得自己长高了一点”","ans":"小光每次独自完成任务，发现自己找东西越来越快，觉得自己成长了。","ctx":""},{"f":"open","q":"第一次去小超市，小光惊讶的原因是什么？他是怎么把东西找齐的？","ans":"小光觉得惊讶，因为他原本以为大人会帮忙，却听到王爷爷叫他自己找。他在架子间走来走去，蹲下、起身，来来回回转了好多圈，才手忙脚乱地把东西全部找齐。","ctx":""},{"f":"open","q":"假期里，外婆是怎么帮助小光成长的？","ans":"一开始，外婆写了购物清单，让小光去附近的小超市帮忙买日用品。后来，小光向外婆抱怨王爷爷时，外婆鼓励他自己去找答案。接下来的几天，外婆依然让他自己去买东西。最后，小光学会了独自买东西，明白了很多事情不是别人不帮，而是自己可以做到。","ctx":""},{"f":"open","q":"请用不超过15个字，写出文中第五段的段落大意。","ans":"小光独自购物，学会动脑，找东西更快。","ctx":"字数限制：≤15字"},{"f":"open","q":"小光对自己去超市买东西的想法有什么改变？从哪里可以看出？","ans":"一开始，小光去超市买东西时，认为自己只需要提供购物清单，大人应该帮他找东西。从他听了王爷爷的话，十分惊讶，以为大人会帮他，结果却被一句话打发了，后面还抱怨王爷爷冷冰冰的可以看出。后来，他明白应该自己动脑，很多事情自己可以做到。从他后来找东西前会主动把清单读一遍，在脑子里先想好找东西的顺序再出门可以看出。","ctx":""},{"f":"open","q":"如果你遇到困难，你会像小光一样，自己尝试解决问题吗？为什么？请举生活中的例子加以说明。","ans":"官方参考答案接受两种立场（学生答案只要合理并符合评分要点即可）：\n【会】我会像小光一样自己尝试解决问题，因为我觉得能够自己完成任务，才是真正的成长。我小时候不会骑脚踏车，我没有让爸爸扶我，而是让自己练习，最后我真的学会了，也很有成就感。\n【不会】我不会像小光一样自己尝试解决问题，因为我觉得刚开始做一件事时，还是需要有大人的帮助和指导。我小时候第一次学游泳，我很紧张，还是需要妈妈带着我一起游，最后我学会了。","ctx":""}]},{"id":"ACSJ-G2","sub":"Chinese","title":"妈妈的用心","text":"小时候，小安喜欢围着妈妈转，告诉她学校里发生的事情。可是随着年龄增长，他只有在向妈妈要零用钱时才会和她说两句话。就连一起吃晚餐时，他也只是安静地盯着电视屏幕看，这让妈妈很伤心。妈妈担心小安长大后不懂得怎么跟别人交流，也无法清楚地说出自己的想法。\n\n不少父母只会批评孩子，从不称赞和鼓励他们；还有一些家长手机不离手，不是忙着上网购物，就是追看连续剧。这样的家长孩子们自然不愿意和他们交流。可小安的妈妈并不是那样的。\n\n在一次家长会上，老师告诉小安的妈妈，小安觉得妈妈不关心他。妈妈皱着眉头说：“我怎么会不关心小安呢？我每天一回到家，就会问他是否完成了作业。”老师说：“孩子们其实有许多烦恼，需要找人说一说。如果您只关心他的学业，小安会越来越害怕和您说话。要不，您试试和他聊学习以外的事情？”老师的话让妈妈恍然大悟。\n\n那天晚上，妈妈请小安教她打篮球，那是小安最喜欢的运动之一。小安一边教妈妈，一边兴奋地和她说了很多心里话。从那天起，家里又传出了欢声笑语。","qs":[{"f":"mcq","q":"小安什么时候才会开口和妈妈说话？","o":["需要钱的时候。","有烦恼的时候。","开家长会的时候。","一起吃饭的时候。"],"c":"需要钱的时候。"},{"f":"mcq","q":"小安不肯和妈妈说话，妈妈有什么感受？","o":["很失望。","很难过。","很生气。","很害怕。"],"c":"很难过。"},{"f":"mcq","q":"为什么小安不愿意和妈妈说话？","o":["妈妈不懂得怎么跟别人面对面交谈。","妈妈经常忙着上网购物和追看连续剧。","妈妈只会批评小安，从不称赞和鼓励他。","妈妈一开口就问功课，让他觉得压力很大。"],"c":"妈妈一开口就问功课，让他觉得压力很大。"},{"f":"mcq","q":"文中“恍然大悟”说明了什么？","o":["老师知道孩子们有许多烦恼。","老师知道小安的妈妈关心他。","妈妈知道应该和小安聊些什么了。","妈妈知道要怎样说出自己的想法。"],"c":"妈妈知道应该和小安聊些什么了。"},{"f":"mcq","q":"妈妈是个怎样的人？","o":["关心孩子的人。","热爱学习的人。","喜欢运动的人。","乐于助人的人。"],"c":"关心孩子的人。"}]},{"id":"ACSJ-G5","sub":"Chinese","title":"游戏机","text":"一天，杨文回家告诉爸爸妈妈他的同学都买了最新的游戏机，他请求爸爸妈妈也给他买一台。那台游戏机要一千元，太贵了！爸爸想了想，说：“这样吧，如果你在年终考试能考到班级前十名，我们就想办法帮你实现愿望。”杨文听了，说：“您要说到做到！如果大家发现只有我没有游戏机，我会被取笑的！”\n\n杨文平时上课不专心，功课也不用心做，考试从来不超过40分，爸爸觉得他根本不可能完成这个任务。谁知几个月后，年终考试结束，杨文竟然考到全班第九名！爸爸妈妈听到这个好消息却沉默了很久。\n\n过了几天，爸爸妈妈递给杨文一个礼物，杨文兴奋地接过它，双手微微发抖。“这是什么？”杨文拆开礼物后，瞪大了眼睛，难过地问。妈妈拍拍他的肩膀，说：“对不起，我们现在真的没钱给你买游戏机，但你可以把零用钱存进这个铁盒。以后凡是考试得90分以上，我们就给你十元。等你存够了钱，就可以买游戏机了。”看着爸爸身上破了好几个洞的衬衫和妈妈脚上那双旧鞋子，杨文惭愧地点点头。\n\n接下来的一年，他每天认真听讲，晚上还会复习老师当天讲过的内容。此外，遇到不懂的题目他会立刻问老师或同学。在年终考试中，杨文取得了全年级第一名的好成绩。爸爸妈妈看到成绩册，笑着拿出一千元对杨文说：“我们存了一些钱。给！去买游戏机吧！”杨文没有伸手去接，而是从书包里拿出一件新衬衫和一双新鞋子递给了爸爸妈妈，说：“这一年，我明白了有些东西比游戏机更重要！”","qs":[{"f":"fill","q":"文中表示“不说话”的词语是 ___ 。","acc":["沉默"],"ans":"沉默"},{"f":"fill","q":"文中表示“只要是、所有”的词语是 ___ 。","acc":["凡是"],"ans":"凡是"},{"f":"open","q":"杨文为什么想要最新的游戏机？","ans":"因为杨文的同学们都买了最新的游戏机，如果同学们发现只有他没有最新的游戏机，他会被取笑的，所以杨文想要最新的游戏机。","ctx":""},{"f":"open","q":"文中“爸爸觉得他根本不可能完成这个任务”，“这个任务”指的是什么 (1分)？为什么爸爸觉得杨文不可能完成这个任务 (3分)？","ans":"这个任务是杨文要在年终考试考到班级前十名。因为杨文上课不专心，功课也不用心做，考试也从来不超过40分，所以爸爸觉得杨文不可能完成这个任务。","ctx":""},{"f":"open","q":"打开盒子前后杨文的心情有什么不同 (2分)？为什么 (2分)？","ans":"打开盒子前，杨文感到很兴奋，打开盒子后，他感到很难过。因为打开盒子前，他考了全班第九名，他以为里面是父母答应实现的愿望——一台最新的游戏机。可是打开盒子后，发现里面什么也没有，只是一个空盒子。","ctx":""},{"f":"open","q":"杨文怎么取得全年级第一名？","ans":"杨文每天认真听讲，晚上会复习老师当天讲过的内容，他遇到不懂的题目也会立刻问老师或同学，他通过这样做，取得了全班第一名。","ctx":""},{"f":"open","q":"杨文有哪两个值得你学习的地方 (2分)？试各举一个例子加以说明 (2分)。","ans":"杨文有两个值得我学习的地方。第一，他孝顺并且体谅父母。父母答应实现愿望却没有做到，这时他没有大吵大闹，而且十分理解与体谅父母的难处，还买了新衬衫与新鞋子给父母。第二，他通过自己的努力一步一步实现不可能的任务，让自己从考试不超过40分到全班第一，这样决心与努力也值得我学习。","ctx":""}]},{"id":"HP-G2","sub":"Chinese","title":"别乱说话","text":"兴亮是一个可爱的男孩，但是他有一个坏习惯。\n\n一次，兴亮经过小美的座位，发现她正一边写字，一边看另一份相同的作业。他转身向周围的同学说：“原来小美的作业都是抄别人的！”坐在小美旁边的丽文听见了，就立刻对兴亮说：“不知道就不要乱说！”\n\n还有一次，在休息时，兴亮发现食堂的一个角落有一个小女孩在哭。站在小女孩面前的小美正怒气冲冲地瞪着小女孩。接着，兴亮跑去和朋友说：“平时看起来很安静的小美，原来喜欢欺负别人！”\n\n这些话传开后，同学们都在小美的背后指指点点，并渐渐地远离她。这让小美感到很难过。丽文看到了这一切，决定告诉老师。\n\n第二天，老师在班里问兴亮：“你知不知道你的行为对小美造成了多大的伤害？”兴亮却回答：“我亲眼看到小美在课室里抄别人的功课，也看到她在休息时欺负一个小女孩。”\n\n听到这儿，小美激动地说：“我那时是在抄丽文的笔记，因为我生病，好几天没来上学！而食堂的那个小女孩是我的妹妹，我很生气她在短短三天内弄丢了两个水瓶！你们什么都不知道就乱说话！”\n\n老师这时也看向其他同学，问道：“你们现在知道到处乱说话的后果了吗？”同学们听了都红着脸，低下了头。兴亮也恍然大悟，后悔之前对小美做的事……","qs":[{"f":"mcq","q":"兴亮的坏习惯是什么？","o":["他常常在空闲时找同学们说话。","他喜欢躲在角落听别人说坏话。","他没弄清楚情况就到处乱说话。","他在老师的面前说朋友的坏话。"],"c":"他没弄清楚情况就到处乱说话。"},{"f":"mcq","q":"为什么小美会怒气冲冲地瞪着小女孩？因为","o":["小女孩还没有向小美道歉。","小女孩又弄丢了她的水瓶。","小女孩在食堂的角落大哭。","小女孩在休息时去找小美。"],"c":"小女孩又弄丢了她的水瓶。"},{"f":"mcq","q":"为什么同学们都渐渐地远离小美？因为","o":["小美抄了别的同学的作业。","小美爱欺负年纪小的同学。","同学们以为小美是坏学生。","同学们认为小美太安静了。"],"c":"同学们以为小美是坏学生。"},{"f":"mcq","q":"文中“同学们都红着脸，低下了头”指的是什么？","o":["大家很生气，因为兴亮害大家都被老师批评了。","大家很伤心，因为没有人能够回答老师的问题。","大家很惭愧，因为他们之前的行为伤害了小美。","大家很后悔，因为他们没有向老师报告整件事。"],"c":"大家很惭愧，因为他们之前的行为伤害了小美。"},{"f":"mcq","q":"丽文是一个怎样的人？","o":["见义勇为","聪明能干","做事非常小心","懂得尊重别人"],"c":"见义勇为"}]},{"id":"HP-G5","sub":"Chinese","title":"小乌龟爬山","text":"在一片美丽的森林里，有一座山，山脚下住着一只小乌龟。它有个梦想，就是爬上山顶，从那里看看森林的美景。\n\n它把想法告诉朋友们。小猴嘲笑道：“你动作那么慢，要爬到什么时候？”小兔也摇摇头说：“山太高了，你是做不到的。”小乌龟什么也没说，心想：我一定要爬上山顶给你们看！\n\n第二天，小乌龟信心满满地出发了。可是很快的，第一个困难来了——路上一块巨石让它过不去。它试着爬过去，可是石头太滑了，每次刚爬到一半，就滑了下来。这时，一只小鸟飞过来劝它：“算了吧，你爬不过去的。”小乌龟依然没有说话，它决定慢慢地绕过石头，继续前进。\n\n走着走着，天色暗了下来，不一会儿大雨倾盆而下。小乌龟小心翼翼地前进，可一不小心，还是跌倒了。它的身上一阵疼痛，心想：也许，我真的做不到……\n\n就在这时，它看到一只小蚂蚁努力搬着食物，吃力地往前走。小乌龟好奇地问：“这么重的东西，你不累吗？”小蚂蚁喘着气说：“当然累啊，但如果我现在停下，之前付出的努力不就白费了？”说完，它又向前爬。小乌龟沉默了一下，咬紧牙关，然后再慢慢往上爬。\n\n时间一分一秒地过去，山顶越来越近了。然而，最后一段路特别难走，小乌龟的腿已经快要抬不起来了。它看着不远处的山顶，想起了那只努力搬食物的小蚂蚁。它深吸一口气，拼尽最后的力气，一步一步地向上爬去。\n\n终于，它到达了山顶。夕阳的金光洒满森林，它看到了一片从来都没见过的美丽景色。它没有大声欢呼，而是安静地看着远方，嘴角露出了微笑。","qs":[{"f":"fill","q":"文中形容“用看不起别人的语气笑话别人”的词语是 ___ 。","acc":["嘲笑"],"ans":"嘲笑"},{"f":"fill","q":"文中形容“情况没有改变，还是和原来一样”的词语是 ___ 。","acc":["依然"],"ans":"依然"},{"f":"open","q":"小乌龟有什么梦想？","ans":"小乌龟要爬上山顶，从那里看看森林的美景。","ctx":""},{"f":"open","q":"知道小乌龟的梦想后，小猴和小兔各有什么反应？","ans":"知道小乌龟的梦想后，小猴子嘲笑小乌龟的动作那么慢，要爬到什么时候。小兔也摇摇头说山太高了，小乌龟是做不到的。","ctx":""},{"f":"open","q":"小乌龟遇到的第一个困难是什么 (1分)？它接着是怎么做的 (3分)？","ans":"小乌龟遇到的第一个困难是路上一块巨石让它过不去。它接着试着爬过去，可是石头太滑了，爬到一半，就滑了下来。它慢慢地绕过石头继续前进。","ctx":""},{"f":"open","q":"最后一段路小乌龟很累了，为什么它还是拼尽力气向上爬？","ans":"因为它看着不远处的山顶，想起了那只努力搬食物的小蚂蚁。它深吸一口气，用尽最后的力气，所以最后一段小路小乌龟很累了，它还是用尽力气向上爬。小蚂蚁告诉它如果现在停下，之前的努力就白费了。","ctx":""},{"f":"open","q":"你觉得小乌龟是个怎样的动物？从哪里可以看出？","ans":"我觉得小乌龟是个遇到困难不放弃的动物，小乌龟想要爬上山顶看美景，但它没有放弃，而是努力坚持下去，最后爬到山顶看到了美景。","ctx":""}]},{"id":"MB-G2","sub":"Chinese","title":"邻居的手电筒","text":"我刚搬进新家，跟周围的人都不太认识。每天下班回家，我总会看到邻居家的孩子在楼下玩耍。他们常常穿着破旧的校服，在空地上追跑打闹，笑声和吵闹声连楼上的邻居都能听得一清二楚。我皱了皱眉头，心里想：这么吵，也太不为别人着想了！衣服已经那么旧了，还在穿，不觉得难为情吗？我关上窗，告诉自己不要理他们。\n\n一天晚上，突然打雷，接着下起了大雨。不一会儿，整座组屋就停电了。房间里一下子变得黑暗。我有点害怕，立刻找出手电筒，这才安心多了。\n\n这时，门外突然传来敲门声，把我吓了一跳。打开门一看，原来是邻居的小孩。他慌慌张张地问道：“阿姨，您有手电筒吗？”我心想：果然是穷得连手电筒也买不起……“没有！”我不耐烦地摇摇头，急忙把门关上。“阿姨！阿姨！”男孩又开始敲门。我叹了一口气，用力地把门再次打开，并大喊：“去找别人借！”只见小男孩从口袋里拿出手电筒，递给我，说：“妈妈说您一个人住，怕您会害怕，叫我送手电筒来给您。”我顿时大吃一惊，脸也红了。“谢谢你！”我接过手电筒，感动地说，“阿姨刚才还以为……对……不起。”小男孩笑了笑，说：“没关系，我们是邻居！互相关心是应该的啊！”\n\n那晚，手电筒的光虽然很弱，却像太阳一样照亮了我的心。","qs":[{"f":"mcq","q":"一开始，作者对邻居家的孩子有什么看法？","o":["喜欢吵闹，衣服很旧。","有礼貌，会关心邻居。","很穷，喜欢向人借东西。","爱玩，邻居都不想理他们。"],"c":"喜欢吵闹，衣服很旧。"},{"f":"mcq","q":"什么事让作者感到害怕？","o":["突然听见敲门的声音。","找不到家里的手电筒。","打雷后整座组屋受了影响。","停电后的屋子里非常黑暗。"],"c":"停电后的屋子里非常黑暗。"},{"f":"mcq","q":"为什么作者急着把门关上？","o":["不太认识这个小男孩。","被小男孩吓了一大跳。","不想用小男孩家的手电筒。","认为小男孩是来借手电筒的。"],"c":"认为小男孩是来借手电筒的。"},{"f":"mcq","q":"听了小男孩的话，作者的脸为什么红了？","o":["她对小男孩说了一个谎。","她发现刚才的想法不对。","她不想把手电筒借给男孩。","她没想到小男孩很有礼貌。"],"c":"她发现刚才的想法不对。"},{"f":"mcq","q":"文中“像太阳一样照亮了我的心”说明了什么？","o":["作者希望太阳光照进屋子里。","手电筒可以照亮作者的屋子。","邻居的关心让作者感到温暖。","作者害怕停电的时候的感觉。"],"c":"邻居的关心让作者感到温暖。"}]},{"id":"MB-G5","sub":"Chinese","title":"新朋友","text":"小明七岁那年，父母要出国工作，就把小明从乡下送到住在城里的叔叔家住。刚开始，他好开心，觉得大城市里有宽阔的马路和高大的楼房，真好啊！接下来的几天，每当看到楼下的一群孩子玩得热闹时，小明也曾试着加入他们的队伍，可每一次他都会被周围的大人赶出去：“去，去，哪里来的脏孩子！”这让他心里酸酸的，感到闷闷不乐。\n\n一天下午，小明坐在门口，目不转睛地看着不远处一个小男孩和他的妈妈打羽毛球，他真想和他们一起玩呀！忽然，小孩子用力一挥球拍，球向小明飞了过来，最后落在了他的脚旁。小明很快伸出了手，但又马上收了回来。他怕之前的事情再次发生。“小朋友，帮阿姨捡一下羽毛球好吗？”那位阿姨望着他，大声说道。小明没说话，将球捡起来送到阿姨的手里。阿姨接过羽毛球后，说：“一起来玩好吗？”小明听了，一下子呆住了，接着，眼睛亮了起来，拼命地点头。阿姨将球拍交到他的手里，让他和小男孩一起打球。\n\n就这样，小明认识了王阿姨和她的儿子乐乐。很快，他就和乐乐成了好朋友，一有时间，他们就在一起玩。\n\n而对小明来说，最幸福的事情还是和王阿姨一起出去玩。出门在外，每当过马路的时候，王阿姨总是一只手拉着乐乐，另一只手拉着小明。一过了马路，乐乐就松开手，跑向前去。可小明却舍不得松手。王阿姨的手，让他感到十分温暖，让他的心里总是充满了被人关怀、疼爱的快乐。\n\n两年之后，小明的爸妈回国了，决定带着他重新回到乡下生活，小明只好依依不舍地告别了亲爱的乐乐与王阿姨。他的心里，充满了对王阿姨的感激，感谢她给了自己一只温暖的手。而在未来的日子里，他要做的就是将这份温暖传递下去。","qs":[{"f":"fill","q":"文中形容“注意力集中，专心地看着”的词语是 ___ 。","acc":["目不转睛"],"ans":"目不转睛"},{"f":"fill","q":"文中形容“舍不得分离”的词语是 ___ 。","acc":["依依不舍"],"ans":"依依不舍"},{"f":"open","q":"小明刚来到大城市和几天后，他心里的感受有什么变化 (2分)？为什么 (2分)？","ans":"小明刚开始很开心，觉得大城市有宽阔的马路和高大的楼房。接下来几天，每当他看到一群孩子们在楼下玩的热闹时，他想试着加入他们，可是都被周围的大人赶出去说他是脏孩子，让他心里酸酸的，感到闷闷不乐。","ctx":""},{"f":"open","q":"阿姨叫小明一起打球，小明有什么反应 (1分)？他当时有什么感受 (1分)？为什么 (2分)？","ans":"小明听了，一下子呆住了，接着，眼睛亮了起来，拼命地点头。他当时感到很开心，因为他很想打羽毛球，终于有朋友要和他一起玩了。","ctx":""},{"f":"open","q":"过马路后，乐乐跑向前，小明是怎么做的 (1分)？为什么 (2分)？","ans":"小明舍不得松手，因为王阿姨的手，让他感到十分温暖，让他的心里总是充满了被人关怀、疼爱的快乐。","ctx":""},{"f":"open","q":"王阿姨是个怎样的人 (1分)？从哪里可以看出 (2分)？","ans":"王阿姨是个心地善良的人。每当她带着小明和乐乐出门在外，过马路的时候，王阿姨总会一只手拉着乐乐，另一只手拉着小明，可以看出来。","ctx":""},{"f":"open","q":"你认为小明为什么要将这份温暖传递下去 (2分)？如果你是小明，你以后会怎样对待别人？请举例说明 (2分)。","ans":"因为是王阿姨给了他一只温暖的手，在他无助的时候唯有王阿姨不会看不起他，觉得他脏。小明很对王阿姨充满了感激。如果我是小明，我会把王阿姨给予我的爱传下去，例如帮助有需要的人让他们也感受到爱。","ctx":""}]},{"id":"NY-G2","sub":"Chinese","title":"诚实面对错误","text":"明文今年刚加入童子军，他一直希望能在大家面前证明自己的能力。有一回，童子军举办了一项捐钱活动，帮助学校里家庭困难的同学。明文觉得这是一个表现自己的好机会，想交出一份亮眼的成绩单。\n\n回到家后，他认真练习如何向别人介绍捐钱活动，父母被他的认真打动，捐出了钱。拿到第一笔钱后，明文便开开心心地去找邻居捐钱。\n\n然而，当明文按下王叔叔家的门铃时，王叔叔正要出门去工作，就不耐烦地对他摆了摆手，他只好失望地离开了。接着，他在小区里转了几圈，却始终不敢向邻居开口，因为他害怕又被拒绝。\n\n最终，明文闷闷不乐地回到家，看到信封里只有那么一点儿钱，心里很难受。他不想在大家面前丢脸，便从钱包取出一些零花钱塞进信封，并在卡片上写了好几个\"捐钱者\"的名字。\n\n第二天，当他把信封交给老师时，心里很不安。老师看出他很紧张，便把他带到一旁。明文结结巴巴地承认了错误。\n\n老师温和地说：\"明文，捐钱活动的意义不在于收到多少钱，而是让我们学会勇敢、关心他人、传递善意。但我很高兴你愿意承认错误。\"\n\n听了老师的话，明文心里一震，脸红着点点头。放学后，他决定重新尝试。这一次，他不再想着\"出风头\"，而是认真向邻居们说明活动的意义。\n\n后来，许多邻居都捐了钱。当明文再次把钱交给老师时，他放下了心中的大石……","qs":[{"f":"mcq","q":"童子军举办这次捐钱活动的目的是什么？","o":["给学生表现自己的机会。","让学生取得亮眼的成绩。","让学生帮助和关心他人。","使学生明白诚实的可贵。"],"c":"让学生帮助和关心他人。"},{"f":"mcq","q":"明文在小区转了几圈后，为什么没有向邻居开口？","o":["他觉得邻居都很忙。","他害怕邻居拒绝他。","他不想给邻居添麻烦。","他不愿意让邻居帮忙。"],"c":"他害怕邻居拒绝他。"},{"f":"mcq","q":"明文从小区回到家后，做了什么决定？","o":["他决定不再做任何努力。","他把自己的钱放进信封。","他将所有的钱都捐出去。","他勇敢向老师承认错误。"],"c":"他把自己的钱放进信封。"},{"f":"mcq","q":"明文在卡片上写上了几个\"捐钱者\"的名字，说明了什么？","o":["他想要证明自己是一个很有爱心的人。","他想要让这次的捐钱活动变得有意义。","他想要帮助邻居完成这次的捐钱任务。","他想要假装自己已经找到不少人捐钱。"],"c":"他想要假装自己已经找到不少人捐钱。"},{"f":"mcq","q":"这次的捐钱活动对明文有什么影响？","o":["他明白了只有捐钱才能够帮助有困难的家庭。","他感受到只要放下心中的大石才能取得成功。","他学会了诚实，并明白捐钱活动的真正意义。","他体会到邻居工作非常辛苦，不再\"出风头\"。"],"c":"他学会了诚实，并明白捐钱活动的真正意义。"}]},{"id":"RG-G2","sub":"Chinese","title":"打错的电话","text":"一天，我的手机响了，电话另一边传来了个小女孩的声音：\"爸爸，您快回来吧，我好想您！\"我知道她打错了，因为我没有女儿，只有一个五岁的儿子。我不耐烦地说：\"打错了！\"说完，我便放下电话。没想到小女孩很坚持，一直打电话来。\n\n这一天，电话又响起，电话里还是那个女孩的声音：\"爸爸，您能陪我说一说话吗？妈妈说您很忙，但我真的好想您。\"我听了，有点儿感动，觉得自己不能拒绝她的要求。我回答：\"好吧，你想聊什么？\"她问道：\"您能讲个故事给我听吗？\"我想了想，说：\"好。很久以前，有个小女孩，她是世界上最棒的公主……\"我像个父亲一样，温柔地和她聊天，还答应回家时带个布娃娃给她。\n\n就在我渐渐对这个打错的电话感兴趣时，电话里传来一位女士的声音：\"对不起，先生。小孩的爸爸在国外工作，我的女儿联系不到他。她常常一个人在家，我没想到她会打错电话给您……\"\n\n我放下电话后，心想：原来一个孩子需要的，只是简单的陪伴。我忽然想起自己的儿子，心里做了个决定。","qs":[{"f":"mcq","q":"一开始，小女孩打电话来时，作者有什么反应？","o":["温柔地对女孩说话，并安慰她。","答应女孩的要求，买个布娃娃。","觉得很有趣，想要和女孩聊天。","不耐烦地说话，然后放下电话。"],"c":"不耐烦地说话，然后放下电话。"},{"f":"mcq","q":"为什么女孩很坚持地一直打电话来？","o":["她喜欢打电话，想找人陪她聊天。","她一个人在家，想听别人讲故事。","她很想爸爸，希望可以和爸爸说话。","她想要个布娃娃，请求爸爸买给她。"],"c":"她很想爸爸，希望可以和爸爸说话。"},{"f":"mcq","q":"为什么作者会继续和女孩聊天？","o":["女孩对爸爸的想念让他感动。","女孩很喜欢听他讲童话故事。","他想知道女孩打错电话的原因。","他没有办法让女孩先放下电话。"],"c":"女孩对爸爸的想念让他感动。"},{"f":"mcq","q":"女孩打电话的真正原因是什么？","o":["要爸爸给她讲个故事。","要爸爸给她买布娃娃。","希望爸爸能回家陪她。","希望和爸爸一起去玩。"],"c":"希望爸爸能回家陪她。"},{"f":"mcq","q":"最后，作者做了什么决定？","o":["不再忙着工作，专心照顾女儿。","多花点时间，陪伴自己的儿子。","继续接女孩的电话，和她聊天。","和女孩保持联系，给她讲故事。"],"c":"多花点时间，陪伴自己的儿子。"}]},{"id":"RG-G5","sub":"Chinese","title":"善意的传递","text":"一天傍晚，我和父亲一起去公园散步。突然，一位阿姨向我们走来。她不好意思地说：\"先生，能借我两块钱搭巴士回家吗？我的钱包不见了，手机也没电了。\"\n\n这时，我想到电视上说过不能太相信陌生人。我正想把父亲拉走，却看见他已经拿出十块钱递给她。阿姨道谢后，便快步离去。\n\n过后，我忍不住问父亲：\"您忘记去年在地铁站被人骗的事吗？\"父亲解释道：\"去年我是遇到骗子借用手机，当时追不上他，所以才拿不回手机，可是我不能因为那件事而拒绝帮助这位阿姨。有时候，做善事不是要别人感谢我们，而是我们愿不愿意相信这个世界还有真正需要帮助的人。\"我听了，只是对父亲笑了笑。\n\n过了几天，我放学后去文具店买笔，却发现自己忘了带钱包。我站在收银台前，一下子呆住了。老板看出我心里在想什么，微笑着说：\"小朋友，没关系，你先把笔带回家吧，再找时间来付钱也行。\"我吃惊地抬起头，说：\"您真的相信我？\"老板点点头，说：\"每个人都会有需要别人帮忙的时候。\"\n\n那一刻，我似乎明白了什么。我接受了老板的建议，小心地接过笔，连声道谢。回家的路上，我想起那天在公园里发生的事，终于明白了：善心能让人与人之间的感情变得更好，也能让人心里感到更温暖。","qs":[{"f":"fill","q":"文中形容\"不能控制\"的词语是 ___ 。","acc":["忍不住"],"ans":"忍不住"},{"f":"fill","q":"文中形容\"好像\"的词语是 ___ 。","acc":["似乎"],"ans":"似乎"},{"f":"open","q":"阿姨为什么要向作者的父亲借钱？(2分)","ans":"因为阿姨的钱包不见了，手机也没电，她想搭巴士回家，所以阿姨向作者的父亲借钱。","ctx":""},{"f":"open","q":"听了阿姨的话，作者和父亲的反应有什么不同？为什么？(4分)","ans":"听了阿姨的话，作者想到电视上说过不能太相信陌生人，想把父亲拉走，因为他不要父亲被人骗，父亲却已经拿出十块钱递给她。因为父亲愿意相信这个世界还有真正需要帮助的人。","ctx":""},{"f":"open","q":"文中\"一下子呆住了\"这句话的意思是什么？(4分)","ans":"这句话的意思是当作者发现自己忘了带钱包，他站在收银台前，不知所措。","ctx":""},{"f":"open","q":"老板怎么帮助作者？(3分) 作者得到了老板的帮助后，有什么感受？(1分)","ans":"老板看出作者心里在想什么，微笑着说作者可以先把笔带回家，再找时间来付钱也行，作者听了后很感动。","ctx":""},{"f":"open","q":"你认为父亲是个怎样的人？试加以说明。(4分)","ans":"作者认为父亲是个善良的人。因为当一位阿姨问作者跟他的父亲可不可以借他两块钱搭巴士回家时，父亲立刻把一张十元的钞票给她了，他没有因为自己曾经被骗手机而拒绝帮助真正需要帮助的人。","ctx":""}]},{"id":"RS-G2","sub":"Chinese","title":"乔布斯的家规","text":"乔布斯和他的团队推出了世界上第一台苹果手机。很多人以为像他这样的大老板，他家里一定有很多电子用品。他的孩子也肯定每天都在使用手机或电脑。但事实却偏偏相反。\n\n有一次，有人问乔布斯：\"你的孩子是不是很喜欢平板电脑？\"他说：\"他们还没用过，我们不让孩子使用。\"这让很多人非常吃惊。\n\n其实，不只是乔布斯，大多数父母都很小心地控制孩子用手机或电脑的时间。有些父母规定，孩子每天放学回家后不能碰手机或电脑，周末也只能玩一会儿。有些父母则要求孩子只能使用手机或电脑进行学习活动。\n\n这是因为大多数父母很清楚手机和电脑虽然方便，但如果用得太多，会因此迷上手机或电脑游戏，不爱读书，也不爱运动，变得不愿意和别人说话。他们希望孩子多看书，多动脑或者经常参加户外活动，保持身体健康。\n\n不过，也有人觉得，如果禁止孩子用手机和电脑，反而会让孩子更好奇、更想去偷偷使用。比如有的父母不让孩子出去和朋友玩耍，结果孩子长大后常常往外跑，很少待在家里。这说明，有时候过度禁止也可能产生反作用。\n\n在乔布斯的家里，晚餐时间就是全家人一起聊天的时刻，谁也不会拿出手机或平板电脑。他的孩子也并没有因此感到不快乐，反而喜爱阅读和运动，生活得非常充实。","qs":[{"f":"mcq","q":"为什么很多人听了乔布斯的话会非常吃惊？","o":["因为他的家里有很多电子用品。","因为他的孩子不喜欢平板电脑。","因为他不让孩子使用平板电脑。","因为他的孩子每天用电子用品。"],"c":"因为他不让孩子使用平板电脑。"},{"f":"mcq","q":"孩子用手机或电脑，大多数父母是怎么做的？","o":["毫不在意","无能为力","小心控制","鼓励使用"],"c":"小心控制"},{"f":"mcq","q":"以下哪一个不是父母要孩子少用手机和电脑的原因？","o":["孩子有可能会上瘾。","孩子每天都在使用。","影响孩子的身体健康。","孩子会变得不爱说话。"],"c":"孩子每天都在使用。"},{"f":"mcq","q":"为什么有人觉得禁止孩子用手机和电脑是不好的？","o":["因为会让孩子长大常常往外跑。","因为孩子可能会变得不爱读书。","因为孩子应该和朋友一起玩耍。","因为过度禁止可能产生反作用。"],"c":"因为过度禁止可能产生反作用。"},{"f":"mcq","q":"这篇文章最主要想告诉我们什么？","o":["使用手机和电脑会有危险。","孩子不需要用手机和电脑。","父母不应该买手机和电脑。","应该合理使用手机和电脑。"],"c":"应该合理使用手机和电脑。"}]},{"id":"RS-G5","sub":"Chinese","title":"藏起来的功课","text":"\"伟明，你在发什么呆？功课做完了吗？\"妈妈一边在厨房里炒菜，一边说道。伟明觉得做功课很浪费时间。妈妈的问题让他感到非常不耐烦。\"功课，功课！每天都有做不完的功课！今天做完了，老师明天又会再给。我什么时候才可以看电视、玩手机？\"伟明生气地说道。\n\n伟明整天只想着要看电视和玩手机游戏，功课都做得十分马虎。他常常不是忘了几道题没做，就是把字写错。有时候，他在数学作业里会少写数字，答案也常常算错。有一次还把\"天\"字写成\"大\"字。老师和父母都劝他要认真学习，可是伟明并不同意他们说的话。他觉得只要自己在考试时细心点就行了。平时不用把功课看得那么认真，再多错误也没关系。\n\n这天是星期五，老师给了不少功课。伟明一边收拾书包，一边皱着眉头，心想：\"这么多功课，我的周末不是又没了吗？我又不能看电视和玩手机了！\"这时，一个坏主意突然浮现在他的脑海里。他悄悄把功课放到桌子底下，然后当作老师没给功课似的走回家。\n\n接下来的日子，伟明每天不带功课回家做。老师给的功课他也做得不认真，常常被老师批评做事不负责任。\n\n很快，要考试了。伟明在考试前一天才开始复习，结果考试当天很多题不会做，考试成绩不及格。看到其他同学都开心地看着自己的成绩，伟明感到很后悔，伤心地哭了起来。回到家后，妈妈对他说：\"学习靠的是平时的努力，不是到最后一分钟才用功。\"听了妈妈的话后，伟明用力地点了点头，说：\"我以后一定会认真做好每一次功课，细心完成每一道题。\"\n\n从此以后，伟明对功课有了新的看法。妈妈看到伟明的改变，成绩也进步了，露出了满意的笑容。","qs":[{"f":"fill","q":"文中形容\"不惊动人或不让别人知道\"的词语是 ___ 。","acc":["悄悄"],"ans":"悄悄"},{"f":"fill","q":"文中形容\"事情过后感到自责，心里不舒服\"的词语是 ___ 。","acc":["后悔"],"ans":"后悔"},{"f":"open","q":"伟明为什么不喜欢做功课？(3分)","ans":"伟明觉得做功课很浪费时间。他认为每天都有做不完的功课，今天做完了，老师明天又会再给，他就不可以（没有时间）看电视和玩手机。","ctx":""},{"f":"open","q":"从哪里可以看出伟明对待功课不认真？(3分)","ans":"他常常不是忘了几道题没做，就是把字写错。有时候，他在数学作业里会少写数字，答案也常常算错。有一次还把\"天\"字写成\"大\"字。","ctx":""},{"f":"open","q":"文中的\"坏主意\"指的是什么？(1分)伟明为什么要这样做？(3分)","ans":"这指的是伟明把功课放到桌子底下，当作老师没给功课似的走回家。因为那天是星期五，老师给了很多功课，伟明不想做功课，伟明觉得（认为）如果他把功课带回家，他的周末就会用来完成功课，不能看电视和玩手机。","ctx":""},{"f":"open","q":"听了妈妈的话后，伟明对功课的看法和以前有什么不同？(4分)","ans":"他以前觉得只要自己在考试时细心一点就行了，平时不用认真对待功课，再多错误也没关系。听了妈妈的话后，他认为学习靠的是平时努力，不是到最后一分钟才用功。只要认真做好每一次功课，细心完成每一道题，成绩就会进步。","ctx":""},{"f":"open","q":"你认为妈妈最后为什么露出满意的笑容？(4分)","ans":"因为伟明听了妈妈的话后，做出了改变／改过自新（行为），成绩也进步了（结果），妈妈感到开心（感受）。","ctx":""}]},{"id":"RO-G2","sub":"Chinese","title":"老人的善心","text":"从前，有一个年轻人很自私，他的心中只有他自己。当别人遇到困难时，他也不会去帮助他们。\n\n有一次，他自己一个人去爬山。爬了一个小时，他走不动了，便在半路上休息。突然，一条蛇爬了出来，咬了他一口。他躺在路旁，整个人看起来很辛苦。他心想：我平时不肯帮助别人。这次应该也不会有人来帮我。我该怎么回家？\n\n不知过了多久，年轻人醒来了。他发现自己没死。他睡在一间又破又旧的屋子里，一个老人捧着一碗菜汤站在他面前，对他说：\"吃点东西吧，身体才好得快。以后爬山要小心哦！\"\n\n原来是老人发现年轻人倒在路旁。他叫了年轻人好多次，但是年轻人一直紧紧地闭着眼睛。老人担心年轻人会有危险，便把他背回家。到家后，老人还替他在受伤的地方上涂药。年轻人很感谢老人，就拿出一些钱给老人，想谢谢老人救了他的命。\n\n老人拒绝收下年轻人的钱，并对年轻人说：\"我不是为了钱而救你的。\"但是，年轻人坚持要老人把钱收下，老人说：\"如果你想向我表示感谢，就把这些钱送给更需要它的人，这就是给我最好的礼物了。\"听了老人的话，年轻人点了点头。年轻人一想到以前的自己，脸就红了起来。\n\n后来，年轻人把那些钱捐给了穷人。从此，年轻人积极帮助别人，做了很多好事。","qs":[{"f":"mcq","q":"为什么年轻人躺在路旁？","o":["他忘了回家的路。","他不要别人帮忙。","他等着老人出现。","他被一条蛇咬伤。"],"c":"他被一条蛇咬伤。"},{"f":"mcq","q":"以下哪一个不是老人把年轻人背回家的原因？","o":["老人在半路叫不醒年轻人。","老人发现年轻人倒在路旁。","老人想请年轻人喝他煮的菜汤。","老人担心年轻人在山上有危险。"],"c":"老人想请年轻人喝他煮的菜汤。"},{"f":"mcq","q":"老人认为年轻人给他最好的礼物是什么？","o":["年轻人把所有的钱都给老人。","年轻人紧闭着的眼睛睁开了。","年轻人把钱捐给有需要的人。","年轻人懂得向老人表示感谢。"],"c":"年轻人把钱捐给有需要的人。"},{"f":"mcq","q":"年轻人想到以前的自己，他感到 ___ 。","o":["痛苦","惭愧","烦恼","后悔"],"c":"惭愧"},{"f":"mcq","q":"后来，年轻人变成一个怎样的人？","o":["乐于助人","积极努力","坚持到底","注意安全"],"c":"乐于助人"}]},{"id":"RO-G5","sub":"Chinese","title":"拆穿谎言的考题","text":"一天早上，我在上学的路上遇到小安和家明。看到他们手里拿着游戏机，我和他们玩了起来。结果，我们三人玩得很入迷，忘了时间。等我们跑到学校才发现已经迟到了一个小时，林老师安排的考试已经快结束了。\n\n\"对不起，林老师，\"我站在教室门口说道，\"我们不是故意迟到的，我们的巴士在路上出了问题，所以上学迟到了。\"说完后，我朝身旁的两个同学眨了眨眼。小安明白我的意思，立刻说：\"对啊！对啊！当时只听见'碰'的一声，巴士就停了下来不会动了！\"家明紧接着说：\"我们等了好久才等到下一辆巴士，我们已经尽快赶来学校了。\"\n\n林老师听了，微笑着点点头，叫我们不用担心。接着，他让我们坐在教室的三个不同角落，给我们再一次考试的机会。我很高兴，心想：我们就这样混了过去，老师太好骗了！然而，考题一出，我一下子傻了———\n\n\"巴士在哪条道路上出了问题？\"我心想：怎么会有这样的题目？老师是不是怀疑我们说谎？我转过头，想偷偷跟小安和家明讨论答案，没想到老师却直盯着我看。如果我们三个人的答案不一样就惨了！我的额头直冒汗，握笔的手一直抖着，迟迟写不下答案。\n\n那是一道我永远都无法忘记的考题，它虽然简单，但我却得了零分！老师用一道很简单的考题，让我明白了一个重要的道理。","qs":[{"f":"fill","q":"文中表示\"停止进行，不再继续\"的词语是：___ 。","acc":["结束"],"ans":"结束"},{"f":"fill","q":"文中表示\"不太相信\"的词语是：___ 。","acc":["怀疑"],"ans":"怀疑"},{"f":"open","q":"什么事情让\"我\"上学迟到了？(3分)","ans":"\"我\"在上学的路上跟小安和家明一起玩游戏，玩得入迷了，忘了时间。","ctx":""},{"f":"open","q":"\"我们\"怎样骗老师说\"我们\"不是故意迟到的？(3分)","ans":"\"我们\"说巴士在路口出了问题，当时只听见\"碰\"的一声，巴士就停了下来不会动了。\"我们\"等了很久才等到下一辆巴士，已经尽快赶来学校了。","ctx":""},{"f":"open","q":"林老师听了\"我们\"迟到的解释后，有什么反应？(2分) 他后来怎么做？(2分)","ans":"林老师听了，微笑着点点头，叫\"我们\"不用担心。他让\"我们\"坐在教室的三个不同角落，给\"我们\"再一次考试的机会。","ctx":""},{"f":"open","q":"看到考题之前和看到考题之后，\"我\"的心情有什么不同？(2分) 为什么\"我\"的心情会有不同？(2分)","ans":"看到考题之前，\"我\"很高兴。因为\"我们\"就这样混了过去，\"我\"认为老师太好骗了。看到考题之后，我很惊讶。因为\"我\"没有想到会有这样的问题，心想老师可能怀疑\"我们\"说谎。","ctx":""},{"f":"open","q":"为什么\"我\"认为那一道考题非常难忘？(4分)","ans":"因为那道考题虽然简单，但是\"我\"却得了零分。那道题让\"我\"明白了做人要诚实。","ctx":""}]},{"id":"TN-HC-G3","sub":"Higher Chinese","title":"老婆婆过马路","text":"一个早晨，我匆匆向巴士车站赶去，担心着上课会迟到。突然，天空乌云密布，大雨倾盆而下。我急忙撑起伞，加快了脚步，心想：如果十分钟内还没到学校，肯定会被老师批评的。\n\n这时，一只瘦弱冰冷的手抓住了我。我转身一看，竟是一位全身湿透的老婆婆。她手里提着沉重的购物袋，声音微弱地请求我：“小朋友，你可以扶我过马路吗？”我正想答应，脑海中却浮现出老师生气的样子，便放开她的手，向前跑去。\n\n到了巴士车站，我默默回头，只见老婆婆无助地站在路边，整个人像只落汤鸡。眼前的情景让我感到不安：老师和父母常教我们要乐于助人，我怎能忍心不理她呢？\n\n就在这时，“砰”的一声，老婆婆突然跌倒了。她吃力地站起来，伸手想捡起洒落一地的东西。此刻，我不顾一切，冲上去扶起她。我内心充满了后悔和自责，担心她受伤。老婆婆却只是对我微微一笑，说：“谢谢你，小朋友。麻烦你了！”\n\n我撑着伞，在雨中扶着老婆婆过了马路。与她道别后，我立刻赶往巴士车站。这时，我已经迟到了，但我却不后悔。我决心在未来的日子里，无论多忙都要记得停下脚步，去帮助那些需要帮助的人。因为善良和关怀，是我们面对生活风雨最好的力量。","qs":[{"f":"fill","q":"从短文中找出与下列画线词语意思相近或相同的词语：小文向哥哥借故事书，哥哥立刻__同意__了。","acc":["答应"],"ans":"答应"},{"f":"fill","q":"从短文中找出与下列画线词语意思相近或相同的词语：弟弟向妈妈保证，__以后__再也不会犯同样的错误了。","acc":["未来"],"ans":"未来"},{"f":"open","q":"老婆婆请求作者帮忙时，作者的做法是什么？原因是什么？（试比较老婆婆两次需要帮助时，作者前后不同的做法。）","ans":"作者的做法：放开她的手，向前跑去。原因：担心/怕/不想迟到，被老师批评/骂/脑海中浮现出老师生气的样子。","ctx":""},{"f":"open","q":"老婆婆跌倒时，作者的做法是什么？原因是什么？","ans":"作者的做法：冲上去扶起她。原因：（内心）充满/感到后悔和自责，担心/怕她受伤。","ctx":""},{"f":"open","q":"文中\"眼前的情景\"指的是什么？（2分）为什么它会让作者感到不安？（2分）","ans":"文中\"眼前的情景\"指的是老婆婆无助地站在路边，整个人像只落汤鸡/湿透了。作者想起老师和父母常教他（们）要乐于助人，不应该不理老婆婆/但是他没有去帮助老婆婆。","ctx":""},{"f":"open","q":"试从以下的两个选项中，选一个最适合作为这篇短文的题目。这两个选项只有一个是适当的，请为正确的答案打钩（✓），并从短文中找出支持你的答案的理由。","ans":"(2) 《我不后悔做了这个决定》 ✓\n【起因】作者担心迟到，而没有扶老婆婆过马路。【经过】但他看见老婆婆跌倒了，想到老师和父母教导她要乐于助人，便扶起老婆婆。【结果】他虽然迟到了，但他从这件事明白自己无论多忙，都要去帮助有需要帮助的人。","ctx":"(1) 《一件令我自责的事》　(2) 《我不后悔做了这个决定》"}]},{"id":"TN-HC-G4","sub":"Higher Chinese","title":"半截尺子","text":"去年年终考试前，老师再三提醒同学们要带齐考试用品：“笔、尺子、橡皮，一个都不能少！”“真唠叨！这么简单的事情怎么会忘记？”丽文不耐烦地想，并没有把老师的话放在心上。\n\n考试当天，到了课室，丽文才发现自己竟然忘了带文具盒。她不知如何是好，额头冒出了冷汗。周围的同学已经开始准备文具了。丽文听到他们的嘲笑声“看，她又没有记住老师交代的事情”、“这次考试她惨了”。\n\n坐在丽文前面的小红快速地翻找自己的文具盒，然后拿出备用的笔和橡皮递给丽文。\n\n“同学们，准备好了吗？考试马上就要开始了。”听了老师的话，丽文急得眼泪都快掉下来了。她自言自语道：“还少了一把尺，怎么办？”小红看了看自己文具盒里唯一的一把尺，皱了一下眉，然后抓起它，折成了两半。“这个给你用，这样我们都能用了。”说着，她把半截尺子递给丽文。丽文看着手中的尺子，心里暖暖的。\n\n考试结束后，丽文特意去文具店买了一把一模一样的尺子要还给小红。没想到小红笑着摇摇头：“你自己留着用吧！我家里还有尺。”丽文听了，心里微微一震。\n\n真正的朋友在你遇到困难时，会主动帮助你，并不要求回报。丽文会永远记住这件事，珍惜这份友情。","qs":[{"f":"open","q":"试解释下面短语在文中的意思：额头冒出了冷汗（第二段）","ans":"丽文在考试时，忘记带文具盒，感到很紧张/不安/担心/害怕/着急/很急/慌张/惊慌失措。","ctx":""},{"f":"open","q":"试解释下面短语在文中的意思：心里暖暖的（第四段）","ans":"丽文看到小红把尺子折成两半，把半截尺子递给她，心里很感动。","ctx":""},{"f":"open","q":"丽文对老师的提醒有什么看法？","ans":"丽文认为/觉得/心想老师真唠叨，带文具那么简单的事，不可能会忘记。","ctx":""},{"f":"open","q":"发现丽文忘记带文具时，其他同学和小红的反应有什么不同？","ans":"其他同学嘲笑丽文又没记住老师交代的事，这次考试她惨了。小红快速地翻找自己的文具盒，然后拿出备用的笔和橡皮递给丽文。","ctx":""},{"f":"open","q":"请用不超过18个字，写出短文中第五段的段落大意。","ans":"小红不接受丽文买的尺，丽文觉得很感动。","ctx":""},{"f":"open","q":"小红怎么解决丽文没有尺子的问题？（1分）她一开始就决定用这个方法来解决问题吗？从哪里可以看出？（3分）","ans":"小红把自己唯一的一把尺折成两半，然后把半截尺子递给丽文。她一开始不想/没有决定用这个方法解决问题，从哪里可以看出：小红看了看自己文具盒里唯一的一把尺，皱了一下眉。","ctx":""},{"f":"open","q":"你从这篇短文中学到了什么道理？（2分）试举一个例子说明你如何把这个道理应用在生活中。（3分）","ans":"（示例答案，学生可自由发挥，只要贴题即可）我学到了在朋友遇到困难时，要主动帮助他，并不要求回报。有一次，我的朋友小文忘了带钱包，我主动请他吃饭，隔天他想请我吃汉堡，但我拒绝了，还说帮助朋友是应该的。","ctx":""}]},{"id":"SH-HC-G3","sub":"Higher Chinese","title":"迟来的责任感","text":"一年一度的学校艺术节到来了！同学们得根据课本的故事，上台表演。老师把全班分成五人一组，小丽和明华在同一组。小丽鼓励大家：“只要用心准备，我们就能呈现最精彩的表演！”明华却不把这次活动放在心上，说：“小菜一碟！这么简单的故事，我看一遍就会了。”\n\n接下来的几天，小丽每天一早就来排练，还带着组员们练台词。她提醒大家什么时候上场、应该怎么演，连动作和表情也细心指导。她觉得每个组员都会影响表演的成功，只有大家对小组负责，才能把这场戏演好。可明华觉得她唠叨，总是笑着说：“我不用练也能在当天演得很棒。”排练时他东张西望，常说错台词。小丽见了，有些着急，但还是耐心地劝他说：“大家都要认真准备，表演才会成功。”明华只是笑了笑，依然不当一回事。\n\n表演那天，小丽穿好戏服，在后台默记台词，认真练习。明华匆匆赶来，戏服还穿反了。他拿着课本，只随便翻了两页。\n\n上台后，小丽演得非常精彩，赢得观众热烈的掌声。听见掌声，小丽心里充满了自豪，她知道这是她努力练习的成果。\n\n轮到明华时，他突然忘了台词，急得满头大汗。小丽赶紧悄悄提醒，他才接了下去，可后面还是出现了好几处错误。台下的观众不禁露出失望的神情。\n\n下台后，明华低着头，鼓起勇气说：“对不起，我太不负责任了，早知道就该好好练了……”小丽终于忍不住，瞪着明华，指责道：“如果你早点对团队负责，我们也不会落到如此下场。表演已经结束，再也没有下次了！”明华听了，顿时沉默了下来，眼里闪过一丝后悔。","qs":[{"f":"fill","q":"从短文中找出与下列画线词语意思相近或相同的词语：虽然他的成绩很好，但他__还是__努力追求更好。","acc":["依然"],"ans":"依然"},{"f":"fill","q":"从短文中找出与下列画线词语意思相近或相同的词语：看到孩子得到比赛的冠军，爸爸妈妈都感到很__骄傲__。","acc":["自豪"],"ans":"自豪"},{"f":"open","q":"试比较观众对小丽和明华表演的反应，并说明原因：观众对小丽的表演有什么反应？原因是什么？","ans":"观众的反应：感到满意，报以热烈的掌声。原因：小丽演得非常精彩（这是她努力练习的成果）。","ctx":""},{"f":"open","q":"试比较观众对小丽和明华表演的反应，并说明原因：观众对明华的表演有什么反应？原因是什么？","ans":"观众的反应：感到失望，露出失望的神情。原因：明华突然忘词，表演中出现了好几处错误。","ctx":""},{"f":"open","q":"小丽有没有接受明华的道歉？（1分）为什么？（3分）","ans":"没有接受。因为明华之前排练时态度不认真，没有为表演做好准备，影响了整体的表演，明华这种不负责任的行为让小丽感到很生气，所以她还不能接受明华的道歉。","ctx":""},{"f":"open","q":"试从所提供的两个选项中，选一个最适合的作为这篇短文的题目，并举例说明做出这个选择的理由。","ans":"(2) 迟来的责任感。起因：小丽和明华被分到同一组表演。经过：明华排练时很不认真，虽然小丽劝他要认真练习，但他依然不当一回事。结果：表演时，明华在台上忘词，这才让他明白到应该对团队负责。","ctx":"(1) 一场成功的表演\n(2) 迟来的责任感"}]},{"id":"SH-HC-G4","sub":"Higher Chinese","title":"山间雨伞","text":"去年，我陪妈妈去爬山。\n\n刚出发不久，就下起了小雨。这下惨了！我们赶紧走到树下避雨。妈妈突然指着草丛对我说：“你看，那是什么？”\n\n我顺着她指的方向望去，没想到竟然会在这山区发现一把红色的雨伞躺在草丛中！\n\n我走过去撑开伞一看，“还是一把新雨伞呢！”我惊喜地说。妈妈说：“幸好有这把伞。”我们继续前行。\n\n下山时，雨才停住。我心想：这一路上拿把雨伞多不方便呀，便随手把雨伞扔进垃圾桶。妈妈见了，命令道：“你快去把雨伞拿回来！”\n\n我心里有些不高兴：“这把雨伞本来就不是我们的，拿去游客中心又不方便，扔掉算了。”\n\n妈妈没理睬我，自己拿过雨伞：“你带纸了吗？”\n\n我不解地摇摇头。\n\n“你的名片呢？给我一张。”\n\n我取出一张名片递给她。妈妈写了些东西后，便说：“你把名片夹在伞里面，再把这把伞立在那棵树旁。经过的人多，容易注意到。”\n\n我照她的话去做了。名片背面的留言是：“你用过这把伞后，请把它放在容易被看到的地方，让它继续传递温暖。”\n\n几天前，我收到了一张明信片。明信片上没有寄信人的地址，也没有写上名字。\n\n明信片写着几行字：“亲爱的陌生朋友，您留在路边的那把红色雨伞，让我们感受到了世间的温暖与真爱。永远祝福你！”\n\n看到这段话，我心里暖暖的。","qs":[{"f":"open","q":"试解释短语“这下惨了”（第二段）在文中的意思。","ans":"当时下起了小雨，作者和妈妈没带伞，他担心会被雨淋湿。","ctx":""},{"f":"open","q":"试解释短语“让它继续传递温暖”（第十一段）在文中的意思。","ans":"用过这把伞的人将伞传给下一个人，让下一个人感受到关爱。","ctx":""},{"f":"open","q":"为什么作者看到雨伞时会感到意外？","ans":"因为作者没想到会在山上（这山区）发现一把新的雨伞。","ctx":""},{"f":"open","q":"下山后，作者和妈妈分别觉得应该怎么处理那把伞？为什么他们这么认为？","ans":"作者认为伞用完后可以扔掉，因为他觉得伞不是他们的，拿去游客中心又不方便。妈妈认为应该把伞放在容易被看到的地方，并在名片上留言，因为妈妈认为伞可以帮助其他人。","ctx":""},{"f":"open","q":"请用不超过15个字，写出短文中第五段的段落大意。","ans":"雨停后，“我”扔了伞，妈妈命令“我”取回。","ctx":""},{"f":"open","q":"作者收到来自谁的明信片？（1分）看到明信片上的留言，为什么会让他心里暖暖的？（3分）","ans":"作者收到的明信片来自使用过雨伞的人。因为作者发现妈妈留下的雨伞真的帮助到了别人，而且这个人特意写明信片表达祝福，让作者觉得很感动。","ctx":""},{"f":"open","q":"这篇短文告诉了我们什么道理？（2分）试举生活中的例子加以说明。（3分）","ans":"这篇短文告诉我们，我们获得了帮助后应该帮助别人。（举例仅供参考）有一次，我忘了带笔，朋友借我笔用。之后，我看到其他同学没带笔时，想到别人曾经帮助过我，也将自己的笔借给他用。","ctx":""}]},{"id":"TN-G2","sub":"Chinese","title":"乐乐的孝心","text":"小猴子乐乐和它的家人住在森林里。乐乐很好动，喜欢在树上跳来跳去。一有时间，它就会约朋友们到处去玩耍。猴妈妈年纪大了，动作不像以前那么快，但她还是会每天去找最甜的果子给乐乐吃。\n\n一天，森林里刮起了大风，许多树木被吹倒了。猴妈妈摘果子时，不小心摔伤了脚，走不动了。乐乐知道后，心里很难过，决定要为妈妈做点什么。\n\n为了让妈妈有充足的休息，乐乐开始每天早起，独自去树林深处找又大又甜的果子带回家。此外，它也开始学做家务，把家里收拾得整整齐齐，希望让妈妈安心休养。\n\n一天，乐乐出门时，正好遇见小鹿来约它去河边玩，但是乐乐拒绝了。小鹿好奇地问：“乐乐，你最近怎么都不和我们一起玩耍了？”\n\n乐乐停下脚步，解释道：“我妈妈的脚受伤了，我得照顾她。”小鹿听了，说：“乐乐，你真有孝心啊！”这时，在一旁休息的猴妈妈听见了，脸上露出了笑容。\n\n在乐乐细心的照顾下，猴妈妈的脚渐渐好了。她看着懂事的孩子，心里既开心又感动，说：“乐乐，你长大了，我为你感到自豪！”\n\n乐乐明白了：真正的爱，不只是说出来。他学会了用行动去关爱家人。","qs":[{"f":"mcq","q":"猴妈妈是怎么受伤的？","o":["她在树上跳来跳去。","她摘果子时弄伤了脚。","她被大风吹倒摔在地上。","她不小心在河边跌倒了。"],"c":"她摘果子时弄伤了脚。"},{"f":"mcq","q":"知道妈妈受伤后，乐乐决定怎么做？","o":["拒绝小鹿来家里玩。","让自己有充足的休息。","学习做家务和找食物。","和朋友们一起出去玩耍。"],"c":"学习做家务和找食物。"},{"f":"mcq","q":"小鹿知道了乐乐的情况后，有什么反应？","o":["觉得很好奇。","夸乐乐有孝心。","脸上露出了笑容。","约乐乐去森林里玩。"],"c":"夸乐乐有孝心。"},{"f":"mcq","q":"猴妈妈既开心又感动的原因是","o":["乐乐变得懂事了。","乐乐为她感到自豪。","小鹿把家收拾得很整齐。","小鹿要她在家里安心休养。"],"c":"乐乐变得懂事了。"},{"f":"mcq","q":"这个故事告诉我们什么道理？","o":["要学会分工合作。","出门时要注意安全。","要通过行动关爱家人。","朋友之间要互相尊重。"],"c":"要通过行动关爱家人。"}]},{"id":"TN-G5","sub":"Chinese","title":"荧光笔风波","text":"伟明和小华是同班同学，也是好朋友。他们经常讨论功课，还一起参加课外活动。可是，最近他们却为了一件小事而闹得不愉快。\n\n一天，在数学课上，小华发现新买的荧光笔不见了，那可是他求了很久，爸爸才给他买的。要是爸爸知道荧光笔被弄丢了，一定会很生气。\n\n正当他急得团团转时，突然发现伟明手里握着一支同样的荧光笔。小华气得脸色通红，心想：伟明之前向我借荧光笔，我不愿意。现在他竟然没有得到我的同意就拿走，真是太过分了！\n\n下课后，小华怒气冲冲地找到伟明，大声喊道：“小偷！你还不把笔还给我？”伟明听了，大吃一惊，连忙解释说：“这这不是你的笔，是我昨天刚买的。”小华不相信，一把抢过荧光笔，转身就走。伟明呆住了，一时不知如何是好。\n\n不一会儿，级任老师走进课室，来到了小华身边，说：“小华，昨天你把这支笔留在了电脑室。我当时要叫你回来，但是你已经跑远了。你以后要好好保管自己的东西。”说完，老师把手中的荧光笔递给小华。\n\n小华低头看看手中从伟明那儿抢来的笔，又看看老师刚交还给他的那支，顿时恍然大悟。望着一脸伤心的伟明，他感到十分惭愧，默默地做了一个决定。\n\n放学后，小华马上去找伟明，真诚地对他说：“对不起，是我一时粗心，又太冲动，没弄清楚就怪你偷了我的笔。”伟明听了，说：“我早上是真的有点生气，但你肯承认错误，我们就忘了这件事吧！”\n\n从那天起，小华和伟明更加珍惜彼此之间的友情了。","qs":[{"f":"fill","q":"文中形容“表示出乎意料”的词语是：___ 。","acc":["竟然"],"ans":"竟然"},{"f":"fill","q":"文中形容“因对不起别人而内心不安”的词语是：___ 。","acc":["惭愧"],"ans":"惭愧"},{"f":"open","q":"为什么小华发现荧光笔不见了后感到很着急？","ans":"荧光笔是新买的，也是他求了很久，爸爸才给他买的。要是爸爸知道荧光笔被弄丢了，一定会很生气。","ctx":""},{"f":"open","q":"当小华看到伟明握着一支同样的荧光笔时，他有什么反应？","ans":"小华气得脸色通红，想到伟明之前向他借荧光笔，他不愿意。现在伟明竟然没有得到他的同意就拿走荧光笔，这样做太过分了。","ctx":""},{"f":"open","q":"伟明有没有拿小华的荧光笔？从哪里可以看出？","ans":"伟明没有拿走小华的荧光笔。伟明说荧光笔是自己买的。班主任老师告诉小华他昨天把荧光笔留在电脑室，然后把荧光笔递给小华。","ctx":""},{"f":"open","q":"文中的小华“默默地做了一个决定”指的是什么？他为什么会做出这个决定？","ans":"它指的是小华要向伟明道歉，承认自己的错误。小华看到伟明一脸伤心，感到很惭愧，觉得是自己太过冲动，没弄清楚就怪伟明偷了他的笔。","ctx":""},{"f":"open","q":"如果你是伟明，你会继续跟小华做朋友吗？为什么？","ans":"如果我是伟明，我会继续跟小华做朋友。小华只是一时冲动，错怪我偷了他的荧光笔，但是他已经向我道歉，并承认了错误。每个人都会犯错，只要知错能改，就值得被原谅。我们是好朋友，友谊比一时的误会更重要，我们不应该为了一件小事而闹得不愉快。","ctx":""}]},{"id":"RL-G2","sub":"Chinese","title":"孔子教学生","text":"孔子是古时候有名的老师，他会根据每个学生的特点，用不同的方法教学生。\n\n有一天，有一个叫子路的学生走到孔子面前，问道：“老师，如果要做好事，比如帮助别人，我是不是应该马上去做，不必多想？”孔子看着子路，点点头说：“当然要马上去做。一个人如果总是思前想后，机会就会溜走。你要立刻行动！”子路听了，眼睛一亮，点了点头。\n\n没过多久，另一个叫然由的学生也来问孔子同样的问题：“老师，如果我要做一件好事，是不是应该马上去做？”孔子却摇摇头，说：“你应该先想一想，确保自己不会后悔再去做。”然由听了，认真地点了点头。\n\n孔子身旁的学生好奇地问：“老师，子路和然由问的明明是同一个问题，为什么您的回答不一样呢？”\n\n孔子笑了笑，说：“因为子路做事总是拿不定主意，所以我要鼓励他；然由总是没有想清楚就去做事，所以我要提醒他先想再做。教不同的学生要用不同的方法，这样他们才能各自进步。”学生听了，恍然大悟。","qs":[{"f":"mcq","q":"子路问孔子什么问题？","o":["应不应该马上帮助别人","怎样才能不让机会溜走","如何才能一直被人称赞","怎样确保自己不会后悔"],"c":"应不应该马上帮助别人"},{"f":"mcq","q":"文中的子路是一个 ___ 的人","o":["很胆小怕事","拿不定主意","喜欢问问题","要求很严格"],"c":"拿不定主意"},{"f":"mcq","q":"孔子让然由怎么做？","o":["马上去做","想想再做","让别人做","不要去做"],"c":"想想再做"},{"f":"mcq","q":"为什么孔子对两个学生的问题回答不一样？","o":["因为他想考一考学生","因为两个问题不一样","因为学生的特点不同","因为他记不清楚答案"],"c":"因为学生的特点不同"},{"f":"mcq","q":"这个故事主要说明了什么道理？","o":["要学会分工合作","学生要听老师的话","提问之前要先思考","根据特点来教学生"],"c":"根据特点来教学生"}]},{"id":"RL-G5","sub":"Chinese","title":"错怪好友","text":"一天上午，我正准备写作业，忽然发现自己最喜欢的笔不见了。我把书包翻了个遍，还是找不到。\n\n这时，我无意间看见同桌小丽的书包口袋里露出了一支和我的一样的笔。小丽曾经说过我的笔既漂亮又好用，一定是她偷偷拿了我的笔！想到这里，一股怒气冲上了我的脑袋。可是，小丽是我最好的朋友，我们总是互相分享彼此喜欢的东西，她怎么会偷我的笔呢？真的是她偷的吗？我不敢去问小丽。\n\n接下来的华文课上，我闷闷不乐，眼睛盯着白板，老师说的话一句也听不进去。小丽悄悄地碰了碰我，小声地问：“你怎么了？身体不舒服吗？”我冷冷地看了她一眼，完全不想理睬她。\n\n下课前，老师把改好的本子发给我们。我一翻开就呆住了——我的笔竟然在作业本里！原来，昨天交作业时，我粗心大意，不小心把笔夹在作业本里一起交给了老师。我的脸一下子红了，回想起自己刚才对小丽的态度，我恨不得挖个地洞钻进去。\n\n放学后，我鼓起勇气走到小丽的面前，低声对她说：“小丽，对不起，是我错怪了你，以为你偷走了我的笔。”\n\n小丽先是瞪大了眼睛，然后露出了笑容。她拍拍我的肩膀，说：“没关系，我们还是好朋友。”那一刻，我心里的大石头落了地，眼睛也有些湿湿的……","qs":[{"f":"fill","q":"文中表示“从前有过那种情况”的词语是：___ 。","acc":["曾经"],"ans":"曾经"},{"f":"fill","q":"文中形容“没想到，出乎意料”的词语是：___ 。","acc":["竟然"],"ans":"竟然"},{"f":"open","q":"为什么会一股怒气冲上了“我”的脑袋？","ans":"因为“我”的最喜欢的笔不见了，“我”看到同桌小丽的书包口袋里露出一支和“我”一样的笔，“我”以为是小丽偷偷拿了“我”的笔，因为小丽曾经说过“我”的笔既漂亮又好用。","ctx":""},{"f":"open","q":"作者认为是小丽偷了自己的笔，为什么不敢去问她？","ans":"因为小丽是作者最好的朋友，她们总是互相分享彼此喜欢的东西，作者不相信是小丽偷了她的笔，也不确定是不是小丽偷了她的笔。","ctx":""},{"f":"open","q":"当作者找到笔时，心里有什么感受？为什么？","ans":"当作者找到笔时，她的脸一下红了感到不好意思。因为作者以为是她最好的朋友偷了她的笔，而是作者粗心大意，不小心把笔夹在作业本里。作者感到很惊讶和惭愧，因为自己的粗心大意，把笔夹在作业本里交给老师，却怀疑小丽偷了她的笔，对小丽态度不好。","ctx":""},{"f":"open","q":"文中“我心里的大石头落了地”指的是什么？为什么作者的眼睛湿湿的？","ans":"它指的是作者放心了，因为小丽原谅了作者。作者错怪小丽偷她的笔，可是小丽还是原谅作者和她做朋友，她感到很感动。","ctx":""},{"f":"open","q":"小丽还愿意和作者做朋友，你同意她的做法吗？为什么？","ans":"我同意小丽的做法。因为作者丢了她最喜欢的笔，刚巧小丽有一支和她一样的笔，所以作者误会了。后来，作者意识到自己的错误，主动和小丽道歉，朋友之间不应该因为小事而争吵，应该对彼此宽容理解对方。每个人都会犯错，我们应该给同学一个改过的机会。","ctx":""}]},{"id":"SH-G2","sub":"Chinese","title":"运动会上的坚持","text":"今天是学校运动会，小明胸有成竹地站在跑道上开始热身。他的心里既兴奋又紧张。作为班级的短跑选手，他希望为班级赢得冠军。\n\n比赛开始了！小明像箭一样扑了出去，领先其他选手。可是，就在快到终点时，他不小心跌倒了！腿上露出一道伤口，疼得他哭了出来。\n\n“别放弃！”王老师跑过来对他说。小明好不容易站起来，完成了比赛，但其他选手已经超越他了。老师马上检查了他的伤口，还使用药箱帮他处理伤口。这时，同学们也围过来，有的递水，有的安慰他：“小明，你已经很棒了！”\n\n下午的接力赛，小明原本可以休息，但他坚持要上场。“我肯定能赢！”他咬着牙说。比赛时，他忍住疼痛，稳稳地接住接力棒，奋力冲向终点。这一次，他没有摔倒，还帮助班级拿到了第三名！\n\n运动会结束后，小明珍惜地摸着奖杯，心里暖暖的。他明白：只要不怕困难，肯努力，就一定能超越自己。晚上，小明在日记本上认真写道：“今天的运动会让我懂得，比成绩更重要的是永不服输的精神……”","qs":[{"f":"mcq","q":"从哪里可以看出小明已经为比赛做好准备？","o":["他是班上的短跑选手。","他像箭一样飞扑了出去。","他的心里感到既兴奋又紧张。","他胸有成竹地站在跑道上热身。"],"c":"他胸有成竹地站在跑道上热身。"},{"f":"mcq","q":"为什么小明会哭了出来？","o":["他的腿很疼。","他输了比赛。","他的老师骂了他。","他快到终点时跌倒了。"],"c":"他的腿很疼。"},{"f":"mcq","q":"同学们怎么关心小明？","o":["有些同学扶他起来。","他们给他的伤口上药。","同学给他喝水和安慰他。","同学代替他完成接力赛。"],"c":"同学给他喝水和安慰他。"},{"f":"mcq","q":"小明受伤参加接力赛，有什么结果？","o":["他又摔到了。","他没冲过终点。","他没稳稳地接住接力棒。","他帮助班级得到了第三名。"],"c":"他帮助班级得到了第三名。"},{"f":"mcq","q":"这个故事让你明白了什么道理？","o":["忍住疼痛很重要。","成绩比过程更重要。","坚持能让我们超越自己。","我们要努力超越其他选手。"],"c":"坚持能让我们超越自己。"}]},{"id":"SH-G5","sub":"Chinese","title":"五块钱的品格","text":"星期六，爸爸带小杰去附近的图书馆。他们借完书正好是中午。天气非常炎热，他们走了一会儿，就已经满头大汗了。爸爸见路边有个饮料摊，便买了一瓶汽水给小杰解渴。\n\n回到家后，爸爸收拾东西时突然皱起了眉头。“小杰，钱包里怎么多了五块钱？”爸爸不解地说，“我记得很清楚，出门前数目并没有错。”小杰一下呆住了，随即反应过来：“是不是卖汽水的老伯多找的钱？”\n\n爸爸点点头表示同意：“嗯……今天我只在饮料摊花过钱。应该是他不小心找错了。我们得还给他。”\n\n“才五块钱。天气这么热，回去太麻烦了……”小杰不同意爸爸的做法。\n\n“这五块钱虽然不多，但……”爸爸话还没说完，小杰打断了他：“反正他也不一定会记得找错了钱给我们。”\n\n爸爸沉默了一会儿，语重心长地说：“小杰，有时候，一个小小的决定，反映的是一个人的品格。不属于我们的东西我们不能要，我们不能因为这五块钱，丢了更重要的东西。”\n\n这句话像一记重拳打在小杰的胸口。他感到脸上一热，惭愧地低下了头，连忙跟着爸爸出门去了。","qs":[{"f":"fill","q":"文中形容“不说话”的词语是：___ 。","acc":["沉默"],"ans":"沉默"},{"f":"fill","q":"文中形容“做错了事而感到不安”的词语是：___ 。","acc":["惭愧"],"ans":"惭愧"},{"f":"open","q":"爸爸为什么买汽水给小杰？","ans":"因为那天天气非常炎热，他们走了一会儿，就已经满头大汗了，汽水可以让小杰解渴。","ctx":""},{"f":"open","q":"爸爸认为多出来的五块钱是怎么来的？(1分) 他是怎么知道的？(2分)","ans":"爸爸认为多出来的五块钱是卖汽水的老伯多找的钱。因为他记得很清楚出门前钱包里的数目并没错，而且当天他只在饮料摊花过钱。","ctx":""},{"f":"open","q":"爸爸和小杰各认为应该怎样处理那五块钱？(1分) 小杰为什么不同意爸爸的做法？(3分)","ans":"爸爸认为应该把钱还给老伯，小杰则认为不用还钱。因为小杰认为五块钱不算多，而且天气很热，还钱太麻烦，况且老伯不一定会记得找错了钱给他们。","ctx":""},{"f":"open","q":"爸爸说的“更重要的东西”指的是什么？(1分) 小杰听到后为什么会脸上发热？(3分)","ans":"“更重要的东西”指的是诚实（或良好的品格）。因为小杰本来不想还钱给老伯，爸爸的话让他明白了自己的不诚实，不应该拿不属于自己的东西，所以他感到很惭愧。","ctx":""},{"f":"open","q":"读了这篇文章，你学到了什么道理？试举例说明你会如何把它应用在日常生活中。","ans":"我学到了做人要诚实，不能拿不属于自己的东西。例如：如果在学校看到老师改错试卷多给了分数，我会主动向老师说明并扣回分数。虽然分数少了，但我做到了诚实。","ctx":""}]},{"id":"HP-HC-G3","sub":"Higher Chinese","title":"爷爷奶奶的智慧","text":"“反正我永远不够好！我不要留在篮球训练队了！”卫国一上爷爷的车，便开始抱怨，因为他又没被选上篮球校队。奶奶想劝卫国不要轻易放弃，爷爷却示意她别说话，奶奶明白再劝也没用，便不说了。\n\n爷爷笑着对卫国说：“好，我们支持你！”\n\n回到家后，卫国怒气冲冲地去冲凉。之后，他们吃饭时，爷爷说：“这五香肉卷比一开始好吃多了！”看着吃得狼吞虎咽的卫国，奶奶笑着说，她开始学做这道菜时总是做不好，肉卷皮总是破掉。卫国一脸吃惊地问：“奶奶，您可是家里的厨神，怎么会煮不好呢？”\n\n奶奶笑了笑，说：“刚开始做五香肉卷时，不是皮爆开就是炸得焦黑。我也想过放弃，但爷爷说多试几次一定会成功。现在你才能吃到这道好菜呀！我想成功是靠日积月累的尝试和努力，没人一出生就什么都会。”\n\n听着听着，卫国也吃完饭了。他想起教练曾经说过，篮球明星迈克乔丹每天都坚持练习1000次基本投篮，才能成为顶尖球员。他反思自己平时投不到50下就喊累，不禁感到惭愧。这时，爷爷故意说：“过一会儿，我让你爸爸通知学校，说你以后都不去篮球训练了。”\n\n卫国连忙摆手，说：“不用了……我决定留在篮球训练队继续努力，我相信我一定会成功的！”爷爷和奶奶相视而笑，饭桌上的气氛又轻松了起来。","qs":[{"f":"fill","q":"找出与“诉苦”意思相近或相同的词语。","acc":["抱怨"],"ans":"抱怨"},{"f":"fill","q":"找出与“以前”意思相近或相同的词语。","acc":["曾经"],"ans":"曾经"},{"f":"open","q":"吃饭前，卫国的心情是怎样的？他对是否继续留在篮球训练队有什么想法？","ans":"心情：生气\n想法：不要留在篮球队，认为自己永远不够好","ctx":""},{"f":"open","q":"吃饭后，卫国的心情是怎样的？他对是否继续留在篮球训练队有什么想法？","ans":"心情：忏悔\n想法：认为教练说的话是对的，相信一定会成功的","ctx":""},{"f":"open","q":"卫国觉得奶奶煮的食物好吃吗？从哪里可以看出？","ans":"卫国觉得奶奶煮的食物好吃。从卫国吃得很香就知道，奶奶笑着说，她开始学做这道菜时总是做不好，肉卷皮总是破掉。卫国一脸吃惊地问：“奶奶可是家里的厨神，怎么会煮不好呢？”可以看出。","ctx":""},{"f":"open","q":"试从所提供的两个选项中，选一个最适合的作为这篇短文的题目，然后举例说明做出这个选择的理由。(1) 卫国的篮球梦 (2) 聪明的爷爷奶奶","ans":"(2) 聪明的爷爷奶奶。我觉得《聪明的爷爷奶奶》最适合作为这篇短文的题目。因为奶奶听到卫国说他不要待在篮球训练队了，经过劝说，他还是不听，就没有一直劝，而是聪明地通过煮肉卷的例子，说她曾想过要放弃，但爷爷说多试几次，一定会煮成功，来让卫国明白成功是靠日积月累的尝试和努力，没有人一出生就会的道理，去改变了卫国的想法，让他决定留在篮球训练继续努力。","ctx":""}]},{"id":"HP-HC-G4","sub":"Higher Chinese","title":"月美的成长","text":"“把臭袜子放进洗衣篮，不要又乱放！”妈妈有些生气地说。\n\n“我去冲凉！”月美丢下一句话，快速地进了厕所。妈妈在外头叫她：“快点冲！不要浪费水！”月美立刻关上门，故意把水龙头开到最大，让水声盖过外头的声音，然后才开始冲凉。\n\n过了好一会儿，月美才冲好凉，到厨房拿饼干。经过客厅时，她捡起书包，却对一旁的臭袜子视而不见。月美匆匆走进房间，一边吃饼干，一边做功课。不一会儿，她赶完了功课，看着满桌的饼干碎片，随手一扫，有些碎片掉在地上，她一点儿也不在意。\n\n接着，月美发一则信息给好友李林，说最近有个音乐舞蹈短片很受欢迎，她让李林也一起学，好在教师节时上台表演。\n\n于是，她把短片转发给李林，并请李林马上去观看。李林回复：“今天的作业那么多，我都还没做完，还要温习之前的功课呢！而且，我还得收拾房间和洗袜子，真的没有时间！”月美回了句：“功课可以随便做，能交给老师就好了！”\n\n见李林迟迟没回应，心急的月美忍不住打电话给李林：“你要认真读书就算了，为什么还要收拾房间和洗袜子呢？你妈妈不会处理这些事吗？我们的表演更重要吧！”\n\n李林冷静地回答：“自己的事应该自己做。房间和袜子是我的，怎么能让妈妈收拾呢？”听了李林的话，月美的脸红了起来。","qs":[{"f":"open","q":"试解释短语在文中的意思：“让水声盖过外头的声音”（第二段）","ans":"因为月美不想听妈妈的唠叨，故意将水龙头开到最大，让水的声音大过妈妈的声音，她可以不用听到妈妈的唠叨。","ctx":""},{"f":"open","q":"试解释短语在文中的意思：“视而不见”（第三段）","ans":"月美对臭袜子假装没有看见，直接走进房间。","ctx":""},{"f":"open","q":"月美和李林对学习的态度有什么不同？请举例说明。","ans":"月美觉得功课可以随便做，能交给老师就好了。李林对待功课很认真。当月美让李林去看短片时，李林觉得那天的作业那么多，还没做完，还要温习之前的功课，没有时间看短片。","ctx":""},{"f":"open","q":"请用不超过15个字，写出文中第四段的大意。","ans":"月美发信息给李林，让她学短片。","ctx":"字数限制：≤15字"},{"f":"open","q":"你认为月美是个懂事的孩子吗？试举例说明。","ans":"我不认为月美是个懂事的孩子。月美既没有自己的事情自己做，对于功课学业也是马虎敷衍。从月美没有把臭袜子放进洗衣篮，对臭袜子视而不见；为了不听妈妈唠叨，她故意把水龙头开到最大；月美看着满桌的饼干碎片，随便手一扫，有些碎片掉在地上，她一点儿也不在意。随便完成功课，却去看短片。所以我不认为月美是个懂事的孩子。","ctx":""},{"f":"open","q":"你认为月美的脸为什么会红了起来？","ans":"因为月美听到李林说自己的事应该自己做，房间与袜子是她的，不应该让妈妈收拾。月美不仅对臭袜子视而不见，而且吃饼干碎片在地上也是随便手一扫。将全部自己的事情留给妈妈处理，月美觉得很惭愧，所以脸红了。","ctx":""},{"f":"open","q":"你从这篇短文里学到了什么道理？试举生活中的例子加以说明。","ans":"我从这篇短文里学到，自己的事情应该自己做，不应该依赖家长。例如我们自己的书包及房间应该自己整理和打扫，而不是让家长代劳。学习也是我们自己的事情，应该认真对待。","ctx":""}]},{"id":"MB-HC-G3","sub":"Higher Chinese","title":"大信封里的善意","text":"在五乙班，有一个总是坐在角落里的男孩——文光。文光的学习中等，穿着旧校服，经常被同学看不起。班上的同学们几乎把他当成了“透明人”，没有人愿意主动和他说话，也没有人关心他的感受。虽然文光从不说什么，但心里其实很难受。\n\n一天早上，罗老师带着一个大信封来到教室，神秘地笑着说：“从今天开始，请大家每天写下一件看到的好事，放进这个信封里。每周五我们一起读出来。”起初，大家觉得无聊，但还是参与了。\n\n一天放学后，小明不小心打翻水，书包和书全湿了。听到同学的嘲笑声，小明急得快哭了。这时，文光刚巧经过，便走过去，不但帮他擦桌子，而且把弄湿的书拿去晒干。\n\n第二天，信封里多了一张纸条。罗老师把纸条读了出来：“文光帮了我，谢谢你。”大家都知道这是谁写的。文光注意到周围同学向他投来异样的目光，心里涌起从未有过的暖流。\n\n从那天起，同学们看文光的眼神变了，主动接近他。他虽然不多话，却总在别人需要时帮忙。\n\n几周后，黄老师在班上说：“你们发现班上变得不一样吗？这是因为大家开始彼此关心、彼此帮助。”小明也勇敢承认：“我以前看不起文光，现在我知道他才是最值得我学习的人。”小明惭愧地走向文光，并低声道歉，文光点点头，心中的难过也随之消散。文光明白，只要心存善良，总会有人看见和回应。\n\n大信封继续留在教室里，它就像一股无形的鼓励，让整个班级的气氛变得更和谐了。","qs":[{"f":"fill","q":"找出与“正好”意思相近或相同的词语。","acc":["刚巧"],"ans":"刚巧"},{"f":"fill","q":"找出与“友好”意思相近或相同的词语。","acc":["和谐"],"ans":"和谐"},{"f":"open","q":"帮助小明之前，同学对待文光的态度是怎样的？原因是什么？","ans":"态度：看不起他\n原因：学习中等，穿着旧校服","ctx":""},{"f":"open","q":"帮助小明之后，同学对待文光的态度是怎样的？原因是什么？","ans":"态度：看文光的眼神变了，主动接近他；认为他乐于助人\n原因：文光在小明打翻水时主动帮他擦桌子并晒干弄湿的书","ctx":""},{"f":"open","q":"文中“文光心里涌起从未有过的暖流”，这句话指的是什么？","ans":"这句话指的是文光之前总是被别人看不起，他没有想到会有人写纸条感谢他。看到小明写的纸条，他心里很开心、感动，同学们也向他投来异样的目光。","ctx":""},{"f":"open","q":"试从以下的两个选项中，选一个最适合的作为这篇短文的题目，然后举例说明做出这个选择的理由。(1) 善良的力量 (2) 聪明的老师","ans":"(1) 善良的力量。我认为《善良的力量》适合作为短文的题目。在文中，文光常被同学看不起，但是当小明需要帮助时，却只有他一个人主动上前伸出援手。同学们因为这个举动而对他的态度转变。大家开始懂得彼此关心、彼此帮助。这都是因为“善良”带来的变化。","ctx":""}]},{"id":"MB-HC-G4","sub":"Higher Chinese","title":"丽亚的花店","text":"在一座美丽的古城里，住着一个可爱的女孩，名叫丽亚。\n\n不幸的是，她的父母很早就去世了。她也因为生病而双目失明。不过，丽亚从来没有因生活的艰难而放弃。她靠卖花为生，每天风里来雨里去，即使遇到恶劣的天气，她也风雨无阻。\n\n有一阵子，古城里举办活动，原本熟悉的街道突然被围了起来。对丽亚来说，环境的改变是个大麻烦。有一次，她走错了路，花篮也掉在地上。她蹲下身，一边捡花，一边对自己说：“没关系，从哪里跌倒就从哪里爬起来！”之后，她更认真地记周围的环境，比如哪边有水声、哪家店放音乐、哪里有面包香……\n\n有时候，也会有人可怜她。一次，有位游客把钱放在了丽亚的手里，却没有拿花。就在游客刚想要离开时，丽亚叫住了他，笑着说：“虽然我看不见，但我靠自己的双手工作，跟大家一样，是在为生活努力的人。”\n\n几年后，丽亚渐渐长大了，她的心里也悄悄种下了一个愿望：开一间自己的花店。身边的人知道后，完全不听丽亚的想法，并皱着眉头劝她不要尝试。大家都觉得这对双目失明的人来说，是一件非常困难的事。\n\n经过一段时间的努力，丽亚真的开了一家小小的花店。当大家走进这间花店，看到花店里的员工既有像丽亚一样的失明人士，还有一些失聪人员时，脸上都浮现出惊讶的表情，被丽亚的坚持而感动。大家也恍然大悟，明白了丽亚想要开花店的原因：她想用自己的努力，去帮助像她一样的人。\n\n一位失聪的店员对丽亚说：“谢谢你，让我觉得自己也是有用的人。”丽亚轻轻地回答：“我也曾害怕过，但我没有放弃。我相信你也可以做到！”在丽亚的鼓励下，她变得越来越自信，开始主动与顾客交流，做出的花束也越来越漂亮。\n\n从那以后，古城里的人只要一提到丽亚就会说：“她的花特别美，她的心更美。”","qs":[{"f":"open","q":"试解释短语在文中的意思：“风雨无阻”（第二段）","ans":"即使天气恶劣，丽亚还是出去卖花。","ctx":""},{"f":"open","q":"试解释短语在文中的意思：“环境的改变是个大麻烦”（第三段）","ans":"原本熟悉的街道被围起来了，这对失明的丽亚来说很不方便。","ctx":""},{"f":"open","q":"丽亚住在哪里？（1分）她遇到了什么不幸的事情？（2分）","ans":"丽亚住在一个美丽的古城里。她的父母很早就去世了；她也因为生病而双目失明。","ctx":""},{"f":"open","q":"大家得知丽亚开花店之前和之后，各有什么反应？（2分）为什么他们会有这样的反应？（2分）","ans":"大家得知丽亚开花店之前的反应是完全不听丽亚的想法，并皱着眉头劝她不要尝试。因为大家都觉得这对双目失明的人来说，是一件非常困难的事。大家得知丽亚开花店之后的反应是脸上都浮现出惊讶的表情，被丽亚的坚持而感动。因为大家不相信丽亚真的开了一间花店，发现了花店里的员工既有像丽亚一样的失明人士，还有一些失聪人员，明白了丽亚开花店的原因是她想用自己的努力，去帮助像她一样的人。","ctx":""},{"f":"open","q":"请用不超过15个字，写出短文中第四段的段落大意。","ans":"丽亚告诉游客她在卖花，不需要可怜。（或：丽亚靠卖花为生，拒绝了游客的帮助。）","ctx":"字数限制：≤15字"},{"f":"open","q":"丽亚的做法给她的店员带来了什么影响？","ans":"丽亚的做法让她的店员不再认为自己是个没用的人，相信自己还是一个有用的人，变得越来越自信，开始主动与顾客交流，做出的花束也越来越漂亮。","ctx":""},{"f":"open","q":"你从丽亚身上学到了什么？（2分）试举生活中的例子加以说明。（3分）","ans":"我从丽亚的身上学到了无论遇到什么困难，只要不放弃，就一定可以成功。例如我天生个子矮小，每次体育达标测试不及格，但是我每次都能积极准备。虽然我体育考试不达标，但是我能在篮球比赛中发挥自己个子矮小的优势，灵活、快速，和大家一起合作，每次都能赢得比赛，我也变得自信。","ctx":""}]},{"id":"NY-HC-G3","sub":"Higher Chinese","title":"美云的舞蹈演出","text":"美云是一名舞蹈员，两个星期前她在排练时不小心跌倒，划伤了脸，留下了一道伤口。美云看着镜子里的自己，越想越伤心。她感到绝望，决定再也不跳舞了。\n\n一天中午，李教练找美云谈话。李教练关心地问道：“美云，你最近怎么没来排练了？别忘了年底你要上台表演一个节目！”美云小声回答：“我想我以后都不会上台表演了。”李教练说：“是因为脸上的伤口吗？”美云低下了头，沉默不语。李教练觉察到了美云已经对自己失去了信心，温柔地说：“你是一位出色的舞蹈员，怎么能轻易放弃？我们应该专注于自己的优点，脸上的伤口一定会慢慢地好起来的，不会影响你的表演！我有一个方法，可以让你的伤口变成舞台上的亮点！”听了教练的一番话，美云点了点头，但心里仍然有些不安。\n\n到了表演当天，美云感到有些担心，不知道同学会不会嘲笑她的脸。这时，李教练拿出了一些颜料开始在美云脸上涂抹。不一会儿，她脸上那块暗红的伤口竟然变成了一朵鲜艳的花。李教练拿过镜子，摆在美云面前。美云看着镜子里的自己，立刻呆住了。她觉得自己从来没有这么好看过！\n\n演出开始了，美云自信地跳起舞来，跳出了自己最优美的一支舞蹈！表演结束后，台下响起热烈的掌声，美云感动地流下了眼泪……她像一朵盛开的花朵，美丽又迷人，和自己脸上的那朵花一样，在灯光照射下，闪闪发亮。","qs":[{"f":"fill","q":"哥哥是一位优秀的运动员，家中摆满了奖杯。 —— 找出与画线词语意思相近或相同的词语。","acc":["出色"],"ans":"出色"},{"f":"fill","q":"尽管明华今天生病了，他还是决定来上学。 —— 找出与画线词语意思相近或相同的词语。","acc":["仍然"],"ans":"仍然"},{"f":"open","q":"对于美云参加舞蹈演出这件事，试说明演出开始前美云的感受和原因。","ans":"感受：感到担心/不安\n原因：不知道同学会不会嘲笑她的脸","ctx":""},{"f":"open","q":"对于美云参加舞蹈演出这件事，试说明演出结束后美云的感受和原因。","ans":"感受：感到（很/非常）感动\n原因：跳出了自己最优美的一支舞蹈，台下响起了热烈的掌声","ctx":""},{"f":"open","q":"当美云在演出前看到镜子里的自己时，她有什么反应？为什么她会有这样的反应？","ans":"当美云在演出前看到镜子里的自己时，她立刻呆住了。因为她脸上那块暗红的伤口竟变成了一朵鲜艳的花，觉得/认为自己从来没有这么好看过，所以她会有这样的反应。","ctx":""},{"f":"open","q":"试从所提供的两个选项中，选一个最适合的作为这篇短文的题目：(1) 两朵美丽迷人的花儿 (2) 喜欢画画的李教练，然后举例说明做出这个选择的理由。","ans":"(1) 两朵美丽迷人的花儿。我觉得《两朵美丽迷人的花儿》最适合作为题目。因为短文中李教练在美云脸上涂抹颜料，使她脸上的伤口变成了一朵鲜艳的花；而在演出成功后，美云也像一朵盛开的花朵一样美丽迷人。这两朵花都象征着美云重新找回自信、闪闪发亮的过程，非常贴切短文的主旨。","ctx":""}]},{"id":"NY-HC-G4","sub":"Higher Chinese","title":"与众不同的于老师","text":"于老师第一次出现在我们班时，课室里吵闹声一片，有人在聊天，有人在吵架，还有人在丢纸飞机。过了一会儿，不知道是谁发现课室里忽然多了一个人，大家互相提醒着老师已经来了，教室里的声音就这样渐渐落了下去。没有大声责骂，于老师的这一招以静制动马上起了作用。\n\n“自我介绍一下，我是你们今年的级任老师。我姓于，教你们数学，以后上课时，你们可以叫我于哥，把我当作你们的哥哥。”这与众不同的开场白，让讲台下的我们觉得有些意外。说实话，我们师生首次见面有些特别，他没有点名，更没有让我们一一上前作自我介绍。\n\n我们班一向是别人眼中的“问题班”。接下来的计分测试，没人看好我们班，包括我们自己，所以大家也没什么心情复习，上课依然吵吵闹闹。卷子发回来后，我们班的成绩果然也是在意料之中。于老师并没有生气，只是简单地说了一句，有时候，不要因为别人的评语就让你对自己有错误的认识，没试过，你怎么知道自己不行？\n\n听了这番话，同学们开始积极地采取行动。每天下课后、休息时间、放学后，能利用的时间都跑去向各科老师问问题。当然，我们也是于老师办公室的常客。渐渐的，大家上课时都专心听课了，功课也准时交了。年中考试时，我们班的总成绩提高了很多。\n\n有同学问于老师，如果我们成绩没有进步的话该怎么办。于老师回答：“其实不论成绩有没有进步，你们只要努力学了，最终都会有收获，不是吗？”","qs":[{"f":"open","q":"试解释短语在文中的意思：“渐渐落了下去”（第一段）","ans":"这个短语在文中的意思是教室里原本很吵闹，后来发现老师来了，慢慢安静下来。","ctx":""},{"f":"open","q":"试解释短语在文中的意思：“对自己有错误的认识”（第三段）","ans":"这个短语在文中的意思是于老师教我们不要因为别人不看好自己/别人的评语，而认为自己一定不行/学不好。","ctx":""},{"f":"open","q":"于老师第一次走进课室时，他看到了怎样的情景？","ans":"于老师第一次走进课室时，他看到课室里吵闹声一片，有人在聊天，有人在吵架，还有人在丢纸飞机。","ctx":""},{"f":"open","q":"从哪里可以看出于老师和其他老师不一样？","ans":"于老师第一次和学生见面时，让学生们叫他“于哥”，把我当作哥哥，这样的开场白与众不同。他没有点名，也没有让学生一一上前作自我介绍，从这里可以看出于老师和其他老师不一样。","ctx":""},{"f":"open","q":"请用不超过20个字，写出短文中第五段的段落大意。","ans":"于老师说只要大家努力了就会有收获。","ctx":"字数限制：≤20字"},{"f":"open","q":"计分测试过后，我们班的学习态度有什么变化？","ans":"计分测试之前同学们上课很吵，没心情复习。计分测试过后，同学们开始积极地采取行动，每天下课后、休息时间、放学后，能利用的时间都跑去向各科老师问问题。上课时都在专心听课，功课也准时交了。","ctx":""},{"f":"open","q":"“没试过，你怎么知道自己不行”，这句话是什么意思？试举生活中的例子加以说明。","ans":"这句话的意思是不要在没有尝试之前就否定自己/对自己没有信心/觉得自己做不到。（或者：只有亲自去尝试/很多事情只有勇敢去做，才能知道自己是否能做到/有能力做到。）\n例如有一次，我因自己没做过/自我否定不敢参加学校运动会，但后来我勇敢报名并努力训练，最后取得了不错的成绩，证明了自己的能力。","ctx":""}]},{"id":"RG-HC-G3","sub":"Higher Chinese","title":"林伟的兴趣大发现","text":"林伟一直觉得自己是个“无聊”的人。看到同学们在兴趣班里都很积极，他却对什么都不感兴趣。妈妈鼓励他说：“多参加不同的活动，你就会知道自己喜欢什么！”于是，林伟开始了他的“兴趣大发现”。\n\n第一站——武术班。林伟准备要“飞踢”，结果脚还没抬起来，就踏到裤脚摔倒了！林伟发现自己并不喜欢又累又痛的感觉，只好放弃。\n\n第二站——羽毛球班。林伟以为打羽毛球很容易，可是球飞过来时，他总是接不到。几次都接不到后，他觉得自己不太适合，就放弃了。\n\n第三站——合唱团。林伟觉得唱歌应该比较容易。他唱了几句，声音高得连老师都皱眉。他不觉得有趣，就不再参加活动了。\n\n林伟开始怀疑自己是不是对什么都不感兴趣。直到有一天，老师邀请他在全校面前分享他在兴趣班的故事。林伟有点儿紧张，但他还是站在台上，讲起那些让他难为情却有趣的事。没想到，台下的同学哈哈大笑，还不停地拍手。\n\n讲完故事后，林伟不那么紧张了，心里还有点儿兴奋。原来把自己故事讲出来会这么好玩！这时，他感到十分自豪。\n\n回到家，林伟对妈妈说：“我喜欢讲故事！讲故事真的很有趣！”妈妈笑着说：“你看，我之前跟你说的没错吧。你不尝试怎么知道自己对什么感兴趣呢？”","qs":[{"f":"fill","q":"他总是主动地帮助同学，解决他们的问题。 —— 找出与画线词语意思相近或相同的词语。","acc":["积极"],"ans":"积极"},{"f":"fill","q":"他顺利找出数学题的答案，感到十分骄傲。 —— 找出与画线词语意思相近或相同的词语。","acc":["自豪"],"ans":"自豪"},{"f":"open","q":"试说明林伟在参加武术班时的行为和发现。","ans":"行为：准备要“飞踢”，结果脚还没有抬起来就踩到裤脚摔倒了\n发现：自己并不喜欢又累又痛的感觉","ctx":""},{"f":"open","q":"试说明林伟在分享故事时的行为和发现。","ans":"行为：站在台上，讲起那些让他难为情却有趣的事\n发现：原来把自己的故事讲出来会那么好玩","ctx":""},{"f":"open","q":"一开始，林伟对自己有什么看法？妈妈怎么鼓励林伟做出改变？","ans":"一开始林伟觉得自己是个“无聊”的人，看到同学们在兴趣班里都很积极，他却对什么都不感兴趣。妈妈鼓励林伟多参加不同的活动，才会知道自己喜欢什么。","ctx":""},{"f":"open","q":"试从所提供的两个选项中，选一个最适合的作为这篇短文的题目：(1) 参加不同的兴趣班 (2) 从尝试中发现兴趣，然后举例说明做出这个选择的理由。","ans":"(2) 从尝试中发现兴趣。我认为《从尝试中发现兴趣》是最适合的题目。因为当林伟开始对什么都不感兴趣，但在妈妈鼓励下，他尝试参加了不同的活动，最后林伟在台上讲故事，才发现自己喜欢讲故事。","ctx":""}]},{"id":"RG-HC-G4","sub":"Higher Chinese","title":"误会与和好","text":"今天上午，我和好朋友明恩为了一件小事大吵了一架。\n\n英文老师让我们分组活动。一向和我同组的明恩，竟然想要和其他同学一组！我呆住了，委屈和愤怒涌上心头，心想：他是不是不把我当朋友了？\n\n下课后，我忍不住问明恩：“为什么不和我一组？”明恩说：“我想和其他同学一组。”他的话让我更生气了。“好啊，那以后别做朋友了！”我转身就跑，眼泪差点儿掉下来。\n\n接下来的几天，我们没有再说话。每次看到他和其他同学有说有笑，我的心里都很难受。我很想和他说话，但又拉不下面子。\n\n直到星期五，级任老师把我和明恩叫到办公室。“你们两个最近都不跟对方说话，怎么了？”老师温和地问。我生气地说：“他不愿意和我一组。”明恩听了，叹了口气说：“那天我只是想帮学习比较吃力的同学，没想到你会生气……”\n\n我这才恍然大悟，原来明恩不是不想和我一组，而是为了帮助同学才做了那个决定。想到这里，我红着脸，小声地说：“对不起，我不该对你发脾气。”明恩回答：“我也有错，应该先把话说清楚。”老师见我们和好了，便拍拍我们的肩膀，说：“朋友之间应该互相了解，这样的友情才能长久！现在雨过天晴，你们回班上课吧。”","qs":[{"f":"open","q":"试解释短语在文中的意思：“拉不下面子”（第四段）","ans":"这个短语在文中的意思是作者因为害怕丢脸，所以不去跟明恩说话/道歉。","ctx":""},{"f":"open","q":"试解释短语在文中的意思：“恍然大悟”（第六段）","ans":"这个短语在文中的意思是作者忽然明白明恩不是不要跟他一组，而是想帮学习比较吃力的同学。","ctx":""},{"f":"open","q":"上课时，明恩选择跟其他同学一组，作者有什么反应？为什么？","ans":"作者呆住了，委屈和愤怒涌上心头，心想明恩是不是不把他当朋友了。因为明恩和作者一向同组，作者没想到明恩竟然想和其他同学一组。","ctx":""},{"f":"open","q":"作者听了明恩的解释后，心情如何？为什么？","ans":"心情：作者感到十分惭愧，脸红着。\n原因：因为作者明白明恩不是不想和作者同组，而是想去帮助学习吃力的同学，作者错怪了明恩，还生他的气。","ctx":""},{"f":"open","q":"请用不超过18个字，写出短文中第五段的段落大意。","ans":"“我”和明恩告诉老师“我们”不说话的原因。","ctx":"字数限制：≤18字"},{"f":"open","q":"短文中的级任老师是个怎样的人？从哪一件事可以看出来？","ans":"我认为级任老师是个细心的人。级任老师把作者和明恩叫到办公室，然后温和地问为什么他们俩最近都不跟对方说话，从这里可以看出级任老师是个细心的人。","ctx":""},{"f":"open","q":"作者和明恩最后是怎么和好的？你从这件事中学到什么道理？试举生活中的例子加以说明。","ans":"他们互相道歉，就和好了。我学到朋友之间要互相了解，这样友情才能长久。例如我的朋友因为没考好，心情不好，突然不理我，我没有马上生气，而是问她原因。我们把话说清楚，避免发生误会。","ctx":""}]},{"id":"PL-G3","sub":"Chinese","title":"妈妈与蒸鱼","text":"每年过年过节时，妈妈都会想起她的童年。因为家里很穷，妈妈只有在农历新年时才会吃到鱼、肉等。她常常说，现在的孩子不用等到过年过节，平日也能吃到这些美食，真是幸福啊！\n\n我最喜欢吃妈妈做的菜，特别是蒸鱼。妈妈几乎每天都会煮这道菜，因为她认为多吃鱼，对正在成长的小孩有很多好处。虽然我很爱吃蒸鱼，但我最讨厌吃到鱼骨头了。妈妈总会帮我夹出鱼肉，这样我就不会吃到鱼骨头。\n\n慢慢地，我发现妈妈总是把大部分的鱼肉都夹给我，自己只吃鱼头和鱼骨头上连着的那一点肉。当我要把自己碗里的鱼肉夹给她时，她都会说她喜欢吃鱼头，因为鱼头的肉比较甜。每次妈妈都那么说，时间久了，我也就开始相信她的话了。\n\n直到我长大后有了自己的孩子，我才明白妈妈的心。不管是食物还是其他东西，我都会想把最好的给自己的孩子。以前害怕吃到鱼骨头的我，现在也像妈妈一样，很多时候都是把鱼肉夹给孩子后，自己吃鱼头和鱼骨上连着的那一点肉。我也明白了为什么当年妈妈会对我说鱼头的肉特别甜。\n\n其实，看孩子吃着自己煮的食物，心里那甜甜的感受让嘴里的鱼头也变甜了。","qs":[{"f":"fill","q":"文中第一段和第二段中与“喜欢”意思相反的词语是：___ 。","acc":["讨厌"],"ans":"讨厌"},{"f":"fill","q":"文中第三段与“怀疑”意思相反的词语是：___ 。","acc":["相信"],"ans":"相信"},{"f":"open","q":"为什么妈妈会说现在的孩子很幸福？","ans":"作者的妈妈小时候家里很穷，只有在农历新年时才能吃到鱼肉。因为现在的小孩子不用等到过年过节，平日也能吃到鱼、肉等美食。","ctx":""},{"f":"open","q":"为什么妈妈几乎每天都会煮蒸鱼？","ans":"因为作者喜欢吃妈妈煮的蒸鱼。妈妈认为多吃鱼，对在成长的小孩有很多好处。","ctx":""},{"f":"open","q":"长大后，作者还害怕吃到鱼骨头吗？你怎么知道？","ans":"长大后，作者不害怕吃到鱼骨头了。因为作者认为不管是食物还是其他东西，作者都会想把最好的给自己的孩子。以前害怕吃鱼骨头的作者，现在像妈妈一样，很多时候都是把鱼肉夹给孩子后，自己吃鱼头和鱼骨头上连着的那点肉。","ctx":""},{"f":"open","q":"妈妈告诉作者她觉得鱼头的肉怎么样？(1分) 你认为妈妈这样说的原因是什么？(3分)","ans":"妈妈说鱼头的肉特别甜。我认为妈妈这样说是因为她想把最好的给孩子，但又不想告诉孩子她故意这样做，不想让孩子担心她。","ctx":""},{"f":"open","q":"作者的妈妈是个怎样的母亲？试从文中举例说明。","ans":"作者的妈妈是个很爱孩子的母亲。妈妈都把最好的食物给了作者，自己却只吃剩下的一点肉，还常说很好吃。","ctx":""}]},{"id":"NY24-G2","sub":"Chinese","title":"手影游戏","text":"每天吃了晚餐后，我和邻居小孩们就会不约而同地来到楼下的游乐场玩耍。他们有的爱玩荡秋千，有的喜欢溜滑梯，有的爱玩你追我跑，而我最喜欢玩的一种游戏就是手影游戏。明亮的路灯下，我们会用手在组屋的墙上做出各种动物的影子。这些影子在墙上动来动去，有趣极了。\n\n通常我们会分成两组，一组负责追，一组负责躲。负责躲的那组小朋友会用手做出“小鸟”的手影，另一组负责追的小朋友就做成“小狗”的手影，去追“小鸟”。我们的规则是：“小狗”咬到“小鸟”时，那个做“小鸟”的人嘴里要发出“啊呀，啊呀”的叫喊声，假装被咬得很痛。\n\n那天，我和小刚在玩手影游戏时，我做的“小鸟”被小刚做的“小狗”不停地追着。小刚先是假装追不上我，要去旁边休息，但他突然转身，趁我不注意时追上了我！“小狗”立刻咬到“小鸟”！我叹了口气说：“好吧，我输了。”可抓到我的小刚却一脸认真，坚持要我发出“啊呀，啊呀”的叫喊声。我觉得没必要，这只是游戏而已。结果我俩你一言我一语地争吵起来。\n\n站在一旁看我们玩游戏的爸爸对我说：“这就是你的不对了，你没有按照规则来玩游戏，怎么还和小刚吵架呢？如果大家都像你一样，这样的游戏还有趣吗？”我不服气地说：“咬到的只是我的手影，又不是真的我。”爸爸说：“就算这只是个游戏，但只要你来玩，就要认真对待，真正地进入到游戏里。将来无论你做什么事，只有认真对待了，才能做好啊。”我听了，脸忍不住红了……","qs":[{"f":"mcq","q":"在楼下游乐场玩时，“我”最喜欢玩的游戏是什么？","o":["荡秋千。","溜滑梯。","你追我跑。","手影游戏。"],"c":"手影游戏。"},{"f":"mcq","q":"“小狗”咬到“小鸟”后，“我”的反应是什么？","o":["一脸认真地和小刚玩游戏。","叹了口气并且向小刚认输。","发出“啊呀啊呀”的声音。","假装自己被小刚咬得很痛。"],"c":"叹了口气并且向小刚认输。"},{"f":"mcq","q":"小刚和“我”吵架的原因是什么？","o":["“我”认为没必要和小刚一起玩。","“我”拒绝遵守这个游戏的规则。","小刚认为这个游戏一点也不有趣。","小刚在游戏时根本就追不上“我”。"],"c":"“我”拒绝遵守这个游戏的规则。"},{"f":"mcq","q":"根据篇章内容，以下哪一句话是正确的？","o":["爸爸认为“我”不应该和小刚吵架。","爸爸玩游戏的方式让“我”不服气。","爸爸跟“我”说的话让小刚脸红了。","爸爸坚持要“我”向小刚说对不起。"],"c":"爸爸认为“我”不应该和小刚吵架。"},{"f":"mcq","q":"爸爸教“我”什么道理？","o":["做错事要主动承认错误。","要仔细制定好游戏规则。","要认真对待所做的事情。","不要把输赢看得很重要。"],"c":"要认真对待所做的事情。"}]},{"id":"CHS-G1","sub":"Chinese","title":"爱的付出","text":"自从妈妈去世后，爸爸为了两个孩子，每天做两份工作，很辛苦。为了不让爸爸担心家里的事，明华开始负责做家务。此外，明华还学习怎样照顾妹妹。\n\n儿童节那天，明华带着妹妹到图书馆看书。经过玩具店时，妹妹吵着要进去看看。明华对妹妹说：“我没带钱！”说完，他便拉着妹妹的手想离开，妹妹却站在玩具店门口不肯走。明华想让妹妹开心，只好让她在玩具店呆半个小时。\n\n半个小时后，妹妹捧着玩具要哥哥买给她。明华耐心地跟妹妹解释：“爸爸工作辛苦，我们应该节省，不乱花钱买玩具。”妹妹听了，控制不了自己，开始大声哭闹。明华将妹妹手中的玩具放回架子。一旁的保安人员看见了这一切，心里做了一个决定。\n\n当明华拉着妹妹正想离开时，保安人员走了过来，并递给他们一人一个小玩具，微笑着说：“祝你们儿童节快乐！今天每个儿童都可以免费获得礼物。”明华和妹妹连声向保安人员道谢，保安人员开心地笑了。\n\n兄妹俩走出玩具店时，一个顾客指着他们手上的玩具，问保安人员怎么领取，他解释是自己买给他们的。明华终于明白是怎么一回事。他十分感动，下定决心，要像保安人员一样，为他人献出爱心。","qs":[{"f":"fill","q":"文中表示“不收钱”的词语是：___","acc":["免费"],"ans":"免费"},{"f":"fill","q":"文中表示“忍住不要做”的词语是：___","acc":["控制"],"ans":"控制"},{"f":"open","q":"为什么明华要开始做家务？","ans":"因为明华的妈妈去世了，他爸爸为了他和他妹妹，每天做两份工作，很辛苦。为了不让爸爸担心家里的事，明华开始负责做家务，还学怎么照顾妹妹。","ctx":""},{"f":"open","q":"妹妹吵着要进玩具店看玩具，明华有什么反应？他为什么让妹妹在玩具店呆半个小时？","ans":"当妹妹想进玩具店看看时，明华对妹妹说他没带钱。说完，他便拉着妹妹的手想离开。后来因为明华看到妹妹站在玩具店门口不肯走，又想让妹妹开心，只好让她在玩具店里呆半个小时。","ctx":""},{"f":"open","q":"保安人员“心里做了一个决定”，那是什么决定？他在什么情况下做出这个决定的？","ans":"保安人员看见明华妹妹因为没钱买玩具而大哭时，心里做了个决定。他决定用自己的钱给明华和他妹妹一人买一个小玩具。","ctx":""},{"f":"open","q":"明华是一个怎样的孩子？从哪里可以看出？","ans":"明华是一个懂事的孩子。从他看到爸爸很辛苦，每天做两份工作，所以主动分担家务和学习照顾妹妹可以看出。","ctx":""},{"f":"open","q":"如果你是明华，试写一封电邮感谢保安人员为他和妹妹所做的事，并告诉他你会怎么向他学习。","ans":"你好！那天在玩具店，您送小玩具给我们，我们十分感谢。我从你身上学到了要为他人献出爱心。","ctx":""}]},{"id":"NY24EOY-G2","sub":"Chinese","title":"学习打乒乓球","text":"起初，我对打乒乓球充满好奇，吵着让爸爸帮我报名乒乓球班。然而，上了几次课后，教练要求我们不断反复练习基本动作，这让我感到非常枯燥。我逐渐失去了兴趣，上课时也开始心不在焉。\n\n爸爸察觉到了我的变化，但他没有责怪我，而是带我去看了一场精彩的专业乒乓球比赛。赛场上，球员们专注的神情和高超的球技深深吸引了我。爸爸耐心地告诉我，那些优秀的球员也是经过无数次枯燥的练习，才换来今天台上的精彩表现。\n\n听了爸爸的话，我深受启发。回到课堂后，我重新调整了心态，变得更加认真地进行每一次练习。遇到困难时，我也能耐心地克服，不再轻易想要放弃。","qs":[{"f":"mcq","q":"“我”一开始对打乒乓球的态度是怎样的？","o":["非常专心。","很有耐心。","十分自信。","充满好奇。"],"c":"充满好奇。"},{"f":"mcq","q":"为什么上乒乓球课后，“我”对乒乓球失去了兴趣？","o":["同学们都对“我”很不耐烦。","爸爸责怪“我”没有取得进步。","“我”没机会去参加乒乓球比赛。","教练让“我”不停地练习新动作。"],"c":"教练让“我”不停地练习新动作。"},{"f":"mcq","q":"爸爸是怎样帮助“我”的？","o":["为“我”报名参加其他乒乓球课。","带“我”去看专业的乒乓球比赛。","鼓励“我”在上课时多交新朋友。","请教练多教“我”新的打球方法。"],"c":"带“我”去看专业的乒乓球比赛。"},{"f":"mcq","q":"爸爸的帮助对“我”有什么影响？","o":["“我”上课时变得更加认真了。","“我”开始耐心地教别人打球。","“我”练习时再也没遇到困难。","“我”成为班上最厉害的球员。"],"c":"“我”上课时变得更加认真了。"},{"f":"mcq","q":"通过学习打乒乓球，“我”学到了什么？","o":["相信自己就能有进步。","要耐心听别人的意见。","遇到困难坚持不放弃。","兴趣是要慢慢培养的。"],"c":"遇到困难坚持不放弃。"}]},{"id":"NY24EOY-G4","sub":"Chinese","title":"小华的困惑与成长","text":"小华在食堂吃饭时，注意到一群同学聚在一起，不时看向他，其中一些人还对他指指点点的。小华不明白发生了什么事，也不敢上前去问，只好低着头默默吃饭。\n\n吃晚饭时，家人都在开心地边吃边聊天，只有小华闷闷不乐地坐在那里，他和平时不同，一句话都不说，连最爱的炸鸡也没吃。家人注意到后，都盯着小华看，关心地问他出了什么事。\n\n小华摇了摇头说没事。爸爸看出小华有心事，耐心地劝导他，并给了他建议，鼓励他回学校后勇敢面对，弄清楚事情的真相。\n\n听了爸爸的建议，小华心里感到无比温暖，决定回到学校后主动找同学沟通，解开误会。","qs":[{"f":"fill","q":"文中表示“有目的地、有意识地；明明知道不应该这样做还要这样做”的词语是：___ 。","acc":["故意"],"ans":"故意"},{"f":"fill","q":"文中表示“受到关怀、爱护时心里产生的感觉”的词语是：___ 。","acc":["温暖"],"ans":"温暖"},{"f":"open","q":"小华在食堂吃饭时注意到什么？小华是怎么做的？","ans":"小华在食堂吃饭时，注意到一群同学聚在一起，不时看向他，其中一些人还对他指指点点的。小华不明白发生了什么事，也不敢上前去问，只好低着头默默吃饭。","ctx":""},{"f":"open","q":"吃晚饭时，为什么家人盯着小华看？","ans":"因为家人都在开心地边吃边聊天，只有小华闷闷不乐地坐在哪里，家人注意到小华和平时不同，一句话都不说，连最爱的炸鸡也没吃，所以家人吃晚饭时都盯着小华看。","ctx":""},{"f":"open","q":"听到小华说没事，他的家人分别有什么反应？","ans":"家人很关心小华，注意到他的异常后盯着他看并询问他发生了什么事；爸爸耐心地询问并给予他建议和鼓励。","ctx":""},{"f":"open","q":"听到爸爸的问题后，小华为什么摇头？(2分) 爸爸给了小华什么建议？(2分)","ans":"小华摇头是因为他不知道发生了什么事，也不敢上前去问同学。爸爸建议他回到学校后要勇敢面对，主动去找同学弄清楚事实真相。","ctx":""},{"f":"open","q":"你认为小华回到学校后会怎么做？请加以说明。","ans":"我认为小华回到学校后会主动去找那群指指点点的同学，有礼貌地询问他们是不是对自己有什么误会，并勇敢地把事情解释清楚。","ctx":""}]},{"id":"HP24EOY-G2","sub":"Chinese","title":"明文与爷爷的花园","text":"爷爷年纪大了，行动不太方便，但他依然非常喜爱后花园里的各种植物。假期里，明文去爷爷家住。他看到后花园的植物都快枯死了，爷爷无奈地叹了口气。\n\n为了给爷爷一个惊喜，明文决定帮爷爷照顾后花园。他每天特地很早起床，拿起园艺工具去后花园除草、浇水。他还会仔细地看爷爷平时是怎样照顾植物的，甚至向每盆植物说鼓励的话，希望它们快快长大。\n\n几天后，后花园的植物重新恢复了生机。当爷爷看到这一切时，眼眶湿润，鼻子一酸。他觉得明文变得懂事了，内心无比感动。明文看到爷爷高兴的样子，觉得能和爷爷一起打理花园是一件非常幸福的事。","qs":[{"f":"mcq","q":"为什么爷爷看到他后花园的植物后会叹气？因为","o":["他的孙子住在他家。","他的行动很不方便。","他的年纪已经很大。","他的植物都快死了。"],"c":"他的植物都快死了。"},{"f":"mcq","q":"以下哪一个不是明文在准备惊喜时做的事？","o":["用园艺工具除草和浇水。","向每盆植物说鼓励的话。","仔细地看爷爷照顾植物。","特地很早起床去后花园。"],"c":"仔细地看爷爷照顾植物。"},{"f":"mcq","q":"爷爷为什么会突然鼻子一酸？因为","o":["他看到明文弄得一身泥让他很难过。","他觉得明文变得懂事了让他很感动。","明文很喜欢他的后花园让他很好奇。","明文比他更会照顾植物让他很满意。"],"c":"他觉得明文变得懂事了让他很感动。"},{"f":"mcq","q":"以下哪一句话是正确的？","o":["爷爷要求明文在每个假期时去他的家住。","爷爷认为照他的习惯做事会让明文长大。","明文悄悄地走进花园时就被爷爷发现了。","明文觉得和爷爷打理花园是件幸福的事。"],"c":"明文觉得和爷爷打理花园是件幸福的事。"},{"f":"mcq","q":"明文有什么地方是值得我们学习的？","o":["有每天都很早起床的好习惯。","常给家中的长辈不同的惊喜。","为懂得打理花园而感到骄傲。","通过行动来表示对家人的爱。"],"c":"通过行动来表示对家人的爱。"}]},{"id":"HP24EOY-G5","sub":"Chinese","title":"陈老师的课","text":"“这些题很简单，你竟然不会！”看到方丽的卷子有些题答错了，小文便取笑道。方丽的脸上一阵红一阵白的，小文却没有发现，还教起方丽怎么答题。陈老师看了，本想说些什么，但后来决定多观察一下。\n\n听写开始后，陈老师每念完一题，都会停一下，等着那几个较慢的同学写完。这时候，班里总会听到几个同学喊道：“我好了！”“老师快念下一个！”\n\n陈老师总会说，每个同学需要的时间不同，大家应该有耐心。几个同学就会说：“他们这么慢！别等了！”听写做得较慢的那几个同学听了，显得着急、难过。陈老师看到这一切，摇了摇头，叹了一口气。\n\n第二天，陈老师讲解一道难题时，同学们都露出听不懂的神情。陈老师便讲解了第二遍，问谁听明白了，但全班都沉默了。陈老师提高声量说：“这么简单的题目，我讲了这么久，你们怎么还是听不懂？学得真慢！”\n\n听到平时很有耐心的陈老师这么说话，同学们都露出吃惊的表情。有几个同学还小声讨论着老师到底是怎么了。这时，陈老师问：“听了老师刚才的话，你们有什么感受？”老师接着又问：“听写时，看到几个同学写得比较慢，或看到有些题目你们会而其他同学不会，你们是不是也说过这样令人难受的话？在说话前，你们有没有想过其他人的感受？你们好好想想。”\n\n课室里又是一片沉默，班里好几个同学低下头，脸红了起来……","qs":[{"f":"fill","q":"文中表示“做决定”的词语是：___ 。","acc":["决定"],"ans":"决定"},{"f":"fill","q":"文中表示“商量；探讨”的词语是：___ 。","acc":["讨论"],"ans":"讨论"},{"f":"open","q":"方丽的脸上为什么会一阵红一阵白？","ans":"小文看到有些简单的题目，方丽不会，小文取笑她。","ctx":""},{"f":"open","q":"听写时发生什么事让陈老师摇头叹气？","ans":"因为当她念完一题停下来等那几个较慢的同学写完，有些同学对老师说他们那么慢就别等了，所以听写做的那几个同学听了，显得着急。因此陈老师会摇头因为她认为那些说快点人的同学没为别人着想。","ctx":""},{"f":"open","q":"第二天老师讲题时，什么事令同学露出吃惊的表情？(2分) 为什么他们会这么吃惊？(2分)","ans":"当陈老师提高声量说简单的题目，她讲了那么久，同学们怎么还是听不懂，他们学的很慢。同学们露出吃惊的表情因为陈老师平时很有耐心的。同学们认为陈老师平时有耐心，没想到老师会说出他们很慢的这些话。","ctx":""},{"f":"open","q":"为什么好几个同学脸红了起来？","ans":"因为他们意识到自己之前也对其他同学说过这样令人难受、不顾他人感受的话，感到非常惭愧。","ctx":""},{"f":"open","q":"你们觉得老师是个怎样的老师？从哪里可以看出？","ans":"我觉得陈老师是一个用心良苦、有耐心的好老师。从她为了让学生学会换位思考和顾及他人感受，特地通过切身体会的方式引导学生反思自己的言行可以看出。","ctx":""}]},{"id":"MB24SA2-G2","sub":"Chinese","title":"开着的门","text":"许多年前，有一对母女住在山村里。女儿渐渐长大了，想要到大城市去工作。妈妈听了很担心，因为城市离村子很远，而且外面并不安全，所以不同意女儿去。为了这件事，她们发生了争吵。尽管妈妈不同意，女儿还是决定离开村子去城市。\n\n女儿离开家后，妈妈心里非常挂念，每天晚上睡觉前，都认认真真地把门锁好，生怕小偷进来。几年过去了，女儿在城市里生活得很辛苦，渐渐明白了妈妈当初的苦心。她决定回村子看望妈妈。\n\n女儿回到家时已经是深夜了。她走近家门，发现门竟然是没有关上的。她轻轻敲了敲门，走进屋里。妈妈听到声音，立刻睁开了眼睛。女儿感到很奇怪，问妈妈：“妈妈，你怎么没关门就睡觉了？如果进小偷怎么办？”\n\n妈妈激动地握着女儿的手，说：“自从你走后，我每天晚上都开着门。因为我担心你会在深夜回来，如果门锁上了，你就进不来了。”女儿听了，泪水流了下来。她终于明白了妈妈一直深爱着她，等待着她回家。\n\n从那以后，女儿决定留下来孝顺妈妈，一家人幸福地生活在一起。","qs":[{"f":"mcq","q":"妈妈为什么每天睡觉前都认真地关好家里的门？","o":["担心女儿会跑出去玩。","不想女儿去城市工作。","怕晚上家里进来小偷。","觉得菜和鸡鸭会被偷。"],"c":"怕晚上家里进来小偷。"},{"f":"mcq","q":"“她们为了这件事发生了争吵”文中的这件事指的是什么？","o":["女儿不想要住在村子里。","女儿帮忙种菜和喂鸡鸭。","妈妈不想女儿去城市工作。","妈妈认为出外工作很危险。"],"c":"妈妈不想女儿去城市工作。"},{"f":"mcq","q":"看到门开着时，女儿有什么想法？","o":["觉得家里可能进来了小偷。","认为妈妈没关门就去睡觉。","生气妈妈很粗心，忘记关门。","十分感动妈妈还这么关心她。"],"c":"觉得家里可能进来了小偷。"},{"f":"mcq","q":"一听到女儿的叫声，妈妈立刻睁开眼睛。这说明了什么？","o":["女儿告诉妈妈她晚上回家。","她知道女儿一定会回来的。","女儿每天晚上都准时回家。","她时刻盼望女儿早点回家。"],"c":"她时刻盼望女儿早点回家。"},{"f":"mcq","q":"这篇文章让我们明白了什么道理？","o":["不应该经常和妈妈吵架。","去大城市工作不会开心。","门应该开着让孩子能回家。","与家人在一起是最快乐的。"],"c":"与家人在一起是最快乐的。"}]},{"id":"MB24SA2-G5","sub":"Chinese","title":"丽飞与康乐","text":"丽飞是班上的学习委员，不仅聪明，运动方面也很优秀，许多同学都喜欢她。这学期班上来了一位转学生叫康乐。康乐性格开朗，乐于助人，很快也得到了大家的喜爱。\n\n丽飞见到康乐比自己更受欢迎，心里有些不愉快，觉得康乐抢走了她的朋友。因此，丽飞一开始时对康乐总是不理不睬，见到他有困难时也不肯上前帮忙。\n\n一次科学测验后，老师发还试卷。丽飞拿到试卷，看到分数大吃一惊——她竟然只得了一分！丽飞感到非常难过，觉得给自己和父母丢脸，忍不住低头哭了起来。这时，康乐走过来，拍拍她的肩膀安慰她，叫她不要难过，还答应会和她一起复习努力，下次一定会考好的。\n\n听到康乐的话，丽飞恍然大悟。她意识到康乐是一个真诚善良的好朋友，而自己过去的做法太狭隘了。她决定放下偏见，和康乐成为真正的朋友。隔天，老师在全班面前宣布丽飞和康乐共同获得了科学进步奖，大家都为他们热烈鼓掌。","qs":[{"f":"fill","q":"文中形容“公开告诉大家”的词语是：___ 。","acc":["宣布"],"ans":"宣布"},{"f":"fill","q":"文中形容“一下子明白过来”的词语是：___ 。","acc":["恍然大悟"],"ans":"恍然大悟"},{"f":"open","q":"同学们喜欢丽飞吗？(1分) 为什么？(2分)","ans":"许多同学都喜欢丽飞。这是因为她不但聪明，运动方面也很优秀。","ctx":""},{"f":"open","q":"丽飞一开始时怎么对待康乐？(2分) 为什么她会这么做？(2分)","ans":"丽飞一开始时对康乐总是不理不睬，见到他有困难时也不肯上前帮忙。因为丽飞见到康乐比自己更受欢迎，心里有些不愉快，觉得康乐抢走了她的朋友。","ctx":""},{"f":"open","q":"什么事让丽飞感到难过？(2分) 康乐怎样安慰她？(2分)","ans":"丽飞的科学测验没有考好，觉得自己很笨，害怕爸妈会失望。康乐拍拍她的肩膀，叫她不要难过，还答应会和她一起复习努力，下次一定会考好的。","ctx":""}]}],"sentence":[{"k":"sentence","q":"表哥因为挑食而营养不良，___________ 。","o":["因此天天做运动","所以经常会生病","不然上学会迟到","结果把钱都花完"],"c":"所以经常会生病"},{"k":"sentence","q":"___________ ，终于完成了小组任务。","o":["同学们齐心协力","家长们不约而同","老师们胸有成竹","朋友们狼吞虎咽"],"c":"同学们齐心协力"},{"k":"sentence","q":"___，不如留在家里看书吧。","o":["反正我们都喜欢画画","反正外面正在下大雨","反正这本书我刚看完","反正朋友叫我下楼玩"],"c":"反正外面正在下大雨"},{"k":"sentence","q":"他很自私，___。","o":["从来不会对别人说真话","都会慢慢学会原谅他人","总是尽力帮助其他同学","邻居们都不想和他来往"],"c":"邻居们都不想和他来往"},{"k":"sentence","q":"小明低着头偷看故事书，___________ 。","o":["视力就下降了许多","是大家学习的榜样","没发现老师正盯着他","不知不觉做完了功课"],"c":"没发现老师正盯着他"},{"k":"sentence","q":"___________ ，真想找个地洞钻进去。","o":["黄叔叔发现骂错了人","林老师气得火冒三丈","他的家被大雨冲倒了","小明喜欢阴凉的地方"],"c":"黄叔叔发现骂错了人"}],"clozeAll":[{"id":"CH-G1","title":"行善日","text":"如果你的同学在踢球时不小心摔伤了腿，需要坐轮椅，你会怎么做呢？有所学校的一个学生受伤后，他的同学有的主动帮他推轮椅，有的同学提早到学校等他，个个都 [Q16]___ 地想帮忙，让他非常感动。\n\n为了 [Q17]___ 更多同学做善事，这所学校表扬了这位同学，并举办了“行善日”活动。学校通过歌曲、游戏和有趣的活动，让同学们一起学习如何做善事。\n\n问到对“行善日”的感受时，小乐兴奋地说：“我觉得‘行善日’让我们更 [Q18]___ 朋友的需要，也学会如何帮助别人！”他的同学小同点点头，说：“我同意，如果大家懂得互相尊重和照顾，也就不会发生 [Q19]___ 同学的事情。这样，学习环境会变得更美好。”\n\n他们的老师听了，微笑着说道：“其实，行善不需要做非常伟大的事情，可以从小事开始。同学们 [Q20]___ 行善的同时，也能慢慢培养善良的品德。”","items":[{"q":"个个都 ___ 地想帮忙，让他非常感动。","o":["异口同声","七嘴八舌","争先恐后","喜出望外"],"c":"争先恐后"},{"q":"为了 ___ 更多同学做善事，这所学校表扬了这位同学。","o":["鼓励","配合","谈论","联系"],"c":"鼓励"},{"q":"“行善日”让我们更 ___ 朋友的需要。","o":["丰富","了解","拥有","探索"],"c":"了解"},{"q":"如果大家懂得互相尊重和照顾，也就不会发生 ___ 同学的事情。","o":["打败","灭绝","怀疑","欺负"],"c":"欺负"},{"q":"同学们 ___ 行善的同时，也能慢慢培养善良的品德。","o":["积极","感恩","珍惜","制造"],"c":"积极"}]},{"id":"NH-G1","title":"难忘的五年级","text":"五年级有丰富的活动，如：露营、学习之旅、观看国庆预演等。最让我难忘的是三天两夜的露营活动。那是我第一次离开家人，[Q16]___ 参加那么久的活动。虽然没有美味的食物，也没有舒服的床，但那一次的露营经历却让我更加 [Q17]___ 和同学在一起的时光。\n\n国庆前的一个周六傍晚，五年级学生在老师们的带领下，去大草场观看了国庆预演。跳伞表演、海陆空三军表演、大型歌舞节目、[Q18]___ 的烟花……当课本上写的场景真实地出现我面前时，我为新加坡感到 [Q19]___。\n\n五年级 [Q20]___ 就要过去了，这一年非常充实，父母都夸我长大了，更懂事了。","items":[{"q":"那是我第一次离开家人，___ 参加那么久的活动。","o":["独自","顺利","坚持","配合"],"c":"独自"},{"q":"那一次的露营经历却让我更加 ___ 和同学在一起的时光。","o":["满意","习惯","珍惜","盼望"],"c":"珍惜"},{"q":"跳伞表演、海陆空三军表演、大型歌舞节目、___ 的烟花……","o":["精彩万分","五彩缤纷","兴高采烈","整整齐齐"],"c":"五彩缤纷"},{"q":"我为新加坡感到 ___。","o":["幸福","激动","惊奇","骄傲"],"c":"骄傲"},{"q":"五年级 ___ 就要过去了，这一年非常充实。","o":["一转身","一回头","一抬手","一眨眼"],"c":"一眨眼"}]},{"id":"ACSJ-G1","title":"建国60周年","text":"今年是新加坡建国60周年。爷爷说以前很多人的家里很穷，一家几口挤在一个小房间里。房间里光线[Q16]___，就连白天都看不清楚书本上的字。到了晚上，路灯下坐满了写作业的孩子。虽然生活困难，但是大家的感情很好，只要有人买了好吃的，都会和邻居[Q17]___。\n\n听说今年的国庆庆典会介绍新加坡从过去到现在的改变，爷爷便决定带我去看。国庆那天，大草场外排起了长长的人龙，我等得有些不耐烦。爷爷见了[Q18]___我，说我们很快就可以进入会场了。\n\n我们在观众席坐下后不久，国庆庆典就开始了！表演节目十分精彩，我看得目不转睛。当国歌响起时，我自豪地唱着国歌，[Q19]___流下了眼泪。\n\n回家的路上，看着眼前的街道和高楼，我觉得作为新加坡人很[Q20]___。我们现在所拥有的一切得来不易，长大后，我也要为新加坡尽自己的一份力。","items":[{"q":"房间里光线 ___ ，就连白天都看不清楚书本上的字。","o":["昏暗","充足","丰富","模糊"],"c":"昏暗"},{"q":"只要有人买了好吃的，都会和邻居 ___ 。","o":["欣赏","分享","共用","尝试"],"c":"分享"},{"q":"爷爷见了 ___ 我，说我们很快就可以进入会场了。","o":["唠叨","提醒","命令","安慰"],"c":"安慰"},{"q":"当国歌响起时，我自豪地唱着国歌，___ 流下了眼泪。","o":["恨不得","忍不住","受不了","来不及"],"c":"忍不住"},{"q":"我觉得作为新加坡人很 ___ 。","o":["轻松","惊喜","幸福","欢乐"],"c":"幸福"}]},{"id":"HP-G1","title":"热心的邻居","text":"现在的人住在一座座高楼里，多数的人却与邻居都 [Q16]___。但我很幸运有一个热心助人的邻居。\n\n有一次，我像往常一样放学回到家，但 [Q17]___ 我按多少次门铃，却都没有人开门。这时，我才想起：惨了！外婆去朋友的家，家里现在没人！\n\n不久，天色渐渐暗了下来，我在门前来来回回地走着。突然，一个身影走近，那人不是外婆，而是我的邻居——陈阿姨。我有些失望，心想：[Q18]___ 还要等多久，外婆才会回来啊？陈阿姨知道我的情况后，二话不说，便让我去她家等外婆。陈阿姨还请我在她家吃晚饭。\n\n[Q19]___ 她烧的菜不如外婆煮的美味，但我还是吃得很开心。陈阿姨还 [Q20]___ 给我夹菜，怕我没吃饱。\n\n我从这件事明白了“远亲不如近邻”的意思。我很感恩能有陈阿姨这样的好邻居。","items":[{"q":"现在的人住在一座座高楼里，多数的人却与邻居都 ___ 。","o":["无精打采","互不来往","愁眉苦脸","不顾一切"],"c":"互不来往"},{"q":"但 ___ 我按多少次门铃，却都没有人开门。","o":["凡是","由于","因此","不管"],"c":"不管"},{"q":"我有些失望，心想：___ 还要等多久，外婆才会回来啊？","o":["不如","是否","到底","明明"],"c":"到底"},{"q":"___ 她烧的菜不如外婆煮的美味，但我还是吃得很开心。","o":["果然","虽然","不然","竟然"],"c":"虽然"},{"q":"陈阿姨还 ___ 给我夹菜，怕我没吃饱。","o":["不时","一向","尽早","每当"],"c":"不时"}]},{"id":"MB-G1","title":"好朋友","text":"小云和小玉是邻居，也是同班同学。每天早上，[Q16]___7点，她们就会在家楼下等对方，然后一起上学。放学后，她们也会一起回家。\n\n小云最喜欢中午的时光，因为小玉的妈妈总会为她们准备美味的午餐。这天中午，午餐特别 [Q17]___，有炒饭、煎鸡蛋、排骨，还有青菜和萝卜汤。她们看着眼前的饭菜，眼睛闪闪发亮，口水都要流出来了。\n\n一天早上，小玉在楼下等了十五分钟，依然不见小云的 [Q18]___。小玉跑到小云的家一看，才发现原来小云发高烧了。“别担心，你好好休息，我会帮你把作业带回来的。”小玉轻声说。\n\n放学后，小玉去小云家，耐心地教她写作业。看着好朋友对自己这么好，小云的心里暖暖的，也更加 [Q19]___ 这份友谊。她 [Q20]___ 着自己快点好起来，就能和小玉一起上学、一起吃午餐了。","items":[{"q":"每天早上，___ 7点，她们就会在家楼下等对方。","o":["基本","大约","刚巧","每隔"],"c":"大约"},{"q":"这天中午，午餐特别 ___ 。","o":["丰盛","贵重","优美","仔细"],"c":"丰盛"},{"q":"小玉在楼下等了十五分钟，依然不见小云的 ___ 。","o":["回答","消息","身影","到达"],"c":"身影"},{"q":"小云的心里暖暖的，也更加 ___ 这份友谊。","o":["增添","欣赏","珍惜","承认"],"c":"珍惜"},{"q":"她 ___ 着自己快点好起来。","o":["鼓励","祝福","安慰","盼望"],"c":"盼望"}]},{"id":"NY-G1","title":"妈妈的提醒","text":"丽文六年级毕业后，考进了体育学校。这是她第一次离开父母，和同学们住在一起。离开家之前，为了 [Q16]___ 她和同学们争吵，妈妈不断地提醒她要多为别人着想，但丽文总是回答：\"别管我，我已经长大了，知道怎么做！\"\n\n上学后，她认识了很多新朋友，大家一起玩，一起训练，生活过得既 [Q17]___ 又开心。渐渐地，同学发现丽文时常不顾他人的感受，对她这种自私的行为很不满，便纷纷与她 [Q18]___ 距离。\n\n丽文这才开始思考妈妈之前说过的话，她 [Q19]___ 明白妈妈是为了她好。丽文感到很惭愧，知道自己以前没有真正理解妈妈的心意。想到这里，她的视线开始 [Q20]___ 了，眼泪不由自主地流了下来。","items":[{"q":"离开家之前，为了 ___ 她和同学们争吵，妈妈不断地提醒她要多为别人着想。","o":["禁止","停止","阻止","防止"],"c":"防止"},{"q":"上学后，她认识了很多新朋友，生活过得既 ___ 又开心。","o":["充足","充实","充分","充满"],"c":"充实"},{"q":"同学们对她这种自私的行为很不满，便纷纷与她 ___ 距离。","o":["保持","避开","减少","制造"],"c":"保持"},{"q":"丽文这才开始思考妈妈之前说过的话，她 ___ 明白妈妈是为了她好。","o":["曾经","终于","此后","永远"],"c":"终于"},{"q":"想到这里，她的视线开始 ___ 了，眼泪不由自主地流了下来。","o":["昏暗","模糊","劳累","下降"],"c":"模糊"}]},{"id":"RG-G1","title":"交流生","text":"去年，五名从印度来的学生到我的学校交流。在短短的一个月里，我们一起上课，一起参加不同的户外活动，拉近了我们之间的 [Q16]___。\n\n这几名印度学生用心学习，几个星期后就能用 [Q17]___ 的华文词语与我们聊天。他们非常努力地学习华语，尽管遇到困难，也不怕被别人 [Q18]___，继续坚持练习。\n\n有一天，印度学生除了为我们献上精彩的歌舞节目，还讲故事 [Q19]___ 自己在印度的生活，让我们对他们的国家有了更深的认识。\n\n我们十分 [Q20]___ 这次交流的机会。在他们离开新加坡之前，我们互相送上代表自己国家的纪念品，并说好会继续保持联系。","items":[{"q":"在短短的一个月里，我们一起上课，一起参加不同的户外活动，拉近了我们之间的 ___ 。","o":["地址","网络","年龄","距离"],"c":"距离"},{"q":"这几名印度学生用心学习，几个星期后就能用 ___ 的华文词语与我们聊天。","o":["容易","基本","大概","初级"],"c":"基本"},{"q":"他们非常努力地学习华语，尽管遇到困难，也不怕被别人 ___ ，继续坚持练习。","o":["阻拦","嘲笑","讨厌","怀疑"],"c":"嘲笑"},{"q":"有一天，印度学生除了为我们献上精彩的歌舞节目，还讲故事 ___ 自己在印度的生活。","o":["讨论","表示","分享","宣布"],"c":"分享"},{"q":"我们十分 ___ 这次交流的机会。","o":["珍惜","制造","盼望","记得"],"c":"珍惜"}]},{"id":"RS-G1","title":"陈老师的词典","text":"陈老师是我们的华文老师。他的脾气很好，但是十分 [Q16]___ ，同样的事要说很多次。\n\n刚上五年级时，有几个同学每次上华文课都是 [Q17]___ 的样子。陈老师没有生气，而是一遍又一遍地提醒他们要认真听课。过了一段时间，这几个同学一看到陈老师，就会 [Q18]___ 地坐好。\n\n其实，陈老师十分关心学生。那时我家里穷，上学用的书本都是哥哥姐姐用剩下的，但我学习很努力。有一天，陈老师 [Q19]___ 拿起我又破又旧的词典，翻开后忽然呆住了，用一种特别的眼神看了我好一会儿，什么也没说就转身离开。第二天，他突然在课堂上说要小测验，考得最好的人，可以得到一本词典。我很幸运地得到了它。\n\n那本词典我用了好多年。我会永远爱护它，[Q20]___ 它。能遇到这样的好老师，真是我一生的幸运！","items":[{"q":"他的脾气很好，但是十分 ___ ，同样的事要说很多次。","o":["恶劣","自私","唠叨","沉默"],"c":"唠叨"},{"q":"有几个同学每次上华文课都是 ___ 的样子。","o":["狼吞虎咽","胸有成竹","无精打采","兴高采烈"],"c":"无精打采"},{"q":"这几个同学一看到陈老师，就会 ___ 地坐好。","o":["激动人心","不约而同","异口同声","七嘴八舌"],"c":"不约而同"},{"q":"陈老师 ___ 拿起我又破又旧的词典，翻开后忽然呆住了。","o":["无意间","一眨眼","回过神","禁不住"],"c":"无意间"},{"q":"我会永远爱护它，___ 它。","o":["照顾","感恩","珍惜","赢得"],"c":"珍惜"}]},{"id":"RO-G1","title":"班长的信心","text":"小红是我们班的班长。但是她觉得自已 [Q16]___ 安静，不适合当班长。她对自已没有什么信心。\n\n有一次，她和我说她不明白老师为什么 [Q17]___ 几年都选她当班长，她觉得自已不是好班长。我说她是个温柔的班长，看到同学犯错会很有 [Q18]___ 地劝他们。\n\n我也说她是个 [Q19]___ 的人。有一次，我忘了带钱买食物吃，小红还把自已的面包分一半给我吃。听了我的 [Q20]___，小红变得更有信心。","items":[{"q":"但是她觉得自已 ___ 安静，不适合当班长。","o":["经常","似乎","永远","比较"],"c":"比较"},{"q":"她不明白老师为什么 ___ 几年都选她当班长。","o":["连续","连接","继续","接着"],"c":"连续"},{"q":"看到同学犯错会很有 ___ 地劝他们。","o":["细心","孝心","爱心","耐心"],"c":"耐心"},{"q":"我也说她是个 ___ 的人。","o":["诚实","公平","善良","聪明"],"c":"善良"},{"q":"听了我的 ___ ，小红变得更有信心。","o":["鼓励","支持","表示","告诉"],"c":"鼓励"}]},{"id":"TN-G1","title":"外婆的红烧排骨","text":"今天是个特别的日子，因为住在马来西亚的外婆要来我家！一想到又能吃外婆做的红烧排骨，我的心里感到很 [Q16]___。\n\n记得去年假期，妈妈带着我去外婆家玩。刚进门，我就闻到一阵香味。我 [Q17]___ 地跑到厨房，看见外婆正在做饭。外婆看见我，微笑着对我说：“饿了吧？马上就能吃饭了。”我站在一旁，看外婆翻着锅里的排骨。突然，热油喷到了她的手上，她却一点也不在意，[Q18]___ 做饭。“外婆，疼不疼？”我担心地问。“没事没事，”外婆摇摇头，“你爱吃就行。”终于，红烧排骨出锅了！外婆把排骨夹到我的碗里。我立刻 [Q19]___ 地吃了起来，这是世界上最好吃的味道！\n\n现在，每当吃红烧排骨时，我的脑海里就会 [Q20]___ 外婆在厨房忙着做饭的身影。我想对外婆说：“谢谢您，您辛苦了！”","items":[{"q":"一想到又能吃外婆做的红烧排骨，我的心里感到很 ___ 。","o":["充实","新鲜","精彩","温暖"],"c":"温暖"},{"q":"刚进门，我就闻到一阵香味。我 ___ 地跑到厨房。","o":["一眨眼","转眼间","恨不得","一溜烟"],"c":"一溜烟"},{"q":"热油喷到了她的手上，她却一点也不在意，___ 做饭。","o":["连忙","继续","开始","尽早"],"c":"继续"},{"q":"我立刻 ___ 地吃了起来，这是世界上最好吃的味道！","o":["七嘴八舌","不约而同","狼吞虎咽","争先恐后"],"c":"狼吞虎咽"},{"q":"我的脑海里就会 ___ 外婆在厨房忙着做饭的身影。","o":["排列","浮现","构成","产生"],"c":"浮现"}]},{"id":"RL-G1","title":"课程辅助活动","text":"在学校里，除了上课，同学们还会参加课程辅助活动。这些活动让校园生活变得更 [Q16]___。\n\n参加课程辅助活动，可以让同学们学到很多课本上学不到的东西。喜欢运动的同学，可以加入足球队、篮球队或羽毛球队，在比赛中学会团队合作。喜欢艺术的同学，可以参加合唱团、舞蹈团或美术小组，展示自己的才华。同学们要养成 [Q17]___ 参加训练的好习惯，并在活动中互相帮忙，坚持到最后才会有进步。\n\n[Q18]___，课程辅助活动还让我们有机会认识与自己兴趣和爱好一样的新朋友，和朋友们一起参加活动，既 [Q19]___ 又开心。\n\n课程辅助活动不只是玩乐，它能帮助我们成长。每一位同学都应该 [Q20]___ 参加，从中学习新知识，找到自己的兴趣，让自己变得更棒。","items":[{"q":"这些活动让校园生活变得更 ___ 。","o":["充足","丰富","可贵","有效"],"c":"丰富"},{"q":"同学们要养成 ___ 参加训练的好习惯。","o":["仔细","笔直","准时","安静"],"c":"准时"},{"q":"___ ，课程辅助活动还让我们有机会认识新朋友。","o":["因此","从此","此后","此外"],"c":"此外"},{"q":"和朋友们一起参加活动，既 ___ 又开心。","o":["愉快","顺利","感恩","自豪"],"c":"愉快"},{"q":"每一位同学都应该 ___ 参加，从中学习新知识。","o":["拼命","故意","积极","勇敢"],"c":"积极"}]},{"id":"SH-G1","title":"伟明的演讲","text":"有一次，伟明在准备上台演讲之前，[Q16]___ 坐在一边自言自语。他觉得很紧张，还想象自己会在台上说错话。这时候，他的朋友小丽走过来对他说：“不要担心，你已经准备好了，只要尽力就可以。”听了朋友的话，伟明心里觉得舒服多了。\n\n在演讲的时候，伟明开始觉得自己记的内容有点 [Q17]___，怕自己会说错话。但是他告诉自己要勇敢，慢慢说出来。终于，他 [Q18]___ 完成了演讲，还得到了老师和同学们的掌声。\n\n回到家，伟明觉得很开心。他想：如果没有丽丽的 [Q19]___，我不可能完成演讲。明天我一定要去给丽丽写张感谢卡，表达我的心意！\n\n从这件事中，伟明学会了 [Q20]___ 和坚持。","items":[{"q":"伟明在准备上台演讲之前，___ 坐在一边自言自语。","o":["陪伴","共同","简单","单独"],"c":"单独"},{"q":"伟明开始觉得自己记的内容有点 ___ ，怕自己会说错话。","o":["明白","模糊","忘记","清楚"],"c":"模糊"},{"q":"终于，他 ___ 完成了演讲，还得到了老师和同学们的掌声。","o":["拒绝","放弃","顺利","困难"],"c":"顺利"},{"q":"如果没有丽丽的 ___ ，我不可能完成演讲。","o":["劝告","建议","鼓励","提醒"],"c":"鼓励"},{"q":"从这件事中，伟明学会了 ___ 和坚持。","o":["感恩","尊重","团结","原谅"],"c":"感恩"}]},{"id":"NY24-G1","title":"文文的试卷","text":"年终考试到了，老师分回试卷。看到同桌丽丽优异的成绩，文文默默收起自己的试卷回家了。\n\n看到文文 [Q16]___ 的样子，妈妈忍不住关心地问她发生了什么事。文文沉默了一会儿，轻轻说：“我没考好，我真是太没用了。”\n\n妈妈抱住文文，[Q17]___ 道：“你虽然没考到好成绩，但在我心中你是一个非常优秀的孩子！”文文一脸惊讶地看着妈妈。妈妈笑着说：“你热心善良、乐于助人。每次帮助别人时，你从不觉得 [Q18]___ 。妈妈为你感到很骄傲呢！”\n\n文文听了，不好意思地吐了吐舌头：“我真有这么好？”\n\n妈妈笑眯眯地说：“当然你也有缺点，你有时太粗心了，经常需要别人来 [Q19]___ ，不然不知道会忘了多少事情呢。”\n\n文文红着脸笑了。\n\n妈妈接着说：“每个人都有优点，也有缺点。但我们不要看到别人的优点就觉得自己很没用。我们 [Q20]___ 都不要看轻自己，而是要不断改正自己的缺点，努力向前！”\n\n文文听了，笑了起来。","items":[{"q":"看到文文 ___ 的样子，妈妈忍不住关心地问她发生了什么事。","o":["眉开眼笑","愁眉苦脸","怒气冲冲","得意洋洋"],"c":"愁眉苦脸"},{"q":"妈妈抱住文文，___ 道：“你虽然没考到好成绩……”","o":["批评","请求","安慰","解释"],"c":"安慰"},{"q":"每次帮助别人时，你从不觉得 ___ 。","o":["自私","麻烦","焦急","后悔"],"c":"麻烦"},{"q":"经常需要别人来 ___ ，不然不知道会忘了多少事情呢。","o":["提醒","教导","配合","鼓励"],"c":"提醒"},{"q":"我们 ___ 都不要看轻自己，而是要不断改正自己的缺点，努力向前！","o":["永远","曾经","终于","从来"],"c":"永远"}]},{"id":"NY24EOY-G1","title":"小学同学聚会","text":"一天，我接到了一个令人兴奋的电话，原来是我小学时的班长请我参加同学聚会。想到我们好多年都没见面了，我立刻就答应了。\n\n当我到达聚会地点时，一位中年男士面带笑容，快速地向我走来，并 [Q16]___ 地握住了我的双手。看着我一脸惊讶的样子，他递给我一张名片。看着名片上的名字，我这才 [Q17]___，原来这位中年男士是我当年的同桌小明！更令我意外的是当年 [Q18]___ 的小明，现在竟然是一名警察了！谈到他小时候犯的那些错事，我们都忍不住哈哈大笑起来。\n\n不一会儿，丰盛的美食被送上了餐桌。大家边吃边聊，整个场地充满了欢声笑语。大家都十分 [Q19]___ 有这样的机会能聚在一起，这不仅让我们更加了解各自的生活，还增进了我们的友谊。\n\n时间过得飞快，天色 [Q20]___ 暗了下来，聚会也到了结束的时候。我们依依不舍地告别，心里充满着对下一次聚会的期待。","items":[{"q":"并 ___ 地握住了我的双手。","o":["感激","激动","故意","意外"],"c":"激动"},{"q":"看着名片上的名字，我这才 ___ ，原来这位中年男士是我当年的同桌小明！","o":["恍然大悟","兴高采烈","不知不觉","灵机一动"],"c":"恍然大悟"},{"q":"更令我意外的是当年 ___ 的小明，现在竟然是一名警察了！","o":["顽皮","懂事","骄傲","自信"],"c":"顽皮"},{"q":"大家都十分 ___ 有这样的机会能聚在一起……","o":["幸好","感恩","爱惜","欢迎"],"c":"感恩"},{"q":"时间过得飞快，天色 ___ 暗了下来……","o":["纷纷","渐渐","轻轻","匆匆"],"c":"渐渐"}]},{"id":"HP24EOY-G1","title":"陈强的梦想","text":"陈强对学习很有兴趣，父母从小也让陈强阅读各种书，因为他们相信知识是 [Q16]___ 的财富，能为陈强打开通往未来的大门。\n\n有一次，老师在课堂上介绍有关太空的知识，让陈强兴奋不已，神秘的太空深深地吸引着他。此后，[Q17]___ 和太空有关的书和视频，他都不放过。阅读这些太空的资料时，太空的奇妙景象会在陈强的脑海中 [Q18]___，让他有如在太空中飞行的感觉。\n\n陈强对太空的热爱，让他梦想着有一天能成为太空人。他知道努力学习的 [Q19]___ 很大，并深信只要他坚持到底，总有一天他会 [Q20]___ 飞向太空的梦想。","items":[{"q":"因为他们相信知识是 ___ 的财富……","o":["感恩","丰盛","充实","宝贵"],"c":"宝贵"},{"q":"此后，___ 和太空有关的书和视频，他都不放过。","o":["只顾","反正","凡是","不管"],"c":"凡是"},{"q":"太空的奇妙景象会在陈强的脑海中 ___ ……","o":["显得","度过","进场","浮现"],"c":"浮现"},{"q":"他知道努力学习的 ___ 很大……","o":["连接","作用","基本","统计"],"c":"作用"},{"q":"总有一天他会 ___ 飞向太空的梦想。","o":["实现","领取","建造","获得"],"c":"实现"}]},{"id":"MB24SA2-G1","title":"短文填空","text":"许多年前，有一对母女住在山村里。女儿渐渐长大了，想要到大城市去工作。妈妈听了很担心，因为城市离村子很远，而且外面并不安全，所以不同意女儿去。为了这件事，她们发生了争吵。[Q16]___ 妈妈不同意，女儿还是决定离开村子去城市。\n\n女儿离开家后，妈妈心里非常 [Q17]___，每天晚上睡觉前，都认认真真地把门锁好，生怕小偷进来。几年过去了，女儿在城市里生活得很辛苦，渐渐明白了妈妈当初的苦心。她决定回村子看望妈妈。\n\n女儿回到家时已经是深夜了。她走近家门，发现门竟然是没有关上的。她轻轻敲了敲门，走进屋里。妈妈听到声音，立刻睁开了眼睛。女儿感到很奇怪，问妈妈：“妈妈，你怎么没关门就睡觉了？如果进小偷怎么办？”\n\n妈妈 [Q18]___ 地握着女儿的手，说：“自从你走后，我每天晚上都开着门。因为我 [Q19]___ 你会在深夜回来，如果门锁上了，你就进不来了。”女儿听了，泪水流了下来。她终于明白了妈妈一直深爱着她，等待着她回家。\n\n从那以后，女儿决定留下来 [Q20]___ 妈妈，一家人幸福地生活在一起。","items":[{"q":"___ 妈妈不同意，女儿还是决定离开村子去城市。","o":["如果","尽管","只要","因为"],"c":"尽管"},{"q":"女儿离开家后，妈妈心里非常 ___ ，每天晚上睡觉前，都认认真真地把门锁好。","o":["伤心","生气的","挂念","害怕"],"c":"挂念"},{"q":"妈妈 ___ 地握着女儿的手，说：“自从你走后……”","o":["激动","着急","轻轻","高兴"],"c":"激动"},{"q":"因为我 ___ 你会在深夜回来，如果门锁上了，你就进不来了。","o":["相信","担心","希望","知道"],"c":"担心"},{"q":"从那以后，女儿决定留下来 ___ 妈妈，一家人幸福地生活在一起。","o":["照顾","帮助","陪伴","孝顺"],"c":"孝顺"}]}]};

function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')}

  if(!raw)return null;

}

function validateSave(obj,lvl){
  if(!obj||typeof obj!=='object'||Array.isArray(obj))throw Error('The save is not an object.');
  if(obj.version!=null&&obj.version>SAVE_VERSION)throw Error('This save was created by a newer game version.');
  if(obj.level&&obj.level!==lvl)throw Error('This save belongs to '+obj.level.toUpperCase()+', not '+lvl.toUpperCase()+'.');
  for(const k of ['lvl','xp','hp','coins'])if(obj[k]!=null&&(!Number.isFinite(obj[k])||obj[k]<0))throw Error('Invalid '+k+' value.');

  return obj;

function markAllWords(text){
  const words=WORDS.map(w=>w.w).sort((a,b)=>b.length-a.length);
  const re=new RegExp(words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
  return esc(text).replace(re,m=>`<span class="vw" data-w="${m}">${m}</span>`);
}
function passageHTML(p){return p.text.split(/\n+/).filter(x=>x.trim()).map(x=>`<p>${markAllWords(x)}</p>`).join('')}
function bindWordPops(root,popId){
  root.querySelectorAll('.vw').forEach(el=>el.onclick=()=>{const W=WMAP[el.dataset.w];const pop=root.querySelector('#'+popId);if(pop)pop.innerHTML=`<div class="pop"><span class="hz">${esc(W.w)}</span><span>${esc(W.p)}</span><span>${esc(W.m)}</span><button class="speak" style="color:var(--paper);border-color:var(--paper)" onclick="speak('${W.w}',this)">Hear it</button></div>`});
}
