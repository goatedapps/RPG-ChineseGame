<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Spirit Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">

</head><body>
<div class="wrap">
  <div class="hud" id="hud">
    <div class="brand">Word Spirit Quest <span style="font-family:var(--brush);font-size:.8em;color:var(--paper)">字灵</span> <span class="lvbadge" id="hLevel">–</span></div>
    <div class="stat">Lv <b id="hLv">1</b><span class="bar xp"><i id="hXp"></i></span><span id="hXpT">0/30 XP</span></div>
    <div class="stat">HP <span class="bar"><i id="hHp"></i></span><span id="hHpT">20/20</span></div>
    <div class="stat">Coins <b id="hCoin">0</b></div>
    <div class="stat">Spirits <b id="hSp">0</b>/54</div>
    <div class="stat" title="Creature battles left today">Battles left <b id="hEn">15</b></div>
    <div class="hudbtns">
      <button class="hbtn" id="bDex">Spirit Book</button>
      <button class="hbtn" id="bParent">Parents</button>
      <button class="hbtn" id="bAudio" aria-pressed="true">Sound on</button>
    </div>
  </div>
  <div class="objective"><b>Next step</b><span id="objectiveText">Meet Grandma Wang in Scholar Village.</span></div>
  <div class="stage" id="stage">
    <canvas id="cv" width="480" height="352"></canvas>
    <div class="zone-toast" id="toast" style="opacity:0"></div>
    <div class="overlay" id="ov" hidden></div>
  </div>
  <div class="pad">
    <div class="help"><b>Drag the joystick</b> on a tablet, or use Arrow keys / WASD on a keyboard. Walk into <b>tall grass</b> to meet creatures.</div>
    <div class="joystick" id="joystick" role="application" aria-label="Movement joystick"><div class="joystick-knob" id="joystickKnob"></div></div>
  </div>
</div>

<script src="vendor/hanzi-writer.min.js"></script>
<script src="data/content.js"></script>
<script src="data/hanzi.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>

</body></html>
